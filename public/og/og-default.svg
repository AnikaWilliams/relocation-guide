<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Relocation Guide — moving to Western Europe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#3b82f6"/>

  <!-- Eyebrow -->
  <text x="80" y="140" class="sans" fill="#60a5fa" font-size="30" font-weight="700" letter-spacing="6">RELOCATION GUIDE</text>

  <!-- Headline -->
  <text x="78" y="250" class="sans" fill="#f8fafc" font-size="86" font-weight="800">Moving to</text>
  <text x="78" y="350" class="sans" fill="#f8fafc" font-size="86" font-weight="800">Western Europe</text>

  <!-- Tagline -->
  <text x="80" y="430" class="sans" fill="#cbd5e1" font-size="34" font-weight="400">Source-backed, independently verified guidance —</text>
  <text x="80" y="475" class="sans" fill="#cbd5e1" font-size="34" font-weight="400">organised by your origin and destination country.</text>

  <!-- Corridor motif: origin -> destination pills -->
  <g class="sans">
    <rect x="80" y="525" width="190" height="56" rx="28" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="175" y="562" fill="#e2e8f0" font-size="28" font-weight="600" text-anchor="middle">USA</text>

    <!-- arrow -->
    <line x1="285" y1="553" x2="360" y2="553" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
    <path d="M355 543 L375 553 L355 563 Z" fill="#3b82f6"/>

    <rect x="390" y="525" width="260" height="56" rx="28" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="520" y="562" fill="#e2e8f0" font-size="28" font-weight="600" text-anchor="middle">Switzerland</text>
  </g>
</svg>
