    summary:
      text: "After successfully completing a course of study in Germany, you can be granted a temporary residence permit to look for a job matching your qualification, for up to 18 months (Section 20 of the Residence Act). During this period you can take steps to move onto a skilled-worker permit or EU Blue Card once you have a suitable job."
