    summary:
      text: "The temporary residence permit is to be granted to the foreign spouse of a German national if the German's habitual residence is in Germany (Section 28 of the Residence Act). This is a strong entitlement — granted as a general rule even where subsistence is not fully secured. A basic ability to communicate in German is generally required as for other spousal reunification (the Section 30 conditions apply accordingly), subject to the statutory exceptions. Family members who come for reunification are allowed to work in Germany."
