    detail: >
      Health insurance is compulsory for residents of Germany: you must hold either statutory
      health insurance (gesetzliche Krankenversicherung, GKV) or private health insurance
      (private Krankenversicherung, PKV). Employees are generally covered by statutory
      insurance via their employment, with contributions shared between employer and employee;
      higher earners, the self-employed and certain others may be able to take private cover.
      Crucially, valid health insurance is part of the "secured subsistence" condition for
      being granted a residence title — so arranging cover is not optional and should be in
      place from the start of your stay. The exact scheme that applies to you, and the
      contribution rates, depend on your circumstances, so confirm them with a German health
      insurer before relying on a figure.
    steps:
      - text: "Determine whether you fall under statutory (GKV) or private (PKV) insurance for your situation (employment, income, self-employment, study)."
      - text: "Apply directly to a health insurer of your choice and obtain proof of cover for your residence-title application."
