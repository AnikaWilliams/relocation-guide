      sourceUrl: "https://www.gesetze-im-internet.de/englisch_aufenthg/englisch_aufenthg.html"
      sourceName: "Residence Act (Aufenthaltsgesetz, AufenthG), Sections 18a, 18b, 18g — official English translation (gesetze-im-internet.de)"
