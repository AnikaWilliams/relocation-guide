    detail: >
      Address registration (Anmeldung) is a legal duty for everyone living in Germany, not
      just foreigners: under Section 17 of the Federal Act on Registration you must register
      within two weeks of moving in. You register in person at the local Bürgeramt /
      Einwohnermeldeamt and must bring a written confirmation from your landlord
      (Wohnungsgeberbestätigung). You receive a registration certificate (Meldebescheinigung),
      and registration triggers issuance of your tax identification number. Because so much
      downstream admin depends on it (bank account, residence title, contracts), book your
      Anmeldung appointment as soon as you have a permanent address — slots can be scarce in
      big cities.
    steps:
      - text: "Find and book an appointment at your local Bürgeramt / Einwohnermeldeamt."
      - text: "Attend in person within two weeks of moving in, bringing your passport and your landlord's confirmation (Wohnungsgeberbestätigung); collect your registration certificate."
