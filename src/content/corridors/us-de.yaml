    detail: >
      The study route starts with admission. Under Section 16b of the Residence Act a foreigner
      is granted a temporary residence permit for full-time studies if accepted by a state or
      state-recognised university (or comparable institution); residence for study also covers
      preparatory measures such as a language or preparatory course where your acceptance
      depends on it. You must also be able to support yourself during your studies (commonly
      shown via a blocked account, scholarship or sponsorship — the required amount changes
      each year, so confirm the current figure). Apply to universities well ahead of the
      semester, secure your letter of admission, and prepare proof of funds before the visa or
      permit stage. The English text of the Residence Act has no legal force; the German version
      is authoritative.
