      text: "If you are the foreign spouse of a German citizen whose home is in Germany, the residence permit is to be granted to you (Section 28) — a strong entitlement, granted as a general rule even if subsistence isn't fully secured. A basic ability to communicate in German is generally expected (the same condition as other spousal reunification), with statutory exceptions. Once here, you may work."
      sourceUrl: "https://www.gesetze-im-internet.de/englisch_aufenthg/englisch_aufenthg.html"
      sourceName: "Residence Act (Aufenthaltsgesetz, AufenthG), Section 28 — official English translation (gesetze-im-internet.de)"
