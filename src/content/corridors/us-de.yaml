    detail: >
      Joining a German-citizen spouse is one of the strongest reunification routes: under
      Section 28 of the Residence Act the residence permit is to be granted to the foreign
      spouse of a German whose home is in Germany, as a general rule even where the
      secured-subsistence condition is not fully met. The reunification rules require a basic
      ability to communicate in German (Section 28 applies the relevant Section 30 conditions
      accordingly), subject to statutory exceptions — so check whether an exception applies to
      you before assuming you must pass a language test. Once admitted, family members who came
