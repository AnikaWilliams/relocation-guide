            sourceName: "German Missions in the United States (germany.info) — Visa"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). germany.info Visa
            # page: online application includes "visas for the purpose of family
            # reunion". Verifier: confirm.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport as identity and travel document."
      - name: "Marriage certificate"
        type: provide
        description: "Your marriage certificate proving the marriage to the German citizen (recognised in Germany)."
      - name: "Proof of your spouse's German citizenship and residence"
        type: provide
        description: "Evidence that your spouse is a German national and habitually resident in Germany."
