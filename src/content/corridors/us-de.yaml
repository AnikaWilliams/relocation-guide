      # a temporary residence permit if he or she has been accepted by the
      # educational institution." Plus preparatory-measures language. BAMF
      # Education: "You can come to Germany to study here as long as you are
      # admitted to a full-time course of study by a higher education institution.
      # You must also be able to support yourself." Verifier: confirm §16b(1)
