    category: education
    appliesIf: "motivation == 'study' && studyStatus == 'applying'"
    summary:
      text: "A residence permit for study requires that you have been accepted by the educational institution: for full-time studies at a state or state-recognised university (or a comparable institution), a foreigner is granted a temporary residence permit if he or she has been accepted by the institution (Section 16b of the Residence Act). Admission is the first step — you must hold a university place (or, in some cases, be admitted to a preparatory or language course required for your studies) before the study permit can be granted."
      sourceUrl: "https://www.gesetze-im-internet.de/englisch_aufenthg/englisch_aufenthg.html"
      sourceName: "Residence Act (Aufenthaltsgesetz, AufenthG), Section 16b — official English translation (gesetze-im-internet.de)"
