    detail: >
      Germany distinguishes EU/EFTA free movement from third-country admission; as a US
      citizen you are a third-country national. For qualified work the two principal titles are
      the skilled-worker residence permit (Section 18a for a recognised vocational training
      qualification, Section 18b for a university degree) and the EU Blue Card (Section 18g)
      for university graduates whose salary meets the statutory threshold. The EU Blue Card is
      granted without the consent of the Federal Employment Agency for graduates above the
      higher salary threshold; for shortage occupations and recent graduates a lower threshold
      and Federal Employment Agency approval apply. These titles are entitlement-based — you
      apply with a concrete job offer that matches your qualification, and you must also meet
      the general conditions of Section 5 (secure subsistence including health insurance,
      established identity, a valid passport, and no interest in your expulsion). The English
      text of the Residence Act is an official translation for information only and has no
      legal force; the German version is authoritative.
    steps:
      - text: "Secure a concrete job offer in Germany that matches your qualification (a university degree for the Blue Card / Section 18b, or a recognised vocational qualification for Section 18a)."
        tip: "If your qualification was obtained abroad, you may need formal recognition that it is equivalent to a German qualification before the permit can be granted — confirm with the competent recognition body."
      - text: "Identify the correct title (skilled-worker permit or EU Blue Card) and confirm whether the Federal Employment Agency's consent is required for your specific case."
        links:
          - text: "BAMF — Working in Germany (skilled workers with vocational training / with an academic education; routes for third-country nationals)"
            sourceUrl: "https://www.bamf.de/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Arbeit/arbeit-node.html"
            sourceName: "Federal Office for Migration and Refugees (BAMF) — Working in Germany"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). BAMF Work page
            # lists "Skilled workers with vocational training", "Skilled workers
            # with an academic education", and other third-country work routes.
            # Verifier: confirm the page lists these skilled-worker routes.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Apply for the residence title via the national (type D) visa before travel, OR — because US nationals may enter visa-free — after entering Germany at the local immigration authority (see the next task)."
        tip: "US citizens have a genuine choice of route here; if you apply after entry, you may NOT take up the employment until the residence title has actually been issued."
        links:
          - text: "BAMF — Entry regulations (national visa type D; nationals of certain countries can apply for a residence title in Germany after visa-free entry)"
            sourceUrl: "https://www.bamf.de/EN/Themen/MigrationAufenthalt/ZuwandererDrittstaaten/Migrathek/Einreisebestimmungen/einreisebestimmungen-node.html"
            sourceName: "Federal Office for Migration and Refugees (BAMF) — Entry regulations"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). BAMF Entry page:
            # ">90 days or to take up work => national visa type D"; "Nationals of
            # certain countries can also apply for a residence title in Germany
            # after entering the country without a visa"; and "the intended
            # purpose of your stay (e.g. work or study) may only be pursued after
            # the residence title has been issued." Verifier: confirm verbatim,
            # and confirm via AufenthV §41 that the USA is on the privileged list.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Signed employment contract or binding job offer"
        type: provide
        description: "Your signed German employment contract or a binding written job offer; the title is tied to qualified employment matching your qualification."
      - name: "Proof of qualification (degree or recognised vocational qualification)"
        type: provide
        description: "Your university degree (for Section 18b / the EU Blue Card) or evidence of a recognised vocational training qualification (for Section 18a) — foreign qualifications may need formal recognition of equivalence."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport — your travel and identity document throughout the process; a valid passport is one of the Section 5 general conditions."
      - name: "Proof of health insurance"
        type: provide
        description: "Evidence that your subsistence is secured including health insurance (a Section 5 general condition); see the mandatory-health-insurance task."
      - name: "Visa or residence-title application form"
        type: form
        description: "The application form — submitted via the German mission abroad (national visa) or the local immigration authority (residence title after visa-free entry). For the USA, the Federal Foreign Office's German Missions portal runs an online application for most employment visas."
        form:
          text: "Apply via the German mission responsible for your US state (national visa) using the Consular Service Portal, or — if you enter visa-free — at your local German immigration authority (Ausländerbehörde). We link the German Missions in the USA visa page (which hosts the online application and lists the 9 US missions) rather than a deep PDF so the form is always the current one."
