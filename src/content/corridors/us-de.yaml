    warning: >
      The EU Blue Card salary thresholds are tied to the annual earnings ceiling of the
      general pension scheme and the euro figures change each year. Do not rely on a euro
      threshold without confirming the current year's amount. Foreign qualifications often
      require formal recognition of equivalence before a skilled-worker title can be granted.
