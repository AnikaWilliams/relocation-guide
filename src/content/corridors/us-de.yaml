    detail: >
      The residence title is the formal authorisation to live in Germany for your purpose of
      stay; it is issued as an electronic card (eAT) with a chip carrying biometric data. You
      apply in person at the Ausländerbehörde for the district where you live, usually after
      you have completed your Anmeldung. Bring your passport, biometric photos, your
      registration certificate, proof of the purpose of your stay (job contract, university
      admission or family documents), and proof of secured subsistence including health
      insurance. If you entered visa-free, remember you may not start the work or study that
      is your purpose of stay until the title is actually issued. Procedures, appointment
      systems and fees are handled locally and vary between immigration authorities.
    steps:
      - text: "After your Anmeldung, book an appointment at the Ausländerbehörde for your district."
      - text: "Attend in person to submit your application and documents and have your biometric data captured; collect your electronic residence title (eAT) when issued."
