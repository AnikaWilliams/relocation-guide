            # covers both routes and the 90-day apply-after-entry rule. Verifier:
            # confirm both routes are described on the page.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "If using the visa route, identify the German mission responsible for your US state and start the application online via the Consular Service Portal where available."
        tip: "Processing a long-stay visa can take several months, plus appointment waiting times — start early."
        links:
