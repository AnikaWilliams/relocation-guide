    detail: >
      Most third-country nationals must obtain a national (type D) visa from a German mission
      abroad before travelling for any stay over 90 days or to take up work (Section 6(3) of
      the Residence Act). US citizens are among a small group of privileged nationals
      (Section 41 of the Residence Ordinance) who may instead enter Germany visa-free and
      apply for the required residence title at the local immigration authority within 90 days
      of arrival. The visa-free route can be convenient, but it carries an important
      restriction: you may not begin the employment or studies that are the purpose of your
      stay until the residence title is actually issued, and immigration-authority appointments
      can take time. The visa route lets a German mission pre-check your file; in the USA most
      employment and residence-visa applications can be started through the Consular Service
      Portal before an in-person appointment. Choose deliberately based on your timeline and
      whether you can afford to wait in Germany before starting work.
    steps:
      - text: "Decide between the two routes: apply for a national (type D) visa at a German mission in the USA before travel, or enter visa-free and apply for the residence title in Germany within 90 days of arrival."
