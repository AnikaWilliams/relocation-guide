    keyFacts:
      - label: "Minimum salary"
        text: "Your employer must pay at least the statutory minimum of €3,465 gross per month (2026)."
        sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
        sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "Your prospective employer will pay the statutory minimum of € 3,465 (2026) gross monthly payments". Figure matches character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
