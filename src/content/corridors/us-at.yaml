    detail: >
      Family reunification lets the spouse/registered partner and minor children of a third-country
      resident move to Austria. For family of Red-White-Red Card and EU Blue Card holders the
      residence title is the «Red-White-Red Card plus», which gives free labour-market access and
      is not subject to quota — a significant advantage over other settlement categories where
      quota space may be required. The spouse or registered partner must be at least 21 at
      application. General granting requirements apply across the board: adequate, regular income
      at or above the standard income rate (Ausgleichszulagenrichtsatz), health insurance covering
      all risks in Austria (family of RWR/Blue Card holders are usually co-insured by the sponsor),
      and adequate accommodation. Family members must additionally evidence German at A1 level
      before immigrating. Confirm the current income figures, which are revised annually.
    steps:
