        text: "The AMS checks that no equally qualified person registered as a jobseeker can be placed (labour-market test / Arbeitsmarktprüfung)."
        sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
        sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "no equally qualified person registered as a jobseeker at the Public Employment Service (AMS) can be placed (labour market test/Arbeitsmarktprüfung)".
