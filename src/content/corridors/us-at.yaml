      # 30-day window: contains the standard income-rate figures.
      reviewBy: "2026-07-13"
    tldr:
      text: "Family of Red-White-Red Card / EU Blue Card holders get the «Red-White-Red Card plus» (free labour-market access) for stays over six months. Spouses/registered partners must be 21+; minor children also qualify. You must show adequate income (2026: €1,308.39 single, €2,064.12 couple, +€201.88 per child), health insurance and suitable housing, and family members need German at A1 before immigrating. No quota applies to RWR/Blue Card family."
