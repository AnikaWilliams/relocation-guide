        sourceHash: "df606c7c3237ff42e87b2a44fa556374646e1f5910601bdc46433517e0fb5d4a"
        reviewBy: "2026-09-11"
    detail: >
      Residence registration (Anmeldung / Meldezettel) is a core, fast-deadline administrative step
      in Austria: anyone taking up accommodation must register within three days, including any
      co-habiting minors. You fill in a registration form that the accommodation provider (the
      person who actually provides the accommodation — usually the landlord) must sign; registering
      a residence without actually living there (sham registration) is a punishable offence. You
      receive a written confirmation of registration (the document formerly called the Meldezettel),
      which you will need for many other steps (banking, contracts). Registration is free and can be
      done in person, by post, or online via oesterreich.gv.at with ID Austria. The legal basis is
