  - id: family-reunification
    title: "Bring your spouse and children (Red-White-Red Card plus)"
    category: family-dependents
    summary:
      text: "Family members of a Red-White-Red Card or EU Blue Card holder who will reside in Austria for more than six months can obtain the «Red-White-Red Card plus», which grants free access to the labour market. Family members are spouses or registered partners (who must be at least 21 when applying) and unmarried minor children (including adoptive and step-children). General requirements apply: adequate means of subsistence (the 2026 standard income rate is €1,308.39 for singles and €2,064.12 for married couples, plus €201.88 per child), health insurance, and adequate accommodation. Family members must also show German on A1 level («German prior to immigration»)."
      sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/family-reunification/"
      sourceName: "Austria Migration — Family reunification"
      # VERIFIED 2026-06-13 (fact-verifier): live re-fetch (curl, browser UA, HTTP 200; sha256 081ae420…, identical to research snapshot — no drift). Verbatim: family members are "spouses registered partners and unmarried minors including adoptive and step children" who "must be 21 years of age or older when applying"; family of RWR/Blue Card holders "shall obtain the residence title 'Red-White-Red Card plus'" which "grants … free access to the labour market"; "In 2026, this standard income rate amounted to € 1,308.39 for singles, € 2,064.12 for married couples and an additional € 201.88 for each child"; A1 German ("German prior to immigration"); and "There is no quota requirement regarding residence titles issued to family members of 'Red-White-Red Card' holders, 'EU Blue Card' holders".
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-at 2026-06-13"
