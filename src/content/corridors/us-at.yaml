    detail: >
      The EU Blue Card is Austria's implementation of the EU-wide highly-skilled-worker permit and
      can be a cleaner fit than the points-based Red-White-Red Card for degree-holders with a
      well-paid offer. The core requirements are a recognised degree (or, for ICT roles, three
      years of comparable experience), a binding job offer of at least six months that matches your
      education, a salary at or above the statutory average (€55,678 in 2026), and a passed AMS
      labour-market test. It is valid for 24 months and allows fixed-term settlement and employment
      with the specific employer; you can also work self-employed if subsidiary to the main job.
      After 21 of the preceding 24 months employed in line with the Blue Card rules you can apply
      for the Red-White-Red Card plus. The application fee is €218.
