  - id: rwr-card-other-key-workers
    title: "Apply for the Red-White-Red Card as an Other Key Worker (job offer in hand)"
    category: visa-permit
    summary:
      text: "If you already have a job offer in Austria, the most common route for a US citizen is the Red-White-Red Card as an «Other Key Worker». You qualify if your employer pays at least the statutory minimum (€3,465 gross per month in 2026), the labour-market test (Arbeitsmarktprüfung) shows no equally qualified jobseeker registered with the Public Employment Service (AMS) can be placed, and you reach at least 55 of 90 points for qualification, work experience, language skills and age. The card is valid for 24 months and ties you to the employer named in the application."
