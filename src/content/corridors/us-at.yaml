    category: registration-bureaucracy
    summary:
      text: "Anyone who takes up accommodation in Austria must register their residence (and any co-habiting minors) with the registration authority within three days of moving in. You complete a registration form (Meldezettel) that your accommodation provider (e.g. landlord) must sign, and you receive a written confirmation of registration. There are no fees. You can register in person, by post, or online with ID Austria."
      sourceUrl: "https://www.oesterreich.gv.at/en/themen/persoenliche_dokumente_und_bestaetigungen/an__abmeldung_des_wohnsitzes/Seite.1180200"
