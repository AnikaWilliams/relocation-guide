            reviewBy: "2026-09-11"
      - text: "Submit the registration in person, by post, or online with ID Austria, and keep the written confirmation of registration."
        links:
          - text: "oesterreich.gv.at — submitting the registration (in person / post / online)"
            sourceUrl: "https://www.oesterreich.gv.at/en/themen/persoenliche_dokumente_und_bestaetigungen/an__abmeldung_des_wohnsitzes/Seite.1180200"
            sourceName: "oesterreich.gv.at — Registration of a new main residence (Meldezettel)"
            # VERIFIED 2026-06-13 (fact-verifier): verbatim "You can register in person or by post or online with ID Austria (id-austria.gv.at) or EU Login" and "You will receive a written confirmation of regsitration." Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-at 2026-06-13"
            sourceHash: "df606c7c3237ff42e87b2a44fa556374646e1f5910601bdc46433517e0fb5d4a"
            reviewBy: "2026-09-11"
