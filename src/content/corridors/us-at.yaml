      sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
      # VERIFIED 2026-06-13 (fact-verifier): live re-fetch (curl, browser UA, HTTP 200; sha256 cd0f7feb…, identical to research snapshot — no drift). Verbatim: "Your prospective employer will pay the statutory minimum of € 3,465 (2026) gross monthly payments", "no equally qualified person registered as a jobseeker at the Public Employment Service (AMS) can be placed (labour market test/Arbeitsmarktprüfung)", "you reach a minimum of 55 points", "Required minimum: 55", "Sum total of maximum allowable points: 90", "The Red-White-Red Card is generally issued for a period of 24 months" and "entitled to fixed-term settlement and employment by the employer specified in the application".
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-at 2026-06-13"
      sourceHash: "cd0f7feb4c605faeb44a9f26e1e9de2a8b45349f799e943ae8a0272eb50a657b"
      # 30-day window: contains the €3,465 minimum-salary figure and points threshold.
      reviewBy: "2026-07-13"
    tldr:
      text: "With a job offer, US citizens usually apply for the Red-White-Red Card as an «Other Key Worker». You need an employer paying at least €3,465 gross a month (2026), a passed labour-market test (no equally qualified AMS jobseeker available), and at least 55 of 90 points across qualification, experience, language and age. The card lasts 24 months and is tied to that employer."
      sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
      sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
