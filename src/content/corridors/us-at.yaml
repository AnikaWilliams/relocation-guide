        text: "You can file at the Austrian embassy or consulate of your country of residence, or your employer can file with the competent residence authority in Austria; the AMS then assesses the points, salary and labour-market test."
        sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
        sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
