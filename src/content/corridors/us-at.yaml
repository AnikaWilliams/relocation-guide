        text: "The Red-White-Red Card is generally issued for 24 months and entitles you to fixed-term settlement and employment by the employer specified in the application."
        sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
        sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "you are entitled to fixed-term settlement and employment by the employer specified in the application. The Red-White-Red Card is generally issued for a period of 24 months."
        status: VERIFIED
