      - label: "Job-Seeker Visa"
        text: "Without a job offer you can come to Austria to look for work for six months on a Job-Seeker Visa (a category D visa) applied for personally at the Austrian embassy/consulate; if you entered visa-free you do not need it."
        sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/very-highly-qualified-workers/"
        sourceName: "Austria Migration — Very Highly Qualified Workers (Red-White-Red Card)"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "If you do not yet have a job offer, you can come to Austria to look for work for six months on a Job-Seeker Visa", "You have to apply for the Job Seeker Visa (category D visa) personally at the competent Austrian representation (embassy or consulate)", and "If you entered Austria under a visa-free regime, you do not need a Job Seeker Visa."
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-at 2026-06-13"
        sourceHash: "8b5cfc3969bbc6813adca8b9ff7a7dd6c0a8062029c8b5add06a8ee39c1095ca"
