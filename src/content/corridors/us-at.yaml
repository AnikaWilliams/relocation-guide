    detail: >
      Studying in Austria as a US citizen requires both academic admission and an immigration
      residence permit. Academically, a study place must be available, you must hold the general
      university entrance qualification (or prove a completed three-year post-secondary study that
      qualifies you for the chosen course in the country where it was obtained), satisfy any
      study-specific entrance requirements, and demonstrate sufficient German. The matriculation
      deadlines are 5 September (winter semester) and 5 February (summer semester); the university
