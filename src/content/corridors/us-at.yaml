    detail: >
      Austria's flexible immigration model, the Red-White-Red Card, gives qualified third-country
      workers a single permit for working and settling. The «Other Key Worker» category is the
      catch-all for people with a concrete job offer who do not fall under the highly-specific
      categories (very highly qualified, shortage occupation, graduate, start-up). You must meet
      a minimum salary (€3,465 gross/month in 2026), pass the AMS labour-market test, and score at
      least 55 points. Either you apply at the Austrian representation in the USA or your employer
      applies at the residence authority in Austria; the AMS assesses the criteria and, if met and
      the general settlement requirements (notably health insurance) are satisfied, the residence
      authority issues the card. If you are subject to visa requirements you then collect the card
      after entering Austria on a category D visa. After 21 of the preceding 24 months in eligible
      employment you can move to the Red-White-Red Card plus (free labour-market access). Use the
      official Points Calculator to self-check before applying.
    steps:
      - text: "Check you meet the salary, labour-market and points criteria — use the official Points Calculator on migration.gv.at."
        links:
          - text: "Austria Migration — Other Key Workers: criteria and points"
            sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
            sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
            # VERIFIED 2026-06-13 (fact-verifier): page is the Other Key Workers criteria/points page; the points table and "Points calculator" link are present. Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-at 2026-06-13"
            sourceHash: "cd0f7feb4c605faeb44a9f26e1e9de2a8b45349f799e943ae8a0272eb50a657b"
            reviewBy: "2026-07-13"
      - text: "File the application — either personally at the Austrian embassy/consulate in the USA, or have your employer file with the competent residence authority in Austria."
        tip: "ABA WORK in AUSTRIA (the federal counselling centre) can support companies and workers through the procedure, though it has no party status."
        links:
          - text: "Austria Migration — Other Key Workers: where to file"
            sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
            sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
            # VERIFIED 2026-06-13 (fact-verifier): "Where to file the application?" section confirms personal filing at the Austrian representation OR employer filing with the competent residence authority. Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-at 2026-06-13"
            sourceHash: "cd0f7feb4c605faeb44a9f26e1e9de2a8b45349f799e943ae8a0272eb50a657b"
            reviewBy: "2026-09-11"
      - text: "After the AMS confirms the criteria and the card is approved, apply for a category D visa to enter Austria and collect your residence title (see the entry-visa task)."
        links:
          - text: "Austria Migration — issuance of the card and collection via a category D visa"
            sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
            sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
            # VERIFIED 2026-06-13 (fact-verifier): verbatim "If you are subject to visa requirements, you have to apply for a category D visa for the purpose of entering Austria to collect your residence title." Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-at 2026-06-13"
            sourceHash: "cd0f7feb4c605faeb44a9f26e1e9de2a8b45349f799e943ae8a0272eb50a657b"
            reviewBy: "2026-09-11"
    documents:
      - name: "Red-White-Red Card application"
        type: form
        description: "The Red-White-Red Card application, filed at the Austrian representation abroad or by the employer at the residence authority; obtain the current forms from the official migration portal."
        form:
          text: "Apply for the Red-White-Red Card. The official migration portal hosts the procedure and links the current application forms; we link the authority page rather than a deep PDF so it stays current."
          sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/other-key-workers/"
          sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
          # VERIFIED 2026-06-13 (fact-verifier): page hosts the procedure and a "Forms — Application form and Employer's declaration (Arbeitgebererklärtung)" link. Accurate to link the authority page.
          status: VERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: "fact-verifier-at 2026-06-13"
          sourceHash: "cd0f7feb4c605faeb44a9f26e1e9de2a8b45349f799e943ae8a0272eb50a657b"
          reviewBy: "2026-09-11"
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport, your travel and identity document throughout the procedure."
      - name: "Evidence for the points criteria (qualifications, experience, language)"
        type: provide
        description: "Diplomas/qualification certificates, work-experience evidence, and German (or English) language certificates assessed under the points system."
      - name: "Employment contract / employer declaration"
        type: provide
        description: "Your employment contract or the employer's declaration showing the role and the salary meeting the statutory minimum."
      - name: "Criminal record extract"
        type: provide
        description: "A recent criminal record extract from your country of origin/residence (many authorities require it to be no more than three months old)."
      - name: "Evidence of health insurance"
        type: provide
        description: "Evidence of health insurance coverage, a general settlement requirement for the card."
    warning: >
      The minimum salary (€3,465 gross/month) is the 2026 figure and is revised annually, and the
      labour-market test and points are mandatory — there is no automatic entitlement. Confirm the
      current salary and shortage lists on migration.gv.at before relying on them.
    dependsOn: []
    appliesIf: "motivation == 'work'"

