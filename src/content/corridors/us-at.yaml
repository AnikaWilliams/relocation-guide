  - id: income-tax
    title: "Understand your Austrian income-tax residency"
    category: taxes
    summary:
      text: "If you live in Austria you are likely subject to «unlimited» income-tax liability, meaning Austria taxes your worldwide income. A person who stays overnight in Austria during the working week and spends more than six months of the year in Austria is considered ordinarily resident and therefore subject to unlimited taxation. Where you remain liable to tax elsewhere too, double-tax conventions (DTCs) determine which country may tax which income and prevent double taxation."
      sourceUrl: "https://www.oesterreich.gv.at/en/themen/arbeit_beruf_und_pension/arbeitnehmerveranlagung/einkommensteuerrechtliche-regelungen-fuer-grenzgaenger-nach-oesterreich"
      sourceName: "oesterreich.gv.at — Tax rules / unlimited tax liability in Austria"
      # VERIFIED 2026-06-13 (fact-verifier): live re-fetch (curl, browser UA, HTTP 200; sha256 13fb9e23…, identical to research snapshot — no drift). Verbatim "Caution" box: "If the worker concerned stays overnight in Austria (at least part of the time) during the working week, and if they spend more than six months of the year in Austria, they can be considered to be ordinarily resident in Austria and therefore subject to unlimited taxation in Austria." Limited taxation is defined as "income tax is only charged in relation to domestic income" — so unlimited liability = worldwide income (the claim's gloss). DTCs "must be taken into account" and "Provisions regarding cross-border workers vary depending on the terms of individual DTCs." The US-by-citizenship note is general, well-established tax fact, not asserted as on this page.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-at 2026-06-13"
      sourceHash: "13fb9e2312ec9675b146ed19c349254f1fc5f2f171b5ea98fecb98f1bd676206"
      reviewBy: "2026-09-11"
    tldr:
      text: "Living in Austria usually means «unlimited» tax liability — Austria taxes your worldwide income. Spending more than six months a year in Austria (with overnight stays in the working week) makes you ordinarily resident and so subject to unlimited taxation. Double-tax conventions split taxing rights and avoid double taxation; as a US citizen, get cross-border advice because the US also taxes by citizenship."
      sourceUrl: "https://www.oesterreich.gv.at/en/themen/arbeit_beruf_und_pension/arbeitnehmerveranlagung/einkommensteuerrechtliche-regelungen-fuer-grenzgaenger-nach-oesterreich"
      sourceName: "oesterreich.gv.at — Tax rules / unlimited tax liability in Austria"
      # VERIFIED 2026-06-13 (fact-verifier): same live re-fetch (sha256 13fb9e23…). >6-months + overnight-stay → ordinarily resident → "unlimited taxation" verbatim; limited liability = domestic income only (so unlimited = worldwide); DTCs allocate taxing rights and vary by treaty. US-citizenship-based taxation is general background, not a claim about this page.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-at 2026-06-13"
      sourceHash: "13fb9e2312ec9675b146ed19c349254f1fc5f2f171b5ea98fecb98f1bd676206"
      reviewBy: "2026-09-11"
    keyFacts:
