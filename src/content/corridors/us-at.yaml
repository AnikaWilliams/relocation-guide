        sourceName: "Austria Migration — Other Key Workers (Red-White-Red Card)"
        # VERIFIED 2026-06-13 (fact-verifier): source points table — "Qualification Maximum allowable points: 30", "Work experience Maximum allowable points: 20", "Language skills Maximum allowable points: 25", "Age Maximum allowable points: 15", "Sum total of maximum allowable points: 90", "Required minimum: 55", and "Additional points for English language skills, if English is the predominant language of the respective company 5". All maxima and the 55/90 threshold match exactly.
