        text: "The registration obligation is set out in the Registration Act (Meldegesetz, MeldeG)."
        sourceUrl: "https://www.oesterreich.gv.at/en/themen/persoenliche_dokumente_und_bestaetigungen/an__abmeldung_des_wohnsitzes/Seite.1180200"
        sourceName: "oesterreich.gv.at — Registration of a new main residence (Meldezettel)"
