  - id: rwr-card-very-highly-qualified
    title: "Use the Job-Seeker Visa / RWR Card if you are a Very Highly Qualified Worker"
    category: visa-permit
    summary:
      text: "If you are very highly qualified but do not yet have a job offer, you can come to Austria for six months on a Job-Seeker Visa to look for work, then apply for a Red-White-Red Card. Both require reaching at least 70 of 100 points for special qualifications and skills, work experience, language skills, age, and studies in Austria. The Job-Seeker Visa is a category D visa applied for at the Austrian representation in your home or residence country, and the AMS confirms your points."
      sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/very-highly-qualified-workers/"
      sourceName: "Austria Migration — Very Highly Qualified Workers (Red-White-Red Card)"
      # VERIFIED 2026-06-13 (fact-verifier): live re-fetch (curl, browser UA, HTTP 200; sha256 8b5cfc39…, identical to research snapshot — no drift). Verbatim: "If you do not yet have a job offer, you can come to Austria to look for work for six months on a Job-Seeker Visa", "Reaching a minimum of 70 points … is a prerequisite for a Job Seeker Visa and for a Red-White-Red card", "Sum total of maximum allowable points: 100", "apply for the Job Seeker Visa (category D visa) personally at the competent Austrian representation (embassy or consulate)", and "if the Public Employment Service (Arbeitsmarktservice - AMS) confirms … that you have reached the points required".
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-at 2026-06-13"
      sourceHash: "8b5cfc3969bbc6813adca8b9ff7a7dd6c0a8062029c8b5add06a8ee39c1095ca"
      reviewBy: "2026-09-11"
    tldr:
      text: "Very highly qualified people without a job offer can enter Austria on a six-month Job-Seeker Visa, then apply for a Red-White-Red Card once hired. Both need at least 70 of 100 points (qualifications/skills, experience, language, age, study in Austria). The Job-Seeker Visa is a category D visa from the Austrian embassy/consulate; the AMS confirms your points."
      sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/very-highly-qualified-workers/"
      sourceName: "Austria Migration — Very Highly Qualified Workers (Red-White-Red Card)"
      # VERIFIED 2026-06-13 (fact-verifier): same live re-fetch (sha256 8b5cfc39…). Six-month Job-Seeker Visa, "minimum of 70 points" / "Sum total … 100", "category D visa" at the embassy/consulate, and AMS points confirmation all present verbatim.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-at 2026-06-13"
      sourceHash: "8b5cfc3969bbc6813adca8b9ff7a7dd6c0a8062029c8b5add06a8ee39c1095ca"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Points threshold"
        text: "You must reach at least 70 of a possible 100 points across special qualifications/skills (max 40), work experience (max 20), language skills (max 10), age (max 20) and studies in Austria (max 10)."
        sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/very-highly-qualified-workers/"
        sourceName: "Austria Migration — Very Highly Qualified Workers (Red-White-Red Card)"
        # VERIFIED 2026-06-13 (fact-verifier): source points table — "Special qualifications and skills Maximum allowable points: 40", "Work experience … Maximum allowable points: 20", "Language skills Maximum allowable points: 10", "Age Maximum allowable points: 20", "Studies in Austria Maximum allowable points: 10", "Sum total of maximum allowable points: 100", "Required minimum: 70". All maxima and 70/100 threshold match exactly.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-at 2026-06-13"
        sourceHash: "8b5cfc3969bbc6813adca8b9ff7a7dd6c0a8062029c8b5add06a8ee39c1095ca"
