        type: form
        description: "The «Red-White-Red Card plus» family-reunification application at the competent residence authority; obtain the current procedure and forms from the official migration portal."
        form:
          text: "Apply for the «Red-White-Red Card plus» for your family member. The official migration portal describes who qualifies, the general requirements and the procedure."
          sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/family-reunification/"
          sourceName: "Austria Migration — Family reunification"
          # VERIFIED 2026-06-13 (fact-verifier): page describes who qualifies, the general granting requirements, the "Filing an application" procedure and lists "Forms Application forms (German)". Supported.
