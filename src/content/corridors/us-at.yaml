originIso2: us
destinationIso2: at
title: "Moving from the USA to Austria"
description: "How US citizens (non-EU/EEA third-country nationals) relocate to Austria for work, study, or family: the points-based Red-White-Red Card (skilled workers, very highly qualified workers, other key workers), the EU Blue Card, the entry (type D) visa, registering your residence (Meldezettel), compulsory health insurance, housing, banking, and Austrian income-tax residency."
lastReviewed: "2026-06-13"
reviewedBy: "research-2"
