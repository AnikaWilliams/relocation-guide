        # 30-day window: salary figure.
        reviewBy: "2026-07-13"
      - label: "Points"
        text: "You must reach at least 55 of a possible 90 points across qualification (max 30), work experience (max 20), language skills (max 25) and age (max 15); English as the company's predominant language adds 5 points."
