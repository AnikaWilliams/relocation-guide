  # ===========================================================================
  - id: health-insurance
    title: "Get covered by Austrian health insurance"
    category: healthcare-insurance
    summary:
      text: "Compulsory health insurance applies to almost everyone in paid employment in Austria; as an employee you are insured with the Austrian Health Insurance Fund (Österreichische Gesundheitskasse, ÖGK) and receive an e-card. The insured and their dependants are entitled to medical care from contracted doctors. You pay a prescription charge (€7.55 per item in 2026) and an annual e-card fee (€25.00 in 2026). Health insurance coverage is also a general requirement for the residence permit."
