    detail: >
      Austria draws the key distinction between «unlimited» tax liability (taxed on worldwide
      income, for those resident or ordinarily resident in Austria) and «limited» liability (taxed
      only on Austrian-source income, for non-residents). Spending more than six months a year in
      Austria, with overnight stays during the working week, makes you ordinarily resident and so
      unlimitedly liable. Where you also have a tax nexus elsewhere, the applicable double-tax
      convention decides which country may tax which income and provides relief from double taxation.
      For US citizens this matters especially because the United States taxes its citizens on
      worldwide income regardless of residence: the Austria–US treaty and foreign tax credits are
      meant to prevent double taxation, but the interaction is complex. This is general information,
      not tax advice — get specialist Austria–US cross-border tax advice (including on US reporting,
      FBAR/FATCA) before your first return. The BMF is the authority for Austrian tax guidance.
