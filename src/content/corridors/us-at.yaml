  # ===========================================================================
  - id: eu-blue-card
    title: "Consider the EU Blue Card for a higher-paid graduate role"
    category: visa-permit
    summary:
      text: "If you hold a university degree (minimum three years) — or, for ICT professionals, at least three years of relevant experience — and have a binding job offer of at least six months matching your education, you can apply for the EU Blue Card. You must earn at least the average gross annual income of full-time employees (in 2026: at least €55,678, annual salary plus special payments) and pass the AMS labour-market test. The Blue Card is issued for 24 months; the application fee is €218."
      sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration-red-white-red-card/eu-blue-card.html"
      sourceName: "Austria Migration — EU Blue Card"
