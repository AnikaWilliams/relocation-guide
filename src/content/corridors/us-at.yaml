      - name: "Residence registration form (Meldezettel)"
        type: form
        description: "The official residence-registration form, signed by you and your accommodation provider; available from oesterreich.gv.at (and as an online service with ID Austria)."
        form:
          text: "Complete the residence-registration form (Meldezettel). oesterreich.gv.at provides the form and an online registration service; the accommodation provider must sign it."
          sourceUrl: "https://www.oesterreich.gv.at/en/themen/persoenliche_dokumente_und_bestaetigungen/an__abmeldung_des_wohnsitzes/Seite.1180200"
