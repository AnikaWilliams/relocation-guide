        # 30-day window: salary point bands.
        reviewBy: "2026-07-13"
    detail: >
      The «Very Highly Qualified Worker» route is designed for top talent and is the only
      Red-White-Red Card category that lets you enter Austria to search for work before you have a
      job. You must reach 70 points; points come from graduation from higher education, a high
      prior salary in senior management, research/innovation, awards, work experience, language,
      youth, and prior study in Austria. With 70 points you can obtain a six-month Job-Seeker Visa
      (a category D visa) at the Austrian representation; the AMS confirms your points to that
      authority. Once you find a job that matches your qualifications you (or your employer) apply
      for the Red-White-Red Card for Very Highly Qualified Workers. If you entered Austria under a
      visa-free regime you do not need the Job-Seeker Visa to search.
    steps:
