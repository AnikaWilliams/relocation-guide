      - label: "Other requirements"
        text: "Health insurance covering all risks in Austria, adequate accommodation for the family size by local standards, and proof of German at A1 level («German prior to immigration»)."
        sourceUrl: "https://www.migration.gv.at/en/types-of-immigration/permanent-immigration/family-reunification/"
        sourceName: "Austria Migration — Family reunification"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "Health insurance coverage … providing benefits in Austria and covering all risks", "Adequate accommodation according to local standards", and "Family Members have to provide evidence of German language skills on A1 level … ('German prior to immigration')".
