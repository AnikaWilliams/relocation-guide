    title: "Apply for a student residence permit to study in Austria"
    category: education
    summary:
      text: "Third-country nationals who are neither EEA citizens nor Swiss, and who do not already have a right of residence, need a residence permit to study at an Austrian university. You must be admitted to a degree programme (a place must be available; you must meet the general university entrance qualification or prove a completed three-year post-secondary study), have sufficient German knowledge (an exam may be required), and the matriculation deadline is 5 September (winter) or 5 February (summer). Third-country students who wish to work also need an employment permit (Beschäftigungsbewilligung)."
