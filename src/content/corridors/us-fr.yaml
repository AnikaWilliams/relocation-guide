      sourceName: "France-Visas — Salaried employment"
      # VERIFIED 2026-06-13 (fact-verifier): France-Visas "Salaried employment" re-fetched LIVE (curl, browser UA, HTTP 200, no redirect; sha256 4b05e186…). Employees & seasonal workers § verbatim: "Your employer or … must obtain a work permit from the French authorities" and a "long-stay visa equivalent to a 12-month residence permit (maximum): Bearing the statement \"salarié\" (employee) for a permanent employment contracts / Bearing the statement \"travailleur temporaire\" (temporary worker) for fixed-term contracts"; "Along with your visa application, you must also submit the work permit that was granted to your employer." Supports employer-obtains-permit + salarié/travailleur-temporaire markings + submit-permit-with-visa.
      status: VERIFIED
      lastVerified: "2026-06-13"
