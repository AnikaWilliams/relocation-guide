      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Eligibility"
        text: "You must hold a residence card valid for at least one year (or a 10-year resident card) and have resided in France for at least 18 months."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
        sourceName: "Service-Public — Family reunification"
        # VERIFIED 2026-06-13 (fact-verifier): live F11166 (sha256 b5fe2a8a…). Verbatim: "residence card of at least 1 year" and "You must also have resided for at least 18 months in France." Supported.
