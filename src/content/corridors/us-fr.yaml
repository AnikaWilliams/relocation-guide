    detail: >
      France determines tax residency by the criteria in Article 4 B of the General Tax Code,
      summarised by Service-Public: you are tax-domiciled in France if your home/household is
      there, if your main stay is there (≥183 days a year), if your main professional activity
      is there, or if your centre of economic interests is there. A French tax resident is taxed
      on worldwide income; a non-resident only on French-source income. For US citizens this is
      especially important because the United States taxes its citizens on worldwide income
      regardless of residence: the France–US tax treaty and foreign tax credits are designed to
      prevent double taxation, but the interaction is complex. French residents must also report
      foreign (including US) accounts. This is general information, not tax advice — a US citizen
      moving to France should get specialist cross-border tax advice on the France–US treaty,
      foreign tax credits, and US reporting (FBAR/FATCA).
