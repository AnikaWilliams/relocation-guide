      - label: "Talent shortcut"
        text: "Passeport Talent / EU Blue Card holders do NOT use family reunification: their spouse and minor children get a «talent-famille» card through the simplified accompanying-family procedure."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
        sourceName: "Service-Public — Talent residence card (multi-year)"
        # VERIFIED 2026-06-13 (fact-verifier): live F16922 (sha256 11b4b0e6…). Verbatim: "Your spouse and minor children can benefit from the simplified procedure accompanying family and obtain a residence card \"talent-family\" without going through the application for family reunification." Supported.
        status: VERIFIED
