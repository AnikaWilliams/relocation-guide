        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Reporting foreign accounts"
        text: "French tax residents must report accounts opened, held, used or closed abroad during the year to the French tax authority."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34342?lang=en"
        sourceName: "Service-Public — Should foreign accounts be reported?"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      France determines tax residency by the criteria in Article 4 B of the General Tax Code,
      summarised by Service-Public: you are tax-domiciled in France if your home/household is
      there, if your main stay is there (≥183 days a year), if your main professional activity
      is there, or if your centre of economic interests is there. A French tax resident is taxed
      on worldwide income; a non-resident only on French-source income. For US citizens this is
      especially important because the United States taxes its citizens on worldwide income
      regardless of residence: the France–US tax treaty and foreign tax credits are designed to
      prevent double taxation, but the interaction is complex. French residents must also report
      foreign (including US) accounts. This is general information, not tax advice — a US citizen
      moving to France should get specialist cross-border tax advice on the France–US treaty,
      foreign tax credits, and US reporting (FBAR/FATCA).
    steps:
      - text: "Work out whether you are a French tax resident under the four tax-domicile criteria."
        links:
          - text: "Service-Public — how to determine your tax domicile"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F62?lang=en"
            sourceName: "Service-Public — How to determine your tax domicile"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "If resident, file a French income-tax return covering your worldwide income, applying the France–US tax treaty; report any foreign accounts."
        tip: "As a US citizen you generally keep US filing obligations too. Get specialist France–US cross-border tax advice before your first return."
        links:
