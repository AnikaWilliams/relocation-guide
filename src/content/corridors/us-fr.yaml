  # ===========================================================================
  - id: open-bank-account
    title: "Open a French bank account (and the right-to-account safety net)"
    category: finance-banking
    summary:
      text: "You will generally need a French bank account for salary, rent and bills. Banks set their own onboarding requirements (typically proof of identity, proof of address in France, and residence/visa status). If a bank refuses to open an account — or does not respond within 15 days — you can use the «right to an account» (droit au compte): the Banque de France will designate a bank that must open a basic-services account for you."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
      sourceName: "Service-Public — Right to a bank account (droit au compte)"
      # VERIFIED 2026-06-13 (fact-verifier): Service-Public F2417 re-fetched LIVE (sha256 5a871fcd…). Verbatim: "If a bank does not respond to your request within 15 days … this is considered a refusal"; on refusal "the Banque de France shall designate … the bank responsible for opening" an account that "must open an account with basic banking services." Supported. (Bank-set onboarding docs are general practice; the load-bearing droit-au-compte mechanism is sourced exactly.)
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-fr 2026-06-13"
      sourceHash: "5a871fcd81c8631aaba228b20b1b0a0114bfc3294d5ea35e18e408cb1813715a"
      reviewBy: "2026-09-11"
    tldr:
      text: "A French bank account is needed for salary, rent and bills; expect to show ID, proof of a French address and your residence status. If you are refused (or get no answer within 15 days), the «droit au compte» lets the Banque de France designate a bank that must open a basic-services account for you."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
      sourceName: "Service-Public — Right to a bank account (droit au compte)"
      # VERIFIED 2026-06-13 (fact-verifier): same live F2417 (sha256 5a871fcd…). 15-days-silence = refusal, and Banque-de-France designation of a bank that must open a basic-services account, confirmed verbatim.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-fr 2026-06-13"
      sourceHash: "5a871fcd81c8631aaba228b20b1b0a0114bfc3294d5ea35e18e408cb1813715a"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Right to an account"
        text: "If a bank refuses to open an account (or does not respond within 15 days, which counts as a refusal), you can ask the Banque de France to designate a bank that must open an account with basic banking services."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
        sourceName: "Service-Public — Right to a bank account (droit au compte)"
        # VERIFIED 2026-06-13 (fact-verifier): live F2417 (sha256 5a871fcd…). Verbatim: "A bank may refuse you to open an account. If a bank does not respond to your request within 15 days … this is considered a refusal"; "[the Banque de France] must open an account for you and give you access to basic banking services" / "the Banque de France shall designate … the bank responsible for opening" it. Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "5a871fcd81c8631aaba228b20b1b0a0114bfc3294d5ea35e18e408cb1813715a"
        reviewBy: "2026-09-11"
      - label: "What to bring"
        text: "The right-to-account file requires a request form, valid French or foreign ID, proof of domicile (e.g. a utility bill or rent receipt under three months), and the bank's letter of refusal or acknowledgement."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
        sourceName: "Service-Public — Right to a bank account (droit au compte)"
        # VERIFIED 2026-06-13 (fact-verifier): live F2417 (sha256 5a871fcd…). Verbatim file list: "[Account] Entitlement Request Form; Valid French or foreign ID; Proof of domicile (e.g. water bill or telephone under 3 months, rent receipt …, title to the principal residence); Letter of refusal from the bank approached, or acknowledgement of receipt." Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "5a871fcd81c8631aaba228b20b1b0a0114bfc3294d5ea35e18e408cb1813715a"
        reviewBy: "2026-09-11"
      - label: "US-specific note"
        text: "As a US person, French banks must apply FATCA reporting; some banks are more reluctant to onboard US citizens. Confirm a bank's US-person policy before applying. (Confirm with the bank / Banque de France.)"
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
        sourceName: "Service-Public — Right to a bank account (droit au compte)"
        # KICKED BACK 2026-06-13 (fact-verifier): the cited source (live F2417, sha256 5a871fcd…) is the droit-au-compte page and contains NO mention of FATCA, "US person", US citizens, or the United States (grep over the live text returns zero hits). It cannot support the FATCA-reporting or banks-reluctant-to-onboard-US-citizens assertions. The claim's own hedge "(Confirm with the bank / Banque de France)" signals it is unsourced. Researcher/frontend: either cite a primary source for FATCA (e.g. impots.gouv.fr / the France–US IGA) or recast as a "confirm with [authority]" note per CLAUDE.md rule 1 — do NOT cite F2417 for it. Left UNVERIFIED.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      A French current account ("compte courant") is needed in practice for receiving salary,
      paying rent and setting up direct debits. Banks decide their own documentary requirements,
      but a passport, proof of a French address and your residence/visa status are the usual
      core. US citizens should be aware that French banks must report US-person accounts under
      FATCA and that some banks are wary of onboarding US clients; ask about a bank's US-person
      policy up front. If you cannot get an account opened, the «droit au compte» is a legal
      safety net: after a refusal (or 15 days' silence), the Banque de France designates a bank
      that must provide a basic-services account.
    steps:
      - text: "Approach a French bank with your passport, proof of a French address and your residence/visa documents; ask about its US-person (FATCA) onboarding policy."
        links:
          - text: "Service-Public — right to a bank account (after a refusal)"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
            sourceName: "Service-Public — Right to a bank account (droit au compte)"
            # VERIFIED 2026-06-13 (fact-verifier): live F2417 (sha256 5a871fcd…); the official droit-au-compte page describing the right to an account after a refusal. Link accurate. (Note: the surrounding step text's FATCA mention is not from this page — see the US-specific keyFact kicked back above.)
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-fr 2026-06-13"
            sourceHash: "5a871fcd81c8631aaba228b20b1b0a0114bfc3294d5ea35e18e408cb1813715a"
            reviewBy: "2026-09-11"
      - text: "If refused (or no response within 15 days), apply to the Banque de France for the right to an account."
        links:
          - text: "Service-Public — how to apply for the droit au compte via the Banque de France"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
            sourceName: "Service-Public — Right to a bank account (droit au compte)"
            # VERIFIED 2026-06-13 (fact-verifier): live F2417 (sha256 5a871fcd…); page describes how to apply for the account entitlement via the Banque de France (the refusing bank can forward the request, or you apply directly). Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-fr 2026-06-13"
            sourceHash: "5a871fcd81c8631aaba228b20b1b0a0114bfc3294d5ea35e18e408cb1813715a"
            reviewBy: "2026-09-11"
    documents:
      - name: "Right-to-account request (Banque de France)"
        type: form
        description: "If a bank refuses, the right-to-account request to the Banque de France; the bank that refused can forward it, or you can apply directly. Procedure and form list on Service-Public."
        form:
          text: "Apply for the droit au compte via the Banque de France. Service-Public is the authority describing the procedure, the required file and the official online démarche."
          sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
          sourceName: "Service-Public — Right to a bank account (droit au compte)"
          # VERIFIED 2026-06-13 (fact-verifier): live F2417 (sha256 5a871fcd…); the authority page describing the droit-au-compte procedure and the required file. Link accurate.
          status: VERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: "fact-verifier-fr 2026-06-13"
          sourceHash: "5a871fcd81c8631aaba228b20b1b0a0114bfc3294d5ea35e18e408cb1813715a"
          reviewBy: "2026-09-11"
      - name: "Valid passport / ID"
        type: provide
        description: "A valid French or foreign identity document (your US passport)."
      - name: "Proof of domicile in France"
        type: provide
        description: "Proof of address under three months old (e.g. utility bill, rent receipt, or title to your main residence)."
      - name: "Bank's letter of refusal (for droit au compte)"
        type: provide
        description: "If using the right to an account, the refusing bank's letter of refusal or acknowledgement of your request."
