        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        # VERIFIED 2026-06-13 (fact-verifier): live F16162 (sha256 1a3fe90f…), "Who can help me?" legal-references block, verbatim: "Code of entry and residence of foreigners and right of asylum: Articles R431-1 to R431-24 — Long-stay visa as residence permit and temporary [residence card]." Citation confirmed character-for-character.
