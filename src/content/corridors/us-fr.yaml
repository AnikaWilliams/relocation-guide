        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F12859?lang=en"
        sourceName: "Service-Public — Health insurance of a foreigner settling in France"
        # VERIFIED 2026-06-13 (fact-verifier): Service-Public F12859 re-fetched LIVE (sha256 0fffc5ec…). Verbatim: "If they have been residing in France with you since more than 3 months, your family members are covered by the French Health Insu[rance]" and reimbursed for care. Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "0fffc5ec8486b66f1f1baadb6a86599a2aedb2d85fc69a09c337c28c08c32dc5"
        reviewBy: "2026-09-11"
      - label: "Students"
        text: "Foreign students register with French health insurance via the dedicated portal etudiant-etranger.ameli.fr."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F12859?lang=en"
        sourceName: "Service-Public — Health insurance of a foreigner settling in France"
        # VERIFIED 2026-06-13 (fact-verifier): live F12859 (sha256 0fffc5ec…). The page (auto-translated EN rendering) directs students to the dedicated portal, verbatim: "you must register with French Health Insurance on the website student-foreigner.ameli.fr." NOTE: the translation engine literally translated the subdomain words — the real French URL is "etudiant-etranger.ameli.fr" (as the claim correctly writes it). Domain confirmed; supported.
        status: VERIFIED
