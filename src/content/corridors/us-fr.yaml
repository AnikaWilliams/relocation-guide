        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "b5fe2a8abeedc0b79df4a89018aa246e095c0270318673be5509ec3f649faacc"
        # 30-day window: resource thresholds.
        reviewBy: "2026-07-13"
      - label: "Housing"
        text: "You must have (or prove you will have on the family's arrival) accommodation considered normal for a comparable family in the same geographic area, meeting sanitary and equipment conditions."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
        sourceName: "Service-Public — Family reunification"
        # VERIFIED 2026-06-13 (fact-verifier): live F11166 (sha256 b5fe2a8a…). Verbatim: "[on the] arrival of your family in France) … housing considered normal for a comparable family living in the same geographical region. Housing must meet certain sanitary and equipment conditions." Supported.
