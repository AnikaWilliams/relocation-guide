  # ===========================================================================
  - id: family-reunification
    title: "Bring your spouse and minor children through family reunification"
    category: family-dependents
    summary:
      text: "If you hold a residence card valid for at least one year (or a 10-year resident card) and have lived in France for at least 18 months, you can apply for family reunification for your spouse (at least 18) and minor children. You must show stable, sufficient resources — for a 2–3 person household, on average the gross monthly minimum wage (SMIC) of €1,867.02 over the last 12 months — and adequate housing for your family. Note: if you hold a Passeport Talent, your family can instead use the simpler «talent-famille» procedure."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
      sourceName: "Service-Public — Family reunification"
      # VERIFIED 2026-06-13 (fact-verifier): Service-Public F11166 re-fetched LIVE (sha256 b5fe2a8a…). Verbatim: "residence card of at least 1 year"; "You must also have resided for at least 18 months in France"; "2 or 3 persons: average of the monthly gross minimum growth wage (Smic), i.e €1,867.02, in the last 12 months"; "spouse who is at least 18" + "minor child"; housing "considered normal for a comparable family living in the same geographical region. Housing must meet certain sanitary and equipment conditions." The talent-famille alternative is on F16922 (verified above). All figures character-for-character.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-fr 2026-06-13"
      sourceHash: "b5fe2a8abeedc0b79df4a89018aa246e095c0270318673be5509ec3f649faacc"
      # 30-day window: contains the resource thresholds (SMIC €1,867.02 etc.).
      reviewBy: "2026-07-13"
    tldr:
      text: "Standard family reunification lets you bring your spouse (18+) and minor children once you hold a residence card valid ≥1 year and have lived in France ≥18 months, with stable resources (about €1,867.02/month gross for a 2–3 person household) and adequate housing. Passeport Talent holders skip this and use the simpler «talent-famille» route."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
      sourceName: "Service-Public — Family reunification"
