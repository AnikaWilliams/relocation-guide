  # ===========================================================================
  - id: income-tax
    title: "Understand your French income-tax residency"
    category: taxes
    summary:
      text: "Once you live in France you are likely a French tax resident, which means France taxes your worldwide income. Your tax domicile is in France if any one of these applies: your home/household is in France; your main stay is in France (at least 183 days in the year); your main professional activity is in France; or your centre of economic interests is in France. A tax treaty between France and your country can change these rules and is designed to avoid double taxation."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F62?lang=en"
      sourceName: "Service-Public — How to determine your tax domicile"
      # VERIFIED 2026-06-13 (fact-verifier): Service-Public F62 re-fetched LIVE (sha256 83f9e436…). Verbatim: "Your tax domicile is in France if you fill in one of the following criteria" — "Your home is in France" (household); main stay "you are staying there at least 183 days"; "you have your main activity there"; "The center of your economic interests is in France." The worldwide-income consequence and tax-treaty modification are on companion F36401 (verified below). Supported.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-fr 2026-06-13"
      sourceHash: "83f9e436eaa8ac7f29f4dd05f15ee0f608c9e407625316f0c530d3e0f59dda57"
      reviewBy: "2026-09-11"
    tldr:
      text: "Living in France usually makes you a French tax resident, taxed on your worldwide income. You are tax-domiciled in France if any one applies: your household, your main stay (≥183 days), your main job, or your centre of economic interests is in France. The France–US tax treaty modifies this to avoid double taxation — get specialist advice as a US citizen, since the US also taxes by citizenship."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F62?lang=en"
      sourceName: "Service-Public — How to determine your tax domicile"
      # VERIFIED 2026-06-13 (fact-verifier): same live F62 (sha256 83f9e436…). The four "one of the following criteria" tax-domicile tests (home/household, main stay ≥183 days, main activity, centre of economic interests) confirmed verbatim. (US-taxes-by-citizenship is general background, not a France-source claim; worldwide-income + treaty are sourced on F36401.)
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-fr 2026-06-13"
      sourceHash: "83f9e436eaa8ac7f29f4dd05f15ee0f608c9e407625316f0c530d3e0f59dda57"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "When you are tax-resident"
        text: "Your tax domicile is in France if any one criterion is met: your home/household is in France; your main stay is in France (at least 183 days, i.e. more than six months); your main professional activity is in France; or your centre of economic interests is in France."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F62?lang=en"
        sourceName: "Service-Public — How to determine your tax domicile"
        # VERIFIED 2026-06-13 (fact-verifier): live F62 (sha256 83f9e436…). Verbatim: "Your tax domicile is in France if you fill in one of the following criteria"; "Your home is in France"; "the place of your main stay, that is to say that you are staying there at least 183 days"; "you have your main activity there"; "The center of your economic interests is in France." All four criteria + the 183-day figure character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "83f9e436eaa8ac7f29f4dd05f15ee0f608c9e407625316f0c530d3e0f59dda57"
        reviewBy: "2026-09-11"
      - label: "What is taxed"
        text: "If you are tax-resident in France you are subject to French income tax on your income of both French and foreign origin (worldwide income); non-residents are taxed only on French-source income, subject to any tax treaty."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F36401?lang=en"
        sourceName: "Service-Public — Taxes paid by a foreigner in France"
        # VERIFIED 2026-06-13 (fact-verifier): Service-Public F36401 re-fetched LIVE (sha256 fbe956ba…). Verbatim: "[if tax resident] subject to income tax in France for your income of french and foreign origin" / "You must declare in France all your income, whether they are of French origin or of foreign origin"; "[if not tax resident] for your income of french origin (subject to the tax treaty …)." Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "fbe956ba6a2fe1ec928edc6083dd1f1e636416d52f40f0a2b0ec75dd55e1597c"
        reviewBy: "2026-09-11"
      - label: "Tax treaty"
        text: "An international convention (tax treaty) between France and a foreign country can provide different rules and is used to avoid double taxation of the same income."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F36401?lang=en"
        sourceName: "Service-Public — Taxes paid by a foreigner in France"
        # VERIFIED 2026-06-13 (fact-verifier): live F36401 (sha256 fbe956ba…). Verbatim: "One international convention concluded between France and a foreigner country may provid[e different rules]" and a "How can the risks of double taxation of income be avoided?" section. Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "fbe956ba6a2fe1ec928edc6083dd1f1e636416d52f40f0a2b0ec75dd55e1597c"
        reviewBy: "2026-09-11"
      - label: "Reporting foreign accounts"
        text: "French tax residents must report accounts opened, held, used or closed abroad during the year to the French tax authority."
