        reviewBy: "2026-09-11"
      - label: "Resources"
        text: "Stable, sufficient resources over the last 12 months, scaled to household size: 2–3 people €1,867.02/month (the gross SMIC); 4–5 people €2,053.72; 6+ people €2,240.42."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
        sourceName: "Service-Public — Family reunification"
        # VERIFIED 2026-06-13 (fact-verifier): live F11166 (sha256 b5fe2a8a…). Verbatim: "2 or 3 persons: average of the monthly gross minimum growth wage (Smic), i.e €1,867.02, in the last 12 months … 4 or 5 people: on average €2,053.72 … 6 or more people: on average €2,240.42." All three figures character-for-character.
        status: VERIFIED
