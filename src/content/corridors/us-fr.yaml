        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "11b4b0e6f5d65fe6dc2cb90f730d25b4f405788c4f12503f6600c32a02ea57ce"
        reviewBy: "2026-09-11"
    detail: >
      Standard family reunification (regroupement familial) is the route for most residence-card
      holders to bring a spouse and minor children, and it has real prerequisites: a card valid
      at least one year, 18 months of prior residence in France, stable resources scaled to
      household size (from the gross SMIC upward), and adequate housing. The family must in
      principle still be abroad when you apply. Ascendants are not covered. The application is
      made to the OFII, which assesses resources and housing; a refusal can be challenged before
      the administrative court. If you arrived on a Passeport Talent or EU Blue Card, do not use
      this route — your family is admitted far more simply as «talent-famille» without the
      18-month wait or the resources/housing test in the same form. Confirm the current resource
      figures, which track the SMIC and are revised.
    steps:
