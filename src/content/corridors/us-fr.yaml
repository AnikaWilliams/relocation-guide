          # VERIFIED 2026-06-13 (fact-verifier): live F11166 (sha256 b5fe2a8a…); the authority page describing conditions/documents/procedure — the file is "Transmission … to the Ofii." Authority-page link (not a self-hosted PDF) confirmed correct and current.
          status: VERIFIED
