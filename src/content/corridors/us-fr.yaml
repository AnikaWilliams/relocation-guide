        sourceName: "Service-Public — Republican Integration Contract (CIR)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Why it matters"
        text: "Since 1 January 2026 the CIR's language level and a civic examination are required to obtain a multi-year residence card or a resident card."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
        sourceName: "Service-Public — Republican Integration Contract (CIR)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The CIR is part of the personalised "republican integration" pathway for non-European
      newcomers who settle in France long-term. The OFII prepares it after a personalised
      interview (with translation into a language you understand) that includes a written and
      oral French test. You commit to civic training and, if below A2, to OFII-prescribed
      language training. The contract is signed by you and, on behalf of the State, by the
      Prefect, for one year. Completing the CIR — and, since 1 January 2026, reaching its
      language level and passing the civic examination — is what lets the prefect issue a
      multi-year card (two to four years) at your first renewal. Talent-passport holders and
      certain students are exempt; if you were not offered a CIR on entry you can ask to sign
      one voluntarily at your local OFII.
    steps:
      - text: "Attend the personalised OFII interview (including the French-language test) after your first admission to France."
        links:
          - text: "Service-Public — CIR: the personalised OFII interview and language test"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
            sourceName: "Service-Public — Republican Integration Contract (CIR)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Sign the CIR and complete the prescribed civic training (and language training if below A2)."
        links:
          - text: "Service-Public — CIR commitments (civic and language training)"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
            sourceName: "Service-Public — Republican Integration Contract (CIR)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "OFII integration-contract appointment"
        type: form
        description: "The OFII prepares and presents the CIR at a personalised interview; if you were not offered one on entry you can request to sign one at your local OFII (procedure on Service-Public)."
        form:
          text: "The CIR is prepared by the OFII following the personalised interview. If you did not sign one on entry you can ask to sign it voluntarily by contacting your local OFII office; Service-Public describes the procedure and links the OFII directory."
          sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
          sourceName: "Service-Public — Republican Integration Contract (CIR)"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Passport and residence document"
        type: provide
        description: "Your passport and your VLS-TS or residence permit, for the OFII interview."
    dependsOn: [validate-vls-ts]
    # Settlement/integration step; not applicable to a short visitor stay where the
    # person is exempt, and explicitly not to study-only entrants exempt by category.
    appliesIf: "motivation != 'study'"

  # ===========================================================================
  - id: health-insurance-puma
    title: "Get covered by French health insurance (PUMa)"
    category: healthcare-insurance
    summary:
      text: "Once you work or reside in France on a stable and regular basis you are covered for your healthcare costs under Universal Health Protection (Protection universelle maladie, PUMa). If you work, you are enrolled in the health insurance from your first activity; if you are not working, you generally must wait three months after arrival before your rights open, and must live in France at least six months a year. Family members residing with you for more than three months are also covered."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
      sourceName: "Service-Public — Universal Health Protection (PUMa)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "France's PUMa covers your healthcare costs once you work or reside there on a stable, regular basis. Workers are covered from their first day of activity; the non-working generally wait three months and must live in France at least six months a year. A residence permit is required, and family living with you over three months is covered too."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
      sourceName: "Service-Public — Universal Health Protection (PUMa)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who is covered"
        text: "Anyone who works or resides in France on a stable and regular basis is entitled to cover of their healthcare costs in a personal capacity under the PUMa; a residence permit/document is required for the regularity condition."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
        sourceName: "Service-Public — Universal Health Protection (PUMa)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "If you work"
        text: "Under the PUMa anyone working in France is entitled to payment of their healthcare costs from their first day of activity; you are enrolled immediately once your application is accepted."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
        sourceName: "Service-Public — Universal Health Protection (PUMa)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "If you are not working"
        text: "Without a professional activity you must wait three months after arriving before your rights open, and you must live in France at least six months of the year."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
        sourceName: "Service-Public — Universal Health Protection (PUMa)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Family"
        text: "Family members who have resided in France with you for more than three months are covered by French health insurance and reimbursed for healthcare."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F12859?lang=en"
        sourceName: "Service-Public — Health insurance of a foreigner settling in France"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Students"
        text: "Foreign students register with French health insurance via the dedicated portal etudiant-etranger.ameli.fr."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F12859?lang=en"
        sourceName: "Service-Public — Health insurance of a foreigner settling in France"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      PUMa is France's universal health cover; it guarantees continuous reimbursement of
      healthcare costs once you work or reside in France on a stable and regular basis (a valid
      residence permit satisfies the regularity condition). Employees are covered from the first
      day of activity; the inactive wait three months and must spend at least six months a year
      in France. You register with the local health insurance fund (CPAM) of your place of
      residence; students use the dedicated etudiant-etranger.ameli.fr portal. PUMa reimburses
      a large share of costs but not all — most residents also take out a complementary health
      insurance ("mutuelle"). Note: a 2026 social-security financing law introduces a financial
      contribution for some inactive PUMa beneficiaries; the amount awaits a decree — confirm
      the current position with the health insurance fund.
    steps:
      - text: "Register with the local health insurance fund (CPAM) of your place of residence once you meet the work or residence condition; students register via etudiant-etranger.ameli.fr."
        links:
          - text: "Service-Public — health insurance of a foreigner settling in France (registration)"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F12859?lang=en"
            sourceName: "Service-Public — Health insurance of a foreigner settling in France"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Consider taking out a complementary health insurance (\"mutuelle\") to cover the share PUMa does not reimburse."
        links:
          - text: "Service-Public — complementary health insurance alongside PUMa"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F12859?lang=en"
            sourceName: "Service-Public — Health insurance of a foreigner settling in France"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "PUMa / health-insurance registration with your CPAM"
        type: form
        description: "Register with the health insurance fund (CPAM) of your place of residence; students use the dedicated student portal. Service-Public describes the route and links the official services."
        form:
          text: "Register for French health insurance via your local CPAM (or, for students, etudiant-etranger.ameli.fr). Service-Public is the authority describing who is covered and how to register."
          sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F12859?lang=en"
          sourceName: "Service-Public — Health insurance of a foreigner settling in France"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Valid residence permit or VLS-TS"
        type: provide
        description: "Your validated VLS-TS or residence permit (the regularity condition for PUMa)."
      - name: "Proof of stable residence in France"
        type: provide
        description: "Proof of address and, for the inactive, evidence you live in France at least six months a year."
      - name: "Employment contract or proof of activity (if working)"
        type: provide
        description: "Your employment contract or proof of professional activity, which opens cover from the first day."
    dependsOn: [validate-vls-ts]

  # ===========================================================================
  - id: family-reunification
    title: "Bring your spouse and minor children through family reunification"
    category: family-dependents
    summary:
      text: "If you hold a residence card valid for at least one year (or a 10-year resident card) and have lived in France for at least 18 months, you can apply for family reunification for your spouse (at least 18) and minor children. You must show stable, sufficient resources — for a 2–3 person household, on average the gross monthly minimum wage (SMIC) of €1,867.02 over the last 12 months — and adequate housing for your family. Note: if you hold a Passeport Talent, your family can instead use the simpler «talent-famille» procedure."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
      sourceName: "Service-Public — Family reunification"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: contains the resource thresholds (SMIC €1,867.02 etc.).
      reviewBy: "2026-07-13"
    tldr:
      text: "Standard family reunification lets you bring your spouse (18+) and minor children once you hold a residence card valid ≥1 year and have lived in France ≥18 months, with stable resources (about €1,867.02/month gross for a 2–3 person household) and adequate housing. Passeport Talent holders skip this and use the simpler «talent-famille» route."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
      sourceName: "Service-Public — Family reunification"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Eligibility"
        text: "You must hold a residence card valid for at least one year (or a 10-year resident card) and have resided in France for at least 18 months."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
        sourceName: "Service-Public — Family reunification"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Who can come"
        text: "Your spouse aged at least 18 and your minor children; ascendants (parents) are excluded and may only come as visitors if adequately resourced."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
        sourceName: "Service-Public — Family reunification"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Resources"
        text: "Stable, sufficient resources over the last 12 months, scaled to household size: 2–3 people €1,867.02/month (the gross SMIC); 4–5 people €2,053.72; 6+ people €2,240.42."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
        sourceName: "Service-Public — Family reunification"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        # 30-day window: resource thresholds.
        reviewBy: "2026-07-13"
      - label: "Housing"
        text: "You must have (or prove you will have on the family's arrival) accommodation considered normal for a comparable family in the same geographic area, meeting sanitary and equipment conditions."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
        sourceName: "Service-Public — Family reunification"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Talent shortcut"
        text: "Passeport Talent / EU Blue Card holders do NOT use family reunification: their spouse and minor children get a «talent-famille» card through the simplified accompanying-family procedure."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
        sourceName: "Service-Public — Talent residence card (multi-year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Standard family reunification (regroupement familial) is the route for most residence-card
      holders to bring a spouse and minor children, and it has real prerequisites: a card valid
      at least one year, 18 months of prior residence in France, stable resources scaled to
      household size (from the gross SMIC upward), and adequate housing. The family must in
      principle still be abroad when you apply. Ascendants are not covered. The application is
      made to the OFII, which assesses resources and housing; a refusal can be challenged before
      the administrative court. If you arrived on a Passeport Talent or EU Blue Card, do not use
      this route — your family is admitted far more simply as «talent-famille» without the
      18-month wait or the resources/housing test in the same form. Confirm the current resource
      figures, which track the SMIC and are revised.
    steps:
      - text: "Check you meet the eligibility (card valid ≥1 year, 18 months' residence), resource, and housing conditions — Service-Public offers a simulator."
        links:
          - text: "Service-Public — family reunification: conditions and simulator"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
            sourceName: "Service-Public — Family reunification"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "File the family-reunification application with the OFII, with civil-status and resource/housing documents; the family applies for the VLS-TS once approved."
        links:
          - text: "Service-Public — family reunification: documents and procedure"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
            sourceName: "Service-Public — Family reunification"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Family-reunification application to the OFII"
        type: form
        description: "The family-reunification application filed with the OFII; obtain the current procedure and forms from Service-Public / the OFII rather than a self-hosted PDF."
        form:
          text: "File the family-reunification application with the OFII. Service-Public is the authority describing the conditions, documents and procedure and linking the official services."
          sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
          sourceName: "Service-Public — Family reunification"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Your valid residence card (≥1 year)"
        type: provide
        description: "Your residence card valid for one year or more (or 10-year resident card), proving eligibility to sponsor."
      - name: "Civil-status documents (marriage and birth certificates)"
        type: provide
        description: "Full copies of your marriage certificate and the birth certificates of your spouse and each child, with marginal mentions."
      - name: "Proof of resources (last 12 months)"
        type: provide
        description: "Evidence of stable, sufficient resources over the last 12 months at the level required for your household size."
      - name: "Proof of adequate housing"
        type: provide
        description: "Evidence of accommodation normal for a comparable family in your area (lease, title, or undertaking for the family's arrival)."
    warning: >
      Resource thresholds track the SMIC and are revised; the figures here (e.g. €1,867.02 for
      2–3 people) must be confirmed against Service-Public before relying on them. If you hold a
      Passeport Talent, use the «talent-famille» route instead — it is far simpler.
    dependsOn: []
    appliesIf: "motivation == 'family'"

  # ===========================================================================
  - id: open-bank-account
    title: "Open a French bank account (and the right-to-account safety net)"
    category: finance-banking
    summary:
      text: "You will generally need a French bank account for salary, rent and bills. Banks set their own onboarding requirements (typically proof of identity, proof of address in France, and residence/visa status). If a bank refuses to open an account — or does not respond within 15 days — you can use the «right to an account» (droit au compte): the Banque de France will designate a bank that must open a basic-services account for you."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
      sourceName: "Service-Public — Right to a bank account (droit au compte)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "A French bank account is needed for salary, rent and bills; expect to show ID, proof of a French address and your residence status. If you are refused (or get no answer within 15 days), the «droit au compte» lets the Banque de France designate a bank that must open a basic-services account for you."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
      sourceName: "Service-Public — Right to a bank account (droit au compte)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Right to an account"
        text: "If a bank refuses to open an account (or does not respond within 15 days, which counts as a refusal), you can ask the Banque de France to designate a bank that must open an account with basic banking services."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
        sourceName: "Service-Public — Right to a bank account (droit au compte)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "What to bring"
        text: "The right-to-account file requires a request form, valid French or foreign ID, proof of domicile (e.g. a utility bill or rent receipt under three months), and the bank's letter of refusal or acknowledgement."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
        sourceName: "Service-Public — Right to a bank account (droit au compte)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "US-specific note"
        text: "As a US person, French banks must apply FATCA reporting; some banks are more reluctant to onboard US citizens. Confirm a bank's US-person policy before applying. (Confirm with the bank / Banque de France.)"
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
        sourceName: "Service-Public — Right to a bank account (droit au compte)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      A French current account ("compte courant") is needed in practice for receiving salary,
      paying rent and setting up direct debits. Banks decide their own documentary requirements,
      but a passport, proof of a French address and your residence/visa status are the usual
      core. US citizens should be aware that French banks must report US-person accounts under
      FATCA and that some banks are wary of onboarding US clients; ask about a bank's US-person
      policy up front. If you cannot get an account opened, the «droit au compte» is a legal
      safety net: after a refusal (or 15 days' silence), the Banque de France designates a bank
      that must provide a basic-services account.
    steps:
      - text: "Approach a French bank with your passport, proof of a French address and your residence/visa documents; ask about its US-person (FATCA) onboarding policy."
        links:
          - text: "Service-Public — right to a bank account (after a refusal)"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
            sourceName: "Service-Public — Right to a bank account (droit au compte)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "If refused (or no response within 15 days), apply to the Banque de France for the right to an account."
        links:
          - text: "Service-Public — how to apply for the droit au compte via the Banque de France"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
            sourceName: "Service-Public — Right to a bank account (droit au compte)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Right-to-account request (Banque de France)"
        type: form
        description: "If a bank refuses, the right-to-account request to the Banque de France; the bank that refused can forward it, or you can apply directly. Procedure and form list on Service-Public."
        form:
          text: "Apply for the droit au compte via the Banque de France. Service-Public is the authority describing the procedure, the required file and the official online démarche."
          sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2417?lang=en"
          sourceName: "Service-Public — Right to a bank account (droit au compte)"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Valid passport / ID"
        type: provide
        description: "A valid French or foreign identity document (your US passport)."
      - name: "Proof of domicile in France"
        type: provide
        description: "Proof of address under three months old (e.g. utility bill, rent receipt, or title to your main residence)."
      - name: "Bank's letter of refusal (for droit au compte)"
        type: provide
        description: "If using the right to an account, the refusing bank's letter of refusal or acknowledgement of your request."
    dependsOn: []

  # ===========================================================================
  - id: income-tax
    title: "Understand your French income-tax residency"
    category: taxes
    summary:
      text: "Once you live in France you are likely a French tax resident, which means France taxes your worldwide income. Your tax domicile is in France if any one of these applies: your home/household is in France; your main stay is in France (at least 183 days in the year); your main professional activity is in France; or your centre of economic interests is in France. A tax treaty between France and your country can change these rules and is designed to avoid double taxation."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F62?lang=en"
      sourceName: "Service-Public — How to determine your tax domicile"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Living in France usually makes you a French tax resident, taxed on your worldwide income. You are tax-domiciled in France if any one applies: your household, your main stay (≥183 days), your main job, or your centre of economic interests is in France. The France–US tax treaty modifies this to avoid double taxation — get specialist advice as a US citizen, since the US also taxes by citizenship."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F62?lang=en"
      sourceName: "Service-Public — How to determine your tax domicile"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "When you are tax-resident"
        text: "Your tax domicile is in France if any one criterion is met: your home/household is in France; your main stay is in France (at least 183 days, i.e. more than six months); your main professional activity is in France; or your centre of economic interests is in France."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F62?lang=en"
        sourceName: "Service-Public — How to determine your tax domicile"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "What is taxed"
        text: "If you are tax-resident in France you are subject to French income tax on your income of both French and foreign origin (worldwide income); non-residents are taxed only on French-source income, subject to any tax treaty."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F36401?lang=en"
        sourceName: "Service-Public — Taxes paid by a foreigner in France"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Tax treaty"
        text: "An international convention (tax treaty) between France and a foreign country can provide different rules and is used to avoid double taxation of the same income."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F36401?lang=en"
        sourceName: "Service-Public — Taxes paid by a foreigner in France"
        status: UNVERIFIED
