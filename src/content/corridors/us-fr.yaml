        # VERIFIED 2026-06-13 (fact-verifier): live F17048 (sha256 446869df…). Verbatim: "Since 1 January 2026, successful completion of this civic examination is required for access to a multi-year residence card [or] resident card" and "[a] command of the French language, level B1 for resident cards, level A2 for multiannual residence cards." Supported (language level + civic exam, since 1 Jan 2026).
        status: VERIFIED
