title: "Moving from the USA to France"
description: "How US citizens (non-EU/EEA third-country nationals) relocate to France for work, study, family reunification, or retirement: choosing the right long-stay visa (type D / VLS-TS) and residence permit (including the Passeport Talent and EU Blue Card), validating your visa online after arrival, the OFII integration contract, mandatory health insurance (PUMa), opening a bank account, and French income-tax residency."
lastReviewed: "2026-06-13"
reviewedBy: "research-2"
