originIso2: us
destinationIso2: fr
title: "Moving from the USA to France"
description: "How US citizens (non-EU/EEA third-country nationals) relocate to France for work, study, family reunification, or retirement: choosing the right long-stay visa (type D / VLS-TS) and residence permit (including the Passeport Talent and EU Blue Card), validating your visa online after arrival, the OFII integration contract, mandatory health insurance (PUMa), opening a bank account, and French income-tax residency."
lastReviewed: "2026-06-13"
reviewedBy: "research-2"
# RESEARCH DRAFT (ADR-0016 research run). Every claim is status: UNVERIFIED with
# a primary official sourceUrl (france-visas.gouv.fr / service-public.gouv.fr,
# captured via scripts/snapshot-source.mjs into sources/us-fr/). published:false
# until the SEPARATE fact-verifier team run re-derives each claim from its live
# source and flips it VERIFIED (two-agent rule). Nothing here is verified.
# Covered routes drafted: work (employee VLS-TS + Passeport Talent + EU Blue Card),
# study, family reunification, retirement (visitor card). "Other" uncovered.
published: false
coversMotivations: [work, family, study, retirement]
tasks:
  # ===========================================================================
  - id: work-permit-employer
    title: "Get your employer's work permit and the salaried-worker long-stay visa"
    category: visa-permit
    summary:
      text: "As a US citizen you are a non-EU/EEA third-country national, so to take up salaried employment in France your employer must obtain a work permit (autorisation de travail) from the French authorities before you arrive. With that permit you apply for a long-stay visa that serves as a residence permit (VLS-TS) bearing the statement «salarié» for a permanent contract (CDI) or «travailleur temporaire» for a fixed-term contract (CDD)."
      sourceUrl: "https://france-visas.gouv.fr/en/activite-salariee"
      sourceName: "France-Visas — Salaried employment"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "To work for a French employer as a US citizen you cannot apply for the work permit yourself: your employer must obtain a work permit (autorisation de travail) from the French authorities first. You then apply at a French consulate for a long-stay visa that doubles as a residence permit (VLS-TS) marked «salarié» (permanent contract) or «travailleur temporaire» (fixed-term contract), submitting that work permit with your visa application."
      sourceUrl: "https://france-visas.gouv.fr/en/activite-salariee"
      sourceName: "France-Visas — Salaried employment"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who applies"
        text: "Your employer obtains the work permit (autorisation de travail) from the French authorities before you arrive; you then apply for the visa and must submit that work permit with your visa application."
        sourceUrl: "https://france-visas.gouv.fr/en/activite-salariee"
        sourceName: "France-Visas — Salaried employment"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Where"
        text: "Apply for the long-stay visa at the French consular authorities responsible for your place of residence in the USA; after arrival the residence-permit side is handled by your local prefecture."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Visa marking"
        text: "Permanent contract (CDI) → long-stay visa serving as a residence permit (VLS-TS) marked «salarié»; fixed-term contract (CDD) → VLS-TS marked «travailleur temporaire»."
        sourceUrl: "https://france-visas.gouv.fr/en/activite-salariee"
        sourceName: "France-Visas — Salaried employment"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "After arrival"
        text: "You must validate the VLS-TS online within three months of arriving in France; the temporary-worker / employee residence card is then valid one year and renewable."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F15898?lang=en"
        sourceName: "Service-Public — Residence card: employee / temporary worker"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Right or discretion"
        text: "Discretion: a work permit must be obtained for the role; there is no automatic entitlement to a third-country salaried work authorisation."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2728?lang=en"
        sourceName: "Service-Public — Work authorisation for a foreign employee"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      France admits third-country salaried workers through a two-part process. First, the
      employer secures a work permit (autorisation de travail) from the French authorities;
      depending on the role and contract this may involve a labour-market assessment. Second,
      armed with that permit, the worker applies at the competent French consulate for a
      long-stay visa that doubles as a residence permit (VLS-TS) — marked «salarié» for a
      permanent contract or «travailleur temporaire» for a fixed-term contract. You can begin
      work on arrival. Within three months you must validate the VLS-TS online; the OFII may
      call you in for a medical check-up and the integration contract. The first card is valid
      one year; on renewal, if you are still employed and meet the integration condition, you
      can obtain a multi-year card valid up to four years. For higher-paid or highly qualified
      roles the Passeport Talent or EU Blue Card (separate task) is usually a stronger route.
    steps:
      - text: "Secure a concrete job offer from a French employer; your employer then applies for your work permit (autorisation de travail) from the French authorities."
        tip: "You generally cannot take up the job until the work permit is granted. Confirm with your employer that the permit is in hand before you book the visa appointment."
        links:
          - text: "France-Visas — Salaried employment: employer must obtain the work permit"
            sourceUrl: "https://france-visas.gouv.fr/en/activite-salariee"
            sourceName: "France-Visas — Salaried employment"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Apply for the long-stay visa (VLS-TS «salarié» or «travailleur temporaire») at the French consular authorities for your US state of residence, submitting the work permit granted to your employer."
        tip: "Use the France-Visas online visa wizard to get the exact document list for your situation, then check the competent consulate's own submission instructions."
        links:
          - text: "France-Visas — submit the work permit granted to your employer with the visa application"
            sourceUrl: "https://france-visas.gouv.fr/en/activite-salariee"
            sourceName: "France-Visas — Salaried employment"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Travel to France on the VLS-TS, then validate it online within three months of arrival (see the separate validation task)."
        links:
          - text: "Service-Public — employee/temporary-worker card: validate the VLS-TS within 3 months"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F15898?lang=en"
            sourceName: "Service-Public — Residence card: employee / temporary worker"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Work permit (autorisation de travail) obtained by your employer"
        type: form
        description: "The official work authorisation your EMPLOYER applies for from the French authorities; you submit a copy with your visa application. Obtain the current procedure and forms from the official work-authorisation page rather than a self-hosted PDF."
        form:
          text: "Work authorisation for a foreign employee — the employer files the request; the current procedure and the categories of permit are described on the official Service-Public page. We link the authority page rather than a deep PDF so it stays current."
          sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2728?lang=en"
          sourceName: "Service-Public — Work authorisation for a foreign employee"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Long-stay visa application (via France-Visas)"
        type: form
        description: "The national (type D) long-stay visa application; complete it through the official France-Visas portal, which generates the document list for your situation."
        form:
          text: "Apply for a long-stay visa through the official France-Visas portal; the portal's visa wizard generates the exact supporting-document list for salaried employment. Submit at the competent French consulate."
          sourceUrl: "https://france-visas.gouv.fr/en/visa-de-long-sejour"
          sourceName: "France-Visas — Long-stay visa"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Signed French employment contract or binding job offer"
        type: provide
        description: "Your signed contract (CDI or CDD) or a binding written job offer from the French employer; the work permit and visa are tied to this role."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport, your travel and identity document throughout the process; check the consulate's required remaining validity."
      - name: "Proof of qualifications"
        type: provide
        description: "Evidence of your professional qualifications (degrees, diplomas, references) as required for the role and the work permit."
      - name: "Passport photos to the required specification"
        type: provide
        description: "Recent passport photographs to the specification set by the consulate / France-Visas."
    warning: >
      A US passport does not exempt you from the long-stay visa: France-Visas states that
      your nationality does not exempt you from the requirement to apply in advance for a
      long-stay visa. Do not travel to take up work on the visa-waiver / 90-day route.
    dependsOn: []
    # This task is the employer-sponsored salaried route; it does not apply to
    # family-reunification, study, or visitor (inactive/retiree) entrants.
    appliesIf: "motivation == 'work'"

  # ===========================================================================
  - id: talent-passport
    title: "Consider the Passeport Talent or EU Blue Card for qualified/higher-paid roles"
    category: visa-permit
    summary:
      text: "If you are a qualified or highly qualified employee, the multi-year «passeport talent» residence permit is usually the strongest route: your employment contract and stay must exceed three months, your employer does not have to apply for a separate work permit, and the card is valid for up to four years. The «talent — qualified employee» path requires a master's-level qualification recognised in France and an annual gross salary of at least €39,582; the «talent — EU Blue Card» path requires a relevant higher-education qualification (or comparable experience), a contract of at least six months, and a gross annual salary of at least €59,373."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
      sourceName: "Service-Public — Talent residence card (multi-year)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: contains salary thresholds (€39,582 / €59,373).
      reviewBy: "2026-07-13"
    tldr:
      text: "The «passeport talent» is a multi-year residence permit (up to four years) for qualified employees and similar profiles; the employer is exempt from applying for a separate work permit, and your family can join under a simplified «talent-famille» procedure. The «qualified employee» path needs a master's-level qualification and ≥ €39,582 gross a year; the «EU Blue Card» path needs a relevant degree (or 5 years' comparable experience), a contract ≥ 6 months, and ≥ €59,373 gross a year."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
      sourceName: "Service-Public — Talent residence card (multi-year)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Validity"
        text: "The «passeport talent» is issued for the duration of the employment contract, up to a maximum of four years, commencing on the date of arrival in France."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
        sourceName: "Service-Public — Talent residence card (multi-year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Qualified-employee threshold"
        text: "«Talent — qualified employee»: a qualification at least equivalent to a French master's (or a Grandes Écoles level-1 diploma) plus an employment contract over three months providing annual gross remuneration of at least €39,582."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
        sourceName: "Service-Public — Talent residence card (multi-year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        # 30-day window: salary threshold (€39,582).
        reviewBy: "2026-07-13"
      - label: "EU Blue Card threshold"
        text: "«Talent — EU Blue Card»: a higher-education qualification (≥ 3 years) or 5 years' comparable professional experience, a contract of at least six months, and a gross annual salary of at least 1.5× the average gross salary, i.e. €59,373."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
        sourceName: "Service-Public — Talent residence card (multi-year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        # 30-day window: salary threshold (€59,373).
        reviewBy: "2026-07-13"
      - label: "Work permit"
        text: "The employer does NOT have to apply for a separate work permit for a «passeport talent» or «talent — EU Blue Card» holder."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
        sourceName: "Service-Public — Talent residence card (multi-year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Family"
        text: "Your spouse and minor children can join under a simplified accompanying-family procedure and receive a «talent-famille» multi-year residence card, without going through family reunification."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
        sourceName: "Service-Public — Talent residence card (multi-year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The «passeport talent» was created to attract foreign employees and self-employed people
      who contribute to France's economic attractiveness; for a US professional it is often the
      cleanest route because the employer is spared a separate work-permit step and the card is
      multi-year (up to four years) with a simplified family track. Several sub-categories exist
      — qualified employee, employee of a recognised innovative company, employee on assignment,
      and the EU Blue Card — each with its own conditions. Note the «qualified employee»
      sub-category specifically requires a master's-level qualification recognised in France;
      US graduates whose degree is not so recognised may instead qualify under the innovative-
      company route or the EU Blue Card (which accepts a relevant higher-education degree or
      comparable experience). If your stay is under 12 months the consulate issues a VLS-TS
      «talent» to validate online within three months; if 12 months or more, it issues a
      3-month «talent» visa and you apply online for the multi-year card after arrival.
    steps:
      - text: "Check which «talent» sub-category fits (qualified employee, innovative company, assignment, or EU Blue Card) and that you meet its salary and qualification thresholds."
        links:
          - text: "Service-Public — Talent residence card: sub-categories and thresholds"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
            sourceName: "Service-Public — Talent residence card (multi-year)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-07-13"
      - text: "Apply at the French consulate for the «talent» long-stay visa; for a stay of 12 months or more you receive a 3-month «talent» visa and then apply online for the multi-year card after arrival."
        tip: "If the stay is under 12 months the consulate issues a VLS-TS «talent» that you validate online within three months instead."
        links:
          - text: "France-Visas — International talents and economic attractiveness"
            sourceUrl: "https://france-visas.gouv.fr/en/talents-internationaux-et-attractivite-economique"
            sourceName: "France-Visas — International talents and economic attractiveness"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "After arrival, apply for the residence card online via the ANEF portal within two months (if you hold a long-stay visa), then pay the tax stamp when the card is granted."
        links:
          - text: "Service-Public — Talent card: apply online via ANEF within 2 months of entry"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
            sourceName: "Service-Public — Talent residence card (multi-year)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "«Talent» long-stay visa application (via France-Visas)"
        type: form
        description: "The long-stay «passeport talent» visa application; complete it through the official France-Visas portal."
        form:
          text: "Apply for the «passeport talent» long-stay visa through the official France-Visas portal; the visa wizard generates the supporting-document list for your talent sub-category."
          sourceUrl: "https://france-visas.gouv.fr/en/talents-internationaux-et-attractivite-economique"
          sourceName: "France-Visas — International talents and economic attractiveness"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "ANEF online residence-permit application (after arrival)"
        type: form
        description: "After arrival you apply for the multi-year «talent» card online on the official ANEF foreigners' portal, as directed by Service-Public."
        form:
          text: "Apply online for the residence permit on the official ANEF portal (administration numérique des étrangers en France). Service-Public links this portal as the route to apply for the talent card after arrival."
          sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
          sourceName: "Service-Public — Talent residence card (multi-year)"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Employer attestation"
        type: provide
        description: "An employer certificate (an official template is available on Service-Public) confirming the role and, where relevant, the company's innovative character or the assignment."
      - name: "Diploma / proof of qualification"
        type: provide
        description: "Your higher-education diploma (master's-level for the qualified-employee path) or evidence of comparable professional experience for the EU Blue Card path."
      - name: "Signed commitment to respect the principles of the Republic"
        type: provide
        description: "A signed copy of the commitment to respect the principles of the French Republic, required for the residence-card application."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport for the visa and the residence-card application."
    cost:
      text: "The talent residence card costs €350 (a €300 tax plus a €50 stamp duty), paid by tax stamps when the card is handed over."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16922?lang=en"
      sourceName: "Service-Public — Talent residence card (multi-year)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: fee (€350).
      reviewBy: "2026-07-13"
    warning: >
      Salary thresholds for the «passeport talent» (€39,582 for the qualified-employee path)
      and the EU Blue Card (€59,373) are revised periodically. Confirm the current figures on
      Service-Public before relying on them.
    dependsOn: []
    appliesIf: "motivation == 'work'"

  # ===========================================================================
  - id: student-vls-ts
    title: "Apply for the student long-stay visa (VLS-TS «étudiant»)"
    category: education
    summary:
      text: "To study in France you first apply for a long-stay visa that serves as a residence permit (VLS-TS) marked «étudiant», valid from four months to one year. You must show resources of at least €615 per month. After arrival you validate the VLS-TS online and pay a tax of €150; after one year of study you can apply for a one-year or multi-year (two-to-four-year) student residence card."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2231?lang=en"
      sourceName: "Service-Public — Foreign student in France: long-stay visa or residence permit"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: contains the €615 resource figure and €150 validation tax.
      reviewBy: "2026-07-13"
    tldr:
      text: "Studying in France as a US citizen means a student long-stay visa (VLS-TS «étudiant»), valid 4 months to 1 year, with proof of at least €615 per month in resources. You validate it online after arrival (a €150 tax) and, after a year, move to a one-year or multi-year student card."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2231?lang=en"
      sourceName: "Service-Public — Foreign student in France: long-stay visa or residence permit"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Validity"
        text: "The «student» VLS-TS is issued for a duration of four months to one year; after one year you can apply for a one-year temporary or two-to-four-year multi-year student card."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2231?lang=en"
        sourceName: "Service-Public — Foreign student in France: long-stay visa or residence permit"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Resources required"
        text: "You must be able to justify resources at least equal to €615 per month."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2231?lang=en"
        sourceName: "Service-Public — Foreign student in France: long-stay visa or residence permit"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        # 30-day window: resource figure (€615/month).
        reviewBy: "2026-07-13"
      - label: "Validation tax"
        text: "When you validate the «student» VLS-TS after arrival you pay a tax of €150."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2231?lang=en"
        sourceName: "Service-Public — Foreign student in France: long-stay visa or residence permit"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        # 30-day window: fee (€150).
        reviewBy: "2026-07-13"
      - label: "Working while studying"
        text: "A student residence permit allows employment up to 60% of the legal annual working time (964 hours per year)."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2728?lang=en"
        sourceName: "Service-Public — Work authorisation for a foreign employee"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      US students apply for a «student» long-stay visa (VLS-TS) before travelling. Many
      countries pre-enrol through the Campus France «Études en France» platform; check
      France-Visas to confirm whether the «Études en France» procedure or a direct France-Visas
      application applies to the USA, and the exact document list. You must show resources of at
      least €615 per month and an enrolment (or pre-enrolment) from a recognised higher-education
      institution. After arrival, validate the VLS-TS online within three months and pay the
      €150 tax. After one year you renew online into a one-year or multi-year student card
      (two to four years). Students may work up to 964 hours a year alongside their studies.
    steps:
      - text: "Obtain admission (or pre-enrolment) from a French higher-education institution and check the correct visa procedure for US students on France-Visas / Campus France."
        links:
          - text: "Service-Public — student visa: check the procedure and documents via France-Visas"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2231?lang=en"
            sourceName: "Service-Public — Foreign student in France: long-stay visa or residence permit"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Apply for the «student» VLS-TS at the competent French consulate, showing resources of at least €615 per month and your enrolment."
        links:
          - text: "France-Visas — Study or training (student long-stay visa)"
            sourceUrl: "https://france-visas.gouv.fr/en/visa-de-long-sejour"
            sourceName: "France-Visas — Long-stay visa"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "After arrival, validate the VLS-TS online within three months and pay the €150 tax; renew into a student card before it expires."
        links:
          - text: "Service-Public — validate the «student» VLS-TS (€150 tax)"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F2231?lang=en"
