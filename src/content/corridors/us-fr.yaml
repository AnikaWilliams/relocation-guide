    detail: >
      US students apply for a «student» long-stay visa (VLS-TS) before travelling. Many
      countries pre-enrol through the Campus France «Études en France» platform; check
      France-Visas to confirm whether the «Études en France» procedure or a direct France-Visas
      application applies to the USA, and the exact document list. You must show resources of at
      least €615 per month and an enrolment (or pre-enrolment) from a recognised higher-education
      institution. After arrival, validate the VLS-TS online within three months and pay the
      €150 tax. After one year you renew online into a one-year or multi-year student card
      (two to four years). Students may work up to 964 hours a year alongside their studies.
