      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-fr 2026-06-13"
      sourceHash: "ad88e2a9b52dfba2a0a99250f4a8d6f65a68cc72f558830e9b531703a6fd59e3"
