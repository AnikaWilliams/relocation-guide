        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "b5fe2a8abeedc0b79df4a89018aa246e095c0270318673be5509ec3f649faacc"
        reviewBy: "2026-09-11"
      - label: "Who can come"
        text: "Your spouse aged at least 18 and your minor children; ascendants (parents) are excluded and may only come as visitors if adequately resourced."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F11166?lang=en"
        sourceName: "Service-Public — Family reunification"
        # VERIFIED 2026-06-13 (fact-verifier): live F11166 (sha256 b5fe2a8a…). Verbatim: "spouse who is at least 18" and "minor child"; "The family reunification procedure does not apply to your ascendants. They may eventually come to live in France under the visitor status." Supported.
