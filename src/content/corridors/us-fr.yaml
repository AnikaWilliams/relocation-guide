    detail: >
      The VLS-TS validation is the single most time-sensitive step after arrival. Within three
      months you must complete the validation online on the ANEF portal and pay the tax that
      applies to your route (for example €150 for a student VLS-TS; the amount differs by visa
      type). Validation is what makes the visa function as your residence permit and lets you
      cross the Schengen border again; missing it leaves you irregular. After validation the
      OFII may summon you for a medical check-up and, if you are settling long-term, to sign the
      integration contract (CIR). Keep your validation confirmation — you will need it for
      banking, registration and renewals.
