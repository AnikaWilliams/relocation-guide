        sourceName: "Service-Public — Universal Health Protection (PUMa)"
        # VERIFIED 2026-06-13 (fact-verifier): live F34308 (sha256 442654f2…). Verbatim: "Without the exercise of a professional activity Once in France, you must wait 3 months before seeing your r[ights open]" and "your rights remain open if you live in France for at least 6 months of the year." Supported.
