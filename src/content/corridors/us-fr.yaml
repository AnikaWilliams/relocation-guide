            sourceName: "Service-Public — Republican Integration Contract (CIR)"
            # VERIFIED 2026-06-13 (fact-verifier): live F17048 (sha256 446869df…); "mandatory civic training and possibly language training" commitments confirmed verbatim. Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-fr 2026-06-13"
            sourceHash: "446869df487754d88be3d8956adbf636c83de9ec4a4138a446ec150cc5278b86"
