        sourceName: "Service-Public — Republican Integration Contract (CIR)"
        # VERIFIED 2026-06-13 (fact-verifier): live F17048 (sha256 446869df…). Verbatim: "[the CIR] is concluded, for a period of 1 year … It can be extended in some cases for up to 1 year" and "The contract may be extended for a maximum of one year by the prefect for a legitimate reason." Supported.
        status: VERIFIED
