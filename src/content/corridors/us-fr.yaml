    detail: >
      France admits third-country salaried workers through a two-part process. First, the
      employer secures a work permit (autorisation de travail) from the French authorities;
      depending on the role and contract this may involve a labour-market assessment. Second,
      armed with that permit, the worker applies at the competent French consulate for a
      long-stay visa that doubles as a residence permit (VLS-TS) — marked «salarié» for a
      permanent contract or «travailleur temporaire» for a fixed-term contract. You can begin
      work on arrival. Within three months you must validate the VLS-TS online; the OFII may
      call you in for a medical check-up and the integration contract. The first card is valid
      one year; on renewal, if you are still employed and meet the integration condition, you
      can obtain a multi-year card valid up to four years. For higher-paid or highly qualified
      roles the Passeport Talent or EU Blue Card (separate task) is usually a stronger route.
    steps:
      - text: "Secure a concrete job offer from a French employer; your employer then applies for your work permit (autorisation de travail) from the French authorities."
        tip: "You generally cannot take up the job until the work permit is granted. Confirm with your employer that the permit is in hand before you book the visa appointment."
        links:
          - text: "France-Visas — Salaried employment: employer must obtain the work permit"
            sourceUrl: "https://france-visas.gouv.fr/en/activite-salariee"
            sourceName: "France-Visas — Salaried employment"
            # VERIFIED 2026-06-13 (fact-verifier): live France-Visas page (sha256 4b05e186…); employer-obtains-work-permit confirmed verbatim. Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-fr 2026-06-13"
            sourceHash: "4b05e186151a88ada0804923092c417bf5f28ec69ce6cd845f2a57db915c9bc2"
            reviewBy: "2026-09-11"
      - text: "Apply for the long-stay visa (VLS-TS «salarié» or «travailleur temporaire») at the French consular authorities for your US state of residence, submitting the work permit granted to your employer."
        tip: "Use the France-Visas online visa wizard to get the exact document list for your situation, then check the competent consulate's own submission instructions."
        links:
          - text: "France-Visas — submit the work permit granted to your employer with the visa application"
            sourceUrl: "https://france-visas.gouv.fr/en/activite-salariee"
            sourceName: "France-Visas — Salaried employment"
            # VERIFIED 2026-06-13 (fact-verifier): live France-Visas page (sha256 4b05e186…). Verbatim: "Along with your visa application, you must also submit the work permit that was granted to your employer." Link accurate.
