  # ===========================================================================
  - id: visitor-card
    title: "Apply for the «visitor» residence card if you are retiring or otherwise not working"
    category: visa-permit
    summary:
      text: "If you are moving to France for more than three months as an inactive person (for example, retiring) you can apply for a «visitor» residence card. You must show sufficient resources for your whole stay (at least €1,477.93 net per month for a single person, i.e. €17,735.19 per year), hold health insurance covering your stay, and give a written undertaking not to work in France. The card is valid for one year maximum and is renewable."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F302?lang=en"
      sourceName: "Service-Public — Visitor residence card"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: contains the resource thresholds (€1,477.93 / €17,735.19).
      reviewBy: "2026-07-13"
    tldr:
      text: "Retirees and other inactive US citizens can move to France on a «visitor» residence card: prove sufficient resources (at least €1,477.93 net a month / €17,735.19 a year for one person), carry health insurance for the stay, and sign an undertaking not to work in France. The card lasts up to one year and is renewable."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F302?lang=en"
      sourceName: "Service-Public — Visitor residence card"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Who it is for"
        text: "A non-European who wants to stay in France for more than three months as an inactive person; you must not work in France as an employee, trader, self-employed person, craftsman or in a liberal profession."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F302?lang=en"
        sourceName: "Service-Public — Visitor residence card"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Resources required"
        text: "Sufficient resources for the whole stay — for a single person at least €1,477.93 net per month over one year, i.e. €17,735.19 (from own pensions, annuities, property income, etc., or a family member's)."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F302?lang=en"
        sourceName: "Service-Public — Visitor residence card"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        # 30-day window: resource thresholds.
        reviewBy: "2026-07-13"
      - label: "Other conditions"
        text: "Health insurance covering the duration of your stay, and a handwritten undertaking on your honour not to work in France."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F302?lang=en"
        sourceName: "Service-Public — Visitor residence card"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Validity"
        text: "The «visitor» residence card is valid for one year maximum and is renewable."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F302?lang=en"
        sourceName: "Service-Public — Visitor residence card"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The «visitor» card is the standard route for US retirees and other financially
      self-supporting people who do not intend to work in France. You apply first for a
      «visitor» long-stay visa at the French consulate, showing pension or other resources at
      or above the required level, private health insurance covering the stay, and a written
      undertaking not to work. The OFII may require a medical certificate. After arrival the
      visa is validated or a card is requested at the prefecture, depending on its marking; the
      card is valid up to one year and renewable each year while the conditions are met. Note
      that resource thresholds and the exact procedure are reviewed periodically.
    steps:
      - text: "Confirm you meet the three conditions (sufficient resources, health insurance for the stay, no work in France) and gather proof."
        links:
          - text: "Service-Public — «visitor» residence card: conditions"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F302?lang=en"
            sourceName: "Service-Public — Visitor residence card"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-07-13"
      - text: "Apply for the «visitor» long-stay visa at the competent French consulate before travelling."
        links:
          - text: "France-Visas — Long-stay visa (visitor)"
            sourceUrl: "https://france-visas.gouv.fr/en/visa-de-long-sejour"
            sourceName: "France-Visas — Long-stay visa"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "After arrival, validate the VLS-TS or request the card as marked, and renew the visitor card each year while the conditions remain met."
        links:
          - text: "Service-Public — «visitor» residence card: validity and renewal"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F302?lang=en"
            sourceName: "Service-Public — Visitor residence card"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "«Visitor» long-stay visa application (via France-Visas)"
        type: form
        description: "The «visitor» long-stay visa application; complete it through the official France-Visas portal."
        form:
          text: "Apply for the «visitor» long-stay visa through the official France-Visas portal; the visa wizard generates the document list for an inactive/visitor stay."
          sourceUrl: "https://france-visas.gouv.fr/en/visa-de-long-sejour"
          sourceName: "France-Visas — Long-stay visa"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Proof of resources (pensions, annuities, property income, etc.)"
        type: provide
        description: "Bank certificates, pension vouchers or guarantor documents showing resources at or above the required annual amount (€17,735.19 for a single person)."
      - name: "Private health insurance covering the stay"
        type: provide
        description: "A certificate of health insurance covering the full duration of your stay in France."
      - name: "Handwritten undertaking not to work in France"
        type: provide
        description: "A signed handwritten statement on your honour that you will not work in France."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport for the visa application."
    warning: >
      The visitor card requires a written undertaking NOT to work in France. The resource
      threshold (€1,477.93 net/month for a single person) tracks the French minimum wage and
      is revised; confirm the current figure on Service-Public before applying.
    dependsOn: []
    appliesIf: "motivation == 'retirement'"

  # ===========================================================================
  - id: long-stay-visa
    title: "Apply for the national (type D) long-stay visa at a French consulate in the USA"
    category: visa-permit
    summary:
      text: "To enter and stay in France for more than three months a US citizen must hold a long-stay visa (type D), granted by the French consular authorities. Many long-stay visas are issued as a «VLS-TS» — a long-stay visa valid as a residence permit for a stay of up to one year, which exempts you from applying for a residence card in your first year but must be validated online within three months of arrival. You apply at the French consulate responsible for your place of residence, no more than three months before your planned departure."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
      sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Any stay in France over three months needs a long-stay (type D) visa from a French consulate. The common form, the VLS-TS, doubles as your residence permit for the first year but must be validated online within three months of arrival. Apply at the consulate for your US state of residence, no earlier than three months before departure."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
      sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "What it is"
        text: "A long-stay visa is a type D visa granted by the French consular authorities to enter and stay in France for more than three months, most often for study, work or family reasons."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "VLS-TS vs card-to-request"
        text: "A VLS-TS (valid 4 to 12 months) serves as a residence permit and exempts you from applying for a card in the prefecture in the first year; some visas instead bear «residence card to be requested within 2 months of arrival»."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Where and when"
        text: "Apply at the French consular authorities of the country where you live, no more than three months before your planned departure."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Legal basis"
        text: "Code of entry and residence of foreigners and right of asylum (CESEDA), Articles R431-1 to R431-24, on the long-stay visa serving as a residence permit."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The long-stay visa (type D) is the gateway document for any move to France over three
      months and is granted by French consular authorities for your specific purpose — work,
      study, family or as an inactive visitor. Two patterns exist: a VLS-TS, which is valid as a
      residence permit for up to a year (no prefecture card needed first year, but you must
      validate it online within three months), and a long-stay visa marked «residence card to
      be requested within 2 months of arrival», used for routes such as the Passeport Talent and
      EU Blue Card. Identify the consulate competent for your US state of residence and its
      submission process (France-Visas hosts the application and the document wizard). Visa fees
      vary; confirm the current fee and the document list for your route before applying.
    steps:
      - text: "Identify the French consulate competent for your US state of residence and start the application on the France-Visas portal."
        tip: "France-Visas hosts the visa application and a wizard that lists the documents for your specific route; confirm the competent consulate's own appointment and submission steps."
        links:
          - text: "France-Visas — Long-stay visa"
            sourceUrl: "https://france-visas.gouv.fr/en/visa-de-long-sejour"
            sourceName: "France-Visas — Long-stay visa"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Submit the application no more than three months before your planned departure, with the documents for your route (work, study, family or visitor)."
        links:
          - text: "Service-Public — where and when to apply for a long-stay visa"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
            sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Long-stay visa application (via France-Visas)"
        type: form
        description: "The national (type D) long-stay visa application; complete it through the official France-Visas portal, which generates your route-specific document list."
        form:
          text: "Apply for the long-stay visa through the official France-Visas portal; submit at the competent French consulate for your US state of residence."
          sourceUrl: "https://france-visas.gouv.fr/en/visa-de-long-sejour"
          sourceName: "France-Visas — Long-stay visa"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport, meeting the consulate's required remaining validity for a long-stay visa."
      - name: "Route-specific supporting documents"
        type: provide
        description: "The documents the France-Visas wizard lists for your route (e.g. work permit, enrolment, proof of resources, health insurance)."
      - name: "Passport photos to the required specification"
        type: provide
        description: "Recent passport photographs to the specification set by France-Visas / the consulate."
    warning: >
      Your US nationality does NOT exempt you from the long-stay visa: France-Visas states the
      visa must be applied for in advance. Visa fees vary by route and are revised; confirm the
      current fee with France-Visas / the consulate before applying.
    dependsOn: []

  # ===========================================================================
  - id: validate-vls-ts
    title: "Validate your VLS-TS online within three months of arriving"
    category: registration-bureaucracy
    summary:
      text: "If your long-stay visa is a VLS-TS (long-stay visa valid as a residence permit), you must validate it online within three months of arriving in France on the foreigners' digital-administration portal (ANEF) and pay the applicable tax. If you fail to validate it you will no longer be legally present in France and will be unable to re-enter the Schengen Area. The OFII (French Office for Immigration and Integration) may then call you in for a medical check-up and to sign the integration contract."
      sourceUrl: "https://france-visas.gouv.fr/en/votre-arrivee-en-france"
      sourceName: "France-Visas — Your arrival in France"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "A VLS-TS is not finished at the border: you must validate it online within three months of arrival on the ANEF portal and pay the tax. Miss the deadline and you are no longer legally resident and cannot re-enter the Schengen Area. The OFII may call you for a medical check and the integration contract."
      sourceUrl: "https://france-visas.gouv.fr/en/votre-arrivee-en-france"
      sourceName: "France-Visas — Your arrival in France"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Deadline"
        text: "You must validate the VLS-TS within three months of arriving in France."
        sourceUrl: "https://france-visas.gouv.fr/en/votre-arrivee-en-france"
        sourceName: "France-Visas — Your arrival in France"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Where"
        text: "The validation procedure is completely online on the foreigners' digital-administration portal at administration-etrangers-en-france.interieur.gouv.fr (ANEF)."
        sourceUrl: "https://france-visas.gouv.fr/en/votre-arrivee-en-france"
        sourceName: "France-Visas — Your arrival in France"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Why it matters"
        text: "If you do not validate the VLS-TS in time you are no longer legally present in France and cannot re-enter the Schengen Area."
        sourceUrl: "https://france-visas.gouv.fr/en/votre-arrivee-en-france"
        sourceName: "France-Visas — Your arrival in France"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "OFII"
        text: "The OFII may call you in for further formalities, a medical check-up and/or to sign an integration contract."
        sourceUrl: "https://france-visas.gouv.fr/en/votre-arrivee-en-france"
        sourceName: "France-Visas — Your arrival in France"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The VLS-TS validation is the single most time-sensitive step after arrival. Within three
      months you must complete the validation online on the ANEF portal and pay the tax that
      applies to your route (for example €150 for a student VLS-TS; the amount differs by visa
      type). Validation is what makes the visa function as your residence permit and lets you
      cross the Schengen border again; missing it leaves you irregular. After validation the
      OFII may summon you for a medical check-up and, if you are settling long-term, to sign the
      integration contract (CIR). Keep your validation confirmation — you will need it for
      banking, registration and renewals.
    steps:
      - text: "Within three months of arrival, log in to the ANEF foreigners' portal and complete the VLS-TS validation."
        links:
          - text: "France-Visas — validate your VLS-TS online (ANEF portal)"
            sourceUrl: "https://france-visas.gouv.fr/en/votre-arrivee-en-france"
            sourceName: "France-Visas — Your arrival in France"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Pay the validation tax for your route (e.g. €150 for a student VLS-TS) by electronic tax stamp during the online procedure."
        links:
          - text: "Service-Public — validate a VLS-TS and pay the tax"
            sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/R52684?lang=en"
            sourceName: "Service-Public — Validate a long-stay visa as residence permit (VLS-TS) and pay the tax"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Attend any OFII appointment (medical check-up and/or integration contract) you are summoned to."
        links:
          - text: "France-Visas — the OFII may call you for a medical check-up and integration contract"
            sourceUrl: "https://france-visas.gouv.fr/en/votre-arrivee-en-france"
            sourceName: "France-Visas — Your arrival in France"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Online VLS-TS validation (ANEF portal)"
        type: form
        description: "The online VLS-TS validation procedure on the official ANEF foreigners' portal; you also pay the tax stamp here."
        form:
          text: "Validate the long-stay visa as a residence permit and pay the tax through the official online procedure (ANEF). Service-Public hosts the démarche-en-ligne link to this procedure."
          sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/R52684?lang=en"
          sourceName: "Service-Public — Validate a long-stay visa as residence permit (VLS-TS) and pay the tax"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Your VLS-TS visa and passport"
        type: provide
        description: "Your long-stay visa (VLS-TS) and the passport it is in, to complete the validation."
      - name: "French address"
        type: provide
        description: "Your address in France, required to complete the online validation."
      - name: "Electronic tax stamp for the validation tax"
        type: provide
        description: "An electronic tax stamp (timbre fiscal) for the tax that applies to your VLS-TS route, purchasable online or at a tabac."
    warning: >
      The three-month validation deadline is strict: missing it makes your stay irregular and
      blocks re-entry to the Schengen Area. Validate as soon as you have a French address.
    dependsOn: [long-stay-visa]

  # ===========================================================================
  - id: cir-integration
    title: "Sign the Republican Integration Contract (CIR) with the OFII"
    category: language-integration
    summary:
      text: "Non-European nationals admitted to France for the first time who wish to settle long-term sign a Republican Integration Contract (CIR) with the OFII. It commits you to mandatory civic training and, if your French is below A2, language training. The contract runs for one year (extendable in some cases). Since 1 January 2026 the CIR's language level and a civic examination are required if you later want a multi-year or resident card."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
      sourceName: "Service-Public — Republican Integration Contract (CIR)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Settling in France long-term as a US citizen usually means signing the Republican Integration Contract (CIR) with the OFII on first admission: mandatory civic training, plus language training if you test below A2. It lasts one year, and since 1 January 2026 meeting its language level and passing a civic exam are conditions for a later multi-year or resident card."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
      sourceName: "Service-Public — Republican Integration Contract (CIR)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who signs"
        text: "Non-European nationals admitted to stay in France for the first time and wishing to settle long-term; some categories (e.g. talent-passport holders, students with one academic year already in France) are exempt."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
        sourceName: "Service-Public — Republican Integration Contract (CIR)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "What it requires"
        text: "Mandatory civic training and, if a French-language test places you below A2, language training prescribed by the OFII."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
        sourceName: "Service-Public — Republican Integration Contract (CIR)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Duration"
