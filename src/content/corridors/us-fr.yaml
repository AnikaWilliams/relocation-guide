      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-fr 2026-06-13"
      sourceHash: "1a3fe90f88fb634bf2914c5c386228f3fa340883357f12faf669a3632a037b6d"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "What it is"
        text: "A long-stay visa is a type D visa granted by the French consular authorities to enter and stay in France for more than three months, most often for study, work or family reasons."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        # VERIFIED 2026-06-13 (fact-verifier): live F16162 (sha256 1a3fe90f…). Verbatim: "The long-stay visa, type D, allows you to enter and stay in France 4 months to 1 year" and "To enter and stay in France for more than 3 months, a foreigner must hold a long-stay visa (type D)." Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "1a3fe90f88fb634bf2914c5c386228f3fa340883357f12faf669a3632a037b6d"
        reviewBy: "2026-09-11"
      - label: "VLS-TS vs card-to-request"
        text: "A VLS-TS (valid 4 to 12 months) serves as a residence permit and exempts you from applying for a card in the prefecture in the first year; some visas instead bear «residence card to be requested within 2 months of arrival»."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        # VERIFIED 2026-06-13 (fact-verifier): live F16162 (sha256 1a3fe90f…). Verbatim: "Long-stay visa as residence permit (VLS-TS): valid for 4 to 12 months"; and the alternative "Visa mention 'residence card to be requested within 2 months of arrival' … The endorsement shall bear the residence card to be requested within 2 months of arrival." Both endorsement patterns confirmed.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "1a3fe90f88fb634bf2914c5c386228f3fa340883357f12faf669a3632a037b6d"
        reviewBy: "2026-09-11"
      - label: "Where and when"
        text: "Apply at the French consular authorities of the country where you live, no more than three months before your planned departure."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F16162?lang=en"
        sourceName: "Service-Public — Long-stay visa (3 months to 1 year)"
        # VERIFIED 2026-06-13 (fact-verifier): live F16162 (sha256 1a3fe90f…). Verbatim: "You must submit your visa application (no more than 3 months before departure planned) with the French consular authorit[ies]" of the country where you live. Supported.
