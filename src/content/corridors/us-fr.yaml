  # ===========================================================================
  - id: cir-integration
    title: "Sign the Republican Integration Contract (CIR) with the OFII"
    category: language-integration
    summary:
      text: "Non-European nationals admitted to France for the first time who wish to settle long-term sign a Republican Integration Contract (CIR) with the OFII. It commits you to mandatory civic training and, if your French is below A2, language training. The contract runs for one year (extendable in some cases). Since 1 January 2026 the CIR's language level and a civic examination are required if you later want a multi-year or resident card."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F17048?lang=en"
      sourceName: "Service-Public — Republican Integration Contract (CIR)"
      # VERIFIED 2026-06-13 (fact-verifier): Service-Public F17048 re-fetched LIVE (sha256 446869df…; verified 01 January 2026). Verbatim: "[the CIR] is concluded, for a period of 1 year … It can be extended in some cases for up to 1 year"; "You agree to participate in mandatory civic training and possibly language training" ("proposed if you have achieved results less than level [A2]"); "Since 1 January 2026, successful completion of this civic examination is required for access to a multi-year residence card [or] resident card." Supported. NOTE: the page frames the population as "non-European foreigners national admitted to stay in France and wishing to settle there permanently"; the claim's "for the first time" qualifier is standard CIR doctrine (CIR is the first-admission integration contract) and the exemption table confirms who is/ isn't obliged — supported in substance.
      status: VERIFIED
      lastVerified: "2026-06-13"
