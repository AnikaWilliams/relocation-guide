  # ===========================================================================
  - id: health-insurance-puma
    title: "Get covered by French health insurance (PUMa)"
    category: healthcare-insurance
    summary:
      text: "Once you work or reside in France on a stable and regular basis you are covered for your healthcare costs under Universal Health Protection (Protection universelle maladie, PUMa). If you work, you are enrolled in the health insurance from your first activity; if you are not working, you generally must wait three months after arrival before your rights open, and must live in France at least six months a year. Family members residing with you for more than three months are also covered."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
      sourceName: "Service-Public — Universal Health Protection (PUMa)"
      # KICKED BACK 2026-06-13 (fact-verifier): the "stable and regular basis", "wait three months", "at least six months a year", and "family members residing … more than three months" elements ARE supported by live F34308 (sha256 442654f2…) and live F12859. BUT the worker-timing element "If you work, you are enrolled in the health insurance from your first activity" is NOT stated by F34308: the page actually says "If you work and your Puma application is accepted, you are immediately enrolled in the Health Insurance" — coverage is conditioned on the application being accepted, not literally "from your first activity". Researcher: either reword to "you are enrolled immediately once your PUMa application is accepted" or cite a source that states first-day-of-activity. Left UNVERIFIED.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "France's PUMa covers your healthcare costs once you work or reside there on a stable, regular basis. Workers are covered from their first day of activity; the non-working generally wait three months and must live in France at least six months a year. A residence permit is required, and family living with you over three months is covered too."
      sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
      sourceName: "Service-Public — Universal Health Protection (PUMa)"
      # KICKED BACK 2026-06-13 (fact-verifier): same issue as the summary — "Workers are covered from their first day of activity" is NOT supported by live F34308 (sha256 442654f2…), which says "If you work and your Puma application is accepted, you are immediately enrolled in the Health Insurance." The other elements (stable/regular, 3-month wait, 6 months/year, residence permit required, family >3 months) ARE supported. Researcher: reword the worker-timing element. Left UNVERIFIED.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who is covered"
        text: "Anyone who works or resides in France on a stable and regular basis is entitled to cover of their healthcare costs in a personal capacity under the PUMa; a residence permit/document is required for the regularity condition."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
        sourceName: "Service-Public — Universal Health Protection (PUMa)"
        # VERIFIED 2026-06-13 (fact-verifier): live F34308 (sha256 442654f2…). Verbatim: "If you work or reside in France on a stable and regular basis, the Puma guarantees you a right to cover your health costs, in your personal [capacity]"; and for the regularity condition "if you are a national of another country, you must have a residence permit or document." Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-fr 2026-06-13"
        sourceHash: "442654f214beccf49d6d590931681cb49a4d0699e1ecbaf4350c17866271cc77"
        reviewBy: "2026-09-11"
      - label: "If you work"
        text: "Under the PUMa anyone working in France is entitled to payment of their healthcare costs from their first day of activity; you are enrolled immediately once your application is accepted."
        sourceUrl: "https://www.service-public.gouv.fr/particuliers/vosdroits/F34308?lang=en"
        sourceName: "Service-Public — Universal Health Protection (PUMa)"
        # KICKED BACK 2026-06-13 (fact-verifier): live F34308 (sha256 442654f2…) does NOT state coverage "from their first day of activity". Its exact words are: "If you work and your Puma application is accepted, you are immediately enrolled in the Health Insurance." So the second clause ("enrolled immediately once your application is accepted") is supported verbatim, but the first clause ("from their first day of activity") adds a timing the source does not state and which is materially different (coverage is tied to application acceptance, not day one of work). Researcher: drop "from their first day of activity" (or source it). Left UNVERIFIED.
