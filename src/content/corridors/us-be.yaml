            # reunification with a Belgian national / with a national of an EU or
            # associated country / with a third country national / with a beneficiary
            # of international protection status" — plus the conditions and "the
            # decision is made by the Immigration Office". Link target accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-be 2026-06-13"
            sourceHash: "1ab78bb497cbfd81c7c10466b205c85ab8c0149ac2ac2872e0d621f0e468cd22"
            reviewBy: "2026-09-11"
      - text: "Apply abroad for the family-reunification D visa at the competent Belgian post (or, in eligible situations, in Belgium)."
    documents:
