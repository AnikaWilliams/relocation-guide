    detail: >
      To study in Belgium for more than 90 days you first secure admission to a recognised
      higher-education institution. Because education is organised by the Communities (Flemish,
      French and German-speaking), you apply to an institution of the relevant Community and the
      language and admission rules follow from that. With your admission you apply, as a rule,
      for a national (type D) study visa at the competent Belgian post in the USA before
      travelling, and after arrival you register at your commune and obtain your residence
      permit. After completing your studies you may stay an additional year (a search year) to
      find a job or start a business, opening the way to a work residence permit. Note that
      Belgium updated its study-residence rules in 2026 (a ministerial circular published in
      March 2026 revoked older circulars), so confirm the current conditions and required funds
      with the Immigration Office and your institution.
    steps:
      - text: "Apply to and secure admission from a recognised Belgian higher-education institution (of the relevant Community)."
        links:
          - text: "belgium.be — Coming to study in Belgium (education is a Community competence; entry conditions via FPS Foreign Affairs)"
            sourceUrl: "https://www.belgium.be/en/education/coming_to_study_in_belgium"
            sourceName: "belgium.be (official federal portal) — Coming to study in Belgium"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). Verifier: confirm.
