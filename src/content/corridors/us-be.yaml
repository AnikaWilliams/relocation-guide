      # Affairs, Department of Federal Immigration." FPS Employment: "Since 1
      # January 2019, the single permit has been in force. Thus, the residence
      # document now indicates whether the person concerned has a work
      # authorisation." Verifier: confirm both — the residence-document
      # responsibility and the work-authorisation-shown-on-the-card fact.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who issues it"
        text: "Residence documents for a long stay are the responsibility of the FPS Home Affairs / federal Immigration Office; the commune handles your local registration."
        sourceUrl: "https://www.belgium.be/en/family/residence_documents_for_belgium"
        sourceName: "belgium.be (official federal portal) — Residence documents for Belgium"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). belgium.be verbatim
        # basis as above. Verifier: confirm.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Work authorisation shown on the card"
        text: "Since 1 January 2019 the residence document indicates whether the holder has a work authorisation — your right to work is recorded on the residence permit."
        sourceUrl: "https://employment.belgium.be/en/themes/international/foreign-workers"
        sourceName: "FPS Employment, Labour and Social Dialogue — Foreign workers"
