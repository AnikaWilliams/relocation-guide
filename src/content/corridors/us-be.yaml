# =============================================================================
# USA -> Belgium (us-be) corridor — RESEARCH DRAFT (ADR-0016 research run).
#
# Drafted 2026-06-13 by content-researcher "research-1". Every claim is
# status: UNVERIFIED and the corridor is published: false. NOTHING here is
# verified — a separate fact-verifier team must independently re-derive each
# claim from its primary official source before any claim is set VERIFIED or
# the corridor is published (two-agent rule, CLAUDE.md rule 2 / ADR-0016).
#
# Source base (all captured to sources/us-be/ via scripts/snapshot-source.mjs,
# local curl / residential IP, on 2026-06-13 — see manifest.json):
#   - Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken,
#     IBZ/DOFI, dofi.ibz.be) — EN third-country pages: Work, Single Permit,
#     Family reunification, Study. The federal authority for residence.
#   - FPS Employment, Labour and Social Dialogue (employment.belgium.be) —
#     Foreign workers (the single-permit / regional-competence authority).
#   - belgium.be (official federal portal) — Coming to work, Residence
#     documents, Moving to Belgium (the 8-day commune registration), Coming to
#     study.
#   - Embassy of Belgium in the United States (unitedstates.diplomatie.belgium.be)
#     — Visa for Belgium: the USA-specific source (visas issued by the Embassy in
#     Washington D.C. and Consulates General in Atlanta, Los Angeles, New York;
#     A/C/D visa types).
#
# STRUCTURE NOTES specific to Belgium (and DIFFERENT from us-de):
#   - Belgium is a FEDERAL state. Since the Sixth State Reform, WORK authorisation
#     is the competence of the REGIONS (Flemish, Brussels-Capital, Walloon) and
#     the German-speaking Community; RESIDENCE is federal (Immigration Office).
#   - Since 1 January 2019 the SINGLE PERMIT (combined work+residence) is in
#     force: the employer applies to the competent Region via the one-stop
#     counter; the Region and the Immigration Office decide jointly within a
#     4-month deadline; one application = work + residence.
#   - UNLIKE Germany, there is NO visa-free-entry-and-apply-in-country option for
#     US citizens: ALL nationalities need a D (national long-stay) visa for stays
#     over 90 days. Application for residence in Belgium is only possible "in
#     certain exceptional circumstances".
#   - Arrival registration is at the COMMUNE/municipality within 8 days (National
#     Register), not a 2-week Anmeldung.
#
# dofi.ibz.be is partly JS-rendered ("This website requires JavaScript to work
# properly"), but its server-rendered HTML carries the substantive facts cited
# here; the Single Permit page in particular is fully detailed. The Flanders
# vlaanderen.be page is JS-only (no substantive server text) and is therefore
# NOT cited for specific facts — regional detail is pointed to via the FPS
# Employment page that lists the regional administrations.
#
# Sources that could NOT be captured (unreachable on 2026-06-13):
#   - immigration.belgium.be (000), EU Immigration Portal ec.europa.eu (000) —
#     not used. vlaanderen.be single-permit (JS-only) — not cited for facts.
#
# FIGURE-bearing claims (fees, deadlines, %s) carry reviewBy = today+30d
# (2026-07-13). All other claims carry today+90d (2026-09-11).
# =============================================================================
originIso2: us
destinationIso2: be
title: "Moving from the USA to Belgium"
description: "How US citizens (non-EU third-country nationals) relocate to Belgium for work, family reunification, or study: Belgium's single permit (combined work and residence, decided jointly by the competent Region and the federal Immigration Office), the national (type D) long-stay visa, registration at your commune, the residence permit, and mandatory health insurance — in a federal state where work is a regional competence and residence is federal."
lastReviewed: "2026-06-13"
reviewedBy: "research-1"
published: false
# Covered routes drafted in this research run: work (single permit / EU Blue
# Card), family reunification, and study. "Retirement" and "other" are NOT
# covered (no dedicated researched + sourced track yet) — deliberately omitted
# rather than invented.
coversMotivations: [work, family, study]
tasks:
  # ===========================================================================
  # WORK ROUTE — the single permit (combined work + residence)
  # ===========================================================================
  - id: work-single-permit
    title: "Get a single permit (combined work and residence authorisation)"
    category: visa-permit
    summary:
      text: "Since 1 January 2019, any non-European citizen who wants to stay and work in Belgium for more than 90 days must hold a single permit — one authorisation that combines the right to work and the right to reside. The application is made by your employer to the competent Region (the Region of your principal place of work), and the Region and the federal Immigration Office examine and decide it jointly: the Region decides whether you may work and the Immigration Office whether you may stay for more than 90 days."
      sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/work/single-permit"
      sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Single Permit"
      # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). FIGURE (90 days) ->
      # 30-day window. dofi Single Permit page verbatim basis: "Since 03/01/2019,
      # any citizen from a non-European country who wants to stay and work more
      # than 90 days in Belgium must be a single permit holder."; "The employer
      # must apply to the competent Region (=the worker's principal place of
      # work)."; "The Immigration Office and the Region handle the request
      # together and make a decision."; "The Region will examine whether the
      # worker can be authorised to work, and the Immigration Office will
      # determine whether the worker can to stay in Belgium for more than 90
      # days." Verifier: confirm all four elements verbatim.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    tldr:
      text: "To work in Belgium for more than 90 days you need a single permit — a combined work-and-residence authorisation. You do not apply yourself: your Belgian employer applies to the competent Region (where you will mainly work), and the Region (for the work) and the federal Immigration Office (for the residence) decide together. One application covers both."
      sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/work/single-permit"
      sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Single Permit"
      # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). Same single-permit
      # basis. "Applying for a work permit is equivalent to applying for a
      # residence permit (single application)." Verifier: confirm the
      # employer-applies and one-application framing.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who applies"
        text: "Your employer applies, not you — the application must be made by an employer based in Belgium, to the competent Region via the one-stop counter."
        sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/work/single-permit"
        sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Single Permit"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). dofi: "The
        # application has to be done by an employer based in Belgium."; "The
        # employer must apply to the competent Region". Verifier: confirm verbatim.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Where (which Region)"
        text: "The competent Region is the one where your principal place of work is — work authorisation is a regional competence (Flemish, Brussels-Capital, Walloon Region, or the German-speaking Community), while residence is decided federally by the Immigration Office."
        sourceUrl: "https://employment.belgium.be/en/themes/international/foreign-workers"
        sourceName: "FPS Employment, Labour and Social Dialogue — Foreign workers"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). FPS Employment
        # verbatim basis: "Since the Sixth State Reform, the regulation of foreign
        # workers has been the responsibility of the Regions." with the regional
        # administration URLs listed (Flemish, Brussels-Capital, Walloon Region,
        # German-speaking Community). dofi: "the competent Region (=the worker's
        # principal place of work)". Verifier: confirm the regional competence
        # and the "principal place of work" rule.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Decision deadline"
        text: "Once the Region declares the application admissible, the Region and the Immigration Office must decide within 4 months (extendable in complex cases); if no unfavourable decision is taken within that period, the residence and work authorisations are considered granted."
        sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/work/single-permit"
        sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Single Permit"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). FIGURE (4 months) ->
        # 30-day window. dofi verbatim: "A second period of 4 months within which
        # the Region and the Immigration Office must decide on the single
        # application. The Region or the Immigration Office may extend this second
        # deadline in exceptional circumstances ... If the Region and the
        # Immigration Office do not make any unfavourable decision within the
        # 4-month deadline, potentially extended, the residence and work
        # authorisations will be considered as being granted." Verifier: confirm
        # the 4-month figure and the silence-equals-granted rule verbatim.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "One application = work + residence"
        text: "Applying for the work permit is equivalent to applying for the residence permit — a single application produces a single permit certifying you are authorised to stay and work for more than 90 days."
        sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/work/single-permit"
        sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Single Permit"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). dofi: "Applying for a
        # work permit is equivalent to applying for a residence permit (single
        # application)."; "the Immigration Office issues a single permit
        # certifying the holder is authorised to stay and work in Belgium for
        # more than 90 days." Verifier: confirm verbatim.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Belgium is a federal state, and since the Sixth State Reform the authorisation to work is
      a competence of the Regions while the authorisation to reside is federal. The single
      permit, in force since 1 January 2019, merges the two: your employer files one
      application with the competent Region (the Region where you will mainly work) through the
      one-stop counter, and the Region and the federal Immigration Office examine it together —
      the Region deciding the work side and the Immigration Office the residence side — and
      combine their decisions into one administrative act. The Region first checks the file is
      complete (giving 15 days to complete it if not); once admissible, a 4-month clock runs
      for the joint decision, extendable in complex cases, with silence treated as a grant.
      Some categories (au pair, work under 90 days) remain under the older work-permit B
      procedure. The EU Blue Card for highly qualified workers is granted through the same
      single-permit framework.
    steps:
      - text: "Secure a Belgian job offer; your employer determines the competent Region (your principal place of work) and its specific conditions."
        links:
          - text: "FPS Employment — Foreign workers (work authorisation is a regional competence; links to each Region)"
            sourceUrl: "https://employment.belgium.be/en/themes/international/foreign-workers"
            sourceName: "FPS Employment, Labour and Social Dialogue — Foreign workers"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). FPS Employment
            # lists the regional administration URLs and the single-permit-since-
            # 2019 fact. Verifier: confirm.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Your employer submits the single-permit application to the competent Region via the one-stop counter; you provide the residence-side documents."
        links:
          - text: "Immigration Office — Single Permit (employer applies via the one-stop counter; documents; joint decision)"
            sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/work/single-permit"
            sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Single Permit"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). dofi Single Permit
            # page describes the one-stop counter submission and the documents.
            # Verifier: confirm the one-stop-counter step.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "If the single permit is granted while you are abroad, apply for the national (type D) long-stay visa at the Belgian post to travel to Belgium (see the next task)."
        tip: "A worker who gave a foreign address must then obtain the D visa on presentation of a valid passport and the decision granting the single permit."
        links:
          - text: "Immigration Office — Single Permit: granting to a worker who is abroad (apply for the D visa at the Belgian post)"
            sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/work/single-permit"
            sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Single Permit"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). dofi: "A worker
            # who has indicated a foreign address ... must apply for a national
            # long-stay visa (more than 90 days) at the Belgian diplomatic or
            # consular post ... on presentation of a valid passport and the
            # decision granting a [single permit]." Verifier: confirm.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Copy of your valid US passport"
        type: provide
        description: "A copy of your valid passport (or travel document in lieu thereof) — part of the residence-side documents for the single permit."
      - name: "Proof of sufficient means of subsistence"
        type: provide
        description: "Documentation of sufficient means and the duration of your employment as a worker (and, where applicable, the employer's VAT number)."
      - name: "Criminal-record extract"
        type: provide
        description: "An extract from your criminal record (or equivalent document) if you are over 18 years of age."
      - name: "Medical certificate"
        type: provide
        description: "A medical certificate as required for the single-permit residence documents."
      - name: "Proof of health insurance covering all risks in Belgium"
        type: provide
        description: "Proof that you (and your family) have health insurance covering all risks in Belgium."
      - name: "Single-permit application (employer-filed, via the one-stop counter)"
        type: form
        description: "The single-permit application is filed by your employer to the competent Region through the federal one-stop counter; the work-side documents are listed on each Region's website. We link the Immigration Office's Single Permit authority page so the procedure and counter link are always current."
        form:
          text: "The single permit is applied for by your Belgian employer to the competent Region via the one-stop counter (international.socialsecurity.be). Conditions, the work-side documents and procedures are published by each Region (Flemish, Brussels-Capital, Walloon, German-speaking Community). We link the Immigration Office Single Permit authority page rather than a deep regional PDF so the current procedure is always referenced."
          sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/work/single-permit"
          sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Single Permit"
          # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). dofi: application
          # "via the one-stop counter:
          # https://www.international.socialsecurity.be/working_in_belgium/en/single-permit.html";
          # "To find out more about the conditions, procedures and all other
          # required information ... consult the website of each region". Verifier:
          # confirm the one-stop-counter URL is the current official channel.
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
    warning: >
      The single-permit application must be filed by a Belgian-based employer, not by you, and
      the detailed work-side conditions and documents are set by the competent Region — confirm
      them with the Region of your principal place of work. Fees and exact processing times can
      change; confirm the current figures before relying on them.
    dependsOn: []
    appliesIf: "motivation == 'work'"

