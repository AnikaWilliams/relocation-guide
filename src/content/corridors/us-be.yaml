        # gloss is a soft caveat — keep it general or soften to the four-week
        # statement on the page.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      A national (type D) visa is the document that lets you travel to Belgium for a long stay
      (over 90 days) — to take up the job, family life or studies for which your underlying
      authorisation was granted. Unlike Germany, Belgium offers US citizens no general
      visa-free entry-and-apply route for long stays: every nationality needs a D visa, applied
      for before travel, and applying for residence from inside Belgium is reserved for
      exceptional cases. The issue of visas is the responsibility of the FPS Foreign Affairs;
      for US residents, applications are handled by the Belgian Embassy in Washington, D.C. and
      the Consulates General in Atlanta, Los Angeles and New York. Confirm which post covers
      your US state and its submission instructions, and apply early — long-stay procedures can
      take time.
    steps:
      - text: "Confirm which Belgian post (Washington, Atlanta, Los Angeles or New York) is competent for your US state of residence."
        links:
          - text: "Embassy of Belgium in the United States — Visa for Belgium (posts that issue visas; A/C/D visa types)"
            sourceUrl: "https://unitedstates.diplomatie.belgium.be/en/travel-belgium/visa-belgium"
            sourceName: "Embassy of Belgium in the United States (FPS Foreign Affairs) — Visa for Belgium"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). Verifier: confirm.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Apply for the national (type D) visa at the competent post, presenting your underlying authorisation (e.g. the single-permit grant, family-reunification decision or admission) and the required documents."
        links:
          - text: "belgium.be — Residence documents for Belgium (visa issued by FPS Foreign Affairs; apply at the Belgian embassy/consulate where you live)"
            sourceUrl: "https://www.belgium.be/en/family/residence_documents_for_belgium"
            sourceName: "belgium.be (official federal portal) — Residence documents for Belgium"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). belgium.be:
            # "You must apply for a visa at the Belgian Embassy or the consulate
            # in the country where you live"; "The issue of visas is the
            # responsibility of the FPS Foreign Affairs." Verifier: confirm.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport — the D visa is affixed to it."
      - name: "Your underlying authorisation/decision"
        type: provide
        description: "The decision granting your single permit, family reunification, or study admission — the basis on which the D visa is issued."
      - name: "National (type D) visa application"
        type: form
        description: "The long-stay (D) visa application, submitted to the competent Belgian post in the USA. Obtain the current application and document checklist from that post."
        form:
          text: "Apply for the national (type D) visa at the competent Belgian post in the USA (Embassy Washington D.C. or Consulates General Atlanta, Los Angeles, New York). We link the Embassy's Visa for Belgium authority page rather than a deep PDF so the current form and instructions are referenced."
          sourceUrl: "https://unitedstates.diplomatie.belgium.be/en/travel-belgium/visa-belgium"
          sourceName: "Embassy of Belgium in the United States (FPS Foreign Affairs) — Visa for Belgium"
          # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). Verifier: confirm
          # the Embassy page is the current visa-application authority page for US
          # residents.
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
    warning: >
      Belgium has no general visa-free entry-and-apply route for US citizens on long stays —
      you must obtain the D visa before travelling. Long-stay visa procedures can take
      considerable time; apply early and confirm requirements with the competent Belgian post.
    dependsOn: []
    appliesIf: "motivation == 'work' || motivation == 'study' || motivation == 'family'"

  # ===========================================================================
  # SHARED ARRIVAL TASKS (all routes)
  # ===========================================================================
  - id: register-commune
    title: "Report to your commune within 8 days and register on the National Register"
    category: registration-bureaucracy
    summary:
      text: "If you are a foreign national who wants to stay in Belgium for longer than three months, you must report to the commune (municipality) where you are staying within eight days of your arrival, and you must be registered on the National Register — for which you need an actual place of residence in that commune. The commune and the Immigration Office handle your residence record, which leads to your residence permit (electronic card)."
      sourceUrl: "https://www.belgium.be/en/housing/moving_to_belgium"
