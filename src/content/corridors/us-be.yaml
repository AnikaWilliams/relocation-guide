    detail: >
      Belgium recognises a right to family reunification for family members of a Belgian or of
      a foreign national legally residing in Belgium, but it is a conditional right: you must
      prove with documents that the conditions are met. Those conditions turn on nationality,
      age, the family relationship (marriage, registered partnership or lineage) and the
      sponsor's residence status, and typically include stable, regular and adequate means of
      subsistence, health insurance and adequate housing. As a rule you apply abroad for a
      national (type D) visa, though in certain situations the application can be made in
      Belgium; the federal Immigration Office takes the decision and, if positive, you receive
      a D visa and/or a residence permit. Whether a joining family member may work is decided
      federally and recorded on the residence card. Belgian law also includes protective
      clauses for victims of domestic violence whose residence is dependent on family
      reunification.
    steps:
      - text: "Identify the right sub-category for your situation (joining a Belgian, an EU national, or a third-country national) and gather documents proving the relationship and conditions."
        links:
          - text: "Immigration Office — Family reunification (sub-categories; conditions; who decides)"
            sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/family-reunification"
            sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Family reunification"
            # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). dofi sidebar lists
            # "with a Belgian national / with a national of an EU or associated
            # country / with a third country national / with a beneficiary of
            # international protection status". Verifier: confirm.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Apply abroad for the family-reunification D visa at the competent Belgian post (or, in eligible situations, in Belgium)."
    documents:
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport (and the children's, if applicable)."
      - name: "Marriage / partnership / birth certificates"
        type: provide
        description: "Civil-status documents proving the family relationship (marriage, registered partnership or lineage), as required to have the right recognised."
      - name: "Proof of the sponsor's status and legal residence (or Belgian nationality)"
        type: provide
        description: "Evidence that your relative is a Belgian national or legally resides in Belgium with a qualifying status."
      - name: "Proof of stable, regular and adequate means of subsistence"
        type: provide
        description: "Documentation of the means of subsistence condition for family reunification."
      - name: "Proof of adequate housing"
        type: provide
        description: "Evidence of adequate housing for the family in Belgium."
      - name: "Proof of health insurance"
        type: provide
        description: "Health insurance covering the family in Belgium."
      - name: "Family-reunification application (D visa)"
        type: form
        description: "As a rule the family-reunification application is made abroad as a D-visa application at the competent Belgian post; in certain situations it can be made in Belgium. Obtain the current form and checklist from the post or the Immigration Office."
        form:
          text: "The family-reunification application is normally a national (type D) visa application made abroad at the competent Belgian post; the Immigration Office decides. We link the Immigration Office Family reunification authority page rather than a deep PDF so the current conditions and procedure are referenced."
          sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/family-reunification"
          sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Family reunification"
          # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). Verifier: confirm.
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
    warning: >
      Family-reunification conditions (means of subsistence, housing, insurance and proof of
      the relationship) are strict and depend on the sponsor's exact status; confirm your
      specific case with the Immigration Office or the competent Belgian post before relying on
      this route. If a family member's residence depends on family reunification and they
      experience domestic violence, protective clauses exist — contact the Immigration Office.
    dependsOn: []

