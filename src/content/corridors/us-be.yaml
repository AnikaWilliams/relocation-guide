  - id: family-permit
    title: "Family reunification with a relative legally residing in Belgium (or a Belgian)"
    category: family-dependents
    appliesIf: "motivation == 'family'"
    summary:
      text: "Certain foreign family members of a Belgian national or of a foreign national legally residing in Belgium have the right to come and live with their family in Belgium, provided they prove with documents that the conditions are met. The conditions depend on nationality, age, family relationship (marriage, partnership or lineage) and the sponsor's residence status. As a rule the application is made abroad (a D visa), and the decision is made by the Immigration Office; conditions include stable, regular and adequate means of subsistence, health insurance and adequate housing."
      sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/family-reunification"
      sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Family reunification"
