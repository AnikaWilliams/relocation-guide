      # Conditions list includes "Stable, regular and adequate means of
      # subsistence", "Insurance", "Adequate housing". Verifier: confirm these
      # elements verbatim; do not overstate "right" (it is conditional on proof).
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "If you are the family member of a Belgian or of someone legally living in Belgium, you can have a right to join them — once you prove the conditions are met. These depend on your relationship, ages, nationality and the sponsor's residence status, and include stable adequate means, health insurance and adequate housing. You normally apply for a D visa abroad, and the Immigration Office decides."
      sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/family-reunification"
      sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Family reunification"
