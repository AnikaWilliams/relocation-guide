  - id: national-d-visa
    title: "Apply for the national (type D) long-stay visa at the Belgian post in the USA"
    category: visa-permit
    summary:
      text: "For any stay in Belgium longer than 90 days you need a national (type D) long-stay visa, applied for before you travel. All nationalities — including US citizens — are subject to the visa requirement for long stays; there is no visa-free option to simply enter and apply in Belgium except in exceptional circumstances. Visas for US residents are issued by the Embassy of Belgium in Washington, D.C. and the Consulates General in Atlanta, Los Angeles and New York."
      sourceUrl: "https://unitedstates.diplomatie.belgium.be/en/travel-belgium/visa-belgium"
      sourceName: "Embassy of Belgium in the United States (FPS Foreign Affairs) — Visa for Belgium"
      # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). FIGURE (90 days) ->
      # 30-day window. Embassy page verbatim basis: "National visa (D-visa) ... Long
      # stay (>90 days), or D-visa"; "Visas are issued by the Embassy of Belgium
      # in Washington, D.C. and by the Consulates General of Belgium in Atlanta,
      # Los Angeles and New York. Honorary consulates do not issue Schengen
      # visas." dofi third-country page verbatim: "all nationalities are subject
      # to a visa requirement for a [long stay] in Belgium. In certain
      # exceptional circumstances, the application for residence can be submitted
      # in Belgium." Verifier: confirm the D-visa-for->90-days and
      # all-nationalities facts, and the 4 US posts.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    tldr:
      text: "A national (type D) visa is required to enter Belgium for any stay over 90 days, and you must obtain it before travelling — unlike some countries, the USA has no visa-free 'enter then apply' option for long stays in Belgium. For US residents, D visas are issued by the Belgian Embassy in Washington, D.C. and the Consulates General in Atlanta, Los Angeles and New York."
      sourceUrl: "https://unitedstates.diplomatie.belgium.be/en/travel-belgium/visa-belgium"
      sourceName: "Embassy of Belgium in the United States (FPS Foreign Affairs) — Visa for Belgium"
      # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). Same basis. Verifier:
      # confirm the no-visa-free-for-long-stays point against the dofi page.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "When required"
        text: "A national (type D) visa is required for stays in Belgium longer than 90 days; a C (Schengen) visa covers stays of up to 90 days."
        sourceUrl: "https://unitedstates.diplomatie.belgium.be/en/travel-belgium/visa-belgium"
        sourceName: "Embassy of Belgium in the United States (FPS Foreign Affairs) — Visa for Belgium"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). FIGURE (90 days) ->
        # 30-day window. Embassy: "Short stay (< 90 days), or C-visa"; "Long stay
        # (>90 days), or D-visa". Verifier: confirm.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "No visa-free long-stay option"
        text: "All nationalities are subject to the visa requirement for long stays in Belgium; applying for residence from inside Belgium is only possible in exceptional circumstances."
        sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals"
        sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Third-country nationals"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). dofi third-country
        # page verbatim: "all nationalities are subject to a visa requirement for
        # a [long stay] in Belgium. In certain exceptional circumstances, the
        # application for residence can be submitted in Belgium." Verifier:
        # confirm — this is the key contrast with Germany's §41 US exemption.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Where (USA)"
        text: "For US residents, visas are issued by the Embassy of Belgium in Washington, D.C. and the Consulates General in Atlanta, Los Angeles and New York; honorary consulates do not issue Schengen visas."
        sourceUrl: "https://unitedstates.diplomatie.belgium.be/en/travel-belgium/visa-belgium"
        sourceName: "Embassy of Belgium in the United States (FPS Foreign Affairs) — Visa for Belgium"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). Embassy verbatim:
        # "Visas are issued by the Embassy of Belgium in Washington, D.C. and by
        # the Consulates General of Belgium in Atlanta, Los Angeles and New York.
        # Honorary consulates do not issue Schengen visas." Verifier: confirm the
        # four posts.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Apply early"
        text: "The visa application procedure can take a long time; apply well ahead of your planned travel (at least four weeks for visas generally, and longer for long-stay cases)."
        sourceUrl: "https://www.belgium.be/en/family/residence_documents_for_belgium"
        sourceName: "belgium.be (official federal portal) — Residence documents for Belgium"
        # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). belgium.be Residence
        # documents: "In some cases, the visa application procedure may take a
        # long time. You are advised to make your application at least four weeks
