    detail: >
      Your residence permit is the physical proof of your right to live in Belgium for your
      purpose of stay. It is issued by the federal Immigration Office (FPS Home Affairs) after
      your commune registration, typically as an electronic card. A useful feature of the
      Belgian system since 2019 is that the residence card itself shows whether you may work:
      single-permit holders' cards record the work authorisation, and for residents whose main
      reason for coming is not work (students, family members), the federal authorities note on
      the card whether they may work. Keep your card valid and follow the renewal conditions
      communicated when it is issued.
    steps:
      - text: "Complete your commune registration, then collect your residence permit (electronic card) once issued by the Immigration Office."
        links:
          - text: "belgium.be — Residence documents for Belgium (residence documents are FPS Home Affairs / Federal Immigration)"
            sourceUrl: "https://www.belgium.be/en/family/residence_documents_for_belgium"
