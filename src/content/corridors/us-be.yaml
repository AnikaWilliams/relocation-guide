  - id: study-residence
    title: "Come to Belgium to study (higher education) for more than 90 days"
    category: education
    appliesIf: "motivation == 'study'"
    summary:
      text: "Non-EU foreigners who wish to stay in Belgium for more than 90 days to study at a recognised higher-education institution apply via the Immigration Office's study route. Education is organised by the Communities (Flemish, French and German-speaking), so admission is to an institution of the relevant Community. After completing your studies, you can stay for an additional year (a search year) to find a job or start a business with a view to a work residence permit."
      sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/study"
      sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Study"
