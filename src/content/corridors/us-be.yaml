        type: provide
        description: "Documentation of the means of subsistence condition for family reunification."
      - name: "Proof of adequate housing"
        type: provide
        description: "Evidence of adequate housing for the family in Belgium."
      - name: "Proof of health insurance"
        type: provide
        description: "Health insurance covering the family in Belgium."
      - name: "Family-reunification application (D visa)"
        type: form
        description: "As a rule the family-reunification application is made abroad as a D-visa application at the competent Belgian post; in certain situations it can be made in Belgium. Obtain the current form and checklist from the post or the Immigration Office."
        form:
          text: "The family-reunification application is normally a national (type D) visa application made abroad at the competent Belgian post; the Immigration Office decides. We link the Immigration Office Family reunification authority page rather than a deep PDF so the current conditions and procedure are referenced."
          sourceUrl: "https://dofi.ibz.be/en/themes/third-country-nationals/family-reunification"
          sourceName: "Immigration Office (Office des Etrangers / Dienst Vreemdelingenzaken, IBZ/DOFI) — Family reunification"
          # VERIFIED 2026-06-13 (fact-verifier): live dofi Family reunification page
