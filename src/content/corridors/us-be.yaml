      Registration at the commune is the step that formally records your residence in Belgium
      and starts the process for your residence permit. As a foreign national staying more than
      three months, you must report to the commune where you live within eight days of arrival
      and be entered on the National Register, which requires an actual address there. The
      commune typically arranges a check that you really live at the address before completing
      registration, and the residence permit (an electronic card) follows. Bring your passport
      with your D visa, proof of your address, and the documents for your purpose of stay.
      Procedures vary by commune, so confirm the exact requirements locally.
