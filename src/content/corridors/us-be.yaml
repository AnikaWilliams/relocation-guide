    detail: >
      A national (type D) visa is the document that lets you travel to Belgium for a long stay
      (over 90 days) — to take up the job, family life or studies for which your underlying
      authorisation was granted. Unlike Germany, Belgium offers US citizens no general
      visa-free entry-and-apply route for long stays: every nationality needs a D visa, applied
      for before travel, and applying for residence from inside Belgium is reserved for
      exceptional cases. The issue of visas is the responsibility of the FPS Foreign Affairs;
      for US residents, applications are handled by the Belgian Embassy in Washington, D.C. and
      the Consulates General in Atlanta, Los Angeles and New York. Confirm which post covers
      your US state and its submission instructions, and apply early — long-stay procedures can
      take time.
    steps:
