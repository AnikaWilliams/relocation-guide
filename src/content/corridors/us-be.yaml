        type: provide
        description: "Your valid US passport (and the children's, if applicable)."
      - name: "Marriage / partnership / birth certificates"
        type: provide
        description: "Civil-status documents proving the family relationship (marriage, registered partnership or lineage), as required to have the right recognised."
      - name: "Proof of the sponsor's status and legal residence (or Belgian nationality)"
        type: provide
        description: "Evidence that your relative is a Belgian national or legally resides in Belgium with a qualifying status."
