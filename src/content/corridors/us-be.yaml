    detail: >
      Belgium recognises a right to family reunification for family members of a Belgian or of
      a foreign national legally residing in Belgium, but it is a conditional right: you must
      prove with documents that the conditions are met. Those conditions turn on nationality,
      age, the family relationship (marriage, registered partnership or lineage) and the
      sponsor's residence status, and typically include stable, regular and adequate means of
      subsistence, health insurance and adequate housing. As a rule you apply abroad for a
      national (type D) visa, though in certain situations the application can be made in
      Belgium; the federal Immigration Office takes the decision and, if positive, you receive
      a D visa and/or a residence permit. Whether a joining family member may work is decided
      federally and recorded on the residence card. Belgian law also includes protective
      clauses for victims of domestic violence whose residence is dependent on family
      reunification.
    steps:
      - text: "Identify the right sub-category for your situation (joining a Belgian, an EU national, or a third-country national) and gather documents proving the relationship and conditions."
