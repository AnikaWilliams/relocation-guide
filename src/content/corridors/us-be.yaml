  - id: residence-permit
    title: "Obtain your Belgian residence permit (electronic card)"
    category: visa-permit
    summary:
      text: "After you arrive on your D visa and register at the commune, your long-stay residence is evidenced by a Belgian residence permit, issued under the responsibility of the FPS Home Affairs / federal Immigration Office. Since 1 January 2019, the residence document itself indicates whether the holder is authorised to work (for single-permit holders) — so for the work route your right to work is shown on the residence card."
      sourceUrl: "https://www.belgium.be/en/family/residence_documents_for_belgium"
      sourceName: "belgium.be (official federal portal) — Residence documents for Belgium"
