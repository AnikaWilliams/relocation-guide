  # ---------------------------------------------------------------------------
  - id: work-single-permit-gvva
    title: "Other paid employment: the single permit (GVVA)"
    category: visa-permit
    summary:
      text: "If you want to work in paid employment in the Netherlands but do not qualify as a highly skilled migrant, you generally need a single permit (in Dutch: gecombineerde vergunning verblijf en arbeid or GVVA). The single permit combines the residence permit and the work permit (TWV), so you apply for only one permit, which you do at the IND. The IND asks the Netherlands Employees Insurance Agency (UWV) for advice on the labour-market aspect, and the UWV assesses that request against the criteria of the Foreign Nationals Employment Act (Wav)."
      sourceUrl: "https://home-affairs.ec.europa.eu/policies/migration-and-asylum/eu-immigration-portal/employed-worker-netherlands_en"
      sourceName: "European Commission — EU Immigration Portal: Employed worker (Netherlands)"
      # RE-SOURCED 2026-06-13 (content-researcher): re-pointed from the quiz-gated IND GVVA SPA (whose static HTML omits the UWV-advice element) to the European Commission's EU Immigration Portal "Employed worker in the Netherlands" page (home-affairs.ec.europa.eu, DG Migration & Home Affairs — official EU body), which plainly states verbatim: "Most of the times, you can apply for a GVVA (single permit for residence and work). The GVVA combines the residence permit and the work permit (TWV). You thus only apply for one permit. You do this at the Immigration and Naturalisation Service (IND). The IND asks advice from the Netherlands Employees Insurance Agency (UWV) about the labour market aspect. UWV assesses the request for advice based on the criteria of the Foreign Nationals Employment Act (Wav)." Recast text to track this wording (added the Wav basis; dropped the prior unsourced "whether a suitable worker is available within the EU/EEA" gloss). Captured sources/us-nl/dd3dcb88.txt.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "For ordinary paid employment that is not highly skilled work, US citizens generally need a single permit (GVVA) — one document combining the residence permit and the work permit (TWV), applied for at the IND. The IND asks the UWV (the employee-insurance agency) for advice on the labour-market aspect, so this route is more involved than the highly skilled migrant permit."
      sourceUrl: "https://home-affairs.ec.europa.eu/policies/migration-and-asylum/eu-immigration-portal/employed-worker-netherlands_en"
      sourceName: "European Commission — EU Immigration Portal: Employed worker (Netherlands)"
      # RE-SOURCED 2026-06-13 (content-researcher): re-pointed to the EU Immigration Portal "Employed worker in the Netherlands" page, which states verbatim "You do this at the Immigration and Naturalisation Service (IND). The IND asks advice from the Netherlands Employees Insurance Agency (UWV) about the labour market aspect" and that the GVVA "combines the residence permit and the work permit (TWV). You thus only apply for one permit." Supports the GVVA-combines + IND-asks-UWV-advice elements that the quiz-gated IND GVVA page omits. Captured sources/us-nl/dd3dcb88.txt.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
