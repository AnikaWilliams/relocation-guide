    detail: >
      Registering with your municipality is the administrative anchor of life in the
      Netherlands. If you will live here for more than 4 months you register as a resident
      in the Personal Records Database (BRP) at the municipality where you live; municipalities
      record residents' personal data (address, marriage, births) in the BRP. Registration
      automatically produces your citizen service number (BSN), the personal number used for
      every government service, by health insurers and care providers (who are legally
      required to use it), by your employer for payroll, and in education (as the PGN). Without
      a BSN you cannot smoothly work, take out health insurance, or open a bank account, so
      register promptly. You make an appointment at the municipality and bring identity and
      address documents; confirm the exact deadline and document list with your municipality,
      as the procedure is run locally.
    steps:
      - text: "Arrange an address in the Netherlands and make an appointment at your municipality (gemeente) to register in the BRP."
      - text: "Register in person, bringing your passport, your residence document, proof of your address, and civil-status documents (e.g. a marriage or birth certificate) if registering family members."
        tip: "Bring legalised/translated civil-status documents (marriage, birth) where required — ask your municipality in advance which documents and translations it needs."
        links:
          - text: "Government of the Netherlands — Personal Records Database (BRP): residents and the 4-month threshold"
            sourceUrl: "https://www.government.nl/topics/personal-data/personal-records-database-brp"
            sourceName: "Government of the Netherlands — Personal Records Database (BRP)"
            # VERIFIED 2026-06-13 (fact-verifier): government.nl BRP page (LIVE, HTTP 200). Correct page; states residents are recorded in the BRP and "People who are in the Netherlands for less than 4 months ... can also register as non-residents with the RNI" — the residents / 4-month threshold the link text references. Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "88dbec0123c2a2ccb9021f18c776d1c7c26c86a3b14ee4dd87eb24c6cfc4a234"
            reviewBy: "2026-09-11"
      - text: "Receive your citizen service number (BSN) on registration; use it for the tax office, health insurance, your employer and other official matters."
        links:
          - text: "Government of the Netherlands — citizen service number (BSN): issued automatically on BRP registration"
            sourceUrl: "https://www.government.nl/topics/personal-data/citizen-service-number-bsn"
            sourceName: "Government of the Netherlands — Citizen service number (BSN)"
            # VERIFIED 2026-06-13 (fact-verifier): government.nl BSN page (LIVE, HTTP 200). Verbatim: "Everyone who registers with the BRP is automatically given a BSN." — supports "issued automatically on BRP registration". Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "eddfed340d645855617ca0cb2657a5b739e9c39f7871e09d5fe6b828cdeec6d2"
            reviewBy: "2026-09-11"
    documents:
      - name: "Municipal registration (BRP) — make an appointment at your gemeente"
        type: form
        description: "Registration in the BRP is done in person at your municipality (gemeente); there is no single national form — each municipality runs the appointment and tells you what to bring. We link the official BRP overview as the authority page."
        form:
          text: "There is no single national BRP registration form — you register in person at the municipality (gemeente) where you live, by appointment, and the municipality records your data in the BRP and issues your BSN. Use the official Government of the Netherlands BRP page as the authority overview and your municipality's website for the local appointment and document list."
          sourceUrl: "https://www.government.nl/topics/personal-data/personal-records-database-brp"
          sourceName: "Government of the Netherlands — Personal Records Database (BRP)"
          # VERIFIED 2026-06-13 (fact-verifier): government.nl BRP page (LIVE, HTTP 200). Confirms municipalities (not a national form) record residents' data: "Municipalities record the personal data of all residents in the BRP." and BSN is issued on registration (companion BSN page: "Everyone who registers with the BRP is automatically given a BSN."). Using this page as the authority overview, with the municipality's own site for the local appointment/document list, is correct. Supported.
          status: VERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: "fact-verifier-nl 2026-06-13"
          sourceHash: "88dbec0123c2a2ccb9021f18c776d1c7c26c86a3b14ee4dd87eb24c6cfc4a234"
          reviewBy: "2026-09-11"
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport as proof of identity and nationality."
      - name: "Residence document / proof of right to reside"
        type: provide
        description: "Your residence permit (or proof your application has been approved) showing your right to live in the Netherlands."
      - name: "Proof of address in the Netherlands"
        type: provide
        description: "Your rental contract or a written statement from the main occupant of your address; the municipality registers you at this address."
      - name: "Civil-status documents for family members"
        type: provide
        description: "Marriage and birth certificates (often legalised/translated) if you are registering a spouse or children — confirm the format with your municipality."
