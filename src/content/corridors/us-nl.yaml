            sourceName: "Immigration and Naturalisation Service (IND) — Required amounts (income requirements)"
            # VERIFIED 2026-06-13 (fact-verifier): IND Required-amounts page (LIVE, HTTP 200). Carries the study means-of-support figure verbatim ("Higher professional education (hbo) or university € 1,130.77", valid 1 Jan–31 Dec 2026). Link accurate.
