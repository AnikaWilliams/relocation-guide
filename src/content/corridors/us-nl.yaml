  - id: work-hsm-permit
    title: "Get sponsored as a highly skilled migrant (kennismigrant)"
    category: visa-permit
    summary:
      text: "As a US citizen you are a non-EU/EEA third-country national, so to work in the Netherlands you need a residence permit. The most common route for qualified professionals is the highly skilled migrant (kennismigrant) permit: you cannot apply yourself — only an employer recognised by the IND can apply for your permit, and the agreed salary must meet the IND income requirement for your category and be in line with the market rate."
