originIso2: us
destinationIso2: nl
title: "Moving from the USA to the Netherlands"
description: "How US citizens (non-EU/EEA third-country nationals) relocate to the Netherlands for work, family, or study: the right residence permit for your route, why US nationals are exempt from the MVV (entry visa), municipal registration in the BRP and your citizen service number (BSN), mandatory Dutch health insurance, and the 30% expat tax ruling."
lastReviewed: "2026-06-13"
reviewedBy: "research-3"
published: false
