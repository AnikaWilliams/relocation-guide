    detail: >
      The Netherlands separates EU/EEA/Swiss nationals (who move freely and need no permit)
      from third-country nationals such as US citizens, who need a residence permit to work.
      The highly skilled migrant (kennismigrant) scheme is the fast, employer-driven route
      for qualified professionals: a single permit covers both work and residence, but it
      hinges on the employer. The employer must be recognised by the IND as a sponsor, must
      file the application, and must pay at least the IND required amount for your category
      (a higher figure for those 30+, a lower one for under-30s, and a reduced criterion for
      recent Dutch graduates / orientation-year holders). The salary must also be in line
      with the market rate for the role. Because you are an MVV-exempt US national you do not
      need the entry visa (see the residence-permit task), but you still receive a residence
      permit, which you collect in the Netherlands after a positive decision.
    steps:
      - text: "Secure a job with a Dutch employer that is — or is willing to become — a recognised IND sponsor; confirm the offered salary meets the IND required amount for your age/category and the market rate."
        tip: "Ask the employer directly whether they are on the IND public register of recognised sponsors. Recognition is mandatory to hire a highly skilled migrant."
        links:
          - text: "IND — highly skilled migrant: requirements and how your employer applies"
            sourceUrl: "https://ind.nl/en/residence-permits/work/highly-skilled-migrant"
            sourceName: "Immigration and Naturalisation Service (IND) — Highly skilled migrant"
            # VERIFIED 2026-06-13 (fact-verifier): IND HSM page (LIVE, HTTP 200). Correct page (breadcrumb Home › Residence permits › Work › Highly skilled migrant); states the requirements/how-employer-applies framing ("Only an employer recognised by the IND can apply for your permit. Read what the requirements are and how your employer can apply."). Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "ac7c389c865089339f51f03c25647298e6f07420ef544bb7b8785a933651628e"
            reviewBy: "2026-09-11"
      - text: "Your recognised-sponsor employer files the residence permit application with the IND. As a recognised sponsor they can apply quickly; the IND has up to 90 days to decide, but with direct debit a decision often follows within about two weeks."
        links:
          - text: "IND — employing a foreign national: the recognised-sponsor application process and decision period"
            sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
            sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
            # VERIFIED 2026-06-13 (fact-verifier): IND Employing-a-foreign-national page (LIVE, HTTP 200). Instruction video step 4 verbatim: "Then the IND has 90 days to make a decision. This is called the decision period. Did you use direct debit? Then a decision is often taken within two weeks." Supports "up to 90 days to decide ... with direct debit a decision often follows within about two weeks" character-for-character. Recognised-sponsor framing also confirmed on the page.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
            reviewBy: "2026-09-11"
      - text: "After a positive decision, travel to the Netherlands (no MVV needed for US citizens) and collect your residence permit, then register with your municipality."
    documents:
      - name: "Residence permit application for highly skilled migrant work (sponsor-filed)"
        type: form
        description: "The recognised sponsor files the work/residence application with the IND, usually online via the IND Business Portal or in writing — there is no separate worker-filed form for the recognised-sponsor route. We link the IND employer page rather than a deep form so it stays current."
