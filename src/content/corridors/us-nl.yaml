# is deliberately NOT set (verifier's job).
#
# KEY CORRIDOR-SPECIFIC DIVERGENCE FROM us-ch (flagged for the verifier):
# US nationals are EXEMPT from the MVV (the Netherlands' long-stay entry visa /
# type-D sticker). IND's MVV-exemptions page lists "United States" among the
# exempt nationalities. So this corridor has NO national-D-visa task like us-ch.
# Instead: a residence-permit task (applied for by the recognised sponsor for
# work/study, or by the sponsor-partner for family) plus an explicit
