  - id: entry-residence-permit
    title: "Your residence permit — and why US citizens do not need an MVV"
    category: visa-permit
    summary:
      text: "To stay in the Netherlands for more than 90 days you need a regular residence permit. Many nationalities also need a provisional residence permit (MVV) — a type-D entry visa sticker — but US nationals are exempt: the IND lists the United States among the nationalities that do not need an MVV. You still need the residence permit; as an MVV-exempt national you travel to the Netherlands without the entry visa and the permit is arranged for you to collect there."
      sourceUrl: "https://ind.nl/en/mvv-exemptions"
      sourceName: "Immigration and Naturalisation Service (IND) — MVV exemptions"
      # VERIFIED 2026-06-13 (fact-verifier): IND MVV-exemptions page re-fetched LIVE (curl, HTTP 200, sha256 ac7125e0..., unchanged). Verbatim: "You do not need an MVV if you have the nationality of one of these countries." followed by a list that includes "United States". The MVV being a type-D long-stay entry visa for >90 days is verbatim on the companion MVV page ("The MVV is a visa sticker (Type D)"; "intended for persons who want to stay in the Netherlands for more than 90 days"); "you need a regular residence permit" for >90 days also on that page. This is the corridor's central divergence from us-ch — confirmed.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-nl 2026-06-13"
      sourceHash: "ac7125e031d2d2e880a87b630eeb4bcac33c97269944a811b3a5cd1da5caa290"
      reviewBy: "2026-09-11"
    tldr:
      text: "Any stay over 90 days needs a residence permit. The MVV (the type-D long-stay entry visa) is required for most nationalities — but not for US citizens, who are on the IND's MVV-exemption list. So you skip the embassy MVV step that nationals of many other countries must complete: you still need the residence permit, but you enter without the entry visa and collect the permit in the Netherlands."
      sourceUrl: "https://ind.nl/en/mvv-exemptions"
      sourceName: "Immigration and Naturalisation Service (IND) — MVV exemptions"
      # VERIFIED 2026-06-13 (fact-verifier): IND MVV-exemptions page (LIVE, HTTP 200). United States listed verbatim among nationalities that "do not need an MVV". The MVV page corroborates "most nationalities" need it ("It holds for most nationalities that you will receive a residence permit only if you have an MVV") and that the MVV is collected at the embassy then used to "pick up your residence permit" (i.e. exempt nationals skip the embassy step). Supported.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-nl 2026-06-13"
      sourceHash: "ac7125e031d2d2e880a87b630eeb4bcac33c97269944a811b3a5cd1da5caa290"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "MVV not needed for US citizens"
        text: "“You do not need an MVV if you have the nationality of one of these countries” — the IND list includes the United States (alongside Australia, Canada, Japan, Monaco, New Zealand, Vatican City, the United Kingdom, South Korea, Switzerland and EU/EEA member states)."
        sourceUrl: "https://ind.nl/en/mvv-exemptions"
        sourceName: "Immigration and Naturalisation Service (IND) — MVV exemptions"
        # VERIFIED 2026-06-13 (fact-verifier): IND MVV-exemptions page (LIVE, HTTP 200). Verbatim: "You do not need an MVV if you have the nationality of one of these countries." and the list reads exactly "Australia Canada Japan Monaco New Zealand Vatican City United Kingdom United States South Korea Switzerland An EU/EEA Member State" — matches the claim's enumeration (incl. United States) character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "ac7125e031d2d2e880a87b630eeb4bcac33c97269944a811b3a5cd1da5caa290"
        reviewBy: "2026-09-11"
      - label: "What an MVV is"
        text: "The MVV (machtiging tot voorlopig verblijf) is an entry visa for people who want to stay in the Netherlands for more than 90 days; it is a visa sticker (Type D) placed in the passport, used to travel to the Netherlands and pick up the residence permit."
        sourceUrl: "https://ind.nl/en/provisional-residence-permit-mvv"
        sourceName: "Immigration and Naturalisation Service (IND) — Provisional residence permit (MVV)"
        # VERIFIED 2026-06-13 (fact-verifier): IND MVV page (LIVE, HTTP 200, sha256 0380c811...). Verbatim: "The MVV is an entry visa. This visa is intended for persons who want to stay in the Netherlands for more than 90 days. The MVV is a visa sticker (Type D) to be placed in your passport. With the MVV you can travel to the Netherlands and pick up your residence permit." The Dutch term "machtiging tot voorlopig verblijf or MVV" is named verbatim. Matches the claim character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "0380c811c79815c5aff48801bdd847f7bd75ba2467dab3653bf48f4d485c6533"
        reviewBy: "2026-09-11"
      - label: "You still need a residence permit"
        text: "Being MVV-exempt removes only the entry visa; you still need a regular residence permit to stay longer than 90 days, applied for under your purpose of stay (work, family or study)."
        sourceUrl: "https://ind.nl/en/provisional-residence-permit-mvv"
        sourceName: "Immigration and Naturalisation Service (IND) — Provisional residence permit (MVV)"
        # VERIFIED 2026-06-13 (fact-verifier): IND MVV page (LIVE, HTTP 200). Verbatim: "You want to stay in the Netherlands for more than 90 days and you need a regular residence permit." and "You apply for the MVV and the residence permit at the same time. Your sponsor in the Netherlands usually submits the application. This depends on your residence permit." — supports that the MVV exemption removes only the entry visa while the regular residence permit (under purpose of stay) is still required. Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "0380c811c79815c5aff48801bdd847f7bd75ba2467dab3653bf48f4d485c6533"
        reviewBy: "2026-09-11"
      - label: "Legal basis"
        text: "The MVV obligation and its exemptions are governed by the Aliens Act (Vreemdelingenwet 2000), Article 2p, and the Aliens Act Implementation Guidelines (Vreemdelingencirculaire 2000), B1/3.3."
        sourceUrl: "https://ind.nl/en/provisional-residence-permit-mvv"
        sourceName: "Immigration and Naturalisation Service (IND) — Provisional residence permit (MVV)"
        # VERIFIED 2026-06-13 (fact-verifier): IND MVV page (LIVE, HTTP 200), "Rules and regulations" footer verbatim: "Article 2p Aliens Act (Vreemdelingenwet 2000, only in Dutch)" and "B1/3.3 Aliens Act Implementation Guidelines (Vreemdelingencirculaire 2000, only in Dutch)" — matches "Aliens Act (Vreemdelingenwet 2000), Article 2p" and "Aliens Act Implementation Guidelines (Vreemdelingencirculaire 2000), B1/3.3" character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "0380c811c79815c5aff48801bdd847f7bd75ba2467dab3653bf48f4d485c6533"
        reviewBy: "2026-09-11"
    detail: >
      The Netherlands' long-stay entry visa is the MVV (machtiging tot voorlopig verblijf),
      a type-D sticker placed in the passport that nationals of most countries must obtain
      at a Dutch embassy or consulate before travelling, then use to enter and collect their
      residence permit. US nationals are exempt: the IND's MVV-exemptions page lists the
      United States among the nationalities that do not need an MVV. This is the central
      difference from many other corridors — there is no embassy MVV step for US citizens.
      You still need a regular residence permit for any stay over 90 days, applied for under
      your purpose of stay: for work, the recognised-sponsor employer applies (see the
      highly-skilled-migrant and single-permit tasks); for study, the recognised education
      institution applies; for family, the sponsor in the Netherlands applies. After a
      positive decision you travel to the Netherlands and collect your residence permit
      (see the collect-residence-document task), then register with your municipality.
    steps:
      - text: "Confirm your purpose of stay (work, family or study) — your residence permit is applied for under that purpose, and for work/study the sponsor (employer or institution) applies for you."
        links:
          - text: "IND — provisional residence permit (MVV): when it is and is not needed"
            sourceUrl: "https://ind.nl/en/provisional-residence-permit-mvv"
            sourceName: "Immigration and Naturalisation Service (IND) — Provisional residence permit (MVV)"
            # VERIFIED 2026-06-13 (fact-verifier): IND MVV page (LIVE, HTTP 200). Correct page; sections "When is an MVV needed?" and "When is an MVV not needed?" — accurately described as "when it is and is not needed". Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "0380c811c79815c5aff48801bdd847f7bd75ba2467dab3653bf48f4d485c6533"
            reviewBy: "2026-09-11"
      - text: "Confirm you are MVV-exempt as a US national, so no embassy entry-visa appointment is required for you."
        tip: "Exemption is by nationality. If a family member travelling with you holds a different (non-exempt) nationality, check the MVV-exemptions page for their situation separately."
        links:
          - text: "IND — MVV exemptions: the United States is on the exemption list"
            sourceUrl: "https://ind.nl/en/mvv-exemptions"
            sourceName: "Immigration and Naturalisation Service (IND) — MVV exemptions"
            # VERIFIED 2026-06-13 (fact-verifier): IND MVV-exemptions page (LIVE, HTTP 200). "United States" appears verbatim in the list of nationalities that "do not need an MVV". Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "ac7125e031d2d2e880a87b630eeb4bcac33c97269944a811b3a5cd1da5caa290"
            reviewBy: "2026-09-11"
      - text: "Once the residence permit is approved, travel to the Netherlands and collect it; then register with your municipality within 5 days of arrival."
    documents:
      - name: "Residence permit application (filed under your purpose of stay)"
        type: form
        description: "There is no MVV application for US citizens. The residence permit itself is applied for under your purpose of stay — by the recognised sponsor (employer/institution) for work/study, or by the sponsor in the Netherlands for family. We link the IND MVV page as the authority index that routes you to the right purpose-of-stay procedure."
        form:
          text: "As an MVV-exempt US national you do not file an MVV application. The residence permit is applied for under your purpose of stay: the recognised sponsor applies for work (see the highly-skilled-migrant and single-permit tasks) and for study (the education institution applies), and the sponsor in the Netherlands applies for family. Use the IND 'Provisional residence permit (MVV)' page to confirm the exemption and route to the correct purpose-of-stay procedure."
          sourceUrl: "https://ind.nl/en/provisional-residence-permit-mvv"
          sourceName: "Immigration and Naturalisation Service (IND) — Provisional residence permit (MVV)"
          # VERIFIED 2026-06-13 (fact-verifier): IND MVV page (LIVE, HTTP 200). Confirms US nationals are MVV-exempt (United States is on the page's own exemption list) so no MVV application is filed, and that the residence permit is applied for under the purpose of stay: "You apply for the MVV and the residence permit at the same time. Your sponsor in the Netherlands usually submits the application. This depends on your residence permit." Using this page as the authority index that routes to the purpose-of-stay procedure is correct. Supported.
          status: VERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: "fact-verifier-nl 2026-06-13"
          sourceHash: "0380c811c79815c5aff48801bdd847f7bd75ba2467dab3653bf48f4d485c6533"
          reviewBy: "2026-09-11"
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport — your identity and travel document; biometric data for the residence permit are captured in the Netherlands or as instructed by the IND."
      - name: "Proof of your purpose of stay"
        type: provide
        description: "Documentation of the basis of your stay — for work, your employment contract; for study, the institution's enrolment; for family, the relationship and the sponsor's documents."
    warning: >
      MVV exemption is decided by nationality. A US passport exempts you, but a partner or
      child travelling with you who holds a different, non-exempt nationality may still need
      an MVV. Always check the IND MVV-exemptions page for each traveller's nationality.
    dependsOn: []
    # No appliesIf: applies to all covered routes (work, family, study).

