        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "aa2b070046f14424bbcb932aef06ba84ef663b41b2177a566ba463ace3d698be"
        reviewBy: "2026-07-13"
      - label: "Recognised sponsor required"
        text: "Recognition as an IND sponsor is required in order to employ highly skilled migrants; by employing a foreign employee an employer automatically becomes the sponsor, but only a recognised sponsor can apply for the highly skilled migrant permit."
        sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
        sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
        # VERIFIED 2026-06-13 (fact-verifier): IND Employing-a-foreign-national page (LIVE, HTTP 200). Verbatim: "By employing a foreign employee, you automatically become the sponsor for that employee." and "Recognition is required in order to employ highly skilled migrants and researchers under Directive (EU) 2016/801." and "As a recognised sponsor you can simply and quickly apply for a residence permit for your employee." All three clauses of the claim supported character-for-character.
        status: VERIFIED
