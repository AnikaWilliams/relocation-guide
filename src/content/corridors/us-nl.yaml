    detail: >
      The single permit (GVVA) is the general paid-employment route for third-country
      nationals whose work does not fall under one of the knowledge/talent permits (highly
      skilled migrant, EU Blue Card, intra-corporate transferee, researcher, essential
      start-up personnel). It rolls the residence permit and the work permit (TWV) into one
      document. Unlike the highly skilled migrant permit, the GVVA involves a labour-market
      assessment: the IND asks the UWV for advice on the employment-market aspects of the
      application. The IND advises that the employer files the application in the Netherlands.
      Because you are an MVV-exempt US national you do not need the entry visa, but you still
      receive a residence permit, collected in the Netherlands after a positive decision.
    steps:
      - text: "Confirm with your employer whether your role qualifies for a knowledge/talent permit (e.g. highly skilled migrant) or whether the single permit (GVVA) is the correct route."
        links:
          - text: "IND — employing a foreign national: which residence permit for which work"
            sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
            sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
            # VERIFIED 2026-06-13 (fact-verifier): IND Employing-a-foreign-national page (LIVE, HTTP 200). Correct page; it routes "which residence permit for which work" (sections "Residence permit for work", "Knowledge and talent residence permits", "Residence permit paid employment"). Link accurate.
            status: VERIFIED
