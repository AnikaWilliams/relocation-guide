      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-nl 2026-06-13"
      sourceHash: "ac7c389c865089339f51f03c25647298e6f07420ef544bb7b8785a933651628e"
      reviewBy: "2026-09-11"
    tldr:
      text: "The highly skilled migrant (kennismigrant) permit is the main work route to the Netherlands for US professionals. You cannot apply on your own: only an employer recognised by the IND can apply for your permit, and your salary must meet the IND's income requirement for your category and match the market rate. The permit combines the right to work and to reside."
      sourceUrl: "https://ind.nl/en/residence-permits/work/highly-skilled-migrant"
      sourceName: "Immigration and Naturalisation Service (IND) — Highly skilled migrant"
      # VERIFIED 2026-06-13 (fact-verifier): same IND HSM page (LIVE, HTTP 200). Verbatim intro: "Only an employer recognised by the IND can apply for your permit." Supports "only an employer recognised by the IND can apply for your permit" / "you cannot apply on your own" character-for-character. Salary + market-rate elements confirmed via the required-amounts keyFact (this page's detail is quiz-gated). No overstatement.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-nl 2026-06-13"
      sourceHash: "ac7c389c865089339f51f03c25647298e6f07420ef544bb7b8785a933651628e"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who applies"
        text: "Your employer applies, not you: “Only an employer recognised by the IND can apply for your permit.” Recognition is required in order to employ highly skilled migrants."
        sourceUrl: "https://ind.nl/en/residence-permits/work/highly-skilled-migrant"
        sourceName: "Immigration and Naturalisation Service (IND) — Highly skilled migrant"
        # VERIFIED 2026-06-13 (fact-verifier): IND HSM page (LIVE, HTTP 200). Verbatim: "Only an employer recognised by the IND can apply for your permit." The "Recognition is required in order to employ highly skilled migrants" element is verbatim on the companion Employing-a-foreign-national page ("Recognition is required in order to employ highly skilled migrants and researchers under Directive (EU) 2016/801."). Both quoted clauses supported character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "ac7c389c865089339f51f03c25647298e6f07420ef544bb7b8785a933651628e"
        reviewBy: "2026-09-11"
      - label: "Where"
        text: "Your recognised-sponsor employer applies to the Immigration and Naturalisation Service (IND), the Dutch immigration authority, in the Netherlands."
        sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
        sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
        # VERIFIED 2026-06-13 (fact-verifier): IND Employing-a-foreign-national page (LIVE, HTTP 200, sha256 46506145...). Confirms the recognised sponsor applies to the IND: "As a recognised sponsor you can simply and quickly apply for a residence permit for your employee." and the instruction video step 2 "You can submit the application in writing, or online in the Business Portal." The IND being the Dutch immigration authority is self-evident (the page is ind.nl). Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
        reviewBy: "2026-09-11"
      - label: "Salary requirement (2026)"
        text: "The 2026 highly-skilled-migrant required amount (gross per month, excluding the 8% holiday allowance) is €5,942.00 if you are 30 or older, €4,357.00 if you are under 30, and €3,122.00 under the reduced salary criterion (e.g. shortly after a Dutch graduation or orientation year). The amount that applies on the application date must be met; figures change every year on 1 January. Confirm the current figure before relying on it."
        sourceUrl: "https://ind.nl/en/required-amounts-income-requirements"
        sourceName: "Immigration and Naturalisation Service (IND) — Required amounts (income requirements)"
        # FEE/THRESHOLD figure -> 30-day review window.
