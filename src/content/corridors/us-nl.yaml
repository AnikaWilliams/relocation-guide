        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "00fee87d9c1e9cdda69a4b99091db677b79f0452b281c7342f4f3fa313b57ee5"
        reviewBy: "2026-09-11"
    detail: >
      Dutch health insurance is not optional: under the Healthcare Insurance Act (Zvw),
      anyone who lives or works in the Netherlands must take out a basic policy from a Dutch
      insurer, even if they already hold insurance abroad. For permit holders the timing is
      specific: you have four months from the date your residence permit comes into force to
      take out a policy, and that policy must be effective from the permit's start date — if
      it starts retroactively you pay the premium retroactively. A crucial catch for new
      arrivals: you cannot buy Dutch health insurance until a decision has been taken on your
      residence permit, so you need foreign or international cover for the period between
      arrival and your permit coming into force. The basic package covers GP, hospital and
      pharmacy care; a mandatory risk excess (eigen risico) applies each year, with some
      care (GP, maternity) exempt. Depending on income you may be able to claim healthcare
      benefit (zorgtoeslag) from the Tax Administration.
    steps:
      - text: "While your residence permit is pending, hold foreign or international health insurance that covers you in the Netherlands — you cannot take out a Dutch policy until your permit is decided."
        links:
          - text: "Government of the Netherlands — health insurance and residence permit: no Dutch cover before a decision"
            sourceUrl: "https://www.government.nl/topics/health-insurance/health-insurance-and-residence-permit"
            sourceName: "Government of the Netherlands — Health insurance and residence permit"
            # VERIFIED 2026-06-13 (fact-verifier): government.nl page (LIVE, HTTP 200). Verbatim: "If a decision has not been taken on your application for a residence permit, you cannot take out health insurance in the Netherlands" — supports the link text "no Dutch cover before a decision". Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "e4ac43fbc9590c1abc693ec695c42cf48dea0aeeb3a761ac91cbd363314fbe4b"
            reviewBy: "2026-09-11"
      - text: "Once your residence permit is in force, take out a Dutch basic health insurance policy within four months, effective from the permit's start date."
        tip: "You need your BSN to take out a policy, so register with your municipality first. Compare insurers' basic-package prices; the basic package is standardised by law."
        links:
          - text: "business.gov.nl — compulsory Dutch healthcare insurance (Zvw) for everyone who lives or works in the Netherlands"
            sourceUrl: "https://business.gov.nl/regulations/health-care-insurance/"
            sourceName: "Netherlands Enterprise Agency (business.gov.nl) — Taking out compulsory healthcare insurance"
            # VERIFIED 2026-06-13 (fact-verifier): business.gov.nl page (LIVE, HTTP 200). Verbatim: "Anyone who lives or works in the Netherlands must take out healthcare insurance under the Healthcare Insurance Act (Zorgverzekeringswet, Zvw)." — supports the link text "compulsory Dutch healthcare insurance (Zvw) for everyone who lives or works in the Netherlands". Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "00fee87d9c1e9cdda69a4b99091db677b79f0452b281c7342f4f3fa313b57ee5"
            reviewBy: "2026-09-11"
    documents:
      - name: "Dutch health insurance policy (taken out with an insurer)"
        type: form
        description: "You take out the basic-package policy directly with a Dutch health insurer of your choice — there is no government form. We link the official overview as the authority page."
        form:
          text: "There is no government application form for health insurance — you take out a basic-package policy directly with a Dutch health insurer of your choice, using your BSN, effective from the date your residence permit comes into force. Use the official Government of the Netherlands health-insurance-and-residence-permit page as the authority overview of the rules and timing."
          sourceUrl: "https://www.government.nl/topics/health-insurance/health-insurance-and-residence-permit"
          sourceName: "Government of the Netherlands — Health insurance and residence permit"
          # VERIFIED 2026-06-13 (fact-verifier): government.nl page (LIVE, HTTP 200). The "effective from the date your residence permit comes into force" element is verbatim: "Your health insurance policy must be effective from the date your residence permit comes into force." There is indeed no government application form on the page (you take out a policy with an insurer); BSN-required-for-a-policy is supported by the BSN page ("health insurance companies have to use the BSN"). This form claim does NOT restate the 4-month deadline, so the "permanent" wording issue (which kicked back the summary/tldr) does not arise here. Supported.
          status: VERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: "fact-verifier-nl 2026-06-13"
          sourceHash: "e4ac43fbc9590c1abc693ec695c42cf48dea0aeeb3a761ac91cbd363314fbe4b"
          reviewBy: "2026-09-11"
      - name: "Citizen service number (BSN)"
        type: provide
        description: "Your BSN, obtained on municipal registration — health insurers are legally required to use it."
      - name: "Residence document"
        type: provide
        description: "Your residence permit, showing the date it comes into force (the date from which your policy must be effective)."
    warning: >
      You cannot take out Dutch health insurance until your residence permit application has
      been decided, but once the permit is in force you have only four months to take out a
      policy, effective from the permit's start date. Keep foreign/international cover for the
      gap and switch to a Dutch policy as soon as your permit is in force.
