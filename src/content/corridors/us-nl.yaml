        reviewBy: "2026-09-11"
      - label: "Right or discretion"
        text: "Conditional, not automatic: the permit is granted only if a recognised sponsor applies and the salary and other conditions are met — there is no entitlement to a highly skilled migrant permit. US citizens are outside EU/EEA free movement and so always need a residence permit to work."
        sourceUrl: "https://ind.nl/en/residence-permits/work/highly-skilled-migrant"
        sourceName: "Immigration and Naturalisation Service (IND) — Highly skilled migrant"
        # VERIFIED 2026-06-13 (fact-verifier): IND HSM page (LIVE, HTTP 200) states "To work in the Netherlands as a highly skilled migrant, you need a residence permit. Only an employer recognised by the IND can apply for your permit" — conditional ("Only ... can apply"), never an entitlement/right register. The "US citizens outside EU/EEA free movement need a residence permit to work" element is verbatim on the companion Employing page: "EU law provides for free movement of persons. This means that your employee is free to work ... and does not need a residence permit" (contrasted with "Employees with other nationalities ... needs a residence permit to work and stay for more than 90 days"). No overstatement.
