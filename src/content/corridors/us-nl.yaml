      - label: "What it covers / risk excess"
        text: "The mandatory basic package covers default healthcare (GP, hospital, pharmacy). Dutch health insurance is subject to a mandatory risk excess (eigen risico) set annually by the government; some care, such as the GP and maternity care, is exempt from the excess."
        sourceUrl: "https://business.gov.nl/regulations/health-care-insurance/"
        sourceName: "Netherlands Enterprise Agency (business.gov.nl) — Taking out compulsory healthcare insurance"
