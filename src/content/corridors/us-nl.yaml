  - id: health-insurance-zvw
    title: "Take out mandatory Dutch health insurance (Zvw)"
    category: healthcare-insurance
    summary:
      text: "Anyone who lives or works in the Netherlands must take out healthcare insurance under the Healthcare Insurance Act (Zorgverzekeringswet, Zvw). As a new arrival you must take out Dutch health insurance within four months of your arrival in the Netherlands. Important: you cannot take out Dutch health insurance until a decision has been taken on your residence permit application, so hold foreign or international cover until then."
      sourceUrl: "https://home-affairs.ec.europa.eu/policies/migration-and-asylum/eu-immigration-portal/employed-worker-netherlands_en"
      sourceName: "European Commission — EU Immigration Portal: Employed worker (Netherlands)"
      # RE-SOURCED 2026-06-13 (content-researcher): the prior government.nl page states the deadline as "within four months of your PERMANENT residence permit coming into force" — the draft had dropped "permanent", broadening the rule. Rather than re-introduce the "permanent" qualifier (which would mis-state the deadline for a first/temporary permit holder), re-pointed the general new-arrival rule to the EU Immigration Portal "Employed worker in the Netherlands" page, which states verbatim "take out health insurance within 4 months following your arrival in the Netherlands." Recast the deadline to the arrival-based wording the source supports. The compulsory-Zvw clause stays sourced to business.gov.nl in the "Compulsory" keyFact, and the no-Dutch-cover-before-a-decision clause stays sourced to government.nl in its own keyFact; the verbatim "permanent residence permit" wording remains separately preserved in the VERIFIED "Deadline (4 months)" keyFact. Captured sources/us-nl/dd3dcb88.txt.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Dutch health insurance is compulsory for everyone who lives or works in the Netherlands (the Zvw). As a new arrival you must take out a Dutch policy within four months of arriving in the Netherlands. You cannot buy Dutch health insurance before your permit is decided, so arrange bridging cover for the gap and switch once the permit is in force."
      sourceUrl: "https://home-affairs.ec.europa.eu/policies/migration-and-asylum/eu-immigration-portal/employed-worker-netherlands_en"
      sourceName: "European Commission — EU Immigration Portal: Employed worker (Netherlands)"
      # RE-SOURCED 2026-06-13 (content-researcher): same fix as this task's summary — re-pointed the 4-month deadline from the government.nl page (which says "within four months of your PERMANENT residence permit coming into force") to the EU Immigration Portal "Employed worker in the Netherlands" page, which states verbatim "take out health insurance within 4 months following your arrival in the Netherlands." Recast to the arrival-based wording the source supports. The compulsory-Zvw and no-Dutch-cover-before-a-decision clauses remain sourced in their own keyFacts. Captured sources/us-nl/dd3dcb88.txt.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Compulsory"
        text: "“Anyone who lives or works in the Netherlands must take out healthcare insurance under the Healthcare Insurance Act (Zorgverzekeringswet, Zvw).” This includes employees, entrepreneurs and the self-employed."
        sourceUrl: "https://business.gov.nl/regulations/health-care-insurance/"
        sourceName: "Netherlands Enterprise Agency (business.gov.nl) — Taking out compulsory healthcare insurance"
        # VERIFIED 2026-06-13 (fact-verifier): business.gov.nl healthcare-insurance page (LIVE, HTTP 200, sha256 00fee87d...). The quoted sentence appears verbatim: "Anyone who lives or works in the Netherlands must take out healthcare insurance under the Healthcare Insurance Act (Zorgverzekeringswet, Zvw). This includes entrepreneurs and self-employed professionals." The quoted first sentence is exact; the trailing enumeration adds "employees" (the page lists "entrepreneurs and self-employed professionals"), which is encompassed by "Anyone who lives or works" — immaterial, the load-bearing quoted sentence is verbatim.
