  - id: study-work-alongside
    title: "Working alongside your studies"
    category: employment
    summary:
      text: "As an international student you may work, but only if your employer holds a work permit (TWV) for you, which the employer applies for at the UWV. The hours are capped: a student may work a maximum of 16 hours per week, OR full-time in June, July and August. The Netherlands Labour Authority checks compliance, and working without a TWV or beyond the limit leads to fines."
      sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
      sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
      # VERIFIED 2026-06-13 (fact-verifier): IND Employing-a-foreign-national page re-fetched LIVE (curl, HTTP 200, sha256 46506145..., unchanged). "Employing foreign students" section verbatim: "A foreign student is only allowed to work if you have a work permit (in Dutch: tewerkstellingsvergunning or TWV) for the student. Apply to the UWV for a TWV. The student is allowed to work maximally 16 hours per week, or fulltime in June, July and August. The Dutch Labour Inspectorate (... NLA) checks whether you have a TWV. And whether the student does not work more than is allowed. Does the student work more or without a TWV? In that case the Dutch Labour Inspectorate will report this to the IND and you will get a fine." Supports TWV-required (employer applies to UWV), 16h/week-or-summer-fulltime, enforcement and fines character-for-character.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-nl 2026-06-13"
      sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
      reviewBy: "2026-09-11"
    tldr:
      text: "Students can work in the Netherlands only if the employer has a work permit (TWV) for them, applied for at the UWV. The limit is 16 hours a week, or full-time in June, July and August — not both. Working without a TWV or over the limit means fines for the employer."
      sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
      sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
      # VERIFIED 2026-06-13 (fact-verifier): same IND Employing page (LIVE, HTTP 200). Verbatim: "A foreign student is only allowed to work if you have a work permit (... TWV) for the student. Apply to the UWV for a TWV. The student is allowed to work maximally 16 hours per week, or fulltime in June, July and August." and "... will report this to the IND and you will get a fine." Supports "only if the employer has a TWV ... applied for at the UWV; 16h/week or full-time in June/July/August — not both; fines for the employer" character-for-character. The "not both" is implied by the source's "or" (16h/week OR fulltime in summer).
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-nl 2026-06-13"
      sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Work permit required"
        text: "“A foreign student is only allowed to work if you have a work permit (in Dutch: tewerkstellingsvergunning or TWV) for the student.” The employer applies to the UWV for the TWV."
        sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
        sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
        # VERIFIED 2026-06-13 (fact-verifier): IND Employing page (LIVE, HTTP 200). The quoted sentence is verbatim: "A foreign student is only allowed to work if you have a work permit (in Dutch: tewerkstellingsvergunning or TWV) for the student." followed by "Apply to the UWV for a TWV." — supports the employer-applies-to-UWV element. Exact match.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
        reviewBy: "2026-09-11"
      - label: "Hours cap"
        text: "“The student is allowed to work maximally 16 hours per week, or fulltime in June, July and August.”"
        sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
        sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
        # VERIFIED 2026-06-13 (fact-verifier): IND Employing page (LIVE, HTTP 200). The quoted sentence is verbatim on the page: "The student is allowed to work maximally 16 hours per week, or fulltime in June, July and August." Exact match.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
        reviewBy: "2026-09-11"
      - label: "Enforcement"
        text: "The Dutch Labour Inspectorate (Netherlands Labour Authority) checks whether the employer has a TWV and whether the student does not work more than allowed; breaches are reported to the IND and the employer is fined."
        sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
        sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
        # VERIFIED 2026-06-13 (fact-verifier): IND Employing page (LIVE, HTTP 200). Verbatim: "The Dutch Labour Inspectorate (in Dutch: de Nederlandse Arbeidsinspectie or NLA) checks whether you have a TWV. And whether the student does not work more than is allowed. Does the student work more or without a TWV? In that case the Dutch Labour Inspectorate will report this to the IND and you will get a fine." Matches "checks the employer has a TWV and the student does not work more than allowed; breaches reported to the IND and the employer is fined" character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-nl 2026-06-13"
        sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
        reviewBy: "2026-09-11"
    detail: >
      A student residence permit does not give an unconditional right to work. A foreign
      student may work only if the employer holds a work permit (TWV) for them, which the
      employer applies for at the UWV. The amount of work is strictly limited: a maximum of
      16 hours per week during the year, or full-time during the summer months of June, July
      and August — you cannot combine both in the same period. The Netherlands Labour
      Authority (Dutch Labour Inspectorate) enforces this, checking that the employer holds a
      TWV and that the student stays within the hours; violations are reported to the IND and
      the employer is fined. If you intend to work during your studies, make sure your
      employer arranges the TWV before you start.
    steps:
      - text: "Before starting any job, ensure your employer applies to the UWV for a work permit (TWV) for you as a student."
        links:
          - text: "IND — employing foreign students: TWV required, 16 hours/week or full-time in summer"
            sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
            sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
            # VERIFIED 2026-06-13 (fact-verifier): IND Employing page (LIVE, HTTP 200), "Employing foreign students" section. Verbatim: "A foreign student is only allowed to work if you have a work permit (... TWV) ... The student is allowed to work maximally 16 hours per week, or fulltime in June, July and August." Supports the link label (TWV required; 16h/week or full-time in summer). Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-nl 2026-06-13"
            sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
            reviewBy: "2026-09-11"
      - text: "Keep within the hours limit (16 hours/week, or full-time only in June, July and August) to avoid fines and risk to your permit."
    documents:
      - name: "Work permit (TWV) for the student — employer-filed at UWV"
        type: form
        description: "The employer applies to the UWV (the employee-insurance agency) for the student's work permit (TWV); the student does not file it. We link the IND employer page as the authority index for the rule."
        form:
          text: "The student does not apply — the employer applies to the UWV for the work permit (TWV) for the student. Use the IND 'Employing a foreign national' page as the authority index that states the TWV requirement and the hours limit, and the UWV for the TWV application itself."
          sourceUrl: "https://ind.nl/en/residence-permits/work/employing-a-foreign-national"
          sourceName: "Immigration and Naturalisation Service (IND) — Employing a foreign national"
          # VERIFIED 2026-06-13 (fact-verifier): IND Employing page (LIVE, HTTP 200). Verbatim: "A foreign student is only allowed to work if you have a work permit (... TWV) for the student. Apply to the UWV for a TWV." — confirms the employer (not the student) applies to the UWV. The page is the correct authority index stating the TWV requirement and the hours limit. Supported.
          status: VERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: "fact-verifier-nl 2026-06-13"
          sourceHash: "46506145b47cb3139c5f90a94dd3a17e30ff6afc3cfbc34383e9014ffa719e47"
          reviewBy: "2026-09-11"
      - name: "Valid student residence permit"
        type: provide
        description: "Your valid student residence permit, on the basis of which the employer can obtain a TWV for term-time/summer work."
    warning: >
      Working without a TWV, or beyond the 16-hours-per-week / summer-full-time limit, is
      enforced by the Netherlands Labour Authority and leads to employer fines and possible
      risk to your residence permit. Confirm the current rules and hours with the IND/UWV.
    dependsOn:
      - study-residence-permit
    appliesIf: "motivation == 'study'"
