  # ---------------------------------------------------------------------------
  - id: tax-residence
    title: "Understand your Irish tax residence (and the US double-tax angle)"
    category: taxes
    summary:
      text: "Your liability to Irish tax depends on tax residence, which is based on days present in Ireland: you are resident for a tax year (1 January to 31 December) if you spend 183 days or more in Ireland in that year, or 280 days or more across two consecutive tax years (with a minimum of 31 days in each year). If you are resident but not domiciled in Ireland, you pay Irish tax on your Irish income and on foreign income only to the extent you remit it to Ireland. On employment income you normally pay Income Tax, PRSI (social insurance) and the Universal Social Charge (USC)."
      sourceUrl: "https://www.citizensinformation.ie/en/money-and-tax/tax/moving-country-and-taxation/tax-residence-and-domicile-in-ireland/"
      sourceName: "Citizens Information (Citizens Information Board, statutory body) — Tax residence and domicile in Ireland"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): citizensinformation tax-residence
      # page (captured; edited 15 Dec 2025) verbatim: "You are resident for tax
      # purposes for a year if you spend 183 days or more in Ireland in that year.
      # Alternatively, if you spend 280 days or more in Ireland over a period of 2
      # consecutive tax years ... You must be in Ireland for a minimum of 31 days
      # each year."; "A tax year runs from 1 January to 31 December." The
      # resident-non-domiciled remittance basis is on the same page's tax-implications
      # / the companion "Coming to Ireland - tax" page; the IT/PRSI/USC-on-employment
      # element is on the Citizens Information tax pages (per search). FIGURES (day
      # counts are thresholds, not fees/quotas) -> 90-day window. Fact-verifier to
      # re-derive live and confirm the remittance-basis wording. NOTE: US citizens
      # are taxed by the US on worldwide income regardless of residence; the
      # US-Ireland double-taxation treaty governs relief — flag for a tax adviser,
      # do NOT assert treaty outcomes as a claim.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Whether Ireland taxes your worldwide income turns on tax residence — broadly, 183 days in Ireland in a year (or 280 over two years). If you are resident but not Irish-domiciled, foreign income is taxed only when remitted to Ireland. As a US citizen you also remain subject to US tax on worldwide income, so the US-Ireland double-tax treaty matters — get advice from a tax professional before you move."
      sourceUrl: "https://www.citizensinformation.ie/en/money-and-tax/tax/moving-country-and-taxation/tax-residence-and-domicile-in-ireland/"
      sourceName: "Citizens Information (Citizens Information Board, statutory body) — Tax residence and domicile in Ireland"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): 183/280-day rule + remittance basis
