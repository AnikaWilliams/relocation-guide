    detail: >
      Ireland's retirement route is for people of independent means and is registered as
      Stamp 0 — a limited, conditional permission with no access to State benefits and no
      right to work. The financial bar is high and is assessed carefully: a guide individual
      income of EUR 50,000 a year plus a lump sum equivalent to, for example, the price of a
      home in Ireland, with everything presented in a spreadsheet, converted to euros, and
      certified by an Irish accountancy firm (investment lump sums are generally not counted
      — they look for pension income or readily accessible funds). Everyone applies for the
      permission before arriving (the TPER form, sent to the Domestic Residence and
      Permissions Division). If approved you get a Conditional Letter of Offer; visa-required
      people then need a D-Reside visa, but US citizens are non-visa-required and may travel
      on the Conditional Letter of Offer, then send back the signed Agreement Form and
