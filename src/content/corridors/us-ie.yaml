    detail: >
      Registration is the step that turns your granted permission into a residence card.
      It is required for any non-EEA/UK/Swiss national staying more than 90 days, and you
      must register within 90 days. You book an appointment through your online ISD
      Customer Service account (appointments can only be made once you are in Ireland),
      attend the registration office (Burgh Quay in Dublin, or a regional office) in
      person, pay the EUR 300 fee (by card; some
      categories such as the spouse of an Irish citizen are exempt), and your IRP card is
      then posted to you. The card shows your stamp number, which encodes the conditions of
      your stay (for example Stamp 1 lets you work for the employer on your permit; Stamp 4
      lets you work without a permit). Bring originals of everything the relevant stamp
      category requires — registrations are not completed without all required documents.
