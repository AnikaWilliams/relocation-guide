        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Non-domiciled (remittance basis)"
        text: "If you are resident but not domiciled in Ireland, you pay Irish tax on Irish income and on foreign income only to the extent that you bring (remit) it into Ireland."
