        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "What you pay on a salary"
        text: "On employment income in Ireland you normally pay Income Tax, PRSI (Pay Related Social Insurance) and the Universal Social Charge (USC), deducted under PAYE."
