    detail: >
      The Critical Skills Employment Permit is the more attractive route where the
      occupation and salary qualify. It is designed to attract highly skilled people and to
      encourage permanent residence: no Labour Market Needs Test, immediate family
      reunification, and after the permit's two-year duration the holder can apply directly
      to immigration for a Stamp 4 (live and work without a further permit). Eligibility is
      driven by the occupation (on the Critical Skills Occupations List) and the salary.
      The General Employment Permit is the broader, default route: most occupations are
      eligible unless on the Ineligible List, but a Labour Market Needs Test is usually
      required (the employer must advertise the role), and the salary thresholds are lower.
      It issues for up to two years initially, renewable for up to three more, with a route
      to long-term residency after five years. Confirm the current Critical Skills
      Occupations List, the Ineligible List, and the salary thresholds with DETE before
      applying, as these are reviewed regularly.
    steps:
      - text: "Check whether the occupation is on the Critical Skills Occupations List and whether the salary meets the Critical Skills threshold; if so, the Critical Skills Employment Permit is usually the better route."
