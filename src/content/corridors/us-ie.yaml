  - id: pps-number
    title: "Get your PPS (Personal Public Service) number"
    category: registration-bureaucracy
    summary:
      text: "A Personal Public Service (PPS) Number is the unique reference that lets you access public services in Ireland and is needed to take up employment and to register for tax. You apply for it once you are in Ireland (you cannot get it as a reason to relocate): if you are 18 or over you apply online at MyWelfare using a MyGovID account, providing evidence of your identity (for a non-EU/EEA citizen, your current passport), evidence of your Irish address, and the reason you need the number."
      sourceUrl: "https://www.gov.ie/en/department-of-social-protection/services/get-a-personal-public-service-pps-number/"
      sourceName: "Department of Social Protection (gov.ie) — Get a Personal Public Service (PPS) Number"
