        # corroborated). Confirm live.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "After arrival"
        text: "Each joining spouse/de facto partner and any child aged 16 or over must register and get an Irish Residence Permit (IRP) after arriving in Ireland."
        sourceUrl: "https://www.citizensinformation.ie/en/moving-country/working-in-ireland/employment-permits/spousal-work-permit-scheme/"
        sourceName: "Citizens Information (Citizens Information Board, statutory body) — Employment permits and family members"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): captured page verbatim: "Your
        # spouse or de-facto partner and any child aged 16 and over must register and
        # get an Irish Residence Permit (IRP)." Confirm live.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Ireland has no automatic family-reunification right for non-EEA/UK/Swiss family
      members — even Irish citizens cannot automatically bring a non-EEA spouse. Instead
      Immigration Service Delivery's family reunification policy governs who can sponsor
      whom and when. The single biggest factor is the sponsor's permission: a Critical
      Skills Employment Permit allows the spouse/de facto partner and dependent children to
      apply immediately, and the spouse/partner can then work in Ireland without their own
      employment permit (Stamp 1G). Holders of other employment permits must wait 12 months
      and show they can support the family (there are minimum income limits by family size).
      "Family member" generally means a spouse or de facto partner (you must show at least
      a 2-year relationship for a de facto partner) and dependent children under 18; other
      relatives, including dependent parents, may join only in limited circumstances.
      Visa-required family members apply for a Join Family Member (D) visa; non-visa-required
      de facto partners of a Critical Skills holder must apply for preclearance first. After
      arrival, joining family members aged 16+ register for an IRP.
    steps:
      - text: "Confirm the sponsor's permission and the waiting period: immediate for a Critical Skills permit holder; 12 months for other employment permits (with proof of sufficient income)."
        links:
          - text: "Citizens Information — employment permits and family members (who can join, when, and work rights)"
            sourceUrl: "https://www.citizensinformation.ie/en/moving-country/working-in-ireland/employment-permits/spousal-work-permit-scheme/"
            sourceName: "Citizens Information (Citizens Information Board, statutory body) — Employment permits and family members"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): page captured.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Apply by the right route: visa-required family members apply for a Join Family Member (D) visa; non-visa-required de facto partners of a Critical Skills holder apply for preclearance — both before travelling."
        links:
          - text: "Citizens Information — visa requirements and preclearance for family"
            sourceUrl: "https://www.citizensinformation.ie/en/moving-country/visas-for-ireland/visa-requirements-for-entering-ireland/"
            sourceName: "Citizens Information (Citizens Information Board, statutory body) — Visa requirements for entering Ireland"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): page captured (preclearance
            # categories listed verbatim).
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "After arriving in Ireland, each joining spouse/partner and any child aged 16+ registers for an IRP; the spouse/partner of a Critical Skills holder receives a Stamp 1G allowing work without a permit."
    documents:
      - name: "Join Family Member (D) visa or preclearance application"
        type: form
        description: "The online application a family member submits before travelling — a Join Family Member (D) visa for visa-required family, or a preclearance application for non-visa-required de facto partners of a Critical Skills holder (and certain others)."
        form:
          text: "Family members apply online through the ISD/AVATS system (Join Family Member (D) visa) or the ISD preclearance process. We link the ISD 'Coming to join family in Ireland' authority section rather than a deep form URL, so it stays current; confirm the exact route (visa vs preclearance) for the family member's nationality and relationship."
          sourceUrl: "https://www.irishimmigration.ie/coming-to-join-family-in-ireland/"
          sourceName: "Irish Immigration Service (ISD) — Coming to join family in Ireland"
          # DRAFT/UNVERIFIED (research-4 2026-06-13): ISD "Coming to join family"
          # landing page captured (sources/us-ie). Linking the authority section
          # (not a deep form) matches project rule. Verifier to confirm it routes to
          # the Join Family (D) visa and preclearance processes.
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Sponsor's employment permit / IRP"
        type: provide
        description: "The sponsor's employment permit and IRP — establishing the sponsor's status (Critical Skills vs other) and therefore the waiting period and work rights."
      - name: "Proof of relationship"
        type: provide
        description: "Marriage or civil-partnership certificate, or for a de facto partner, evidence of a relationship of at least 2 years; birth certificates for dependent children."
      - name: "Evidence the sponsor can support the family"
        type: provide
        description: "Evidence the sponsor meets the minimum income limits for the family size (especially for non-Critical-Skills permit holders); the family must not become a burden on the State."
      - name: "Each family member's valid passport"
        type: provide
        description: "A valid passport for each family member joining you, used for the visa/preclearance application and for registration after arrival."
    warning: >
      There is no automatic right to bring non-EEA/UK/Swiss family to Ireland, and income
      and relationship-duration conditions apply. Check the current ISD Family Reunification
      Policy Document and the minimum income limits for your family size before applying.
    dependsOn:
      - employment-permit
    appliesIf: "motivation == 'family'"

