  - id: employment-permit-type
    title: "Choose the right permit: Critical Skills vs General Employment Permit"
    category: employment
    summary:
      text: "The Critical Skills Employment Permit targets strategically important, in-demand occupations: no Labour Market Needs Test is required, immediate family reunification is allowed, and after the permit's duration the holder can apply directly to immigration for a Stamp 4 to live and work without a permit. It needs a job offer of at least 2 years and a minimum annual remuneration of EUR 40,904 for occupations on the Critical Skills Occupations List (EUR 36,848 if you obtained the relevant qualification within the previous 12 months), or EUR 68,911 for other eligible occupations. The General Employment Permit covers a broader range of occupations (all except those on the Ineligible List), usually requires a Labour Market Needs Test, and has a minimum annual remuneration generally of EUR 36,605."
      sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/critical-skills-employment-permit/"
      sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Critical Skills Employment Permit"
