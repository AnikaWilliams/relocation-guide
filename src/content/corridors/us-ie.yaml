  # ---------------------------------------------------------------------------
  - id: retirement-permission
    title: "Retire to Ireland as a person of independent means (Stamp 0)"
    category: visa-permit
    summary:
      text: "To retire to Ireland you must be financially independent and meet all conditions; you are not entitled to access State benefits on this permission. As a guide, a person of independent means should have an individual income of EUR 50,000 per year and access to a lump sum to cover a major expense (for example, the price of a residential dwelling in the State). All applicants must apply for permission (Stamp 0) before arriving, by completing the TPER application form; your finances must be certified by an Irish accountancy firm. If successful you receive a Conditional Letter of Offer; non-visa-required applicants (including US citizens) may then travel, complete the process and register."
      sourceUrl: "https://www.irishimmigration.ie/coming-to-live-in-ireland/i-want-to-retire-to-ireland/"
      sourceName: "Irish Immigration Service (ISD) — I want to retire to Ireland"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): ISD retire page (captured; updated
      # 15 Oct 2025) verbatim: "If you wish to retire to Ireland you must be
      # financially independent and meet all conditions ... you are not entitled to
      # access State benefits while resident here on a retirement permission."; "For
      # people of independent means ... you should have an individual income of EUR
      # 50,000 per year. You must also have access to a lump sum of money to cover any
      # sudden major expenses. This lump sum should be equal to, for example, the
      # price of a residential dwelling in the State."; "all applicants must apply for
      # Stamp 0 before arriving in Ireland."; "you must apply for permission by
      # completing the TPER application form"; finances "must be certified by an Irish
      # accountancy firm"; "If your application is successful, you will be issued with
      # a Conditional Letter of Offer". FIGURE (EUR 50,000) -> 30-day review window.
      # Fact-verifier to re-derive live.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    tldr:
      text: "Ireland's retirement route is the 'person of independent means' Stamp 0: you must be financially self-supporting (guide income EUR 50,000/year plus a lump sum), claim no State benefits, and have your finances certified by an Irish accountancy firm. Everyone applies for Stamp 0 before arriving (TPER form); US citizens, being non-visa-required, travel once they have the Conditional Letter of Offer, then complete the process and register."
      sourceUrl: "https://www.irishimmigration.ie/coming-to-live-in-ireland/i-want-to-retire-to-ireland/"
      sourceName: "Irish Immigration Service (ISD) — I want to retire to Ireland"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): all elements verbatim on captured
