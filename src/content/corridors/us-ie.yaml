    category: taxes
    summary:
      text: "Your liability to Irish tax depends on tax residence and domicile, not your nationality. You are resident for a tax year (1 January to 31 December) if you spend 183 days or more in Ireland in that year, or 280 days or more across two consecutive tax years (with a minimum of 31 days in each year). Residence and domicile are taken into account for a number of taxes, including income tax. How your foreign income is taxed, and the income tax and social insurance (PRSI) charged on a salary, are covered in the key facts below."
