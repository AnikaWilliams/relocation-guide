        text: "Discretion: the permit is granted only if statutory criteria are met (bona-fide employer, eligible occupation, minimum remuneration, the 50:50 EEA-employee rule and, for most General Employment Permits, a Labour Market Needs Test). There is no entitlement to an employment permit."
        sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/general-employment-permit/"
        sourceName: "Department of Enterprise, Tourism and Employment (DETE) — General Employment Permit"
