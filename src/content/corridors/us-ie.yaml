      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "US citizens are non-EEA nationals and cannot simply move to Ireland to work: you (or your prospective employer) must first obtain an Irish employment permit from the Department of Enterprise, Tourism and Employment. The two main types are the Critical Skills Employment Permit (for in-demand, higher-paid roles, with strong family and residency benefits) and the General Employment Permit (broader range of jobs, usually with a Labour Market Needs Test)."
      sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/"
      sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Employment permits"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): the must-hold-a-permit framing is
      # verbatim on the DETE overview (captured). The two-main-types distinction
      # (Critical Skills vs General) is drawn from the two dedicated DETE permit
      # pages, also captured (see the eligibility task). Fact-verifier to confirm.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who applies"
        text: "Either the prospective employee or the employer can apply; the permit issues to the employee, with a certified copy to the employer, and allows employment only by the named employer in the occupation and location(s) stated on the permit."
        sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/general-employment-permit/"
        sourceName: "Department of Enterprise, Tourism and Employment (DETE) — General Employment Permit"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): GEP page (captured) verbatim:
        # "Either the foreign national or the prospective employer can apply for a
        # General Employment Permit and the permit is issued to the foreign
        # national, and a certified copy sent to the employer, which permits his or
        # her employment in the State by the employer in the occupation and
        # location/s specified on the permit." Same framing on the CSEP page.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Where"
        text: "Applications are made online on the Employment Permits Online system and administered by the Employment Permits Section of the Department of Enterprise, Tourism and Employment."
        sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/"
        sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Employment permits"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): DETE overview (captured): "You
        # can apply for a permit on Employment Permits Online." and "The
        # department's Employment Permits Section administers the employment permits
        # system." Confirm live.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "When"
        text: "An application for any employment permit must be received at least 12 weeks before the proposed employment start date; a signed contract of employment must be submitted with each application."
        sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/"
        sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Employment permits"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): DETE overview (captured)
        # verbatim: "An application for any employment permit must be received at
