    keyFacts:
      - label: "Resident test"
        text: "Resident for a tax year if present in Ireland 183 days or more that year, or 280 days or more over two consecutive years (minimum 31 days each year). The tax year is the calendar year."
        sourceUrl: "https://www.citizensinformation.ie/en/money-and-tax/tax/moving-country-and-taxation/tax-residence-and-domicile-in-ireland/"
        sourceName: "Citizens Information (Citizens Information Board, statutory body) — Tax residence and domicile in Ireland"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): verbatim on captured page (see
