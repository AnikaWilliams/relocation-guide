      - text: "Once living in Ireland, establish your HSE ordinary-residence eligibility for public services; check whether you qualify for a medical card or GP visit card."
        links:
          - text: "Citizens Information — entitlement to public health services"
            sourceUrl: "https://www.citizensinformation.ie/en/health/health-system/entitlement-to-public-health-services/"
            sourceName: "Citizens Information (Citizens Information Board, statutory body) — Entitlement to health services"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): page captured.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Private medical insurance with hospital cover (if your stamp requires it)"
        type: provide
        description: "An original private medical/health insurance policy in your name with hospital cover, valid for the period of your stay, where your immigration stamp requires it for registration/renewal."
      - name: "Evidence of ordinary residence (for HSE eligibility)"
        type: provide
        description: "Documents the HSE may ask for to accept you as ordinarily resident (e.g. proof of property purchase/rental as your principal residence, a financial-institution statement, a utility bill), dated within the last 12 months."
