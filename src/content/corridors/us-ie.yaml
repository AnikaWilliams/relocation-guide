        # criteria (bona-fide employer registered with Revenue; occupation not on
        # the Ineligible List; minimum remuneration; "An employment permit will not
        # issue unless at the time of application at least 50% of the employees in a
        # firm are EEA nationals (50:50 rule)."; "A Labour Market Needs Test is
        # required in most cases ..."). The no-entitlement/discretion gloss is a
        # fair characterisation of the conditional grant — verifier to confirm no
        # overstatement.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Ireland is not in the Schengen area and runs its own employment-permit system,
      administered by the Department of Enterprise, Tourism and Employment (DETE). As a
      US (non-EEA) citizen you cannot take up employment in Ireland without a valid
      employment permit unless you are exempt. There are nine permit types; the two that
      matter for most US hires are the Critical Skills Employment Permit (for strategically
      important, higher-paid occupations, with no Labour Market Needs Test, immediate
      family reunification and a fast route to long-term residency) and the General
      Employment Permit (a broader range of occupations, usually requiring a Labour Market
      Needs Test). The permit is tied to the specific employer, occupation and location.
      An employment permit is not a residence permission: after it is granted you must
      still enter Ireland and, for stays over 90 days, register and obtain an Irish
      Residence Permit. The right permit type depends on the occupation and the salary.
    steps:
      - text: "Secure a concrete job offer from a bona-fide Irish employer registered with the Revenue Commissioners; the offer drives which permit type applies and the permit is job-, employer- and location-specific."
      - text: "You or your employer apply online on Employment Permits Online for the relevant permit type, at least 12 weeks before the proposed start date, enclosing the signed contract of employment."
        tip: "Choose the permit type before applying: Critical Skills for eligible higher-paid/in-demand roles; General Employment Permit for most other eligible occupations (usually after a Labour Market Needs Test)."
        links:
          - text: "DETE — employment permits overview (how to apply, types, fees)"
            sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/"
            sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Employment permits"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): DETE overview captured;
            # links to Employment Permits Online, types, eligibility and fees.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Once the permit is granted it issues to you (the employee), with a certified copy to your employer; keep the original — you must show it to an immigration officer on entry and at registration."
    documents:
      - name: "Employment permit application (Employment Permits Online)"
        type: form
        description: "The online application for the relevant employment permit type, made on the DETE Employment Permits Online system. Either you or your employer can be the applicant."
        form:
          text: "Apply on Employment Permits Online — the DETE system for making and tracking employment-permit applications. We link the DETE Employment Permits page (the authority page that links the online system and the per-type checklists) rather than a deep form URL, so it stays current. DETE provides a per-permit-type checklist to use before applying."
          sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/"
          sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Employment permits"
          # DRAFT/UNVERIFIED (research-4 2026-06-13): DETE overview (captured):
          # "You can apply for a permit on Employment Permits Online." and "Use the
          # appropriate checklist to help with your application." Linking the
          # authority page (not a deep form) matches project rule. Verifier: confirm
          # the page still links Employment Permits Online and the checklists.
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Signed contract of employment"
        type: provide
        description: "A contract of employment signed by both you and the employer — DETE requires it to be submitted with every employment-permit application."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport — your travel and identity document throughout the process and on entry to Ireland."
      - name: "Evidence of qualifications, skills or experience"
        type: provide
        description: "Evidence of the qualifications, skills or experience required for the role (degree, professional registration, references), as required by the relevant permit type."
    warning: >
      An employment permit is not permission to enter or reside in Ireland. Entry is always
      at the discretion of the immigration officer at the port of entry, and for any stay
      over 90 days you must separately register and obtain an Irish Residence Permit. Do not
      travel or start work until the permit is granted.
    dependsOn: []
    appliesIf: "motivation == 'work'"

  # ---------------------------------------------------------------------------
  - id: employment-permit-type
    title: "Choose the right permit: Critical Skills vs General Employment Permit"
    category: employment
    summary:
      text: "The Critical Skills Employment Permit targets strategically important, in-demand occupations: no Labour Market Needs Test is required, immediate family reunification is allowed, and after the permit's duration the holder can apply directly to immigration for a Stamp 4 to live and work without a permit. It needs a job offer of at least 2 years and a minimum annual remuneration of EUR 40,904 for occupations on the Critical Skills Occupations List (EUR 36,848 if you obtained the relevant qualification within the previous 12 months), or EUR 68,911 for other eligible occupations. The General Employment Permit covers a broader range of occupations (all except those on the Ineligible List), usually requires a Labour Market Needs Test, and has a minimum annual remuneration generally of EUR 36,605."
      sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/critical-skills-employment-permit/"
      sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Critical Skills Employment Permit"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): CSEP page (captured) verbatim:
      # "a Labour Market Needs Test is not required", "Permit holders can apply for
      # immediate family reunification", "minimum annual remuneration of EUR 40,904
      # for a restricted number of strategically important occupations contained in
      # the Critical Skills Occupations List", "the minimum annual remuneration will
      # be EUR 36,848" (qualification within prior 12 months), "All occupations with
      # a minimum annual remuneration of over EUR 68,911 ...", "only ... a minimum
      # of 2 years' duration". GEP page (captured): "all occupations are eligible
      # unless excluded under the Ineligible List", "Minimum annual remuneration -
      # is generally EUR 36,605", "A Labour Market Needs Test is required in most
      # cases". FIGURES present -> 30-day review window. Fact-verifier must re-derive
      # each figure live from the two DETE pages.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    tldr:
      text: "Pick the permit before you apply. Critical Skills Employment Permit: in-demand/higher-paid roles (salary threshold EUR 40,904, or EUR 36,848 for recent graduates of the relevant qualification, or EUR 68,911 for occupations not on the Critical Skills list), 2-year job offer, no labour-market test, immediate family reunification, and a fast route to Stamp 4. General Employment Permit: most other occupations, salary generally from EUR 36,605, usually a Labour Market Needs Test, family can join after 12 months."
      sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/critical-skills-employment-permit/"
      sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Critical Skills Employment Permit"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): distilled from the two captured
      # DETE permit pages; all figures sourced as in the summary. The "family can
      # join after 12 months" element for GEP is on the Citizens Information
      # "Employment permits and family members" page (captured) and is carried by
      # the family route tasks; verifier to confirm. FIGURES -> 30-day window.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Critical Skills — salary"
        text: "Minimum annual remuneration EUR 40,904 for occupations on the Critical Skills Occupations List (EUR 36,848 if you obtained the relevant degree within the previous 12 months); for occupations not on that list, EUR 68,911."
        sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/critical-skills-employment-permit/"
        sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Critical Skills Employment Permit"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): figures verbatim on the captured
        # CSEP page. FIGURES -> 30-day review window.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "General — salary"
        text: "Minimum annual remuneration generally EUR 36,605 (EUR 32,691 for specified roles such as Health Care Assistant / Home Support Worker, Horticulture worker, Meat Processor Operative; EUR 34,009 where the applicant has a relevant Irish third-level degree obtained in the previous 12 months)."
        sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/general-employment-permit/"
        sourceName: "Department of Enterprise, Tourism and Employment (DETE) — General Employment Permit"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): GEP page (captured) verbatim:
        # "Minimum annual remuneration - is generally EUR 36,605."; "Horticulture
        # worker, Meat Processor Operative, Health Care Assistant (HCA) & Home
        # Support Worker (SOC 6145) the minimum annual remuneration is EUR 32,691";
        # "relevant degree issued by an Irish third level college in the previous 12
        # months, the minimum annual remuneration is EUR 34,009". FIGURES -> 30-day.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "Labour Market Needs Test"
        text: "Not required for a Critical Skills Employment Permit; required for a General Employment Permit in most cases (waived, for example, where the role is on the Critical Skills Occupations List or the salary is at least EUR 68,911)."
        sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/general-employment-permit/"
        sourceName: "Department of Enterprise, Tourism and Employment (DETE) — General Employment Permit"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): CSEP page: "a Labour Market
        # Needs Test is not required". GEP page (captured): "A Labour Market Needs
        # Test is required in most cases, other than: Where the job is an occupation
        # included on the Critical Skills Occupations List. Where the job offer is
        # in respect of an eligible employment with a minimum annual remuneration of
        # EUR 68,911." FIGURE present -> 30-day review window.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "Duration & renewal"
        text: "Critical Skills permit needs a job offer of at least 2 years. A General Employment Permit issues for up to 24 months initially and can be renewed for up to 3 further years; after 5 years a General Employment Permit holder may apply to immigration for long-term residency."
        sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/general-employment-permit/"
        sourceName: "Department of Enterprise, Tourism and Employment (DETE) — General Employment Permit"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): CSEP page: job offer "at least a
        # minimum of 2 years' duration". GEP page (captured): "A General Employment
        # Permit can be issued for an initial period of 2 years and can then be
        # renewed for up to a further three years. After 5 years, the applicant may
        # apply to the Dept Of Justice (Immigration Service Delivery (ISD) for long
        # term residency." Confirm live.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The Critical Skills Employment Permit is the more attractive route where the
      occupation and salary qualify. It is designed to attract highly skilled people and to
      encourage permanent residence: no Labour Market Needs Test, immediate family
      reunification, and after the permit's two-year duration the holder can apply directly
      to immigration for a Stamp 4 (live and work without a further permit). Eligibility is
      driven by the occupation (on the Critical Skills Occupations List) and the salary.
      The General Employment Permit is the broader, default route: most occupations are
      eligible unless on the Ineligible List, but a Labour Market Needs Test is usually
      required (the employer must advertise the role), and the salary thresholds are lower.
      It issues for up to two years initially, renewable for up to three more, with a route
      to long-term residency after five years. Confirm the current Critical Skills
      Occupations List, the Ineligible List, and the salary thresholds with DETE before
      applying, as these are reviewed regularly.
    steps:
      - text: "Check whether the occupation is on the Critical Skills Occupations List and whether the salary meets the Critical Skills threshold; if so, the Critical Skills Employment Permit is usually the better route."
        links:
          - text: "DETE — Critical Skills Employment Permit (eligibility, salary thresholds, benefits)"
            sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/critical-skills-employment-permit/"
            sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Critical Skills Employment Permit"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): CSEP page captured; carries
            # eligibility, thresholds and the family/Stamp 4 benefits.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Otherwise, check the General Employment Permit: confirm the occupation is not on the Ineligible List and that the salary meets the General threshold; the employer will usually have to complete a Labour Market Needs Test first."
        links:
          - text: "DETE — General Employment Permit (eligibility, Labour Market Needs Test, salary)"
            sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/permit-types/general-employment-permit/"
            sourceName: "Department of Enterprise, Tourism and Employment (DETE) — General Employment Permit"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): GEP page captured.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Job offer / contract showing occupation, salary and duration"
        type: provide
        description: "Documentation of the offered role — occupation, annual remuneration and contract length — used to determine which permit type and salary threshold applies."
      - name: "Evidence the occupation is eligible (Critical Skills or not on the Ineligible List)"
        type: provide
        description: "Confirmation that the occupation is on the Critical Skills Occupations List (for a Critical Skills permit) or is not on the Ineligible List of Occupations (for a General Employment Permit)."
    cost:
      text: "DETE processing fee: a Critical Skills Employment Permit is EUR 1,000. A General Employment Permit is EUR 500 for a permit of 6 months or less, or EUR 1,000 for 6 months up to 24 months (renewals EUR 750 / EUR 1,500). If an application is unsuccessful, 90% of the fee is refunded. Confirm the current fees with DETE before applying."
      sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/fees/"
      sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Fees for employment permits"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): CSEP page (captured): "The
      # processing fee for a Critical Skills Employment Permit is EUR 1,000. If an
      # application is unsuccessful then 90% of the fee will be refunded." GEP page
      # (captured): "EUR 500 for an employment permit of 6 months or less ... or
      # EUR 1,000 for ... 6 months up to 24 months ... renewal ... is EUR 750 ...
      # or EUR 1,500". The DETE Fees page (captured) is the consolidated authority.
      # FEE claim -> 30-day review window. Fact-verifier to re-derive live.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    dependsOn:
      - employment-permit
    appliesIf: "motivation == 'work'"

