    detail: >
      After admission, your study permission is Stamp 2 (registered after arrival like every
      other non-EEA stay over 90 days). The conditions are strict: you must evidence the
      required funds (EUR 10,000 for a year-long course, or EUR 833/month for shorter
      courses), hold private medical insurance to register, and your work rights are capped
      at 20 hours a week during term and 40 hours a week during the standardised holidays.
      Students cannot claim social welfare and must be able to support themselves. As a
      student you generally cannot sponsor family to join you. You must keep progressing in
      your course (e.g. passing exams and meeting attendance) to renew. US students benefit
      from being non-visa-required for entry but must still register for Stamp 2 within 90
      days and meet all the financial and insurance conditions.
    steps:
      - text: "Before travelling, assemble proof of the required funds and private medical insurance; after arrival, register for Stamp 2 within 90 days (see the registration step)."
        links:
          - text: "Citizens Information — immigration rules for full-time non-EEA students"
            sourceUrl: "https://www.citizensinformation.ie/en/moving-country/moving-to-ireland/studying-in-ireland/immigration-nonEEA-students/"
            sourceName: "Citizens Information (Citizens Information Board, statutory body) — Immigration rules for full-time non-EEA students"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): page captured.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Keep within the 20-hours/40-hours work limits and keep proof of academic progression for each renewal."
    documents:
      - name: "Proof of finances (EUR 10,000 / EUR 833 per month)"
        type: provide
        description: "Evidence you can access the required funds — EUR 10,000 for a one-year course, or EUR 833 per month (EUR 6,665 total for 8 months) for shorter courses."
      - name: "Private medical insurance with hospital cover"
        type: provide
        description: "Original private medical insurance with hospital cover valid for your stay — required to register Stamp 2."
      - name: "Letter of enrolment and proof of fees paid"
        type: provide
        description: "Your institution's letter of enrolment on a full-time ILEP course and proof your fees are paid, carried over from the admission step."
    warning: >
      Stamp 2 work rights (20 hours/term, 40 hours/holidays) and the financial-evidence
      figures are conditions of the permission — breaching the work limits or failing to
      show funds can cost you your permission. Confirm the current figures with ISD, as they
      are reviewed.
    dependsOn:
      - study-admission
    appliesIf: "motivation == 'study'"

