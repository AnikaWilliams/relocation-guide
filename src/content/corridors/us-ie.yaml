  - id: entry-permission
    title: "Enter Ireland: US citizens are non-visa-required (no entry visa needed)"
    category: visa-permit
    summary:
      text: "US citizens are listed among the nationalities who do not need a visa to land in Ireland, so as a US citizen you do not apply for an Irish entry visa before travelling. A visa-required national would instead need a long-stay (D) employment visa, applied for online through AVATS up to 3 months before travel. Either way, a visa only allows you to travel to Ireland; it does not give permission to enter. As a non-EEA citizen you are subject to immigration control at the port of entry, and entry is always at the discretion of the immigration officer."
      sourceUrl: "https://www.citizensinformation.ie/en/moving-country/visas-for-ireland/visa-requirements-for-entering-ireland/"
      sourceName: "Citizens Information (Citizens Information Board, statutory body) — Visa requirements for entering Ireland"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): citizensinformation page (captured;
      # edited 10 June 2026) lists "United States of America" in the table of
      # countries whose citizens "do not need a visa to land in Ireland".
      # citizensinformation.ie is run by the Citizens Information Board, a statutory
      # state body (not a blog/firm) — acceptable as official Irish government info.
      # NOTE for fact-verifier: the PRIMARY determinant is the Department of Justice
      # / ISD "visa-required nationalities" rule (irishimmigration.ie, captured) and
      # the ISD Travel Path; the ISD page (captured) states the RULE but its captured
      # text does not enumerate USA (list is JS-rendered). The "subject to
      # immigration control" / "visa does not give permission to enter" elements are
      # verbatim on the DFA Embassy-USA page (captured). Verifier should confirm USA
      # non-visa-required status against the ISD source directly if reachable.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Good news for US citizens: you do not need an Irish entry visa. You travel to Ireland on your US passport, but you must still hold the underlying permission for your stay (an employment permit for work, a course place for study, an approval letter for retirement/family) and, for any stay over 90 days, register after you arrive. Entry is decided by the immigration officer at the airport — carry your supporting documents."
      sourceUrl: "https://www.citizensinformation.ie/en/moving-country/visas-for-ireland/visa-requirements-for-entering-ireland/"
      sourceName: "Citizens Information (Citizens Information Board, statutory body) — Visa requirements for entering Ireland"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): non-visa-required status per the
      # captured citizensinformation table (USA listed). "register for stays over 90
      # days" is verbatim on the ISD registration page (captured). Entry-at-officer-
      # discretion verbatim on the DFA/ISD pages (captured). Verifier to confirm.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Do US citizens need an entry visa?"
        text: "No. The United States of America is on the list of countries whose citizens do not need a visa to land in Ireland."
        sourceUrl: "https://www.citizensinformation.ie/en/moving-country/visas-for-ireland/visa-requirements-for-entering-ireland/"
        sourceName: "Citizens Information (Citizens Information Board, statutory body) — Visa requirements for entering Ireland"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): captured page lists "United
        # States of America" in the do-not-need-a-visa table. Verifier: cross-check
        # against ISD irishimmigration.ie visa-non-visa-required-nationalities if the
        # list renders for the live re-fetch.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Does that let me stay?"
        text: "No. A visa (or visa-free travel) allows you to travel to Ireland only; it does not give you permission to enter or to stay. As a non-EEA citizen you are subject to immigration control on arrival, and you need the underlying permission for your purpose of stay."
        sourceUrl: "https://www.ireland.ie/en/usa/washington/services/visas/visas-for-ireland/"
        sourceName: "Embassy of Ireland, USA (Department of Foreign Affairs) — Visas For Ireland"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): DFA Embassy-USA page (captured)
        # verbatim: "A visa allows you to travel to Ireland only. It does not give
        # you permission to enter the country or to stay here." and "If you're a
        # citizen of a non-EEA country, whether you need a visa or not, you will be
        # subject to immigration control when you enter Ireland." Confirm live.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "If you ARE visa-required (e.g. some family members)"
        text: "A visa-required national applies for a long-stay (D) employment visa online through AVATS up to 3 months before travelling, from their home country or country of legal residence, after the employment permit is granted. Approximate processing time is 8 weeks."
        sourceUrl: "https://www.irishimmigration.ie/coming-to-work-in-ireland/what-are-my-work-visa-options/applying-for-a-long-stay-employment-visa/employment-visa/"
        sourceName: "Irish Immigration Service (ISD) — Employment (long stay D) visa"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): ISD employment-visa page (captured)
        # verbatim: "Once you have received a permit, you are eligible to apply for an
        # Employment Visa."; "You should apply for a long stay employment visa up to 3
        # months before your date of travel to Ireland. You must apply from your home
        # country or where you are a legal resident."; "applicants can expect a
        # decision within approximately 8 weeks". This branch is relevant to
        # visa-required family members, not to US citizens themselves.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Ireland is not in the Schengen area and sets its own visa rules. US citizens are
      non-visa-required: you do not apply for an Irish entry visa and travel on your US
      passport. What you must have ready instead is the permission underlying your stay —
      for the work route, the employment permit; for study, your course enrolment and proof
      of fees and finances; for retirement, the Stamp 0 approval letter; for family, the
      approval/preclearance — plus evidence you can support yourself. A visa (where one is
      needed at all) only authorises travel to the border; it never guarantees entry. At
      the port of entry an immigration officer checks your documents and decides whether to
      admit you and for how long (the landing stamp). For any stay over 90 days you then
      register and obtain an Irish Residence Permit. Visa-required nationals — which can
      include some non-US family members joining you — follow the separate AVATS long-stay
      (D) visa process before travelling.
    steps:
      - text: "Confirm your nationality's status on the official ISD visa-required/non-visa-required list — for US citizens, no entry visa is required."
        links:
          - text: "ISD — Visa & Non-Visa Required Nationalities (the authoritative determinant)"
            sourceUrl: "https://www.irishimmigration.ie/visa-non-visa-required-nationalities/"
            sourceName: "Irish Immigration Service (ISD) — Visa & Non-Visa Required Nationalities"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): ISD page captured; states the
            # visa-requirement rule. NOTE: the captured text does not enumerate the
            # country list (JS-rendered); the explicit USA listing is sourced to the
            # captured citizensinformation table. Verifier to reconcile.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Travel to Ireland on your valid US passport carrying your underlying permission (employment permit, course documents, or approval letter) and evidence of means; present them to the immigration officer at the port of entry."
        tip: "Keep originals to hand at the border — the officer can refuse entry, and you will need these same documents to register afterwards."
      - text: "Note the landing stamp in your passport — it shows how long you may stay; for stays over 90 days you must register and get an Irish Residence Permit."
    documents:
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport — US citizens travel to Ireland visa-free, so the passport is your travel document; carry it for the immigration officer at entry."
      - name: "Underlying permission for your stay"
        type: provide
        description: "The document that justifies your stay — for work, the original employment permit; for study, enrolment + proof of fees/finances; for retirement/family, the approval or preclearance letter."
      - name: "Evidence of funds / means of support"
        type: provide
        description: "Evidence you can support yourself for your stay (the immigration officer may ask), and any private medical/travel insurance needed for your route."
    # timeline omitted (ADR-0007): there is no entry-visa processing step for US
    # citizens (non-visa-required); the visa-required D-visa ~8-week figure is on
    # the keyFact above for the family-member branch only.
    dependsOn:
      # Listed across routes; at runtime appliesIf filters out non-applicable
      # predecessors (ADR-0009 mechanics). For the work route the predecessor is the
      # employment permit; other routes attach their own admission task.
      - employment-permit
      - study-admission
      - retirement-permission
      - family-reunification
    appliesIf: "destination == 'ie'"

