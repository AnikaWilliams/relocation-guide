    detail: >
      Ireland taxes you according to your tax residence and domicile, not your nationality.
      You become tax-resident broadly by spending 183 days in a year (or 280 days across
      two years) in Ireland. A newcomer who is resident but not Irish-domiciled is taxed on
      Irish income and on foreign income only when it is remitted to Ireland — which can
      matter for US investment and pension income. Crucially, the United States taxes its
      citizens on worldwide income wherever they live, so as a US citizen in Ireland you
      will generally have filing obligations in both countries; the US-Ireland double
      taxation treaty and foreign tax credits are designed to prevent double taxation, but
      the interaction is genuinely complex (pensions, capital gains, PFIC rules). This guide
      is informational only — get advice from a cross-border US/Irish tax professional
      before you move and before your first filing.
