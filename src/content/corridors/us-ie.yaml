      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Ordinary residence = access"
        text: "You are ordinarily resident if you have lived in Ireland for at least a year or intend to live here for at least a year; any ordinarily resident person, regardless of nationality, gets full or limited eligibility for public health services."
        sourceUrl: "https://www.citizensinformation.ie/en/health/health-system/entitlement-to-public-health-services/"
        sourceName: "Citizens Information (Citizens Information Board, statutory body) — Entitlement to health services"
