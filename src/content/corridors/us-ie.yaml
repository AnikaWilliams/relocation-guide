      # enterprise.gov.ie/.../employment-permits/). Page states verbatim "To work
      # in Ireland, a non-EEA national, unless they are exempted, must hold a valid
      # employment permit." and "The department's Employment Permits Section
      # administers the employment permits system." The "an employment permit is
      # not a Residence Permission" element appears verbatim on the companion
