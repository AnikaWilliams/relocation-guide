    detail: >
      Ireland taxes you according to your tax residence and domicile, not your nationality.
      You become tax-resident broadly by spending 183 days in a year (or 280 days across
      two years) in Ireland. A newcomer who is resident but not Irish-domiciled is taxed on
      Irish income and on foreign income only when it is remitted to Ireland — which can
      matter for US investment and pension income. Crucially, the United States taxes its
      citizens on worldwide income wherever they live, so as a US citizen in Ireland you
      will generally have filing obligations in both countries; the US-Ireland double
      taxation treaty and foreign tax credits are designed to prevent double taxation, but
      the interaction is genuinely complex (pensions, capital gains, PFIC rules). This guide
      is informational only — get advice from a cross-border US/Irish tax professional
      before you move and before your first filing.
    steps:
      - text: "Once you have your PPS number, register your employment with Revenue (via myAccount) so the correct tax credits and rate band apply to your pay."
        links:
          - text: "Citizens Information — tax residence and domicile in Ireland"
            sourceUrl: "https://www.citizensinformation.ie/en/money-and-tax/tax/moving-country-and-taxation/tax-residence-and-domicile-in-ireland/"
            sourceName: "Citizens Information (Citizens Information Board, statutory body) — Tax residence and domicile in Ireland"
            # DRAFT/UNVERIFIED (research-4 2026-06-13): page captured.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Get cross-border tax advice on the US filing obligation and the US-Ireland treaty before relying on any particular treatment of foreign income, pensions or gains."
    documents:
      - name: "PPS number"
        type: provide
        description: "Your PPS number — needed to register for Irish tax and to be taxed correctly under PAYE."
      - name: "Record of days present in Ireland"
        type: provide
        description: "A record of your arrival date and days present in Ireland — relevant to determining your tax-residence position for the year."
    warning: >
      US citizens remain subject to US tax on worldwide income regardless of living in
      Ireland. Do not treat any statement here about foreign income, pensions or the
      remittance basis as advice for your situation — confirm with a qualified US/Irish
      tax adviser.
    dependsOn:
      - pps-number
    appliesIf: "destination == 'ie'"

