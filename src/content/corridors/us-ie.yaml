      - label: "Full vs limited eligibility"
        text: "Full eligibility (medical card) gives free GP, public hospital, prescribed-drug (subject to a per-item charge) and other services; without a medical card you have limited eligibility and may pay public-hospital charges and for GP visits and medicines."
        sourceUrl: "https://www.citizensinformation.ie/en/health/health-system/entitlement-to-public-health-services/"
        sourceName: "Citizens Information (Citizens Information Board, statutory body) — Entitlement to health services"
