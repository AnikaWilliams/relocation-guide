  # FAMILY ROUTE
  # ---------------------------------------------------------------------------
  - id: family-reunification
    title: "Join family in Ireland (family reunification)"
    category: family-dependents
    summary:
      text: "Family members of a person living in Ireland have no automatic right to join them unless they are EEA, UK or Swiss citizens; instead Immigration Service Delivery operates a family reunification policy that sets the rules. If your sponsor holds a Critical Skills Employment Permit (or is a researcher on a Hosting Agreement, or a doctor on Stamp 1H), the spouse/de facto partner and dependent children can apply to come to Ireland immediately. If your sponsor holds any other employment permit, family can apply after a 12-month waiting period and the sponsor must be earning enough to support the family. You must have been in a de facto partnership for at least 2 years to sponsor a partner."
      sourceUrl: "https://www.citizensinformation.ie/en/moving-country/working-in-ireland/employment-permits/spousal-work-permit-scheme/"
      sourceName: "Citizens Information (Citizens Information Board, statutory body) — Employment permits and family members"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): citizensinformation "Employment
      # permits and family members" page (captured; edited 19 May 2026) verbatim:
      # "Your family does not have an automatic right to join an employment permit
      # holder in Ireland, unless they are citizens of the EEA ... the UK or
      # Switzerland."; "Immigration Service Delivery (ISD ...) has a family
      # reunification policy"; CSEP/researcher/Stamp 1H: "Your spouse or de facto
      # partner and dependent children can apply to come to Ireland without any
      # waiting period."; "All other employment permits ... can apply to come to
      # Ireland at the end of a 12 month waiting period. You must be earning enough
      # money to support your family."; "For de facto partnerships, you must be able
      # to show that you have been in the relationship for at least 2 years." Confirm
      # live. The "no automatic right for Irish citizens either" point is on the
      # captured visa-requirements page (search corroborated). FIGURE (12 months) is
      # a duration, not a fee/quota -> 90-day window.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Whether and when your family can join you in Ireland depends on the sponsor's status. Critical Skills permit holders: spouse/partner and children can come immediately, and the spouse/partner can work (Stamp 1G) without their own permit. Other employment-permit holders: family can join after 12 months, and you must show you can support them. There is no automatic right to family reunification for non-EEA/UK/Swiss family — ISD's family reunification policy applies."
      sourceUrl: "https://www.citizensinformation.ie/en/moving-country/working-in-ireland/employment-permits/spousal-work-permit-scheme/"
      sourceName: "Citizens Information (Citizens Information Board, statutory body) — Employment permits and family members"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): distilled from the captured family-
      # members page (immediate vs 12-month; spouse of CSEP holder gets Stamp 1G to
      # work without a permit; no automatic right). Confirm live.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "When family can join"
        text: "Immediately if the sponsor holds a Critical Skills Employment Permit (or is a researcher on a Hosting Agreement, or a doctor on Stamp 1H); after a 12-month waiting period for other employment permits."
        sourceUrl: "https://www.citizensinformation.ie/en/moving-country/working-in-ireland/employment-permits/spousal-work-permit-scheme/"
        sourceName: "Citizens Information (Citizens Information Board, statutory body) — Employment permits and family members"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): verbatim on captured page (see
        # summary note). 12 months is a duration -> 90-day window.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Can the spouse/partner work?"
        text: "Spouse or de facto partner of a Critical Skills permit holder gets a Stamp 1G when they register, which allows work without an employment permit. Since 15 May 2024, the spouse/de facto partner of a General Employment Permit or Intra-Corporate Transferee holder can also work without a permit (issued a Stamp 1G)."
        sourceUrl: "https://www.citizensinformation.ie/en/moving-country/working-in-ireland/employment-permits/spousal-work-permit-scheme/"
        sourceName: "Citizens Information (Citizens Information Board, statutory body) — Employment permits and family members"
        # DRAFT/UNVERIFIED (research-4 2026-06-13): captured page verbatim: "Your
        # spouse or partner can get a Stamp 1G IRP when they register. This gives
        # them the right to work without an employment permit." and "From 15 May 2024,
        # you can work without an employment permit if you are the spouse or de-facto
        # partner of a General Employment Permit (GEP) holder or an Intra-Corporate
        # Transferee (ICT) permit holder ... When your current IRP card expires and
        # you renew it, you will be issued with a Stamp 1G." Confirm live.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Visa vs preclearance"
        text: "Visa-required family members each apply for a Join Family Member (D) visa. Non-visa-required de facto partners of a Critical Skills (or Hosting Agreement) holder must apply for preclearance before coming to Ireland."
        sourceUrl: "https://www.citizensinformation.ie/en/moving-country/visas-for-ireland/visa-requirements-for-entering-ireland/"
        sourceName: "Citizens Information (Citizens Information Board, statutory body) — Visa requirements for entering Ireland"
