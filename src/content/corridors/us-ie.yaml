    detail: >
      Ireland has no automatic family-reunification right for non-EEA/UK/Swiss family
      members — even Irish citizens cannot automatically bring a non-EEA spouse. Instead
      Immigration Service Delivery's family reunification policy governs who can sponsor
      whom and when. The single biggest factor is the sponsor's permission: a Critical
      Skills Employment Permit allows the spouse/de facto partner and dependent children to
      apply immediately, and the spouse/partner can then work in Ireland without their own
      employment permit (Stamp 1G). Holders of other employment permits must wait 12 months
      and show they can support the family (there are minimum income limits by family size).
