  - id: register-immigration-irp
    title: "Register your immigration permission and get your Irish Residence Permit (IRP)"
    category: registration-bureaucracy
    summary:
      text: "If you are from a country outside the EU, UK or Switzerland and come to Ireland to work, study, live or join family for more than 90 days, you must register your immigration permission with Immigration Service Delivery, and you must do so within 90 days of being granted permission. Registration records the permission you have been given and what you may legally do; once you have registered you receive an Irish Residence Permit (IRP) card by post, which is your proof that you are legally in the State. The registration fee is EUR 300 per person (with some exemptions). At registration your fingerprints and photograph are taken."
      sourceUrl: "https://www.irishimmigration.ie/registering-your-immigration-permission/how-to-register-your-immigration-permission-for-the-first-time/"
