  - id: healthcare
    title: "Sort out healthcare: public eligibility and private insurance"
    category: healthcare-insurance
    summary:
      text: "Anyone the Health Service Executive (HSE) accepts as ordinarily resident in Ireland — meaning you have been living here for at least a year, or you intend to live here for at least a year — is entitled, regardless of nationality, to public health services, either with full eligibility (a medical card) or limited eligibility (without one). Separately, many immigration stamp categories require you to hold private medical insurance with hospital cover to register, so check what your route requires."
      sourceUrl: "https://www.citizensinformation.ie/en/health/health-system/entitlement-to-public-health-services/"
      sourceName: "Citizens Information (Citizens Information Board, statutory body) — Entitlement to health services"
      # DRAFT/UNVERIFIED (research-4 2026-06-13): citizensinformation health-
      # entitlement page (captured) verbatim: "You are ordinarily resident if you
      # have been living in Ireland for at least a year or you intend to live here
      # for at least one year." and "Any person, regardless of nationality, who is
      # accepted by the HSE as being ordinarily resident in Ireland is entitled to
      # either full eligibility (Category 1, medical card holders) or limited
      # eligibility (Category 2) for health services." The private-medical-insurance-
      # to-register requirement is verbatim on the ISD registration Required-Documents
      # page (captured) for several stamps. Confirm live. NOTE: page last-edited
      # 17 Oct 2022 — verifier should check currency.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Ireland's public health system is residence-based, not insurance-based: once the HSE treats you as ordinarily resident (living here, or intending to live here, for at least a year) you can use public health services regardless of nationality. But unlike Switzerland there is no universal mandatory insurance — and several immigration stamps require you to BUY private medical insurance with hospital cover in order to register, so check your route's requirement."
      sourceUrl: "https://www.citizensinformation.ie/en/health/health-system/entitlement-to-public-health-services/"
      sourceName: "Citizens Information (Citizens Information Board, statutory body) — Entitlement to health services"
