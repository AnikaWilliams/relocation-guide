      text: "Non-EEA students register on Stamp 2 and must show they can support themselves: for a one-year course you must show access to EUR 10,000; for courses of 6 to 8 months you must show EUR 833 per month (EUR 6,665 in total for 8 months). Stamp 2 lets you take casual employment of up to 20 hours per week during term and up to 40 hours per week during defined holiday periods. Stamp 2 students are not entitled to social welfare and generally cannot bring family members on the basis of being a student."
      sourceUrl: "https://www.citizensinformation.ie/en/moving-country/moving-to-ireland/studying-in-ireland/immigration-nonEEA-students/"
