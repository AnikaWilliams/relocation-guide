  - id: employment-permit
    title: "Secure an Irish employment permit (your Swiss employer cannot self-apply)"
    category: visa-permit
    summary:
      text: "As a US citizen you are a non-EEA national. To work in Ireland you, or your employer, must first obtain a valid Irish employment permit from the Department of Enterprise, Tourism and Employment: \"To work in Ireland, a non-EEA national, unless they are exempted, must hold a valid employment permit.\" An employment permit is not on its own a residence permission — it lets you take up the specific job named on it; you still need permission to enter and (for stays over 90 days) to register after arrival."
      sourceUrl: "https://enterprise.gov.ie/en/what-we-do/workplace-and-skills/employment-permits/"
      sourceName: "Department of Enterprise, Tourism and Employment (DETE) — Employment permits"
