  # ---------------------------------------------------------------------------
  - id: family-permit-children
    localCostTimeline: canton
    title: "Family reunification for minor children"
    category: family-dependents
    # Deliberately motivation-independent: children also accompany work-route
    # users. Pure-|| rule (no parentheses needed, ADR-0009 grammar): applies if
    # the user is bringing children OR is themselves joining a parent/child
    # (the intake's 'parent' relationship option covers both directions).
    # appliesIf APPROVED 2026-06-12 (fact-verifier, ADR-0009 §4): motivation-
    # independence is legally correct — a work-route B-permit holder's children
    # are admitted via Art. 44 FNIA family reunification (verified this run),
    # so this task must also reach work-route users with hasChildren == true.
    # Routing familyRelationship == 'parent' here is acceptable because the
    # task's detail honestly states that adult-child/parent constellations fall
    # outside the Art. 42-44 minor-children scope (supported by ch.ch).
    appliesIf: "hasChildren == true || familyRelationship == 'parent'"
    summary:
      text: "Unmarried children under 18 qualify for family reunification: children of a Swiss citizen who live with them are entitled to a residence permit (Art. 42 para. 1 FNIA), children of a settlement (C) permit holder are entitled to one subject to the Art. 43 conditions, and children of a residence (B) permit holder may be granted one at the authorities' discretion (Art. 44). Children under 12 of a Swiss citizen or of a C-permit holder are entitled to a settlement permit directly (Art. 42 para. 4 and Art. 43 para. 6). The language requirement does not apply to unmarried children under 18 (Art. 43 para. 3 and Art. 44 para. 3)."
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html-3.html#art_42"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 42-44 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01; one document covers Arts. 42-44, anchor "art_42" present). Each element verbatim: Art. 42 para. 1 "unmarried children under 18 of a Swiss national who live with the Swiss national are entitled to be granted a residence permit"; Art. 43 para. 1 children of settlement-permit holders "are entitled ... provided" conditions a-e; Art. 44 para. 1 children of residence-permit holders "may be granted"; Art. 42 para. 4 and Art. 43 para. 6 identically "Children under twelve are entitled to be granted a settlement permit."; Art. 43 para. 3 and Art. 44 para. 3 — the para. 1 let. d language requirement "does not apply" to unmarried children under 18. All ages, article/paragraph numbers and entitlement-vs-discretion language match character-for-character.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    # ADR-0012 distilled copy (tldr/keyFacts) drafted 2026-06-12
    # (content-researcher), independently VERIFIED 2026-06-12 (fact-verifier,
    # two-agent rule) — see VERIFICATION_LOG.md family-distilled run.
    # Route-neutral: children accompany work-route users too; no employment presumed.
    tldr:
      text: "Unmarried children under 18 can join a parent in Switzerland: children of a Swiss citizen are entitled to a residence permit (Art. 42), children of a C-permit holder are entitled subject to conditions (Art. 43), and children of a B-permit holder may be granted one at the canton's discretion (Art. 44). Children under 12 of a Swiss citizen or C-permit holder get a settlement permit directly."
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html-3.html#art_42"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 42-44 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): the Art. 42/43/44 split for unmarried children under 18 (Swiss-citizen children entitled; C-holder children entitled subject to conditions; B-holder children may be granted at the canton's discretion) and the under-12 direct settlement permit (Art. 42 para. 4 / Art. 43 para. 6) are all logged verbatim character-for-character (F5, separate session). Fedlex SPA not re-renderable this session — relied on prior independent verbatim verification. Age thresholds, paragraph numbers and entitlement/discretion terms exact; route-neutral.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    keyFacts:
      - label: "Who applies"
        text: "Unmarried children under 18 of a Swiss national who live with them are entitled to a residence permit (Art. 42 para. 1); children of a C-permit holder are entitled subject to the Art. 43 conditions; children of a B-permit holder may be granted one (Art. 44)."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html-3.html#art_42"
        sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 42-44 — Fedlex"
        # VERIFIED 2026-06-12 (fact-verifier): Art. 42 para. 1 (children under 18 of a Swiss national entitled), Art. 43 (C-holder children entitled subject to conditions), Art. 44 (B-holder children may be granted) — all logged verbatim F5. Accurate.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Right or discretion"
        text: "Children under twelve of a Swiss national or of a settlement-permit holder are entitled to be granted a settlement permit directly (Art. 42 para. 4 and Art. 43 para. 6)."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html-3.html#art_42"
        sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 42 para. 4 and Art. 43 para. 6 — Fedlex"
        # VERIFIED 2026-06-12 (fact-verifier): children under twelve of a Swiss national or settlement-permit holder "are entitled to be granted a settlement permit" directly (Art. 42 para. 4 and Art. 43 para. 6) — logged verbatim F5. Age threshold and paragraph numbers exact. (One Vaud-page paraphrase rendered the under-12 C-permit basis as "Art. 43 para. 3"; the statute and this claim correctly cite Art. 43 para. 6 — the WebFetch paraphrase was imprecise; the claim follows the statute.)
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Legal basis"
        text: "The language requirement (communicate in the national language) does not apply to unmarried children under 18 (Art. 43 para. 3 and Art. 44 para. 3 FNIA)."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_43"
        sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 43 para. 3 and Art. 44 para. 3 — Fedlex"
        # VERIFIED 2026-06-12 (fact-verifier): language requirement does not apply to unmarried children under 18 (Art. 43 para. 3 and Art. 44 para. 3) — logged verbatim F5. Article/paragraph numbers exact.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Deadline"
        text: "The right to family reunification must be exercised within five years; children over twelve must be reunified within twelve months (Art. 47 para. 1 FNIA). A subsequent reunification is authorised only if there are important family reasons (Art. 47 para. 4)."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html-3.html#art_47"
        sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 47 — Fedlex"
        # VERIFIED 2026-06-12 (fact-verifier): Art. 47 para. 1 (five years; twelve months for over-12s) and para. 4 (subsequent reunification only for important family reasons) logged verbatim F5 and corroborated on the Vaud SPOP page this session. Exact.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Where"
        text: "Include the children in the family-reunification application to the cantonal immigration authority of the canton where the parent lives. Cantonal worked example (Vaud): the Service de la population (SPOP) is the competent authority."
        sourceUrl: "https://www.vd.ch/population/population-etrangere/entree-et-sejour/etats-tiers/regroupement-familial-du-conjoint-partenaire-et/ou-des-enfants-aupres-dun-ressortissant-suisse"
        sourceName: "Canton de Vaud — Service de la population (SPOP), Regroupement familial (conjoint, partenaire et/ou enfants)"
        # VERIFIED 2026-06-12 (fact-verifier): include children in the family-reunification application to the cantonal immigration authority where the parent lives; confirmed this session on the Vaud SPOP Swiss-national page (SPOP competent; documents for children incl. birth certificates with filiation, custody/consent). Accurate.
