  - id: family-permit-spouse-settled
    localCostTimeline: canton
    title: "Family reunification as the spouse or registered partner of a settled person (C permit)"
    category: family-dependents
    appliesIf: "motivation == 'family' && familyJoineeStatus == 'settled' && familyRelationship != 'unmarried-partner' && familyRelationship != 'parent'"
    summary:
      text: "The foreign spouse (and unmarried children under 18) of a person holding a settlement permit (C permit) are entitled to a residence permit and its extension provided they live with that person, suitable accommodation is available, they do not depend on social assistance, they are able to communicate in the national language spoken at the place of residence, and the person they are joining is not claiming (and would not become entitled to claim) supplementary benefits (Art. 43 para. 1 FNIA). Registering for a language support programme is sufficient as an alternative to the language requirement (Art. 43 para. 2). The provisions on foreign spouses apply mutatis mutandis to registered partnerships of same-sex couples (Art. 52 FNIA)."
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_43"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 43 and 52 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): FNIA EN consolidated HTML read from the official Fedlex filestore (in-force 2026-02-01; anchor "art_43" present). Art. 43 para. 1 verbatim: "are entitled to be granted a residence permit and to have their residence permit extended provided: a. they live with that person; b. suitable accommodation is available; c. they do not depend on social assistance; d. they are able to communicate in the national language spoken at their place of residence; and e. the family member they are joining is not claiming supplementary benefits under the [SBA] or would not be entitled to claim such benefits due to family reunification." Para. 2 verbatim: "it is sufficient to register for a language support programme as an alternative to meeting the requirement set out in paragraph 1 letter d." Art. 52 mutatis-mutandis confirmed. All five conditions and the entitlement language match character-for-character.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    # ADR-0012 distilled copy (tldr/keyFacts) drafted 2026-06-12
    # (content-researcher), independently VERIFIED 2026-06-12 (fact-verifier,
