    detail: >
      This is the key legal difference from the Swiss-citizen and C-permit cases: Art. 42
      and Art. 43 FNIA create entitlements ("are entitled to be granted a residence
      permit"), whereas Art. 44 FNIA says the spouse and children of a B-permit holder
      "may be granted" a permit — the decision lies with the cantonal authorities. The
      official federal portal ch.ch puts it plainly: unlike the C permit, the B permit does
      not necessarily give the right to family reunification, which may, however, also be
      granted by the authorities. Once admitted under family reunification, the spouse and
      children of a B-permit holder may work, salaried or self-employed, anywhere in
      Switzerland (Art. 46 FNIA). The English text of the FNIA is provided for information
      only and has no legal force.
    steps:
      - text: "Understand that admission is discretionary: meeting the Art. 44 conditions makes reunification possible, not guaranteed. Discuss your case with the competent cantonal migration office before relocating."
        links:
          - text: "ch.ch — «Unlike the C permit, the B permit does not necessarily give you the right to family reunification, which may, however, also be granted by the authorities.»"
            sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
            sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): ch.ch page loaded (HTTP 200). The quoted sentence appears verbatim: "Unlike the C permit, the B permit does not necessarily give you the right to family reunification, which may, however, also be granted by the authorities." Quote matches character-for-character.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Check the conditions: living together, suitable housing, no dependence on social assistance, language (or enrolment in a language course), and no claim to supplementary benefits by the person you are joining."
        links:
          - text: "FNIA Art. 44 — spouses and children of persons with a residence permit (conditions a–e and the language-course alternative)"
            sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html-3.html#art_44"
