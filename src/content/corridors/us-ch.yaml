    tldr:
      text: "If you are the foreign spouse or registered partner of a Swiss citizen and you live together, you are entitled by law to a Swiss residence permit and its extension (Art. 42 para. 1 FNIA) — this is a right, not a discretionary admission, so it is not subject to the work-route quotas."
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html-3.html#art_42"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 42 — Fedlex, the official publication platform of Swiss law"
