      text: "If you are not working, the OASI contribution is a minimum of CHF 530 per year and depends on your situation; the cantonal compensation office assesses the exact amount. Contributions can be estimated with the Federal Social Insurance Office's online calculator (available in German, French and Italian); confirm your assessment with the compensation office."
