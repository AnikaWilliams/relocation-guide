    documents:
      - name: "Cantonal family-reunification application (children included)"
        type: form
        description: "The family-reunification application filed with the cantonal migration authority of the canton where the parent lives, listing the children; the canton issues the current form and checklist. Vaud is the worked example here."
        form:
          text: "Children are included in the family-reunification application filed with the competent cantonal authority, which issues the current form and document checklist. Vaud worked example: the Canton de Vaud Service de la population (SPOP) \"Regroupement familial ... du conjoint, partenaire et/ou des enfants\" page sets out the competent authority (SPOP), the legal basis and the documents to provide for children (incl. birth certificate with filiation, and custody/consent documents where only one parent relocates); there is no single named federal family-reunification PDF, so we link the SPOP authority page rather than a deep PDF. For other cantons, find the competent office via the SEM directory of cantonal immigration and employment-market authorities."
          sourceUrl: "https://www.vd.ch/population/population-etrangere/entree-et-sejour/etats-tiers/regroupement-familial-du-conjoint-partenaire-et/ou-des-enfants-aupres-dun-ressortissant-suisse"
