  - id: ahv-social-security
    title: "Get your AHV/AVS social security (OASI) number"
    category: registration-bureaucracy
    summary:
      text: "The OASI number (AHV in German / AVS in French) is the social-insurance number assigned to everyone living or working in Switzerland, used for old-age and survivors' insurance. As an employee you do not handle OASI yourself: your employer deducts your OASI contributions from your gross salary and pays them, with the employer's own share, to its compensation office (Ausgleichskasse / caisse de compensation). If you do not already have an OASI number when employment begins, confirm with your cantonal compensation office how it is issued; once you have one, you can ask your employer for it."
      sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
      sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
      # VERIFIED 2026-06-09 (fact-verifier): ch.ch "Paying OASI contributions in Switzerland" page loaded (curl, browser UA, HTTP 200, title matches). Confirms the load-bearing checkable facts verbatim: "All persons living or working in Switzerland must pay OASI contributions" and "Half of your OASI contributions (8.7% of your salary) are paid by you and the other half by your employer. Your employer takes care of deducting the OASI contributions from your gross salary and pays them to the compensation fund." The trailing number-issuance step ("Confirm with your cantonal compensation office how it is issued") is an honest pointer embedded in an otherwise fully-supported summary; no fact invented. Summary VERIFIED on its checkable content.
      status: VERIFIED
      lastVerified: "2026-06-09"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-07"
    detail: >
      The OASI/AHV/AVS number (beginning 756) is assigned to everyone living or working in
      Switzerland and is valid for life. As an employee you normally do not deal with OASI
      yourself: your employer deducts your OASI contributions from your gross salary and pays
      them, together with the employer's matching share, to its compensation office
      (Ausgleichskasse / caisse de compensation). If you do not already hold an OASI number
      when you start work, ask your cantonal compensation office how it is issued. You can
      ask your employer for your OASI number once you have one.
    steps:
      - text: "Once you start employment, your employer deducts your OASI contributions and pays them to its compensation office (Ausgleichskasse / caisse de compensation); if you do not yet have an OASI number, the compensation office is the body that handles it — confirm the procedure with them."
        tip: "If you need the number, ask your employer or your cantonal compensation office; an OASI card can also be requested."
        links:
          - text: "ch.ch — requesting an OASI card"
            sourceUrl: "https://www.ch.ch/en/documents-and-register-extracts/requesting-an-oasi-card/"
            sourceName: "ch.ch — Requesting an OASI card (official federal portal)"
            # VERIFIED 2026-06-09: server-rendered HTML (curl, HTTP 200) is the OASI-card page; lead reads "If you do not have an OASI card or if you have lost yours, you can request one by filling out the online form and sending it to the competent authority. The OASI card ceased to be compulsory in 2016..." Link text ("requesting an OASI card") accurate. (EN page falls back to a German <title> "Den AHV-Ausweis bestellen" = "Order the AHV card"; body content is English.)
            status: VERIFIED
            lastVerified: "2026-06-09"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-07"
    documents:
      - "Swiss employment contract"
      - "Valid US passport / residence permit"
    cost:
      text: "Getting the OASI number itself involves no fee for you; ongoing OASI contributions are shared — as an employee you pay half of your OASI contributions (8.7% of salary) and your employer pays the other half, deducted from your gross salary by the employer."
      sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
      sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
      # VERIFIED 2026-06-09 (fact-verifier): ch.ch "Paying OASI contributions" page loaded (curl, browser UA, HTTP 200). Load-bearing fact confirmed verbatim: "Half of your OASI contributions (8.7% of your salary) are paid by you and the other half by your employer. Your employer takes care of deducting the OASI contributions from your gross salary and pays them to the compensation fund." The "no fee for the number itself" portion is not contradicted by the page (the page describes no charge for an OASI number; the only fee discussion is the contribution split, which is confirmed). Contribution-rate claim -> 30-day review window.
      status: VERIFIED
      lastVerified: "2026-06-09"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-07-09"
    dependsOn:
      - residence-permit-card
    # appliesIf added 2026-06-12 (content-researcher, retirement-route draft;
    # PENDING fact-verifier approval per ADR-0009 §4 — claims above untouched):
    # this task describes the EMPLOYEE OASI mechanics (employer deducts and
    # pays contributions). Retirees admitted under Art. 28 FNIA may not work
    # at all (VZAE Art. 25 para. 3), so the employee framing can never apply
    # to them; they get the dedicated retirement-ahv-contributions task
    # instead. Without this rule, retirement-route users would see BOTH OASI
    # tasks, one of which is wrong for them. Work and family users are
    # unaffected ("motivation != 'retirement'" is true for them, and
    # 'retirement' is not yet offered by the intake anyway).
    # appliesIf APPROVED 2026-06-12 (fact-verifier, ADR-0009 §4): correct
    # against the legal sources. VZAE Art. 25 para. 3 (verified this run in
    # the consolidation in force 2026-06-12) bans ALL gainful activity in
    # Switzerland or abroad except managing one's own assets, so an Art. 28
    # retiree can never be the employee this task's verified claims describe;
    # their actual obligation (non-employed contributions, min. CHF 530/yr
    # until the reference retirement age, ch.ch) is covered by the dedicated
    # retirement-ahv-contributions task. Excluding retirement here prevents
    # showing a factually inapplicable task. KNOWN RESIDUAL GAP (reported,
    # out of verifier remit): non-working family-route spouses still see this
    # employee-framed task; its claims are true of employees but do not
    # describe a non-working spouse's liability (non-employed minimum, or
    # CHF 1,060 spouse-coverage exemption). Researcher follow-up recommended.
    appliesIf: "motivation != 'retirement'"

