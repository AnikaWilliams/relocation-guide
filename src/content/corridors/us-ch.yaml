      text: "Basic health insurance is compulsory for everyone resident in Switzerland and is not provided by your employer — you choose and contract your own insurer. Anyone settling in Switzerland must take out insurance within three months of taking up residence; if you do, cover is backdated to your arrival and earlier costs are reimbursed retrospectively."
      sourceUrl: "https://www.bag.admin.ch/en/health-insurance-requirement-to-obtain-insurance-for-persons-resident-in-switzerland"
      sourceName: "Federal Office of Public Health (FOPH) — Requirement to obtain insurance for persons resident in Switzerland"
      # VERIFIED 2026-06-12 (fact-verifier): FOPH page re-fetched (WebFetch, HTTP 200). Confirmed verbatim: "any person who is resident in Switzerland is required to obtain health insurance"; "Anyone settling in Switzerland must take out health insurance within three months after taking up residence"; "If insurance is obtained within the specified period, coverage takes effect from birth or from the beginning of residence in Switzerland. Any costs which may have been incurred since the starting date will be reimbursed retrospectively." The "not provided by your employer / you choose your own insurer" element is supported by "People are free to choose any authorised health insurer" and "Applications should be submitted directly to the health insurer of your choice." Fully supported; route-neutral.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    keyFacts:
      - label: "Who applies"
        text: "Each member of a family — adult or child — has to be individually insured; people are free to choose any authorised health insurer, and insurers must enrol all applicants without exclusions or a waiting period."
        sourceUrl: "https://www.bag.admin.ch/en/health-insurance-requirement-to-obtain-insurance-for-persons-resident-in-switzerland"
        sourceName: "Federal Office of Public Health (FOPH) — Requirement to obtain insurance for persons resident in Switzerland"
        # VERIFIED 2026-06-12 (fact-verifier): same FOPH page. Verbatim: "Each member of a family - adult or child - has to be individually insured."; "People are free to choose any authorised health insurer."; "Health insurers are obliged to enrol all applicants without any exclusions or waiting period, regardless of their age or state of health." All three elements supported word-for-word.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Deadline"
        text: "Anyone settling in Switzerland must take out health insurance within three months after taking up residence; if obtained within that period, coverage takes effect from the beginning of residence and costs incurred since then are reimbursed retrospectively."
        sourceUrl: "https://www.bag.admin.ch/en/health-insurance-requirement-to-obtain-insurance-for-persons-resident-in-switzerland"
        sourceName: "Federal Office of Public Health (FOPH) — Requirement to obtain insurance for persons resident in Switzerland"
        # VERIFIED 2026-06-12 (fact-verifier): same FOPH page. Verbatim: "Anyone settling in Switzerland must take out health insurance within three months after taking up residence" and "If insurance is obtained within the specified period, coverage takes effect from birth or from the beginning of residence in Switzerland. Any costs which may have been incurred since the starting date will be reimbursed retrospectively." Deadline and backdating both supported character-for-character. (Three months is a deadline, not a fee/quota figure — 90-day review window correct.)
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Where"
        text: "Applications should be submitted directly to the health insurer of your choice."
        sourceUrl: "https://www.bag.admin.ch/en/health-insurance-requirement-to-obtain-insurance-for-persons-resident-in-switzerland"
        sourceName: "Federal Office of Public Health (FOPH) — Requirement to obtain insurance for persons resident in Switzerland"
        # VERIFIED 2026-06-12 (fact-verifier): same FOPH page. Verbatim: "Applications should be submitted directly to the health insurer of your choice." Matches word-for-word.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Legal basis"
        text: "Any person who is resident in Switzerland is required to obtain health insurance — basic compulsory health insurance under the Federal Health Insurance Act (KVG/LAMal)."
        sourceUrl: "https://www.bag.admin.ch/en/health-insurance-requirement-to-obtain-insurance-for-persons-resident-in-switzerland"
        sourceName: "Federal Office of Public Health (FOPH) — Requirement to obtain insurance for persons resident in Switzerland"
        # VERIFIED 2026-06-12 (fact-verifier): same FOPH page confirms the statutory obligation verbatim: "any person who is resident in Switzerland is required to obtain health insurance". The page names KVG; LAMal is the official French short-title of the same Act (KVG = German short-title), so the dual abbreviation is correct and well-established; the load-bearing fact (residence-based compulsory-insurance obligation) is on the cited page. Supported. Route-neutral.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
    detail: >
      Switzerland's basic compulsory health insurance (KVG in German / LAMal in French) is
      not provided by the employer — you choose and contract your own insurer. The
      obligation applies to residents (including newly arrived third-country nationals).
      You must take out insurance within three months of taking up residence; if you do,
      cover is backdated to your arrival. Miss the deadline and cover only starts from
      enrolment, with a possible surcharge unless the delay is justified. Premiums vary by
      insurer, canton, age and chosen deductible.
    steps:
      - text: "Choose a recognised basic health insurer and a model/deductible, then enrol within three months of taking up residence."
        tip: "Insure promptly — within the three-month window cover is backdated to your arrival; miss it and you may face a surcharge and pay earlier medical costs yourself."
        links:
          - text: "FOPH — obligation to take out insurance and the three-month rule"
            sourceUrl: "https://www.bag.admin.ch/en/health-insurance-requirement-to-obtain-insurance-for-persons-resident-in-switzerland"
            sourceName: "Federal Office of Public Health (FOPH)"
            # VERIFIED 2026-06-09: same FOPH page; states the obligation and the three-month rule verbatim ("must take out health insurance within three months after taking up residence"). Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-09"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-07"
          - text: "Legal basis explained: the compulsory health-insurance obligation under the Federal Health Insurance Act (KVG/LAMal), as set out by the FOPH"
            sourceUrl: "https://www.bag.admin.ch/en/health-insurance-requirement-to-obtain-insurance-for-persons-resident-in-switzerland"
            sourceName: "Federal Office of Public Health (FOPH) — Requirement to obtain insurance for persons resident in Switzerland"
            # VERIFIED 2026-06-09 (fact-verifier): FOPH requirement page loaded (curl, browser UA, HTTP 200, title "Health insurance: Requirement to obtain insurance for persons resident in Switzerland"). Confirms the statutory obligation verbatim: "any person who is resident in Switzerland is required to obtain health insurance ... within three months after taking up residence." Page's Links/Legislation section references "compulsory health insurance (KVG)" and the KVV ordinance (CC 832.102). NOTE for researcher: this page names KVG but does not spell out "LAMal"; the obligation itself (the load-bearing fact) is on the page. Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-09"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-07"
    # documents migrated from legacy strings to ADR-0012 structured entries
    # 2026-06-12 (content-researcher), VERIFIED 2026-06-12 (fact-verifier). No
    # 'form' entry: enrolment is a private contract with a chosen insurer (no
    # single official federal form) — all items are 'provide'. Route-neutral.
    documents:
      - name: "Proof of Swiss residence (commune registration)"
        type: provide
        description: "Confirmation of your commune registration / Swiss residence, establishing that the compulsory-insurance obligation applies to you and from when."
      - name: "Valid US passport or residence permit card"
        type: provide
        description: "Your identity document (passport or residence permit card) for the insurer's enrolment."
      - name: "Date of taking up residence (arrival date)"
        type: provide
        description: "Your arrival/residence start date — it sets the three-month deadline and the date from which cover is backdated."
    timeline:
      text: "You must take out insurance within three months of taking up residence in Switzerland; within that window cover is backdated to your arrival date."
      sourceUrl: "https://www.bag.admin.ch/en/health-insurance-requirement-to-obtain-insurance-for-persons-resident-in-switzerland"
      sourceName: "Federal Office of Public Health (FOPH)"
      # VERIFIED 2026-06-09: FOPH page confirms "within three months after taking up residence" and that timely insurance "takes effect from ... the beginning of residence in Switzerland" with earlier costs "reimbursed retrospectively." Deadline matches character-for-character.
      status: VERIFIED
      lastVerified: "2026-06-09"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-07"
    cost:
      text: "Basic-insurance premiums are not fixed nationally: insurers set the premiums, premium levels vary within and between cantons and depend on your place of residence, and you can lower your premium by choosing a higher deductible or an alternative insurance model. Compare current premiums with the official FOPH premium calculator (priminfo) and confirm with insurers."
      sourceUrl: "https://www.bag.admin.ch/en/health-insurance-premiums-and-co-payment"
      sourceName: "Federal Office of Public Health (FOPH) — Health insurance: Premiums and co-payment"
      # VERIFIED 2026-06-09 (fact-verifier): FOPH "Premiums and co-payment" page loaded (curl, browser UA, HTTP 200, title "Health insurance: Premiums and co-payment"). Confirmed verbatim: "Insurers set the premiums paid by policyholders." and "Premium levels vary in accordance with differences in costs within cantons and depend on the policyholder's place of residence. Insurers may charge different premiums for different regions." Same page also confirms elective deductibles for adults (500, 1000, 1500, 2000, 2500 francs) and restricted-provider models (HMO, GP) yielding premium discounts -> supports "lower your premium by choosing a higher deductible or an alternative insurance model." All claim elements supported. Fee/premium claim -> 30-day review window.
      status: VERIFIED
      lastVerified: "2026-06-09"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-07-09"
    warning: >
      If you do not insure within three months, cover starts only from the date of
      enrolment, a premium surcharge may apply unless the delay is justified, and you may
