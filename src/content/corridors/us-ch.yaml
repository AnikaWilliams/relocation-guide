      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    # ADR-0012 distilled copy (tldr/keyFacts) + structured documents written
    # 2026-06-12 (writer applying VERIFIED two-agent content). NOTE: the
    # "Legal basis" keyFact from the draft was FLAGGED by the verifier
    # (source/claim mismatch — VZAE Art. 23-24 facts cited to FNIA Art. 27)
    # and is deliberately OMITTED here pending re-sourcing.
    tldr:
      text: "Foreign nationals may be admitted to Switzerland for study if the school confirms you are eligible, suitable accommodation and the required financial means are available, and you meet the personal and educational requirements (Art. 27 para. 1 FNIA). This is a discretionary admission decided by the canton — the law says you 'may be admitted', not that you are entitled, and US citizens are outside EU/EFTA free movement."
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_27"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 27 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): FNIA Art. 27 para. 1 confirmed verbatim on the Fedlex static filestore (EN in-force 2026-02-01), all four cumulative conditions present. Discretion framing exactly right and load-bearing ("may be admitted", not "are entitled"). "Decided by the canton" supported by the ch.ch text VERIFIED in this task's step link; "US citizens outside EU/EFTA free movement" is the corridor's verified baseline.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    keyFacts:
