  - id: family-permit-spouse-b-holder
    title: "Family reunification as the spouse or registered partner of a residence (B) permit holder"
    category: family-dependents
    appliesIf: "motivation == 'family' && familyJoineeStatus == 'permit-holder' && familyRelationship != 'unmarried-partner' && familyRelationship != 'parent'"
    summary:
      text: "The foreign spouse (and unmarried children under 18) of a person holding a residence permit (B permit) MAY be granted a residence permit — this is a discretionary decision, not an entitlement — if they live with the permit holder, suitable housing is available, they do not depend on social assistance, they are able to communicate in the national language spoken at the place of residence (registration for a language support programme suffices), and the person they are joining is not claiming (and would not become entitled to claim) supplementary benefits (Art. 44 FNIA). The provisions on foreign spouses apply mutatis mutandis to registered partnerships of same-sex couples (Art. 52 FNIA)."
      sourceUrl: "https://www.fedlex.admin.ch/eli/cc/2007/758/en#art_44"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 44 and 52 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01; anchor "art_44" present). Art. 44 para. 1 verbatim: "The foreign spouse and unmarried children under 18 of a person with a residence permit MAY BE GRANTED a residence permit or an extension thereof if: a. they live with the permit holder; b. suitable housing is available; c. they do not depend on social assistance; d. they are able to communicate in the national language spoken at their place of residence; and e. the family member they are joining is not claiming supplementary benefits according to the SBA or would not be entitled to claim such benefits due to family reunification." Para. 2 language-support-programme alternative verbatim. Art. 52 mutatis-mutandis confirmed. The entitlement-vs-discretion contrast is exactly right: Art. 42/43 say "are entitled", Art. 44 says "may be granted"; the discretion reading is independently confirmed by ch.ch verbatim ("Unlike the C permit, the B permit does not necessarily give you the right to family reunification, which may, however, also be granted by the authorities.").
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    detail: >
      This is the key legal difference from the Swiss-citizen and C-permit cases: Art. 42
      and Art. 43 FNIA create entitlements ("are entitled to be granted a residence
      permit"), whereas Art. 44 FNIA says the spouse and children of a B-permit holder
      "may be granted" a permit — the decision lies with the cantonal authorities. The
      official federal portal ch.ch puts it plainly: unlike the C permit, the B permit does
      not necessarily give the right to family reunification, which may, however, also be
      granted by the authorities. Once admitted under family reunification, the spouse and
      children of a B-permit holder may work, salaried or self-employed, anywhere in
      Switzerland (Art. 46 FNIA). The English text of the FNIA is provided for information
      only and has no legal force.
    steps:
      - text: "Understand that admission is discretionary: meeting the Art. 44 conditions makes reunification possible, not guaranteed. Discuss your case with the competent cantonal migration office before relocating."
        links:
          - text: "ch.ch — «Unlike the C permit, the B permit does not necessarily give you the right to family reunification, which may, however, also be granted by the authorities.»"
            sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
            sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): ch.ch page loaded (HTTP 200). The quoted sentence appears verbatim: "Unlike the C permit, the B permit does not necessarily give you the right to family reunification, which may, however, also be granted by the authorities." Quote matches character-for-character.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Check the conditions: living together, suitable housing, no dependence on social assistance, language (or enrolment in a language course), and no claim to supplementary benefits by the person you are joining."
        links:
          - text: "FNIA Art. 44 — spouses and children of persons with a residence permit (conditions a–e and the language-course alternative)"
            sourceUrl: "https://www.fedlex.admin.ch/eli/cc/2007/758/en#art_44"
            sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 44 — Fedlex"
            # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01). Art. 44 para. 1 letters a–e and para. 2 (register for a language support programme as alternative to letter d) confirmed verbatim. Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Apply via the cantonal immigration authority of the canton where your spouse or partner lives."
        links:
          - text: "SEM — addresses of the cantonal immigration and employment market authorities"
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/sem/kontakt/kantonale_behoerden/adressen_kantone_und.html"
            sourceName: "State Secretariat for Migration (SEM) — Cantonal immigration and employment market authorities"
            # VERIFIED 2026-06-12 (fact-verifier): SEM cantonal address directory loaded (HTTP 200, title "Cantonal immigration and employment market authorities"); per-canton migration-office entries present. Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
    documents:
      - "Valid US passport"
      - "Marriage certificate or registered-partnership certificate (certificate from the country of origin proving the relationship; ch.ch document list)"
      - "Certificate of enrolment in a language course if you cannot make yourself understood in the national language of the place of residence (A1 level at least orally)"
      - "Sponsor-side evidence as requested by the canton (accommodation, financial situation) — confirm the checklist with the cantonal migration office"
    # timeline omitted (ADR-0007): cantonal, discretionary procedure; no federal figure.
    # cost omitted (ADR-0007): cantonal permit fees; no federal figure.
    warning: >
      There is no entitlement in this constellation: the cantonal authorities decide at
      their discretion (Art. 44 FNIA: "may be granted"). Do not make irreversible
      relocation arrangements before the cantonal decision. Statutory time limits
      (Art. 47 FNIA: five years; twelve months for children over 12) still apply.
    dependsOn: []

