    # (SR 142.201) Art. 10 (no official EN translation exists, so the DE/FR
    # consolidation is cited). All new claims UNVERIFIED pending fact-verifier.
    # Route-neutral: no claim presumes employment; OASA Art. 10's 14 days is
    # stated for the residence case and the duty applies to all permit-holders.
    tldr:
      text: "Once you arrive in Switzerland you must register your arrival in person at the residents' registration office of your commune of residence — this is what formally starts your residence and triggers your residence permit. You have to do this within the time limit set under federal law (commonly 14 days of arrival); confirm the exact deadline with your commune, as the procedure is run at cantonal/communal level."
      # Citable canonical URL (anchor art_12). Verifier reads the text from the
      # Fedlex filestore EN HTML: .../eli/cc/2007/758/20260201/en/html/...html
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_12"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 12 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): FNIA Art. 12 read from the Fedlex
      # filestore static EN consolidated HTML (eli/cc/2007/758/20260201/en, the
      # in-force EN version per Fedlex SPARQL). Art. 12 titled "Registration
      # requirement"; para. 1 verbatim: "Foreign nationals who require a short
      # stay, residence or settlement permit, must register with the competent
      # authority at their place of residence in Switzerland before the expiry of
      # the period of stay not requiring a permit or before they take up
      # employment."; para. 3 verbatim: "The Federal Council shall determine the
      # time limits for registration." Confirmed Art. 12 does NOT itself state
      # "14 days" — it delegates the limit, which the ordinance (OASA Art. 10)
      # sets; the tldr's "commonly 14 days" is correctly hedged and not
      # misattributed to Art. 12. FIGURE present (14 days) -> 30-day window.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-07-12"
    keyFacts:
      - label: "Who applies"
        text: "Foreign nationals who require a short stay, residence or settlement permit must register with the competent authority at their place of residence in Switzerland — so US (third-country) nationals on any route (work, family, study, retirement) must register their arrival."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_12"
        sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 12 — Fedlex, the official publication platform of Swiss law"
        # VERIFIED 2026-06-12 (fact-verifier): FNIA Art. 12 para. 1 verbatim on the
        # Fedlex filestore EN HTML (eli/cc/2007/758/20260201/en): "Foreign
        # nationals who require a short stay, residence or settlement permit, must
        # register with the competent authority at their place of residence in
        # Switzerland before the expiry of the period of stay not requiring a
        # permit or before they take up employment." Route-neutral: the duty
        # binds all such permit-holders ("before ... or before they take up
        # employment"), not only employees, so the "any route" gloss is accurate.
        # No FIGURE in this text -> 90-day window.
