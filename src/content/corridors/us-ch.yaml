      reviewBy: "2026-09-07"
    detail: >
      The OASI/AHV/AVS number (beginning 756) is assigned to everyone living or working in
      Switzerland and is valid for life. As an employee you normally do not deal with OASI
      yourself: your employer deducts your OASI contributions from your gross salary and pays
      them, together with the employer's matching share, to its compensation office
      (Ausgleichskasse / caisse de compensation). If you do not already hold an OASI number
      when you start work, ask your cantonal compensation office how it is issued. You can
      ask your employer for your OASI number once you have one.
    steps:
      - text: "Once you start employment, your employer deducts your OASI contributions and pays them to its compensation office (Ausgleichskasse / caisse de compensation); if you do not yet have an OASI number, the compensation office is the body that handles it — confirm the procedure with them."
