    # timeline omitted (ADR-0007): hardship-based cantonal discretion; no official
    # federal processing-time figure exists for Art. 30 para. 1 let. b cases.
    # cost omitted (ADR-0007): cantonal fees; no official federal fee figure exists.
    warning: >
      Do not relocate on the assumption that a cohabiting-partner permit will be granted.
