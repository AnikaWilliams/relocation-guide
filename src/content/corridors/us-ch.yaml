        # para. 1 (verbatim, see above). Route-neutral: the "Work allowed" label
        # carries the employment-income rate for the employee-framed task
        # (appliesIf: motivation != 'retirement'); non-working residents' rate is
        # the separate retirement-ahv-contributions task.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-07-12"
    detail: >
      The OASI/AHV/AVS number (beginning 756) is assigned to everyone living or working in
      Switzerland and is valid for life. As an employee you normally do not deal with OASI
      yourself: your employer deducts your OASI contributions from your gross salary and pays
      them, together with the employer's matching share, to its compensation office
      (Ausgleichskasse / caisse de compensation). If you do not already hold an OASI number
      when you start work, ask your cantonal compensation office how it is issued. You can
      ask your employer for your OASI number once you have one.
    steps:
      - text: "Once you start employment, your employer deducts your OASI contributions and pays them to its compensation office (Ausgleichskasse / caisse de compensation); if you do not yet have an OASI number, the compensation office is the body that handles it — confirm the procedure with them."
        tip: "If you need the number, ask your employer or your cantonal compensation office; an OASI card can also be requested."
        links:
          - text: "ch.ch — requesting an OASI card"
            sourceUrl: "https://www.ch.ch/en/documents-and-register-extracts/requesting-an-oasi-card/"
            sourceName: "ch.ch — Requesting an OASI card (official federal portal)"
            # VERIFIED 2026-06-09: server-rendered HTML (curl, HTTP 200) is the OASI-card page; lead reads "If you do not have an OASI card or if you have lost yours, you can request one by filling out the online form and sending it to the competent authority. The OASI card ceased to be compulsory in 2016..." Link text ("requesting an OASI card") accurate. (EN page falls back to a German <title> "Den AHV-Ausweis bestellen" = "Order the AHV card"; body content is English.)
            status: VERIFIED
            lastVerified: "2026-06-09"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-07"
