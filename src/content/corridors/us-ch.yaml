        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Legal basis"
        text: "Registration requirement: FNIA (Foreign Nationals and Integration Act, SR 142.20) Art. 12; the time limit for registration is set by the Federal Council in the implementing ordinance OASA/VZAE (SR 142.201) Art. 10."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_12"
        sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 12 — Fedlex, the official publication platform of Swiss law"
        # VERIFIED 2026-06-12 (fact-verifier): FNIA Art. 12 confirmed titled
        # "Registration requirement" on the Fedlex filestore EN HTML; para. 3
        # verbatim "The Federal Council shall determine the time limits for
