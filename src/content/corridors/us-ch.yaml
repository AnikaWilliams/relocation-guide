        description: "The application filed with the cantonal migration authority of the canton where your B-permit-holder spouse/partner lives; the canton issues the current form and checklist and decides at its discretion. Vaud is the worked example here."
        form:
          text: "The application is filed with, and the current form and checklist issued by, the competent cantonal authority, which decides at its discretion (Art. 44 FNIA: 'may be granted'). Vaud worked example: the Canton de Vaud Service de la population (SPOP) \"Regroupement familial ... auprès d'un étranger titulaire d'un permis de séjour B, d'établissement C ou de courte durée L\" page sets out the competent authority (SPOP), the legal basis (Art. 44 and 45 LEI) and the documents to provide; there is no single named federal family-reunification PDF, so we link the SPOP authority page rather than a deep PDF. For other cantons, find the competent office via the SEM directory of cantonal immigration and employment-market authorities."
          sourceUrl: "https://www.vd.ch/population/population-etrangere/entree-et-sejour/etats-tiers/regroupement-familial-du-conjoint-partenaire-et/ou-des-enfants-aupres-dun-etranger-titulaire-dun-permis-de-sejour-b-detablissement-c-ou-de-courte-duree-l"
          sourceName: "Canton de Vaud — Service de la population (SPOP), Regroupement familial auprès d'un étranger titulaire d'un permis B, C ou L"
          # VERIFIED 2026-06-12 (fact-verifier): confirmed this session — Vaud SPOP B/C/L page = competent-authority page, cites Art. 44/45 LEI, sets out documents; correctly notes the canton "decides at its discretion (Art. 44 FNIA: may be granted)"; no dedicated federal PDF; Formule 1350 is gainful-activity-only. Authority page linked (not a deep PDF) — correct.
          status: VERIFIED
          lastVerified: "2026-06-12"
          verifiedBy: "fact-verifier"
          reviewBy: "2026-09-10"
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport (a copy of the passport, and of any visa, is on the cantonal document list)."
      - name: "Marriage or registered-partnership certificate"
        type: provide
        description: "The certificate proving your marriage or registered partnership with the B-permit holder; the marriage or partnership must be recognised by Switzerland."
      - name: "Certificate of enrolment in a language course (if you cannot yet communicate in the local national language)"
        type: provide
        description: "Proof of registration for a language support programme satisfies the language condition for the residence permit (Art. 44 para. 2 FNIA; ch.ch lists A1 level at least orally); conditional — only needed if you do not already meet the language requirement."
      - name: "Sponsor-side evidence of suitable housing and that the sponsor is not on social assistance / not claiming supplementary benefits"
        type: provide
        description: "Evidence supporting the Art. 44 conditions (suitable housing; no dependence on social assistance; sponsor not claiming supplementary benefits); the Vaud worked example also requests a financial-means justification."
      - name: "Confirm the full cantonal document checklist with the competent cantonal migration office"
        type: provide
        description: "Because this admission is discretionary and cantonal, confirm the exact requirements and the canton's position with the cantonal migration authority before making relocation arrangements."
    # timeline omitted (ADR-0007): cantonal, discretionary procedure; no federal figure.
    # cost omitted (ADR-0007): cantonal permit fees; no federal figure.
    warning: >
