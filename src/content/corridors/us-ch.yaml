    documents:
      - name: "Written enquiry to the cantonal migration authority"
        type: provide
        description: "There is no federal cohabiting-partner application form or checklist. Submit your case in writing to the competent cantonal migration authority — found via the SEM directory of cantonal immigration and employment-market authorities (linked in the steps above) — which decides at its discretion (Art. 30 para. 1 let. b FNIA), and obtain any procedure or form directly from that authority."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport (your travel and identity document)."
      - name: "Evidence of a stable long-term relationship, if the canton agrees to consider the case"
        type: provide
