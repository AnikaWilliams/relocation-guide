    # (content-researcher, SEPARATE pass). These were FLAGGED in the prior run
    # because the cited ch.ch page served a datacenter-IP 404 to the WebFetch
    # verifier. This pass re-sources the load-bearing facts to the underlying
    # FEDERAL LAW via Fedlex (reachable through the static consolidated HTML on
    # the fedlex.data.admin.ch filestore) so the verifier does not depend on
