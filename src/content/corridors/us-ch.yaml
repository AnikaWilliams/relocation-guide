      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    keyFacts:
      - label: "Who applies"
        text: "Third-state nationals (including third-state-national family members of Swiss citizens) receive a biometric residence permit."
        sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/aufenthalt/biometr_auslaenderausweis.html"
        sourceName: "State Secretariat for Migration (SEM) — Biometric residence permits for foreign nationals"
        # VERIFIED 2026-06-12 (fact-verifier): same SEM biometric-permits page. The page lists "Third-state nationals" AND "Third-state nationals who are family members of Swiss citizens" (and EU/EFTA family members) as recipients. Claim supported verbatim.
