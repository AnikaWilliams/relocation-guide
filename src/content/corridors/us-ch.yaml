            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
          - text: "SEM — National (type D) visa application form (for long-term stays of more than three months in Switzerland subject to authorisation)"
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/einreise/visumantragsformular.html"
            sourceName: "State Secretariat for Migration (SEM) — Visa Application Form"
            # VERIFIED 2026-06-12 (fact-verifier): SEM Visa Application Form page loaded (curl, browser UA, HTTP 200, title "Visa Application Form"). Verbatim: "National (type D) visa application form" with description "For long-term stays (more than three months) in Switzerland subject to authorization (e.g. gainful employment, familiy reunification)." (source's own typo "familiy"). Framing checked and ACCEPTED: the link text claims only "long-term stays of more than three months subject to authorisation" — it does not assert education is named in the page's "e.g." list; that list is expressly non-exhaustive, an Art. 27 stay is a stay subject to authorisation, and the Entry FAQ (verified this run) names education as a category D purpose. Same accepted framing as the verified retirement-d-visa link.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Submit the visa application together with the study supporting documents required by the representation and the canton (admission confirmation, reference to the cantonal Art. 27 application or authorisation)."
        tip: "Check the specific representation's instructions for how to submit (by post or appointment) and the exact document checklist."
