        description: "Proof of registration for a language support programme satisfies the language condition for the residence permit (Art. 43 para. 2 FNIA; ch.ch lists A1 level at least orally); conditional — only needed if you do not already meet the language requirement."
      - name: "Sponsor-side evidence of accommodation and that the sponsor is not on social assistance / not claiming supplementary benefits"
        type: provide
