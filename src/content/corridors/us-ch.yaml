    # across all routes; route-neutral (no employment presumed).
    tldr:
      text: "As a third-country national you receive a biometric residence permit card — the physical proof of your right to live in Switzerland. The application procedure and issuance are decided by your canton of residence, which captures your biometric data (two digital fingerprints and a facial image) for the card's microchip."
      sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/aufenthalt/biometr_auslaenderausweis.html"
      sourceName: "State Secretariat for Migration (SEM) — Biometric residence permits for foreign nationals"
