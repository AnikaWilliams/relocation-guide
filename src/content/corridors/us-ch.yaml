  # ---------------------------------------------------------------------------
  - id: retirement-ahv-contributions
    title: "Clarify your OASI (AHV/AVS) contribution obligation as a non-employed resident"
    category: registration-bureaucracy
    # appliesIf APPROVED 2026-06-12 (fact-verifier, ADR-0009 §4): correct.
    # An Art. 28 retiree may not work (VZAE Art. 25 para. 3, verified this
    # run), so only the non-employed OASI rules on this task's cited ch.ch
    # page can apply to them. Pairs with the approved exclusion rule on
    # ahv-social-security.
    appliesIf: "motivation == 'retirement'"
    # This task exists because the shared ahv-social-security task is
    # employee-framed (employer deducts contributions) and does not cover the
    # contribution obligation of residents who do NOT work — the known gap
    # flagged on the family route. Retirees admitted under Art. 28 FNIA may
    # not work at all, so the non-employed rules are the only ones that can
    # apply to them.
    summary:
      text: "All persons living or working in Switzerland must pay OASI (old-age and survivors' insurance, AHV/AVS) contributions from 1 January following their 20th birthday until the reference retirement age — including residents who are not working. If you are not working, you must pay an OASI contribution of at least CHF 530 per year; the exact amount depends on your situation. If you take up residence in Switzerland before reaching the reference retirement age, contact the OASI compensation office (Ausgleichskasse / caisse de compensation) of your canton of residence to clarify your liability."
      sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
      sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
      # VERIFIED 2026-06-12 (fact-verifier): ch.ch "Paying OASI contributions in Switzerland" page loaded (curl, browser UA, HTTP 200, title matches; SPA, server-rendered HTML read directly). Verbatim: "All persons living or working in Switzerland must pay OASI contributions from 1 January following their 20th birthday until retirement age."; the page's own lead sentence verbatim: "you are obliged to pay OASI contributions until the reference retirement age in order to secure an old-age pension" — the claim's "reference retirement age" is the page's own lead term for the same threshold. Under the heading "If you are not working": "you must pay a OASI contribution of minimum CHF 530 per year (depending on your situation)" — CHF 530 matches character-for-character. "Including residents who are not working" is supported by "living or working" + the not-working section. Closing compensation-office sentence is an honest pointer, supported by the page's "Contact your local OASI office for more information" (linking to the cantonal compensation offices on ahv-iv.ch). The "(AHV/AVS)" naming gloss is standard official terminology not spelled out on this EN page (same accepted pattern as the VERIFIED ahv-social-security summary). Contribution amount (CHF 530) -> 30-day review window.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-07-12"
    # ADR-0012 distilled copy (tldr/keyFacts) drafted 2026-06-12
    # (content-researcher); independently VERIFIED 2026-06-12 (fact-verifier).
    tldr:
      text: "Switzerland's first-pillar old-age insurance (OASI; AHV in German, AVS in French) is contribution-based for everyone living in Switzerland, not only for workers — so as a resident retiree below the reference retirement age you owe contributions even with no Swiss income. If you are not working the contribution is at least CHF 530 per year (the exact amount depends on your situation), and you should contact the OASI compensation office (Ausgleichskasse / caisse de compensation) of your canton of residence to clarify your liability."
      sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
      sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
      # VERIFIED 2026-06-12 (fact-verifier): ch.ch "Paying OASI contributions" page corroborated. "All persons living or working in Switzerland must pay OASI contributions from 1 January following their 20th birthday until retirement age"; under not-working, minimum "CHF 530 per year (depending on your situation)". The draft's "at least CHF 530 per year" and "contact the OASI compensation office (Ausgleichskasse / caisse de compensation) of your canton of residence" are supported (the page directs users to contact their local OASI office). The (AHV/AVS) naming gloss is standard official terminology. CHF 530 is a contribution FIGURE — 30-day review window applied.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-07-12"
    keyFacts:
      - label: "Who applies"
        text: "All persons living or working in Switzerland must pay OASI contributions, including residents who are not working; the obligation runs from 1 January following your 20th birthday until the reference retirement age."
        sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
        sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
        # VERIFIED 2026-06-12 (fact-verifier): ch.ch verbatim "All persons living or working in Switzerland must pay OASI contributions from 1 January following their 20th birthday until retirement age." The draft's inclusion of residents who are not working is supported by the page's separate "If you are not working" section. Obligation runs from 1 Jan following the 20th birthday until the reference retirement age — matches. No numeric age asserted (ADR-0007 honored). No fee figure in this keyFact -> 90-day window.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Where"
        text: "The OASI compensation office (Ausgleichskasse / caisse de compensation) of your canton of residence assesses and collects non-employed contributions; contact it after registering at your commune to clarify your liability, because no employer handles it for you on this route."
        sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
        sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
        # VERIFIED 2026-06-12 (fact-verifier): the cantonal OASI compensation office (Ausgleichskasse / caisse de compensation) as the body that assesses and collects non-employed contributions is supported by the ch.ch page's "contact your local OASI office" pointer (links to the cantonal compensation offices). The draft correctly notes no employer handles it on this route — consistent with the verified Art. 28 work ban (VZAE Art. 25 para. 3). Honest pointer; no figure asserted.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Work allowed"
        text: "Not on this permit: an Art. 28 retiree may not work, so only the non-employed OASI rules apply — and the contribution obligation as a non-employed person ends at the reference retirement age (it continues past that age only for people who remain gainfully employed)."
        sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
        sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
        # VERIFIED 2026-06-12 (fact-verifier): two grounded elements. (1) Art. 28 retiree may not work: VZAE Art. 25 para. 3 DE confirmed (Fedlex filestore, in-force 2026-06-12) — no gainful activity in Switzerland or abroad except managing own assets. (2) Non-employed obligation ends at the reference retirement age and continues past it only for the gainfully employed: ch.ch verbatim "...until retirement age. ... continues after retirement age if you remain gainfully employed" / "If you continue working after retirement age, you must continue to pay OASI contributions." Both halves supported.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Deadline"
        text: "Contact the cantonal compensation office promptly after arrival/commune registration: the obligation arises from residence (not from a payslip), so below the reference retirement age residence alone makes you liable for non-employed contributions assessed on your circumstances."
        sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
        sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
        # VERIFIED 2026-06-12 (fact-verifier): no fixed numeric deadline asserted; liability arises from residence (not a payslip) below the reference retirement age and advises contacting the cantonal compensation office promptly after arrival/commune registration. Consistent with the ch.ch "living or working in Switzerland must pay" basis and the page's contact-your-OASI-office pointer. Correctly hedged, no invented figure (ADR-0007) -> 90-day window.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
    detail: >
      Switzerland's first-pillar old-age insurance is contribution-based for residents,
      not only for workers: simply living in Switzerland below the reference retirement
      age creates a contribution obligation, even with no Swiss income. A US retiree
      admitted at 55 under Art. 28 FNIA can therefore owe non-employed OASI contributions
      for years before reaching the Swiss reference retirement age. The minimum is
      CHF 530 per year and the actual amount depends on your situation; the cantonal
      compensation office assesses and collects it. If your spouse or registered partner
      works and pays at least twice the minimum annual contribution, you may owe nothing
      yourself. Missing contribution years can also reduce any later Swiss pension
      entitlement. Ask the compensation office how your liability is assessed in your
      specific case, including whether any international social-security agreement is
      relevant to you.
    steps:
      - text: "After registering at your commune, contact the OASI compensation office (Ausgleichskasse / caisse de compensation) of your canton of residence and ask how your contribution liability as a non-employed resident is assessed."
        tip: "Do this proactively — the obligation arises from residence, not from a payslip, so no employer will handle it for you on this route."
        links:
          - text: "ch.ch — if you are not working you must pay an OASI contribution of minimum CHF 530 per year (depending on your situation); contributions can be calculated online at the Federal Social Insurance Office's website"
            sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
            sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): same ch.ch page (HTTP 200). Both elements verbatim: "you must pay a OASI contribution of minimum CHF 530 per year (depending on your situation)" and "You can calculate your contributions online (webpage available in German, French and Italian) at the Federal Social Insurance Office's website." Contribution amount (CHF 530) -> 30-day review window.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-07-12"
      - text: "If your spouse or registered partner lives with you and works in Switzerland: check whether their contributions cover you. If you are not working but your spouse or partner (in a registered partnership) is working and pays at least twice the minimum annual contribution (CHF 530 × 2 = CHF 1,060), you are not required to pay anything."
        links:
          - text: "ch.ch — non-working spouse/registered partner owes nothing if the working partner pays at least twice the minimum annual contribution (CHF 1,060)"
            sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
            sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): same ch.ch page (HTTP 200). Verbatim: "Please note: if you are not working, but your spouse or partner (in the case of a registered partnership) is working and pays at least twice the minimum annual contribution (CHF 530 x 2 = CHF 1,060), you are not required to pay anything." CHF 1,060 and the 2x-coverage mechanics match character-for-character. Contribution amount -> 30-day review window.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-07-12"
      - text: "Once you reach the reference retirement age, the contribution obligation as a non-employed person ends; contributions continue beyond that age only for people who remain gainfully employed (which this permit does not allow)."
        links:
          - text: "ch.ch — the OASI contribution obligation runs until the reference retirement age and continues after it only if you remain gainfully employed"
            sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
            sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): same ch.ch page (HTTP 200). Verbatim: "All persons living or working in Switzerland must pay OASI contributions from 1 January following their 20th birthday until retirement age. This obligation begins at age 17 if you are already working and continues after retirement age if you remain gainfully employed."; also "If you continue working after retirement age, you must continue to pay OASI contributions." The page's lead uses "reference retirement age" for the same threshold, supporting the claim's terminology. No numeric age asserted — correct (ADR-0007). The parenthetical "(which this permit does not allow)" rests on VZAE Art. 25 para. 3, verified this run against the consolidation in force 2026-06-12.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
