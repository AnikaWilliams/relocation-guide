      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html-3.html#art_44"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 44 and 52 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01; anchor "art_44" present). Art. 44 para. 1 verbatim: "The foreign spouse and unmarried children under 18 of a person with a residence permit MAY BE GRANTED a residence permit or an extension thereof if: a. they live with the permit holder; b. suitable housing is available; c. they do not depend on social assistance; d. they are able to communicate in the national language spoken at their place of residence; and e. the family member they are joining is not claiming supplementary benefits according to the SBA or would not be entitled to claim such benefits due to family reunification." Para. 2 language-support-programme alternative verbatim. Art. 52 mutatis-mutandis confirmed. The entitlement-vs-discretion contrast is exactly right: Art. 42/43 say "are entitled", Art. 44 says "may be granted"; the discretion reading is independently confirmed by ch.ch verbatim ("Unlike the C permit, the B permit does not necessarily give you the right to family reunification, which may, however, also be granted by the authorities.").
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
