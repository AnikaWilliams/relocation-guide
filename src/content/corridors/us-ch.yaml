  - id: family-permit-unmarried-partner
    title: "Joining an unmarried partner (concubinage): no general right — cantonal discretion"
    category: family-dependents
    appliesIf: "motivation == 'family' && familyRelationship == 'unmarried-partner'"
    summary:
      text: "Swiss law gives unmarried (cohabiting) partners no general right to family reunification: the FNIA reunification provisions cover spouses, registered partners and unmarried children under 18, and the official federal portal states that in a bi-national couple you cannot bring your partner with you if you are not officially married. A residence permit for a cohabiting partner is possible only as a discretionary derogation from the admission requirements in serious cases of personal hardship (Art. 30 para. 1 let. b FNIA; Art. 50 para. 4 FNIA refers to cohabiting partners granted a permit on this basis), decided by the cantonal migration authority."
      sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
      sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
      # VERIFIED 2026-06-12 (fact-verifier): ch.ch page loaded (HTTP 200). Confirms verbatim: "If you are part of a bi-national couple, you cannot bring your partner with you if you are not officially married." and, for third-country citizens, the eligible list is "your spouse or registered partner; your unmarried children under the age of 18" — i.e. no general reunification right for cohabiting partners. The statutory elements are confirmed on the official Fedlex FNIA text (cited as links in this task and read this run from the Fedlex filestore, in-force 2026-02-01): Art. 30 para. 1 let. b verbatim ("take account of serious cases of personal hardship or important public interests") and Art. 50 para. 4 verbatim ("apply mutatis mutandis to cohabiting partners who have been granted a residence permit to remain with their cohabitee in accordance with Article 30 paragraph 1 letter b because of serious personal hardship"). "Only" is correctly scoped to partner-based admission; "decided by the cantonal migration authority" is supported by ch.ch ("You need to contact the following cantonal immigration authorities").
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    detail: >
      This is the honest position: there is no concubinage "track" you can simply apply
      for. Family reunification under Arts. 42-44 FNIA requires a marriage or a registered
      partnership recognised by Switzerland. For unmarried couples, the only opening in
      the Act is Art. 30 para. 1 let. b FNIA, which permits derogations from the admission
      requirements "to take account of serious cases of personal hardship or important
      public interests"; Art. 50 para. 4 FNIA confirms that cohabiting partners can be
      granted a residence permit on that basis. Whether a canton grants such a permit, and
      on what evidence (e.g. proof of a stable long-term relationship), is decided case by
      case by the cantonal migration authority — there is no federal entitlement, no
      federal checklist and no published federal criteria threshold. The authority to
      contact is the migration office of the canton where your partner lives. Note also
      that Swiss law otherwise treats cohabiting partners as two single individuals. The
      English text of the FNIA is provided for information only and has no legal force.
    steps:
      - text: "Before making any relocation plans, contact the migration office of the canton where your partner lives and ask whether, and under what conditions, a residence permit for a cohabiting partner can be considered in your case."
        tip: "Put the question in writing and keep the answer: cantonal practice differs and the decision is discretionary."
        links:
          - text: "SEM — addresses of the cantonal immigration and employment market authorities (the competent authorities for such requests)"
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/sem/kontakt/kantonale_behoerden/adressen_kantone_und.html"
            sourceName: "State Secretariat for Migration (SEM) — Cantonal immigration and employment market authorities"
            # VERIFIED 2026-06-12 (fact-verifier): SEM cantonal address directory loaded (HTTP 200, title matches); per-canton migration-office entries present. Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Know the legal basis being applied: a permit for a cohabiting partner is a hardship-based derogation under Art. 30 para. 1 let. b FNIA, not family reunification under Arts. 42-44."
        links:
          - text: "FNIA Art. 30 para. 1 let. b — derogations from the admission requirements to take account of serious cases of personal hardship"
            sourceUrl: "https://www.fedlex.admin.ch/eli/cc/2007/758/en#art_30"
            sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 30 — Fedlex"
            # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01; anchor "art_30" present). Art. 30 para. 1 verbatim: "Derogations from the admission requirements (Art. 18-29) are permitted in order to: ... b. take account of serious cases of personal hardship or important public interests". Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
          - text: "FNIA Art. 50 para. 4 — refers to cohabiting partners granted a residence permit in accordance with Art. 30 para. 1 let. b because of serious personal hardship"
            sourceUrl: "https://www.fedlex.admin.ch/eli/cc/2007/758/en#art_50"
            sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 50 — Fedlex"
            # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01; anchor "art_50" present). Art. 50 para. 4 verbatim: "Paragraphs 1-3 apply mutatis mutandis to cohabiting partners who have been granted a residence permit to remain with their cohabitee in accordance with Article 30 paragraph 1 letter b because of serious personal hardship." (Para. 4 inserted by FA of 14 June 2024, in force since 1 Jan. 2025.) Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "If you marry or your partnership becomes one recognised by Switzerland, the spouse / registered-partner provisions (Arts. 42-44 FNIA) apply instead — see the corresponding task for your partner's status."
        links:
          - text: "ch.ch — family reunification requires a marriage or registered partnership recognised by Switzerland"
            sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
            sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): ch.ch page loaded (HTTP 200). Verbatim: "Your marriage or a registered partnership must be recognised by Switzerland." and "you cannot bring your partner with you if you are not officially married." Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
    documents:
      - "There is no federal document checklist for cohabiting partners — confirm the required evidence (e.g. proof of a stable long-term relationship, joint household) directly with the cantonal migration authority"
      - "Valid US passport"
    # timeline omitted (ADR-0007): hardship-based cantonal discretion; no official
    # federal processing-time figure exists for Art. 30 para. 1 let. b cases.
    # cost omitted (ADR-0007): cantonal fees; no official federal fee figure exists.
    warning: >
      Do not relocate on the assumption that a cohabiting-partner permit will be granted.
      There is no legal entitlement; the cantonal decision is discretionary and may be
      negative. Obtain the canton's position in writing first.
    dependsOn: []

  # ---------------------------------------------------------------------------
  - id: family-permit-children
    title: "Family reunification for minor children"
    category: family-dependents
    # Deliberately motivation-independent: children also accompany work-route
    # users. Pure-|| rule (no parentheses needed, ADR-0009 grammar): applies if
    # the user is bringing children OR is themselves joining a parent/child
    # (the intake's 'parent' relationship option covers both directions).
    # appliesIf APPROVED 2026-06-12 (fact-verifier, ADR-0009 §4): motivation-
    # independence is legally correct — a work-route B-permit holder's children
    # are admitted via Art. 44 FNIA family reunification (verified this run),
    # so this task must also reach work-route users with hasChildren == true.
    # Routing familyRelationship == 'parent' here is acceptable because the
    # task's detail honestly states that adult-child/parent constellations fall
    # outside the Art. 42-44 minor-children scope (supported by ch.ch).
    appliesIf: "hasChildren == true || familyRelationship == 'parent'"
    summary:
      text: "Unmarried children under 18 qualify for family reunification: children of a Swiss citizen who live with them are entitled to a residence permit (Art. 42 para. 1 FNIA), children of a settlement (C) permit holder are entitled to one subject to the Art. 43 conditions, and children of a residence (B) permit holder may be granted one at the authorities' discretion (Art. 44). Children under 12 of a Swiss citizen or of a C-permit holder are entitled to a settlement permit directly (Art. 42 para. 4 and Art. 43 para. 6). The language requirement does not apply to unmarried children under 18 (Art. 43 para. 3 and Art. 44 para. 3)."
      sourceUrl: "https://www.fedlex.admin.ch/eli/cc/2007/758/en#art_42"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 42-44 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01; one document covers Arts. 42-44, anchor "art_42" present). Each element verbatim: Art. 42 para. 1 "unmarried children under 18 of a Swiss national who live with the Swiss national are entitled to be granted a residence permit"; Art. 43 para. 1 children of settlement-permit holders "are entitled ... provided" conditions a-e; Art. 44 para. 1 children of residence-permit holders "may be granted"; Art. 42 para. 4 and Art. 43 para. 6 identically "Children under twelve are entitled to be granted a settlement permit."; Art. 43 para. 3 and Art. 44 para. 3 — the para. 1 let. d language requirement "does not apply" to unmarried children under 18. All ages, article/paragraph numbers and entitlement-vs-discretion language match character-for-character.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    detail: >
      Children's claims track the status of the parent in Switzerland, with the same
      entitlement-versus-discretion split as for spouses. Two age thresholds matter:
      reunification covers unmarried children under 18, and children under 12 of a Swiss
      citizen or C-permit holder receive a settlement permit directly. Timing is stricter
      for older children: the right must be exercised within five years, but children over
      12 must be reunified within twelve months (Art. 47 FNIA) — ch.ch explains this is so
      they can integrate more rapidly. If you are an adult intending to join a parent in
      Switzerland (or a parent intending to join an adult child), be aware that the FNIA
      reunification provisions for third-country nationals cover spouses, registered
      partners and unmarried children under 18 only; ch.ch states that a Swiss citizen's
      dependent parents (and children up to 21) can join only if they already hold a
      residence permit from an EU/EFTA country. For any case outside the
      minor-children scope, confirm options with the cantonal migration authority. The
      English text of the FNIA is provided for information only and has no legal force.
    steps:
      - text: "Include the children in the family-reunification application to the cantonal immigration authority, with documents proving the parent-child relationship."
        links:
          - text: "ch.ch — third-country nationals may bring their spouse or registered partner and their unmarried children under the age of 18"
            sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
            sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): ch.ch page loaded (HTTP 200). Verbatim under "If you are a citizen from a third country": "You may bring the following family members to Switzerland: your spouse or registered partner; your unmarried children under the age of 18." Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Mind the deadlines: five years in general, but children over 12 must be reunified within twelve months."
        links:
          - text: "FNIA Art. 47 — time limit for family reunification; subsequent reunification only for important family reasons; children over 14 are consulted if necessary"
            sourceUrl: "https://www.fedlex.admin.ch/eli/cc/2007/758/en#art_47"
            sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 47 — Fedlex"
            # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01; anchor "art_47" present). Art. 47 para. 1 verbatim ("within five years. Children over twelve must be reunified with their family within twelve months."); para. 4 verbatim: "A subsequent family reunification shall be authorised only if there are important family reasons therefor. If necessary, children over 14 shall be consulted on family reunification." All three elements of the link text match.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Plan for school: children who join you in Switzerland are required to attend free compulsory schooling at least until the age of 16; the system varies from canton to canton."
        links:
          - text: "ch.ch — children who join you are required to attend free compulsory schooling in Switzerland at least until the age of 16"
            sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
            sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): ch.ch page loaded (HTTP 200). Verbatim: "Children who join you in Switzerland are required to attend free compulsory schooling in Switzerland at least until the age of 16. The system varies from canton to canton." Step text and link text match character-for-character.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
    documents:
      - "Children's valid US passports"
      - "Birth certificates (certificates from the country of origin proving the relationship; ch.ch document list)"
      - "For dependants: certificate from the authorities of the country of origin proving dependence or shared household (ch.ch document list)"
      - "Custody/consent documentation where only one parent relocates — confirm requirements with the cantonal migration office"
    # timeline omitted (ADR-0007): cantonal processing; no federal figure. (The
    # statutory five-year / twelve-month deadlines are claims in summary/steps,
    # not a processing-time estimate.)
    # cost omitted (ADR-0007): cantonal permit fees; no federal figure.
    warning: >
      Children over 12 must be reunified within twelve months (Art. 47 FNIA). A subsequent
      (late) reunification is authorised only if there are important family reasons.
    dependsOn: []

  # ---------------------------------------------------------------------------
  - id: family-d-visa
    title: "Apply for the national (type D) visa for family reunification at the Swiss representation in the USA"
    category: visa-permit
    appliesIf: "motivation == 'family'"
    summary:
      text: "A category D (national) visa is issued for stays exceeding 90 days. SEM's national (type D) visa application form is expressly for long-term stays subject to authorisation, citing family reunification as an example purpose. You apply in writing using the national visa application form at the Swiss representation abroad responsible for your place of residence; applications for a category D visa are processed by the cantons (a residence permit is required)."
      sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/einreise/faq.html"
      sourceName: "State Secretariat for Migration (SEM) — FAQ: Entry"
      # VERIFIED 2026-06-12 (fact-verifier): SEM Entry FAQ loaded (curl, browser UA, HTTP 200, title "FAQ - Entry"). Verbatim: "Category D visas are issued for stays exceeding 90 days"; the FAQ expressly lists "family reunification" among the reasons a category D visa is required; "You must apply for the category D visa in writing using the application form or directly at the Swiss representation abroad responsible for your place of residence."; "Applications for a category D visa are processed by the cantons (a residence permit is required)." The form-specific sentence is confirmed on the companion official SEM page cited in this task's links (visumantragsformular.html, HTTP 200): "National (type D) visa application form — For long-term stays (more than three months) in Switzerland subject to authorization (e.g. gainful employment, familiy reunification)." (source's own typo "familiy"). All claim elements supported on official SEM pages.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    detail: >
      The type D visa is the entry document for the family route, exactly as for the work
      route: it lets you travel to Switzerland to take up the residence the canton has
      authorised on family-reunification grounds. SEM's visa application form page lists
      «familiy reunification» (sic — the source's own typo) alongside gainful employment as
      an example of the long-term stays the national (type D) form covers. Apply at the
      Swiss representation competent for your US state of residence (for example the
      Embassy in Washington or a Swiss consulate); each representation covers specific US
      states — confirm which one covers yours, and its submission procedure, on that
      representation's own page before applying.
    steps:
      - text: "Identify the Swiss representation abroad competent for your US state of residence, then apply for the category D visa in writing using the national visa application form, indicating family reunification as the purpose of stay."
        links:
          - text: "SEM — FAQ: where and how to apply for a category D visa for Switzerland"
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/einreise/faq.html"
            sourceName: "State Secretariat for Migration (SEM) — FAQ: Entry"
            # VERIFIED 2026-06-12 (fact-verifier): SEM Entry FAQ loaded (HTTP 200). FAQ "Where and how do I apply for a category D visa for Switzerland?" states verbatim: "You must apply for the category D visa in writing using the application form or directly at the Swiss representation abroad responsible for your place of residence." Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
          - text: "SEM — National (type D) visa application form (for long-term stays subject to authorisation, e.g. gainful employment, family reunification)"
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/einreise/visumantragsformular.html"
            sourceName: "State Secretariat for Migration (SEM) — Visa Application Form"
            # VERIFIED 2026-06-12 (fact-verifier): SEM Visa Application Form page loaded (HTTP 200, title "Visa Application Form"). Verbatim: "National (type D) visa application form — For long-term stays (more than three months) in Switzerland subject to authorization (e.g. gainful employment, familiy reunification)." (source's own typo "familiy"; link text normalises the spelling). Matches claim.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Submit the visa application together with the family-reunification supporting documents required by the representation and the canton."
        tip: "Check the specific representation's instructions for how to submit (by post or appointment) and the exact document checklist."
      - text: "The representation issues the type D visa once the cantonal decision on family reunification is confirmed; you then travel to Switzerland within its validity."
    documents:
      - "Completed national (type D) visa application form"
      - "Valid US passport"
      - "Passport photos to the required specification"
      - "Marriage / registered-partnership / birth certificates proving the family relationship"
      - "Reference to the cantonal family-reunification application or authorisation"
      - "Confirm the full document list with the competent Swiss representation in the USA"
    timeline:
      text: "Category D (national) visa applications are processed by the cantons and the time required varies by canton and purpose of stay; SEM states that, as a rule, one to several months must be expected. Confirm the current timing with the competent Swiss representation abroad."
      sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/einreise/faq.html"
      sourceName: "State Secretariat for Migration (SEM) — FAQ: Entry"
      # VERIFIED 2026-06-12 (fact-verifier): SEM Entry FAQ loaded (HTTP 200). Verbatim: "Applications for a category D visa are processed by the cantons (a residence permit is required). The time the responsible authorities need to process such applications may vary according to canton and purpose of stay. As a rule, one to several months must be expected." Matches claim character-for-character.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    cost:
      text: "Confirm the current national (type D) visa fee with the competent Swiss representation abroad. Unlike the Schengen (category C) visa, which is a fixed EUR 90 for adults, the national (type D) visa fee is not published by SEM as a single fixed figure; an extra charge of up to 50% of the fee may apply for urgent/out-of-hours handling. A service fee to an external provider may also apply."
      sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/einreise/faq.html"
      sourceName: "State Secretariat for Migration (SEM) — FAQ: Entry"
      # VERIFIED 2026-06-12 (fact-verifier): SEM Entry FAQ loaded (HTTP 200). Verbatim: "The cost of submitting an application is EUR 90 for adults and EUR 45 for children between 6 and 12 years old. This is a fixed charge for a Schengen visa." (EUR 90 is the Schengen fee, exactly as the claim frames it); "There may be an extra charge of up to 50% of the fee for a national visa (for a stay longer than 90 days) when the applicant asks for the visa to be issued urgently or outside of normal working hours or if the application processing procedure is unduly complex."; external-service-provider fee "in addition to the visa fee" confirmed. No fixed national (type D) figure published — claim correctly says confirm with the representation. Fee claim -> 30-day review window.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-07-12"
    # dependsOn lists ALL family route tasks; at runtime the ids filtered out by
    # appliesIf for a given user are ignored (ADR-0009 mechanics), so each user
    # sees only their own route task as the prerequisite.
    dependsOn:
      - family-permit-spouse-swiss
      - family-permit-spouse-settled
      - family-permit-spouse-b-holder
      - family-permit-unmarried-partner
      - family-permit-children
