        # current in-force consolidation per Fedlex SPARQL; no official EN exists,
        # so DE/FR is the authority). DE verbatim: foreign nationals "müssen sich
        # innerhalb von 14 Tagen nach der Einreise bei der durch den Kanton
        # bezeichneten Stelle anmelden". FR verbatim: "déclarer leur arrivée ...
        # auprès du service désigné par le canton" = register with the body/
        # service designated by the canton. The Einwohnerkontrolle / contrôle des
        # habitants naming matches the already-VERIFIED step text and the VERIFIED
        # ch.ch commune-of-residence summary; the federal text names "the body
