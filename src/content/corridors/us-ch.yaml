    appliesIf: "motivation == 'study' && studyStatus == 'applying'"
    summary:
      text: "Admission comes before immigration: the first statutory condition for a residence permit for education purposes is that the management of the educational establishment confirms that you are eligible for the education or training (Art. 27 para. 1 let. a FNIA). Until you hold an admission/confirmation from a Swiss institution there is no Swiss visa or permit application you can usefully make — get admitted first."
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_27"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 27 — Fedlex, the official publication platform of Swiss law"
