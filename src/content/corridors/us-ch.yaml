  - id: study-residence-permit
    localCostTimeline: canton
    title: "Apply for a residence permit for education purposes (Art. 27 FNIA)"
    category: visa-permit
    # appliesIf (content-researcher, 2026-06-12, PENDING fact-verifier approval
    # per ADR-0009 §4): Art. 27 FNIA education admission is specific to the
    # study route; work/family/retirement entrants have their own admission
    # tasks under Arts. 18-22, 42-44 and 28 respectively.
    # appliesIf APPROVED 2026-06-12 (fact-verifier, ADR-0009 §4): correct.
    # Art. 27 FNIA (verified this run, EN 2026-02-01 + DE 2026-06-12) is the
    # dedicated education/training admission; the other routes' admission
    # bases (Arts. 18-22, 42-44, 28 — all previously verified) are distinct,
    # so this task is wrong for every non-study user.
    appliesIf: "motivation == 'study'"
    summary:
      text: "Foreign nationals may be admitted to Switzerland for education or training purposes if the management of the educational establishment confirms that they are eligible for the education or training, suitable accommodation is available, the required financial means are available, and they fulfil the personal and educational requirements for the planned course (Art. 27 para. 1 FNIA). This is a discretionary admission — the law says «may be admitted», not «are entitled» — so there is no legal right to a student permit; the cantonal authorities decide, and US citizens are not covered by EU/EFTA free movement."
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_27"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 27 — Fedlex, the official publication platform of Swiss law"
