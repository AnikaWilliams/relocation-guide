        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Deadline"
        text: "Within 14 days of entering Switzerland you must register with the body designated by your canton (the time limit set under the ordinance for a residence stay); the exact deadline can vary by canton/commune, so confirm it with your commune of residence."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/759/20260101/de/html/fedlex-data-admin-ch-eli-cc-2007-759-20260101-de-html.html#art_10"
        sourceName: "Ordinance on Admission, Period of Stay and Employment (OASA/VZAE, SR 142.201), Art. 10 — Fedlex, the official publication platform of Swiss law"
        # VERIFIED 2026-06-12 (fact-verifier): FIGURE -> 30-day review window.
        # OASA/VZAE Art. 10 para. 1 read verbatim from the Fedlex filestore DE+FR
        # HTML (eli/cc/2007/759/20260612, current in-force consolidation). DE:
        # "Zur Regelung des Aufenthalts müssen sich Ausländerinnen und Ausländer
