originIso2: us
destinationIso2: ch
title: "Moving from the USA to Switzerland"
description: "How US citizens (non-EU/EFTA third-country nationals) relocate to Switzerland for work, family reunification, study, or retirement: the right permit for your route, the national (type D) visa, arrival registration, the residence permit card, mandatory health insurance, and social security."
lastReviewed: "2026-06-12"
reviewedBy: "content-researcher"
published: true
# Covered routes: work (employer-sponsored, verified 2026-06-09), family
# reunification (verified 2026-06-12, 27/27), retirement / non-gainful Art. 28
# (verified 2026-06-12, 20/20), study Art. 27 (verified 2026-06-12, 23/23).
# "Other" remains uncovered pending its own researched and verified content.
coversMotivations: [work, family, retirement, study]
tasks:
  # ---------------------------------------------------------------------------
  - id: work-residence-permit
    localCostTimeline: canton
    title: "Secure an employer-sponsored work and residence permit"
    category: visa-permit
    summary:
      text: "As a US citizen you are a non-EU/EFTA third-country national. You cannot apply for a work permit yourself: a Swiss employer must apply to the cantonal authorities, and you can only be admitted if no suitable worker can be recruited from Switzerland or the EU/EFTA. Admission is limited to managers, specialists and other qualified workers, and is capped by annual federal maximum numbers (quotas)."
      sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/arbeit/nicht-eu_efta-angehoerige/grundlagen_zur_arbeitsmarktzulassung.html"
      sourceName: "State Secretariat for Migration (SEM) — Basis for admission to the Swiss employment market"
      # VERIFIED 2026-06-09: page loaded. Confirms labour-market priority ("admitted only if it is not possible to recruit a person who qualifies for precedence from the labour market in Switzerland or in an EU/EFTA state"), "Admissions are limited to managers, specialists and other qualified workers", and annual maximum numbers set by Federal Council in ASEO. Employer-must-apply / worker-cannot-self-apply confirmed on companion official SEM page (nicht-eu_efta-angehoerige.html: "Your future employer must prove that there is no suitable person...").
      status: VERIFIED
      lastVerified: "2026-06-09"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-07"
    # ADR-0012 distilled copy (tldr/keyFacts) drafted 2026-06-12
    # (content-researcher); all new claims UNVERIFIED pending fact-verifier.
    tldr:
      text: "As a US citizen you cannot get a Swiss work permit on your own: a Swiss employer must obtain your work and residence authorisation from the cantonal authorities before you move. Admission is limited to qualified workers (managers, specialists and other skilled professionals) and is capped by annual federal maximum numbers (quotas)."
      sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/arbeit/nicht-eu_efta-angehoerige/grundlagen_zur_arbeitsmarktzulassung.html"
      sourceName: "State Secretariat for Migration (SEM) — Basis for admission to the Swiss employment market"
      # VERIFIED 2026-06-12 (fact-verifier, independent session per two-agent rule): SEM admission-basis page re-fetched (curl, browser UA, HTTP 200, no redirect; re-checked, not carried over from prior runs). Load-bearing checkable facts confirmed verbatim: "Admissions are limited to managers, specialists and other qualified workers" (Personal requirements §, Art. 23 FNIA) and "Admissions of non-EU and non-EFTA state nationals are limited. To this end, the Federal Council determines the maximum numbers in the Ordinance on Admission, Period of Stay and Employment (ASEO) on an annual basis." (Quotas §, Art. 20 FNIA) — supports "limited to qualified workers" and "capped by annual federal maximum numbers (quotas)". The employer-must-obtain-it / cannot-self-apply element is confirmed on the companion SEM nicht-eu_efta page ("Your future employer must prove that there is no suitable person...", cited by the "Who applies" keyFact). No overstatement: the page uses permissive "can be admitted only if" / "Only a limited number ... can be admitted", never "entitled".
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    keyFacts:
      - label: "Who applies"
        text: "Your future Swiss employer files the application and must prove that no suitable person from Switzerland or an EU/EFTA state could fill the vacancy — you cannot apply for this admission yourself."
        sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/arbeit/nicht-eu_efta-angehoerige.html"
        sourceName: "State Secretariat for Migration (SEM) — Non-EU/EFTA nationals"
        # VERIFIED 2026-06-12 (fact-verifier): SEM "Non-EU/EFTA nationals" page re-fetched (curl, browser UA, HTTP 200, no redirect). Verbatim: "Your future employer must prove that there is no suitable person to fill the job vacancy from Switzerland or from an EU/EFTA state." — supports the prove-no-suitable-person element character-for-character. Worker-cannot-self-apply / employer-files framing supported by the same page's worker-side phrasing ("if you ... would like to work in Switzerland, you may only do so if you are highly qualified") and corroborated by the companion grundlagen page (employer must enclose the signed contract with the application). Link accurate.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Where"
        text: "The cantonal authority of the intended place of work decides first; some cases also need federal approval from SEM. Cantonal worked example (Vaud): the Direction générale de l'emploi et du marché du travail (DGEM) is the authority for salaried-activity work-permit applications."
        sourceUrl: "https://www.vd.ch/economie/prestations-de-la-direction-generale-de-lemploi-et-du-marche-du-travail-dgem/permis-de-sejour-et-de-travail-pour-etrangers/activite-salariee"
        sourceName: "Canton de Vaud — Direction générale de l'emploi et du marché du travail (DGEM), Activité salariée"
        # VERIFIED 2026-06-12 (fact-verifier): Canton de Vaud DGEM "Activité salariée" page fetched (curl, browser UA, HTTP 200, NO redirect; vd.ch reachable from this machine, unlike ch.ch/eda datacenter-IP blocks). Correct page (breadcrumb: vd.ch › Economie › Prestations de la DGEM › Permis de séjour et de travail pour étrangers › Activité salariée). Verbatim: "Pour engager un ressortissant extracommunautaire ... toute entreprise est tenue de solliciter auprès de la Direction générale de l'emploi et du marché du travail une autorisation de travail." → DGEM is the authority for salaried-activity work-permit applications. And under Procédure, verbatim: "une décision préalable sera notifiée à l'employeur par la Direction générale de l'emploi et du marché du travail. Pour certains types de dossiers, il incombera ensuite au Secrétariat d'Etat aux migrations (SEM) de prononcer une approbation fédérale." → supports "cantonal authority decides first; some cases also need federal approval from SEM" character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Legal basis"
        text: "Foreign Nationals and Integration Act (FNIA) Art. 18–22 — overall economic interest, quotas, precedence, and salary and employment conditions customary in the region and sector — together with the ASEO ordinance."
        sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/arbeit/nicht-eu_efta-angehoerige/grundlagen_zur_arbeitsmarktzulassung.html"
        sourceName: "State Secretariat for Migration (SEM) — Basis for admission to the Swiss employment market"
        # VERIFIED 2026-06-12 (fact-verifier): same SEM admission-basis page (HTTP 200). Verbatim: "The admission criteria are listed in the Foreign Nationals and Integration Act (FNIA) and the Ordinance on Admission, Period of Stay and Employment (ASEO)." The four article-tagged section headings confirm the Art. 18–22 span: "Overall economic interest (Art. 18 and Art. 19 FNIA)", "Quotas (Art. 20 FNIA)", "Precedence (Art. 21 FNIA)", "Salary and employment conditions customary in the region and sector (Art. 22 FNIA)". Matches claim character-for-character. NOTE (carried from prior run, still true): the page's "Legal foundations" footer names the ordinance "Ordinance on Admission, Residence and Employment (AREO) (SR 142.201)" while the body uses "ASEO"; claim uses the body/sourceName term "ASEO", which is supported.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Quota-dependent"
        text: "Yes — admissions are limited by annual maximum numbers (quotas) set by the Federal Council."
        sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/arbeit/nicht-eu_efta-angehoerige/grundlagen_zur_arbeitsmarktzulassung.html"
        sourceName: "State Secretariat for Migration (SEM) — Basis for admission to the Swiss employment market"
        # VERIFIED 2026-06-12 (fact-verifier): same SEM admission-basis page (HTTP 200). Quotas § verbatim: "Admissions of non-EU and non-EFTA state nationals are limited. To this end, the Federal Council determines the maximum numbers in the Ordinance on Admission, Period of Stay and Employment (ASEO) on an annual basis." — supports the yes/no fact ("Yes — admissions are limited by annual maximum numbers (quotas) set by the Federal Council") character-for-character. The claim asserts NO quota figure, so the 90-day window is correct (independently, the cited Vaud DGEM page does publish the 2026 figures — 4500 séjour / 4000 courte durée — but no claim in this task quotes a number).
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Right or discretion"
        text: "Discretion: admission is limited to managers, specialists and other qualified workers — there is no entitlement to a third-country work permit."
        sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/arbeit/nicht-eu_efta-angehoerige/grundlagen_zur_arbeitsmarktzulassung.html"
        sourceName: "State Secretariat for Migration (SEM) — Basis for admission to the Swiss employment market"
        # VERIFIED 2026-06-12 (fact-verifier): same SEM admission-basis page (HTTP 200). "limited to managers, specialists and other qualified workers" appears verbatim. Entitlement-vs-discretion check (the load-bearing point flagged for this task): the page never uses "entitled/right" for third-country labour admission — it states "Only a limited number of highly qualified workers CAN BE admitted" and each criterion is conditional ("can be admitted only if it is in the interests of Switzerland ...", "can be admitted only if it is not possible to recruit ..."). This is the same discretionary "may be admitted" register found in FNIA Arts. 27/28/44 (verified in prior runs), and is correctly contrasted with the Art. 42/43 family "are entitled" register. The claim's "Discretion ... no entitlement to a third-country work permit" does NOT overstate the source. Confirmed.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
    detail: >
      Switzerland admits third-country labour under a dual system: free movement applies to
      EU/EFTA nationals, while everyone else (including US citizens) is admitted only in
      limited numbers and only for qualified roles. The employer must show genuine
      recruitment efforts (labour-market priority for Swiss/EU/EFTA candidates), offer pay
      and conditions matching local standards, and the role must fall within the annual
      federal quota. The permit is tied to the specific job, employer and canton. Typical
      permit types for new third-country hires are the short-term L permit and the
      residence B permit.
    steps:
      - text: "Receive a concrete job offer from a Swiss employer; the offer and admission are job-, employer- and canton-specific."
      - text: "Your employer files the work-authorisation application with the cantonal migration / employment authority of the intended place of work."
        tip: "You generally cannot start work until the authorisation is granted. The canton, then SEM, decide before the visa stage."
        links:
          - text: "SEM — admitting non-EU/EFTA nationals to gainful employment"
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/arbeit/nicht-eu_efta-angehoerige.html"
            sourceName: "State Secretariat for Migration (SEM)"
            # VERIFIED 2026-06-09: official SEM page "Non-EU/EFTA nationals" loaded; states you "may only do so if you are highly qualified" and "Your future employer must prove that there is no suitable person to fill the job vacancy from Switzerland or from an EU/EFTA state." Link is accurate.
            status: VERIFIED
            lastVerified: "2026-06-09"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-07"
      - text: "Admission must fit within the annual federal maximum numbers (quotas) and the labour-market priority rule (Swiss/EU/EFTA candidates first)."
        links:
          - text: "Legal basis: the admission criteria are set out in the Foreign Nationals and Integration Act (FNIA) — economic interest, quotas, precedence and salary/conditions (Art. 18–22 FNIA) — and the Ordinance on Admission, Period of Stay and Employment (ASEO), as explained by SEM."
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/arbeit/nicht-eu_efta-angehoerige/grundlagen_zur_arbeitsmarktzulassung.html"
            sourceName: "State Secretariat for Migration (SEM) — Basis for admission to the Swiss employment market"
            # VERIFIED 2026-06-09 (fact-verifier): SEM legal-basis page loaded (curl, browser UA, HTTP 200). Confirms verbatim "The admission criteria are listed in the Foreign Nationals and Integration Act (FNIA) and the Ordinance on Admission, Period of Stay and Employment (ASEO)" and sub-headings cite "Overall economic interest (Art. 18 and Art. 19 FNIA)", "Quotas (Art. 20 FNIA)", "Precedence (Art. 21 FNIA)", "Salary and employment conditions customary in the region and sector (Art. 22 FNIA)". Matches claim character-for-character. NOTE for researcher: the page's "Legal foundations" footer names the ordinance "Ordinance on Admission, Residence and Employment (AREO) (SR 142.201)" while the body uses "ASEO"; claim uses body/sourceName label "ASEO" which is supported.
            status: VERIFIED
            lastVerified: "2026-06-09"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-07"
    # documents migrated from legacy strings to ADR-0012 structured entries
    # 2026-06-12 (content-researcher); all UNVERIFIED pending fact-verifier.
    # Every requirement from the prior string list is preserved: the
    # "Employer's justification of recruitment efforts / labour-market priority"
    # string is no longer a standalone 'provide' item — it is now carried by the
    # cantonal work-authorisation FORM entry below (in Vaud the recruitment-efforts
    # evidence is submitted via that application), so nothing is dropped.
    documents:
      - name: "Cantonal work-authorisation application (employer-filed)"
        type: form
        description: "The official application the EMPLOYER files with the cantonal labour-market / migration authority of the place of work; it carries the employer's justification of recruitment efforts (labour-market priority). Canton-specific — Vaud is the worked example here."
        form:
          text: "Cantonal work-authorisation application for a salaried third-country worker — obtain the current form from the canton's own authority. Vaud worked example: the DGEM 'Activité salariée' page links the current employer application form (Formulaire 1350); we link that authority page rather than a deep PDF so the form is always the current one. For other cantons, find the competent authority via the SEM directory of cantonal immigration and employment-market authorities."
          sourceUrl: "https://www.vd.ch/economie/prestations-de-la-direction-generale-de-lemploi-et-du-marche-du-travail-dgem/permis-de-sejour-et-de-travail-pour-etrangers/activite-salariee"
          sourceName: "Canton de Vaud — Direction générale de l'emploi et du marché du travail (DGEM), Activité salariée"
          # VERIFIED 2026-06-12 (fact-verifier): Canton de Vaud DGEM "Activité salariée" page (HTTP 200, no redirect). The page is the cantonal authority page (NOT a deep PDF) and it DOES carry the current employer application form link: under "Constitution du dossier", verbatim "Le Formulaire 1350 (pdf, 453 Ko) constitue la base du dossier." So the claim's framing is exact — it links the authority page (per the no-self-hosted-PDF rule), and that page links the current Formulaire 1350. It is the EMPLOYER's application: "toute entreprise est tenue de solliciter auprès de la [DGEM] une autorisation de travail", and the dossier requires "preuves de recherches effectuées en vue de trouver un travailleur sur le marché indigène et européen" (the recruitment-efforts / labour-market-priority evidence the description says this form carries). The "find the competent authority via the SEM directory" pointer is honest (that directory was verified in prior runs). Per protocol we verify the authority page is correct and current, not that any specific PDF byte-exists; confirmed.
          status: VERIFIED
          lastVerified: "2026-06-12"
          verifiedBy: "fact-verifier"
          reviewBy: "2026-09-10"
      - name: "Signed Swiss employment contract or binding job offer"
        type: provide
        description: "The signed contract or a binding written job offer from your Swiss employer; admission is tied to this specific job, employer and canton."
      - name: "Detailed CV and proof of qualifications"
        type: provide
        description: "A detailed CV plus evidence of your qualifications (degrees, diplomas, references) showing you are a manager, specialist or other skilled professional."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport (your travel and identity document throughout the process)."
      - name: "Passport photos as specified by the cantonal authority"
        type: provide
        description: "Recent passport photographs to the specification set by the competent cantonal authority."
    warning: >
      Annual quotas (maximum numbers) for third-country nationals are reset each year by the
      Federal Council in the Ordinance on Admission, Period of Stay and Employment (ASEO).
      Do not rely on a quota figure without confirming the current year's numbers with SEM.
    dependsOn: []
    # appliesIf added 2026-06-12 (content-researcher): this task describes the
    # employer-sponsored labour-market admission only (FNIA Art. 18-22); it does
    # not apply to family-reunification entrants.
    # appliesIf APPROVED 2026-06-12 (fact-verifier, ADR-0009 §4): correct.
    # Family-reunification entrants are admitted under FNIA Art. 42-44, not the
    # Art. 18-22 labour-market admission, and Art. 46 FNIA (verified this run)
    # expressly lets the spouse and children of Swiss nationals, C- and
    # B-permit holders "work on a salaried or self-employed basis anywhere in
    # Switzerland" — no separate labour-market permit step applies to them.
    appliesIf: "motivation == 'work'"

