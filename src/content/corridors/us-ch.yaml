  - id: study-admission
    localCostTimeline: institution
    title: "Get admitted: secure the confirmation of a Swiss educational institution first"
    category: education
    # appliesIf (content-researcher, 2026-06-12, PENDING fact-verifier approval
    # per ADR-0009 §4): shown only to study-route users who are still applying.
    # Admitted users skip it; study-residence-permit's dependsOn reference to
