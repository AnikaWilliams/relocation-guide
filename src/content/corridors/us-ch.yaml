        sourceUrl: "https://www.sem.admin.ch/sem/en/home/themen/aufenthalt/biometr_auslaenderausweis.html"
        sourceName: "State Secretariat for Migration (SEM) — Biometric residence permits for foreign nationals"
        # VERIFIED 2026-06-12 (fact-verifier): same SEM biometric-permits page. Verbatim: "The application procedure and issuance of a biometric residence permit are decided by the Canton of residence." Matches character-for-character.
