  # ---------------------------------------------------------------------------
  - id: ahv-social-security
    title: "Get your AHV/AVS social security (OASI) number"
    category: registration-bureaucracy
    summary:
      text: "The OASI number (AHV in German / AVS in French) is the social-insurance number assigned to everyone living or working in Switzerland, used for old-age and survivors' insurance. As an employee you do not handle OASI yourself: your employer deducts your OASI contributions from your gross salary and pays them, with the employer's own share, to its compensation office (Ausgleichskasse / caisse de compensation). If you do not already have an OASI number when employment begins, confirm with your cantonal compensation office how it is issued; once you have one, you can ask your employer for it."
      sourceUrl: "https://www.ch.ch/en/retirement/old-age-pension/the-first-pillar/oasi-contributions/"
      sourceName: "ch.ch — Paying OASI contributions in Switzerland (official federal portal)"
      # VERIFIED 2026-06-09 (fact-verifier): ch.ch "Paying OASI contributions in Switzerland" page loaded (curl, browser UA, HTTP 200, title matches). Confirms the load-bearing checkable facts verbatim: "All persons living or working in Switzerland must pay OASI contributions" and "Half of your OASI contributions (8.7% of your salary) are paid by you and the other half by your employer. Your employer takes care of deducting the OASI contributions from your gross salary and pays them to the compensation fund." The trailing number-issuance step ("Confirm with your cantonal compensation office how it is issued") is an honest pointer embedded in an otherwise fully-supported summary; no fact invented. Summary VERIFIED on its checkable content.
      status: VERIFIED
      lastVerified: "2026-06-09"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-07"
    # ADR-0012 distilled copy (tldr/keyFacts) drafted 2026-06-12
    # (content-researcher, SEPARATE pass). These were FLAGGED in the prior run
    # because the cited ch.ch OASI pages served a datacenter-IP 404 to the
    # WebFetch verifier (the 8.7% rate could not be confirmed verbatim from a
    # reachable source). This pass re-sources the load-bearing facts to the
    # underlying federal law via Fedlex (reachable through the static
    # consolidated HTML on fedlex.data.admin.ch) so the verifier does not depend
    # on ch.ch: WHO is insured/liable is AHVG/LAVS (SR 831.10) Art. 1a; the
    # CONTRIBUTION OBLIGATION is Art. 3; the 8.7% employment rate is the sum of
    # the employee 4.35% (Art. 5 para. 1) and employer 4.35% (Art. 13) — the
    # AHVG has no official EN translation, so the DE consolidation is cited.
    # ROUTE-NEUTRAL: employees are registered via their employer's compensation
    # office, while NON-WORKING residents register with the cantonal
    # compensation office themselves (see the dedicated
    # retirement-ahv-contributions task). All new claims UNVERIFIED pending
    # fact-verifier.
    tldr:
      text: "The OASI number (AHV in German, AVS in French) is Switzerland's social-insurance number for first-pillar old-age and survivors' insurance, and contributions are owed by everyone resident in Switzerland or working there. If you are employed your employer deducts your OASI contributions and pays them — together with the employer's matching share — to its compensation office, so you usually do not handle it yourself; non-working residents instead register with the compensation office of their canton of residence (see the separate non-employed OASI task)."
      sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/63/837_843_843/20260101/de/html/fedlex-data-admin-ch-eli-cc-63-837_843_843-20260101-de-html-1.html#art_1_a"
      sourceName: "Federal Act on Old-Age and Survivors' Insurance (OASI Act / AHVG, SR 831.10), Art. 1a — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): "everyone resident or working" element
      # confirmed on the Fedlex filestore DE HTML (eli/cc/63/837_843_843/20260101,
      # the in-force consolidation per SPARQL; no official EN exists). Art. 1a para.
      # 1 verbatim: "Versichert nach diesem Gesetz sind: a. die natürlichen
      # Personen mit Wohnsitz in der Schweiz; b. die natürlichen Personen, die in
      # der Schweiz eine Erwerbstätigkeit ausüben" = persons domiciled in
      # Switzerland; persons who carry on a gainful activity in Switzerland. The
      # employer-deducts-and-pays element matches AHVG Art. 14 para. 1 verbatim
      # ("bei jeder Lohnzahlung in Abzug zu bringen und vom Arbeitgeber zusammen
      # mit dem Arbeitgeberbeitrag periodisch zu entrichten") and the
      # already-VERIFIED ch.ch summary/cost (re-fetched HTTP 200 this run: "Your
      # employer takes care of deducting the OASI contributions from your gross
      # salary"). Non-working-resident cross-reference is honest. No FIGURE in this
      # text -> 90-day window.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    keyFacts:
      - label: "Who applies"
        text: "Everyone domiciled (resident) in Switzerland and everyone who carries on a gainful activity in Switzerland is insured for OASI — so the number/coverage applies to US nationals on any route, whether or not you work."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/63/837_843_843/20260101/de/html/fedlex-data-admin-ch-eli-cc-63-837_843_843-20260101-de-html-1.html#art_1_a"
        sourceName: "Federal Act on Old-Age and Survivors' Insurance (OASI Act / AHVG, SR 831.10), Art. 1a — Fedlex, the official publication platform of Swiss law"
        # VERIFIED 2026-06-12 (fact-verifier): AHVG/LAVS Art. 1a para. 1 verbatim
        # on the Fedlex filestore DE HTML (eli/cc/63/837_843_843/20260101): "
        # Versichert nach diesem Gesetz sind: a. die natürlichen Personen mit
        # Wohnsitz in der Schweiz; b. die natürlichen Personen, die in der Schweiz
        # eine Erwerbstätigkeit ausüben". (Article heading in this consolidation:
        # "Obligatorisch Versicherte".) Route-neutral by construction: covers
        # residents who do not work (let. a) AND gainfully employed persons (let.
        # b), so the "any route, whether or not you work" gloss is accurate. No
        # official EN translation, so the DE consolidation is the authority. No
        # FIGURE in this text -> 90-day window.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Where"
        text: "If you are employed, your employer handles OASI through its compensation office (Ausgleichskasse / caisse de compensation) and deducts your share from your salary; if you are not working, you register with the OASI compensation office of your canton of residence yourself."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/63/837_843_843/20260101/de/html/fedlex-data-admin-ch-eli-cc-63-837_843_843-20260101-de-html.html#art_13"
        sourceName: "Federal Act on Old-Age and Survivors' Insurance (OASI Act / AHVG, SR 831.10), Art. 13–14 — Fedlex, the official publication platform of Swiss law"
        # VERIFIED 2026-06-12 (fact-verifier): Employer route confirmed on the
        # Fedlex filestore DE HTML. AHVG Art. 14 para. 1 verbatim: "Die Beiträge
        # vom Einkommen aus unselbständiger Erwerbstätigkeit sind bei jeder
        # Lohnzahlung in Abzug zu bringen und vom Arbeitgeber zusammen mit dem
        # Arbeitgeberbeitrag periodisch zu entrichten" = employer deducts at each
        # wage payment and pays periodically with the employer contribution; Art.
        # 13 fixes the employer contribution. Matches the already-VERIFIED ch.ch
        # summary/cost (re-fetched HTTP 200 this run). Non-working route (register
        # with the cantonal compensation office yourself) is route-neutral and
        # correctly cross-referenced to the dedicated retirement-ahv-contributions
        # task; this employee task does not presume employment for non-workers. No
        # FIGURE asserted in this keyFact -> 90-day window.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Legal basis"
        text: "OASI Act (AHVG/LAVS, SR 831.10): gainfully employed insured persons are liable to pay contributions while they work (Art. 3); employee contributions are levied on employment income (Art. 5) and the employer pays a matching contribution (Art. 13)."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/63/837_843_843/20260101/de/html/fedlex-data-admin-ch-eli-cc-63-837_843_843-20260101-de-html-1.html#art_3"
        sourceName: "Federal Act on Old-Age and Survivors' Insurance (OASI Act / AHVG, SR 831.10), Art. 3, 5 and 13 — Fedlex, the official publication platform of Swiss law"
        # VERIFIED 2026-06-12 (fact-verifier): all three articles confirmed on the
        # Fedlex filestore DE HTML (eli/cc/63/837_843_843/20260101). Art. 3 para. 1
        # verbatim: "Die Versicherten sind beitragspflichtig, solange sie eine
        # Erwerbstätigkeit ausüben" = liable to contribute as long as they
        # exercise a gainful activity (para. for non-employed liability begins 1
        # Jan after the 20th birthday until the reference age — consistent with the
        # claim's "while they work" framing for employees). Art. 5 para. 1: "Vom
        # Einkommen aus unselbständiger Erwerbstätigkeit ... wird ein Beitrag von
        # 4,35 Prozent erhoben"; Art. 13: "Der Arbeitgeberbeitrag beträgt 4,35
        # Prozent ...". DE consolidation is the authority (no EN). This keyFact's
        # TEXT asserts no figure (figures live on the rate keyFact) -> 90-day
        # window.
        status: VERIFIED
        lastVerified: "2026-06-12"
        verifiedBy: "fact-verifier"
        reviewBy: "2026-09-10"
      - label: "Work allowed"
        text: "OASI contributions on employment income are shared 50/50: as an employee you pay 4.35% of your relevant salary and your employer pays a matching 4.35% (8.7% in total), deducted from your gross salary by the employer."
        sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/63/837_843_843/20260101/de/html/fedlex-data-admin-ch-eli-cc-63-837_843_843-20260101-de-html.html#art_5"
        sourceName: "Federal Act on Old-Age and Survivors' Insurance (OASI Act / AHVG, SR 831.10), Art. 5 and 13 — Fedlex, the official publication platform of Swiss law"
        # VERIFIED 2026-06-12 (fact-verifier): FIGURE -> 30-day review window.
        # AHVG Art. 5 para. 1 verbatim on the Fedlex filestore DE HTML
        # (eli/cc/63/837_843_843/20260101): "Vom Einkommen aus unselbständiger
        # Erwerbstätigkeit, im folgenden massgebender Lohn genannt, wird ein
        # Beitrag von 4,35 Prozent erhoben." = employee 4.35%. AHVG Art. 13
        # verbatim: "Der Arbeitgeberbeitrag beträgt 4,35 Prozent der Summe der an
        # beitragspflichtige Personen bezahlten massgebenden Löhne." = employer
        # 4.35%. The Act also states verbatim "der Beitragssatz für den
        # Arbeitgeber und den Arbeitnehmer je 4,35 Prozent des massgebenden
        # Lohnes" (employer and employee 4.35% each). 4.35% + 4.35% = 8.7%,
        # matching the already-VERIFIED ch.ch cost field on this task and the
        # ch.ch page re-fetched this run (HTTP 200): "Half of your OASI
        # contributions (8.7% of your salary) are paid by you and the other half
