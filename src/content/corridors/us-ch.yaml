    detail: >
      Joining a spouse or registered partner who holds a Swiss settlement permit (C permit)
      is a statutory entitlement under Art. 43 FNIA, subject to the conditions listed in the
      summary. The official federal portal ch.ch summarises the practical conditions: large
      enough accommodation by Swiss standards, no dependence on social assistance, and —
      where the sponsor is self-employed or unemployed — proof of sufficient financial
      resources. After a law-abiding and uninterrupted stay of five years, the spouse is
      entitled to a settlement permit if the integration criteria of Art. 58a FNIA are met
      (Art. 43 para. 5). Once admitted, the spouse and children may work, salaried or
      self-employed, anywhere in Switzerland (Art. 46 FNIA). The English text of the FNIA
      is provided for information only and has no legal force.
    steps:
      - text: "Check the conditions together with your partner in Switzerland: living together, suitable accommodation, no dependence on social assistance, and no claim to supplementary benefits by the person you are joining."
        links:
          - text: "ch.ch — conditions to be met for family reunification (accommodation, social assistance, financial resources)"
            sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
            sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): ch.ch page loaded (HTTP 200). Verbatim: "you must have large enough accommodation (according to Swiss standards) to house the whole family. You must not depend on social assistance. If you are self-employed or unemployed, you must also provide proof of sufficient financial resources to support your family members." All three condition categories in the link text are on the page.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "If you cannot yet communicate in the national language of the intended place of residence, register for a language course: a certificate of enrolment in a language support programme satisfies the language condition for the residence permit (A1 level at least orally, per ch.ch)."
        links:
          - text: "FNIA Art. 43 para. 2 — registration for a language support programme suffices for obtaining the residence permit"
            sourceUrl: "https://www.fedlex.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20260201/en/html/fedlex-data-admin-ch-eli-cc-2007-758-20260201-en-html.html#art_43"
            sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 43 — Fedlex"
            # VERIFIED 2026-06-12 (fact-verifier): Fedlex filestore FNIA EN (in-force 2026-02-01). Art. 43 para. 2 verbatim: "In order to obtain a residence permit, it is sufficient to register for a language support programme as an alternative to meeting the requirement set out in paragraph 1 letter d." The step text's "(A1 level at least orally, per ch.ch)" attribution is on the ch.ch page document list verbatim ("A1 level at least orally"). Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Apply via the cantonal immigration authority of the canton where your spouse or partner lives, within the statutory time limit (five years; twelve months for children over 12)."
        links:
          - text: "SEM — addresses of the cantonal immigration and employment market authorities"
            cantonOffice: true
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/sem/kontakt/kantonale_behoerden/adressen_kantone_und.html"
            sourceName: "State Secretariat for Migration (SEM) — Cantonal immigration and employment market authorities"
            # VERIFIED 2026-06-12 (fact-verifier): SEM cantonal address directory loaded (HTTP 200, title matches). Per-canton migration-office entries present. The step text's time limits (five years; twelve months for children over 12) are Art. 47 para. 1 FNIA, confirmed verbatim on the Fedlex filestore text this run. Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
