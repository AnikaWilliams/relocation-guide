  # ===========================================================================
  # FAMILY-REUNIFICATION ROUTE (drafted 2026-06-12, content-researcher).
  # VERIFICATION RUN 2026-06-12 (fact-verifier, independent session per
  # two-agent rule): all 27 claims below checked against the sources as
  # served and tagged VERIFIED. FNIA text was read from the official Fedlex
  # filestore consolidated EN HTML (in-force version 2026-02-01) because
  # www.fedlex.admin.ch renders that same document client-side (JS SPA).
  # Statutory references are to the Federal Act on
  # Foreign Nationals and Integration (FNIA, SR 142.20); the Fedlex English
  # translation is marked "provided for information purposes only and has no
  # legal force" — the fact-verifier should check against the page as served.
  # The legal basis differs by sponsor: Swiss citizen (Art. 42 — entitlement),
  # settled C-permit holder (Art. 43 — entitlement with conditions), B-permit
  # holder (Art. 44 — discretionary), so each sponsor type is its own task.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  - id: family-permit-spouse-swiss
    title: "Family reunification as the spouse or registered partner of a Swiss citizen"
    category: family-dependents
    appliesIf: "motivation == 'family' && familyJoineeStatus == 'citizen' && familyRelationship != 'unmarried-partner' && familyRelationship != 'parent'"
    summary:
      text: "The foreign spouse (and unmarried children under 18) of a Swiss citizen who live with the Swiss citizen are entitled to be granted a residence permit and to have it extended (Art. 42 para. 1 FNIA). The provisions on foreign spouses apply mutatis mutandis to registered partnerships of same-sex couples (Art. 52 FNIA). After a law-abiding and uninterrupted stay of five years, the spouse is entitled to a settlement permit if the integration criteria of Art. 58a FNIA are met."
      sourceUrl: "https://www.fedlex.admin.ch/eli/cc/2007/758/en#art_42"
      sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 42 and 52 — Fedlex, the official publication platform of Swiss law"
      # VERIFIED 2026-06-12 (fact-verifier): cited www.fedlex.admin.ch URL resolves (HTTP 200) but renders client-side; text read from the SAME official Fedlex platform's static consolidated HTML (fedlex.data.admin.ch filestore, ELI cc/2007/758, in-force version 2026-02-01, English; anchor id "art_42" present). Art. 42 para. 1 verbatim: "The foreign spouse and unmarried children under 18 of a Swiss national who live with the Swiss national are entitled to be granted a residence permit and to have their residence permit extended." Art. 52 verbatim: "The provisions of this Chapter on foreign spouses apply mutatis mutandis to registered partnerships of same-sex couples." Art. 42 para. 3: after "a law-abiding and uninterrupted period of stay of five years, a foreign spouse is entitled to be granted a settlement permit if the integration criteria set out in Article 58a are met." Entitlement ("are entitled") language matches character-for-character. Doc header confirms the EN translation "has no legal force" — claim/detail state this.
      status: VERIFIED
      lastVerified: "2026-06-12"
      verifiedBy: "fact-verifier"
      reviewBy: "2026-09-10"
    detail: >
      Joining a Swiss-citizen spouse or registered partner is a statutory entitlement, not a
      discretionary admission: it is not subject to the third-country labour-market quotas
      that govern the work route. The requirement is that you live together (Art. 42 para. 1
      FNIA; Art. 49 allows an exemption where good cause is shown for living separately and
      the family household continues to exist). Your marriage or registered partnership must
      be recognised by Switzerland. Once admitted, the spouse and children of a Swiss
      citizen may work, salaried or self-employed, anywhere in Switzerland (Art. 46 FNIA).
      Note that the English text of the FNIA is an official translation provided for
      information only and has no legal force; the German, French and Italian versions are
      authoritative.
    steps:
      - text: "Check that your marriage or registered partnership is recognised by Switzerland — recognition is a precondition for family reunification."
        links:
          - text: "ch.ch — conditions for family reunification: the marriage or registered partnership must be recognised by Switzerland"
            sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
            sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): ch.ch page loaded (curl, browser UA, HTTP 200, title "Application for family reunification in Switzerland"). Under "Conditions to be met for family reunification in Switzerland", verbatim: "Your marriage or a registered partnership must be recognised by Switzerland." Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Apply for family reunification via the cantonal immigration authority of the canton where your spouse or partner lives — the cantons handle family-reunification applications."
        tip: "Procedures, forms and document checklists are cantonal. Contact the competent cantonal migration office before assembling documents."
        links:
          - text: "ch.ch — where to apply for family reunification: contact the cantonal immigration authorities"
            sourceUrl: "https://www.ch.ch/en/foreign-nationals-in-switzerland/living-in-switzerland/family-reunification/"
            sourceName: "ch.ch — Application for family reunification in Switzerland (official federal portal)"
            # VERIFIED 2026-06-12 (fact-verifier): same ch.ch page (HTTP 200); section "Where to apply for family reunification" states verbatim: "You need to contact the following cantonal immigration authorities." Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
          - text: "SEM — addresses of the cantonal immigration and employment market authorities"
            sourceUrl: "https://www.sem.admin.ch/sem/en/home/sem/kontakt/kantonale_behoerden/adressen_kantone_und.html"
            sourceName: "State Secretariat for Migration (SEM) — Cantonal immigration and employment market authorities"
            # VERIFIED 2026-06-12 (fact-verifier): SEM page loaded (curl, browser UA, HTTP 200, title "Cantonal immigration and employment market authorities"). Page is the official per-canton address directory (entries for all cantons incl. their Migrationsamt / Amt für Migration offices). Link text accurate.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
      - text: "Observe the statutory time limit: the right to family reunification must be exercised within five years (children over 12: within twelve months)."
        links:
          - text: "FNIA Art. 47 — time limit for family reunification (five years; twelve months for children over twelve)"
            sourceUrl: "https://www.fedlex.admin.ch/eli/cc/2007/758/en#art_47"
            sourceName: "Foreign Nationals and Integration Act (FNIA, SR 142.20), Art. 47 — Fedlex"
            # VERIFIED 2026-06-12 (fact-verifier): FNIA EN consolidated HTML read from the official Fedlex filestore (in-force 2026-02-01; anchor "art_47" present). Art. 47 para. 1 verbatim: "The right to family reunification must be exercised within five years. Children over twelve must be reunified with their family within twelve months." Matches link text character-for-character.
            status: VERIFIED
            lastVerified: "2026-06-12"
            verifiedBy: "fact-verifier"
            reviewBy: "2026-09-10"
    documents:
      - "Valid US passport"
      - "Marriage certificate or registered-partnership certificate (certificate from the country of origin proving the relationship; ch.ch document list)"
      - "Visa if necessary (see the family national (type D) visa task)"
      - "Certificate of enrolment in a language course if you cannot make yourself understood in the national language of the place of residence (A1 level at least orally) — listed by ch.ch; confirm applicability for spouses of Swiss citizens with the cantonal authority"
      - "Confirm the full cantonal document checklist with the competent cantonal migration office"
    # timeline omitted (ADR-0007): processing of family-reunification applications
    # is cantonal; no official federal processing-time figure exists for this step.
    # cost omitted (ADR-0007): permit fees are set at cantonal level; no official
    # federal fee figure exists. Confirm with the cantonal migration office.
    warning: >
      The right to family reunification must be exercised within five years (Art. 47 FNIA);
      for children over 12 the limit is twelve months. A subsequent (late) reunification is
      authorised only if there are important family reasons.
    dependsOn: []

