        type: provide
        description: "Typically a valid passport; confirm with your chosen bank what identity documents they accept."
      - name: "Proof of UK address (if required)"
        type: provide
        description: "Some banks require proof of a UK address (e.g. tenancy agreement, utility bill). Requirements vary by bank — confirm before applying."
    warning: >
      No official government procedure governs opening a UK bank account; banks
      set their own rules and they differ. Confirm requirements with your chosen
      bank. We do not list fixed documents here because no official source
      prescribes them.
    dependsOn: []
    appliesIf: ""

