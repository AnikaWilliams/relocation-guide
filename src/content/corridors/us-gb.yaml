        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "When to apply / decision"
        text: "Apply at most 6 months before your course starts; a decision usually comes within 3 weeks from outside the UK. You can travel to the UK up to 1 month before your course starts if it lasts more than 6 months."
        sourceUrl: "https://www.gov.uk/student-visa"
        sourceName: "GOV.UK — Student visa: Overview"
        # DRAFT 2026-06-13 (UNVERIFIED). Overview: "The earliest you can apply for
        # a visa is 6 months before you start your course", "3 weeks, if you're
