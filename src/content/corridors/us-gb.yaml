  # ===========================================================================
  # HEALTHCARE — register with an NHS GP
  # ===========================================================================
  - id: register-nhs-gp
    title: "Register with an NHS GP surgery after you arrive"
    category: healthcare-insurance
    summary:
      text: "After you arrive, register with a local NHS GP (general practitioner) surgery so you can access routine healthcare. In England you can register with most surgeries online or on paper, usually near where you live. You only need basic information (name, date of birth, address) — you do not need ID, proof of address or proof of immigration status to register."
      sourceUrl: "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"
      sourceName: "NHS — How to register with a GP surgery"
      # VERIFIED 2026-06-13 (fact-verifier): NHS GP-registration page re-fetched LIVE (HTTP 200, nhs.uk, correct page "Register with a GP surgery", last reviewed 28 July 2025). Verbatim: "Everyone in England can register with a GP surgery or change their GP surgery for free." And: "You'll only be asked to give basic information to register with a GP surgery. This includes your name, date of birth and address. You do not need ID, proof of address or proof of immigration status." Online + paper both confirmed. England-specific framing is correct — the page repeatedly scopes to "in England" (NHS England). Supported character-for-character.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-gb 2026-06-13"
      sourceHash: "16a4747e0d0e1adc2766501fb93a1ff250cb3857f8101b4e775006ed103a1e0b"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "What you need"
        text: "Basic details only — name, date of birth and address. You do NOT need ID, proof of address or proof of immigration status to register with a GP in England."
        sourceUrl: "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"
        sourceName: "NHS — How to register with a GP surgery"
        # VERIFIED 2026-06-13 (fact-verifier): NHS page re-fetched LIVE (HTTP 200). Verbatim: "You'll only be asked to give basic information to register with a GP surgery. This includes your name, date of birth and address. You do not need ID, proof of address or proof of immigration status." Supported character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-gb 2026-06-13"
        sourceHash: "16a4747e0d0e1adc2766501fb93a1ff250cb3857f8101b4e775006ed103a1e0b"
        reviewBy: "2026-09-11"
      - label: "How long"
        text: "You can register online (about 15 minutes per person); you should usually be registered within 5 days of the surgery getting your details, though it may take longer."
        sourceUrl: "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"
        sourceName: "NHS — How to register with a GP surgery"
        # VERIFIED 2026-06-13 (fact-verifier): NHS page re-fetched LIVE (HTTP 200). Verbatim: "This takes about 15 minutes for each person you want to register." And: "You should be told when you have been registered. It will usually be within 5 days of the surgery getting your details, but it may take longer." Supported character-for-character.
