    title: "Set up Council Tax for your home"
    category: housing
    summary:
      text: "Council Tax is a local tax on residential property in England, Wales and Scotland, paid to your local council and used to fund local services. The amount depends on your property's valuation band, your council's charge for that band, and any discount or exemption. Full-time students can be exempt, and there are discounts (for example a single-adult discount), so check what applies once you have a home."
      sourceUrl: "https://www.gov.uk/council-tax"
      sourceName: "GOV.UK — How Council Tax works"
      # DRAFT 2026-06-13 (UNVERIFIED). "How Council Tax works": "You'll need to
