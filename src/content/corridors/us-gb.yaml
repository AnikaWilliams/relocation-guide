  # ===========================================================================
  # REGISTRATION-BUREAUCRACY — eVisa / UKVI account
  # ===========================================================================
  - id: evisa-ukvi-account
    title: "Set up your UKVI account and access your eVisa"
    category: registration-bureaucracy
    summary:
      text: "The UK no longer issues most physical immigration documents: your status is an 'eVisa' — an online record held in a UK Visas and Immigration (UKVI) account. You need a UKVI account to view your eVisa and to generate a 'share code' that proves your status to employers, landlords and others. Each family member needs their own UKVI account."
      sourceUrl: "https://www.gov.uk/get-access-evisa"
      sourceName: "GOV.UK — Get access to your eVisa (set up a UKVI account)"
      # VERIFIED 2026-06-13 (fact-verifier): eVisa "Set up a UKVI account to access your eVisa" page re-fetched LIVE (HTTP 200, correct page). Verbatim: "You need a UK Visas and Immigration (UKVI) account to access your eVisa. If your partner and children are joining you in the UK as 'dependants' then they need their own UKVI accounts to access their eVisas." eVisa-replaces-physical-document supported verbatim: "replaced a physical immigration document with an eVisa, for example a biometric residence permit (BRP)". Share-code purpose: this same guide's contents list "View your eVisa and get a share code to prove your immigration status" (sub-page) — supports the share-code characterisation; full share-code detail lives one click deeper. Supported.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-gb 2026-06-13"
      sourceHash: "a290ce29d8229fcadbd70c3e4eff4341252fb749e8b9a30a63869d059ed98a5b"
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "What replaces the permit"
        text: "An eVisa — an online record of your immigration status in your UKVI account. There is no town-hall registration and (for most people) no physical residence card; biometric residence permits (BRPs) are being phased out."
        sourceUrl: "https://www.gov.uk/get-access-evisa"
        sourceName: "GOV.UK — Get access to your eVisa"
        # VERIFIED 2026-06-13 (fact-verifier): eVisa page re-fetched LIVE (HTTP 200). Verbatim: "replaced a physical immigration document with an eVisa, for example a biometric residence permit (BRP) or biometric residence card (BRC)". Claim's "biometric residence permits (BRPs) are being phased out" is an accurate gloss (eVisa replaces the physical BRP/BRC) and is not overstated. No town-hall registration: there is no local-registration step on UK routes. Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-gb 2026-06-13"
        sourceHash: "a290ce29d8229fcadbd70c3e4eff4341252fb749e8b9a30a63869d059ed98a5b"
        reviewBy: "2026-09-11"
      - label: "What you need to create it"
        text: "A phone number and email you can reuse to sign in, plus a valid passport and your visa application number (GWF or UAN) or BRP number; you confirm your identity (usually via a smartphone app) and link your account to your eVisa."
        sourceUrl: "https://www.gov.uk/get-access-evisa"
        sourceName: "GOV.UK — Get access to your eVisa"
        # VERIFIED 2026-06-13 (fact-verifier): eVisa page re-fetched LIVE (HTTP 200). Verbatim: "To create an account, you'll need a phone number and email address that you can use each time you sign in. You'll also need one of the following ...: a valid passport and your visa application number - this is a global web form (GWF) number or unique application number (UAN); a valid passport and your BRP number". And: "You'll need access to a smartphone so you can install an app to confirm your identity." Supported character-for-character.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-gb 2026-06-13"
        sourceHash: "a290ce29d8229fcadbd70c3e4eff4341252fb749e8b9a30a63869d059ed98a5b"
        reviewBy: "2026-09-11"
      - label: "Each person needs their own"
        text: "If your partner and children join you as dependants, each of them needs their own UKVI account to access their own eVisa."
