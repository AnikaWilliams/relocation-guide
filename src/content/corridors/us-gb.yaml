  - id: global-talent-visa
    title: "Get a Global Talent visa (leaders in academia/research, arts, or digital technology)"
    category: visa-permit
    summary:
      text: "The Global Talent visa is for people who are a leader or potential leader in academia or research, arts and culture, or digital technology. Unlike the Skilled Worker visa it does not need an employer sponsor or a job offer. Most applicants first get an 'endorsement' confirming they are a leader/potential leader in their field; winners of certain eligible prestigious prizes can apply directly without an endorsement. You must be at least 18."
      sourceUrl: "https://www.gov.uk/global-talent"
      sourceName: "GOV.UK — Global Talent visa: Overview"
      # VERIFIED 2026-06-13 (fact-verifier): Global Talent Overview re-fetched LIVE (HTTP 200, correct page "Apply for the Global Talent visa: Overview"). Verbatim: "You can apply for a Global Talent visa to work in the UK if you're a leader or potential leader in one of the following fields: academia or research; arts and culture; digital technology. You must also be at least 18 years old." Endorsement-vs-prize verbatim: "If you've won an eligible prestigious prize, you can apply for the visa directly. If you've not won an eligible prestigious prize, you'll need to get an endorsement first". No-sponsor/no-job-offer confirmed: the page never requires a sponsor or job offer and frames Skilled Worker as the alternative ("there are other ways to work in the UK - for example a Skilled Worker visa"). Supported.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-gb 2026-06-13"
      sourceHash: "3ba22e6a017ebccebb97d2185f38f2f1d2407f809d3eea4592717f642a704d68"
      reviewBy: "2026-09-11"
    tldr:
      text: "If you are a recognised leader (or potential leader) in research/academia, arts and culture, or digital technology, the Global Talent visa lets you work in the UK without an employer sponsor or job offer. Most people need an endorsement from a designated body first; eligible-prize winners can skip that. You can live and work in the UK for up to 5 years at a time, with no overall limit, and may settle after 3 or 5 years depending on your field and route."
      sourceUrl: "https://www.gov.uk/global-talent"
      sourceName: "GOV.UK — Global Talent visa: Overview"
      # VERIFIED 2026-06-13 (fact-verifier): Overview re-fetched LIVE (HTTP 200). Verbatim: "You can live and work in the UK for up to 5 years at a time", "There's no limit to how long you can stay in the UK in total", "You may be able to get indefinite leave to remain so you can settle in the UK after 3 or 5 years, depending on which field you work in and how you apply." "may be able to" preserved. Supported.
      status: VERIFIED
