    detail: >
      The UK partner/spouse family visa is for US citizens joining a partner who
      is British or Irish, settled in the UK, or holds certain other qualifying
      statuses. You apply online from the USA, prove your relationship (a
      UK-recognised marriage/civil partnership, or at least two years living
      together), satisfy the minimum income requirement (a combined income
      threshold, with savings as an alternative), and meet the English-language
      requirement. The visa is normally granted for two years and nine months at
      a time; you can extend, and after five continuous years on the partner route
      you may apply to settle (indefinite leave to remain). Note this route is for
      partners of settled/British people — if your partner is in the UK only
      temporarily (e.g. on a work or student visa), you apply as their dependant
      under that route instead.
