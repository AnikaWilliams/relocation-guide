      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Eligibility"
        text: "You must be in the UK on a Student or Tier 4 (General) student visa, have studied an eligible UK course for the required period, and your provider must have confirmed to the Home Office you completed it."
        sourceUrl: "https://www.gov.uk/graduate-visa"
        sourceName: "GOV.UK — Graduate visa: Overview"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "How long"
        text: "2 years if you apply on or before 31 December 2026; 18 months if you apply on or after 1 January 2027; 3 years for a PhD or other doctoral qualification. It cannot be extended."
        sourceUrl: "https://www.gov.uk/graduate-visa"
        sourceName: "GOV.UK — Graduate visa: Overview"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
