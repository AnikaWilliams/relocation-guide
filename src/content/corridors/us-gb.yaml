          status: VERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: "fact-verifier-gb 2026-06-13"
          sourceHash: "7f1e03639e350a4f751e4a552b9076d813e477dc98f3c29712415494ab2a0420"
