        tip: "The CoS is electronic. You must apply for your visa within 3 months of getting it. If the employer is not yet a licensed sponsor, they must apply for a sponsor licence first."
        links:
          - text: "GOV.UK — Skilled Worker visa: Your job (sponsor licence, CoS, occupation code, salary)"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-job"
            sourceName: "GOV.UK — Skilled Worker visa: Your job"
            # VERIFIED 2026-06-13 (fact-verifier): "Your job" re-fetched LIVE (HTTP 200). Verbatim: "You must apply for your visa within 3 months of getting your certificate of sponsorship." Sponsor-licence framing supported verbatim: "If your employer is not currently approved, they can apply for a sponsor licence if they're eligible ... It usually takes around 8 weeks to process a licence application." Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
