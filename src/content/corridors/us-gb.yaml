    detail: >
      The Skilled Worker visa is the UK's main employer-sponsored work route under
      the post-Brexit points-based system; it replaced the Tier 2 (General) work
      visa. Unlike a US green card it is not a self-petition: a UK employer
      licensed by the Home Office must sponsor you and issue a Certificate of
      Sponsorship (CoS) — an electronic record, not a paper document — before you
      can apply. Your job must be on the list of eligible occupations (identified
      by a 4-digit occupation code) and you must be paid at least the minimum
      salary, which is the higher of the general threshold or the occupation's
      "going rate". You apply online from the USA, pay the application fee and the
      Immigration Health Surcharge, prove you have enough savings to support
      yourself, and prove your identity (often via the UK Immigration: ID Check
      app linked to a UKVI account). As a US national you are exempt from the
      English-language requirement. If granted, your status is an eVisa held in
      your UKVI account — there is no town-hall registration on arrival.
    steps:
