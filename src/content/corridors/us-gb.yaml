  # ===========================================================================
  # FAMILY/DEPENDENTS — bringing your partner and children on a work/study visa
  # ===========================================================================
  - id: dependants-on-work-study
    title: "Bring your partner and children as dependants on a work or study visa"
    category: family-dependents
    summary:
      text: "If you come to the UK on a Skilled Worker (or other eligible) visa, your partner and children may apply to join you or stay as your 'dependants'. Each dependant completes a separate application and pays the application fee and Immigration Health Surcharge. They must show their relationship to you and that there is enough money to support them, in addition to your own savings requirement."
      sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-partner-and-children"
      sourceName: "GOV.UK — Skilled Worker visa: Your partner and children"
      # DRAFT 2026-06-13 (UNVERIFIED). "Your partner and children may also be able
      # to apply to join you or stay in the UK as your 'dependants'. They'll need
      # to complete separate applications." Dependant definition (husband/wife/
      # civil/unmarried partner; child under 18; child over 18 already a
      # dependant). Maintenance amounts on same page. Verifier: confirm separate-
      # application + per-dependant fee.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who counts as a dependant"
        text: "Your husband, wife, civil partner or unmarried partner; your child under 18 (including one born in the UK during your stay); and a child over 18 who already has permission to be in the UK as your dependant."
        sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-partner-and-children"
        sourceName: "GOV.UK — Skilled Worker visa: Your partner and children"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Money for dependants"
        text: "On the Skilled Worker route you (or the dependant) must show extra funds: £285 for your partner, £315 for one child, and £200 for each additional child — held for 28 days in a row — unless an exemption applies. Figures change; confirm current amounts."
        sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-partner-and-children"
        sourceName: "GOV.UK — Skilled Worker visa: Your partner and children"
        # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). "£285 for your
        # partner; £315 for one child; £200 for each additional child." "had the
        # money available for at least 28 days in a row." Verifier: re-confirm.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "What dependants can do"
        text: "A dependant partner or child can work (except as a professional sportsperson or coach) and study; they cannot claim most benefits or the State Pension. They may apply to settle after 5 years."
        sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-partner-and-children"
        sourceName: "GOV.UK — Skilled Worker visa: Your partner and children"
        # DRAFT 2026-06-13 (UNVERIFIED). "Your partner or child can: work, except
        # as a sportsperson or coach; study; ... apply to settle permanently ...
        # if they've lived in the UK for 5 years." "They cannot apply for most
        # benefits (public funds), or the State Pension."
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Children born in the UK"
        text: "A child born to you in the UK does not automatically become a British citizen; you must apply for their dependant visa (before they turn 18) if you want to travel in and out of the UK with them, providing a full UK birth certificate naming both parents."
        sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-partner-and-children"
        sourceName: "GOV.UK — Skilled Worker visa: Your partner and children"
        # DRAFT 2026-06-13 (UNVERIFIED). "If you have a child while you're in the
        # UK, they do not automatically become a British citizen. You must apply
        # for your child's dependant visa ... You'll need to provide a full UK
        # birth certificate for each child, showing the names of both parents."
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Most UK work and study routes let you bring a partner and children as
      dependants, each with their own online application and fees. On the Skilled
      Worker route a dependant is your spouse/civil/unmarried partner, a child
      under 18, or a child over 18 already in the UK as your dependant. They must
      prove their relationship to you and that extra maintenance funds are
      available, on top of your own savings. Dependants can generally work and
      study. Note that a child born in the UK is not automatically British and
      needs their own dependant visa to travel; some "medium skilled" occupations
      and care-worker roles have extra restrictions on bringing dependants, so
      check the specific rules for your job.
    steps:
      - text: "Confirm each family member qualifies as a dependant on your route and gather evidence of your relationship (e.g. marriage/birth certificates)."
        links:
          - text: "GOV.UK — Skilled Worker visa: Your partner and children"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-partner-and-children"
            sourceName: "GOV.UK — Skilled Worker visa: Your partner and children"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Each dependant applies online separately (using your application number / family linking code), pays the fee and the Immigration Health Surcharge, shows the extra maintenance funds, and proves their identity."
        tip: "Dependants applying from outside the UK must apply before they travel."
        links:
          - text: "GOV.UK — Skilled Worker visa: Your partner and children (apply, money needed)"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-partner-and-children"
            sourceName: "GOV.UK — Skilled Worker visa: Your partner and children"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-07-13"
    documents:
      - name: "Each dependant's valid passport"
        type: provide
        description: "A valid passport (or identity/nationality document) for each partner and child applying."
      - name: "Evidence of relationship"
        type: provide
        description: "Marriage/civil partnership certificate for a partner, or evidence of an unmarried-partner relationship; full birth certificate (naming both parents) for each child."
      - name: "Proof of extra maintenance funds"
        type: provide
        description: "Evidence of the additional money required for dependants (e.g. £285 partner / £315 first child / £200 each further child on the Skilled Worker route), unless exempt."
      - name: "Separate online dependant application"
        type: form
        description: "The official online dependant application (one per family member), started from the GOV.UK route page for your visa type."
        form:
          text: "Each dependant applies online via the official GOV.UK 'Your partner and children' route; they apply as your partner or child, from outside or inside the UK as applicable."
          sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-partner-and-children"
          sourceName: "GOV.UK — Skilled Worker visa: Your partner and children"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
    warning: >
      Dependant rules differ by route and by occupation type (e.g. some "medium
      skilled" and care-worker roles restrict bringing dependants). Maintenance
      figures and fees change. Confirm the current dependant rules for your exact
      visa and job on GOV.UK.
    dependsOn: ["skilled-worker-visa"]
    appliesIf: "hasChildren || motivation == 'work'"

  # ===========================================================================
  # HEALTHCARE — Immigration Health Surcharge (IHS)
  # ===========================================================================
  - id: immigration-health-surcharge
    title: "Pay the Immigration Health Surcharge (IHS) to use the NHS"
    category: healthcare-insurance
    summary:
      text: "Most people pay the Immigration Health Surcharge (IHS) as part of their online immigration application. Paying it lets you use the NHS broadly free of charge from the date your visa starts (some services like prescriptions, dental and eye tests are still charged). The amount depends on the length of your visa, and you pay for the whole visa period upfront."
      sourceUrl: "https://www.gov.uk/healthcare-immigration-application"
      sourceName: "GOV.UK — Pay for UK healthcare as part of your immigration application (IHS): Overview"
      # DRAFT 2026-06-13 (UNVERIFIED). IHS Overview: "Most people need to pay the
      # immigration health surcharge (IHS) as part of their online immigration
      # application." "You can start using the NHS free of charge from the date
      # your visa starts." "You'll still need to pay for certain types of
      # services, such as prescriptions, dental treatment, eye tests and assisted
      # conception."
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Standard rate"
        text: "£1,035 per year for most applications (e.g. work and family routes). Students, their dependants, and under-18 applicants pay £776 per year. You pay for the full length of your visa upfront. Figures change — confirm current rates."
        sourceUrl: "https://www.gov.uk/healthcare-immigration-application/how-much-pay"
        sourceName: "GOV.UK — IHS: How much you have to pay"
        # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). "How much you
        # have to pay": "£776 per year for students, their dependants ... and
        # those on a Youth Mobility Scheme visa"; "£776 per year for ... under the
        # age of 18"; "£1,035 per year for all other visa and immigration
        # applications, for example £3,105 for a 3-year visa." Verifier: re-
        # confirm both rates.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "When NHS access starts"
        text: "You can use the NHS free of charge from the date your visa starts, provided you have paid the IHS — even before you have registered with a GP."
        sourceUrl: "https://www.gov.uk/healthcare-immigration-application"
        sourceName: "GOV.UK — IHS: Overview"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Always charged"
        text: "Even with the IHS paid, you pay separately for some services such as prescriptions, dental treatment, eye tests and assisted conception (and may pay for NHS treatment before a decision is made on your visa)."
        sourceUrl: "https://www.gov.uk/healthcare-immigration-application"
        sourceName: "GOV.UK — IHS: Overview"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The Immigration Health Surcharge funds your access to the National Health
      Service (NHS) and is paid as part of your online visa application, in
      addition to the application fee. It is charged per year of your visa and
      paid upfront for the whole period; the standard rate is £1,035 per year,
      with a reduced rate of £776 per year for students, their dependants and
      under-18s. Once paid, you can use the NHS broadly free of charge from the
      day your visa starts, though some services (prescriptions, dental, eye
      tests, assisted conception) are still charged. Doctors, nurses and adult
      social-care workers on the Health and Care Worker visa are exempt from the
      IHS — if that applies to you, check that route instead.
    steps:
      - text: "When you complete your visa application online, pay the IHS for the full length of your visa (it is part of the same application flow)."
        links:
          - text: "GOV.UK — IHS: How much you have to pay"
            sourceUrl: "https://www.gov.uk/healthcare-immigration-application/how-much-pay"
            sourceName: "GOV.UK — IHS: How much you have to pay"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-07-13"
    documents:
      - name: "IHS payment (within the visa application)"
        type: form
        description: "Payment of the Immigration Health Surcharge is made inside the online immigration application; it is not a separate standalone form for most applicants."
        form:
          text: "Pay the IHS as part of your online immigration application; the GOV.UK IHS pages explain who pays and how much."
          sourceUrl: "https://www.gov.uk/healthcare-immigration-application"
          sourceName: "GOV.UK — Pay for UK healthcare as part of your immigration application (IHS)"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
    cost:
      text: "£1,035 per year (standard) or £776 per year (students, their dependants, under-18s), paid upfront for the whole visa length. Confirm current rates."
      sourceUrl: "https://www.gov.uk/healthcare-immigration-application/how-much-pay"
      sourceName: "GOV.UK — IHS: How much you have to pay"
      # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). See "Standard rate".
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    warning: >
      The IHS is charged per year and paid for the whole visa upfront, so it can
      be a large sum. Rates change. If you do not pay (or underpay), UKVI emails
      you a short deadline and refuses the application if you do not pay in time.
    dependsOn: []
    appliesIf: ""

  # ===========================================================================
  # HEALTHCARE — register with an NHS GP
  # ===========================================================================
  - id: register-nhs-gp
    title: "Register with an NHS GP surgery after you arrive"
    category: healthcare-insurance
    summary:
      text: "After you arrive, register with a local NHS GP (general practitioner) surgery so you can access routine healthcare. In England you can register with most surgeries online or on paper, usually near where you live. You only need basic information (name, date of birth, address) — you do not need ID, proof of address or proof of immigration status to register."
      sourceUrl: "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"
      sourceName: "NHS — How to register with a GP surgery"
      # DRAFT 2026-06-13 (UNVERIFIED). NHS: "Everyone in England can register with
      # a GP surgery ... for free." "You'll only be asked to give basic
      # information to register ... This includes your name, date of birth and
      # address. You do not need ID, proof of address or proof of immigration
      # status." Verifier: NOTE this page is England-specific (NHS England);
      # Scotland/Wales/NI have separate systems — keep the "in England" wording.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "What you need"
        text: "Basic details only — name, date of birth and address. You do NOT need ID, proof of address or proof of immigration status to register with a GP in England."
        sourceUrl: "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"
        sourceName: "NHS — How to register with a GP surgery"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "How long"
        text: "You can register online (about 15 minutes per person); you should usually be registered within 5 days of the surgery getting your details, though it may take longer."
        sourceUrl: "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"
        sourceName: "NHS — How to register with a GP surgery"
        # DRAFT 2026-06-13 (UNVERIFIED). "This takes about 15 minutes for each
        # person you want to register." "It will usually be within 5 days of the
        # surgery getting your details, but it may take longer."
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The NHS is the UK's public health service. Registering with a local GP
      surgery is how you access routine and referral care; emergency care is
      available regardless of registration. In England you can register online
      through the NHS website (or on paper at the surgery), usually with a surgery
      near where you live, and you only provide basic details — crucially, you do
      not need ID, proof of address or proof of immigration status to register.
      You can also register as a temporary patient for up to 3 months if you are
      living away from home. This page covers NHS England; Scotland, Wales and
      Northern Ireland run their own NHS systems with separate registration
      routes.
    steps:
      - text: "Find a GP surgery near where you live and register online via the NHS website (or with a paper form at the surgery)."
        links:
          - text: "NHS — How to register with a GP surgery"
            sourceUrl: "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"
            sourceName: "NHS — How to register with a GP surgery"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Your basic details (name, date of birth, address)"
        type: provide
        description: "The only information required to register; no ID, proof of address or proof of immigration status is needed for GP registration in England."
      - name: "GP surgery registration form"
        type: form
        description: "The online (or paper) NHS GP registration form, completed via the NHS website or at your chosen surgery."
        form:
          text: "Register online via the NHS 'register with a GP surgery' service, or use the downloadable paper form at the surgery you choose."
          sourceUrl: "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/"
          sourceName: "NHS — How to register with a GP surgery"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
    warning: >
      This guidance is for NHS England. If you settle in Scotland, Wales or
      Northern Ireland, the NHS there runs separately — use that nation's own GP
      registration route.
    dependsOn: []
    appliesIf: ""

  # ===========================================================================
  # REGISTRATION-BUREAUCRACY — eVisa / UKVI account
  # ===========================================================================
  - id: evisa-ukvi-account
    title: "Set up your UKVI account and access your eVisa"
    category: registration-bureaucracy
    summary:
      text: "The UK no longer issues most physical immigration documents: your status is an 'eVisa' — an online record held in a UK Visas and Immigration (UKVI) account. You need a UKVI account to view your eVisa and to generate a 'share code' that proves your status to employers, landlords and others. Each family member needs their own UKVI account."
      sourceUrl: "https://www.gov.uk/get-access-evisa"
      sourceName: "GOV.UK — Get access to your eVisa (set up a UKVI account)"
      # DRAFT 2026-06-13 (UNVERIFIED). "Set up a UKVI account to access your
      # eVisa": "You need a UK Visas and Immigration (UKVI) account to access your
      # eVisa. If your partner and children are joining you in the UK as
      # 'dependants' then they need their own UKVI accounts to access their
      # eVisas." Verifier: confirm eVisa-replaces-physical-document framing and
      # the share-code purpose (latter on the "View your eVisa and get a share
      # code" sub-page within the same guide).
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "What replaces the permit"
        text: "An eVisa — an online record of your immigration status in your UKVI account. There is no town-hall registration and (for most people) no physical residence card; biometric residence permits (BRPs) are being phased out."
        sourceUrl: "https://www.gov.uk/get-access-evisa"
        sourceName: "GOV.UK — Get access to your eVisa"
        # DRAFT 2026-06-13 (UNVERIFIED). Page references replacing "a physical
        # immigration document with an eVisa, for example a biometric residence
        # permit (BRP)". Verifier: confirm BRP phase-out wording is not
        # overstated.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "What you need to create it"
        text: "A phone number and email you can reuse to sign in, plus a valid passport and your visa application number (GWF or UAN) or BRP number; you confirm your identity (usually via a smartphone app) and link your account to your eVisa."
        sourceUrl: "https://www.gov.uk/get-access-evisa"
        sourceName: "GOV.UK — Get access to your eVisa"
        # DRAFT 2026-06-13 (UNVERIFIED). "To create an account, you'll need a
        # phone number and email address ... a valid passport and your visa
        # application number - this is a global web form (GWF) number or unique
        # application number (UAN) ... You'll need access to a smartphone so you
        # can install an app to confirm your identity."
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Each person needs their own"
        text: "If your partner and children join you as dependants, each of them needs their own UKVI account to access their own eVisa."
        sourceUrl: "https://www.gov.uk/get-access-evisa"
        sourceName: "GOV.UK — Get access to your eVisa"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Under the UK's digital immigration system, your permission to be in the UK
      is an eVisa rather than a sticker or card. You access it through a UK Visas
      and Immigration (UKVI) account, which you create with a reusable phone
      number and email plus your passport and visa application number (GWF/UAN);
      you confirm your identity, usually with a smartphone app, and link the
      account to your eVisa. From the account you can view your status and create
      a time-limited "share code" to prove your right to work, rent or access
      services. There is no separate residence-registration step at a local
      authority — the eVisa is your status record. Note you may already have a
      UKVI account if you used the ID Check app or created one during your
      application; do not create a second account.
    steps:
      - text: "Check whether you already have a UKVI account (e.g. from using the ID Check app during your application). If not, create one with a reusable phone number and email."
        links:
          - text: "GOV.UK — Get access to your eVisa (create a UKVI account)"
            sourceUrl: "https://www.gov.uk/get-access-evisa"
            sourceName: "GOV.UK — Get access to your eVisa"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Confirm your identity (usually via the app), link your account to your eVisa, and use it to view your status and generate share codes when needed."
        links:
          - text: "GOV.UK — Get access to your eVisa"
            sourceUrl: "https://www.gov.uk/get-access-evisa"
            sourceName: "GOV.UK — Get access to your eVisa"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Reusable phone number and email address"
        type: provide
        description: "A phone number and email you can use each time you sign in to your UKVI account."
      - name: "Valid passport and your application number (GWF/UAN) or BRP number"
        type: provide
