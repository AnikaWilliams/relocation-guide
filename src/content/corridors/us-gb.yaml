    appliesIf: "motivation == 'study'"

  # ===========================================================================
  # STUDY ROUTE — Graduate visa (post-study work)
  # ===========================================================================
  - id: graduate-visa
    title: "Switch to a Graduate visa after completing your UK course"
    category: visa-permit
    summary:
      text: "The Graduate visa lets you stay in the UK to work or look for work after successfully completing an eligible UK course. You must be in the UK on a Student (or Tier 4) visa when you apply, and your education provider must have told the Home Office you completed your course. It does not need a sponsor or job offer and cannot be extended, but you can switch from it to another visa such as the Skilled Worker visa."
      sourceUrl: "https://www.gov.uk/graduate-visa"
      sourceName: "GOV.UK — Graduate visa: Overview"
      # DRAFT 2026-06-13 (UNVERIFIED). Overview: "A Graduate visa gives you
      # permission to stay in the UK for at least 18 months after successfully
      # completing an eligible course", eligibility list ("you're in the UK",
      # "your current visa is a Student visa or Tier 4 (General) student visa",
      # course completed), "You cannot extend your Graduate visa. However, you may
      # be able to switch to a different visa, for example a Skilled Worker visa."
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "After finishing an eligible UK degree on a Student visa, you can switch (from inside the UK) to a Graduate visa to work, look for work, or be self-employed without needing a sponsor. It lasts 2 years (or 18 months if you apply on/after 1 January 2027), or 3 years for a PhD. It cannot be extended, but you can move on to a Skilled Worker visa."
