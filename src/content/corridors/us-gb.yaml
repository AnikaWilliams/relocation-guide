    documents:
      - name: "Certificate of Sponsorship (CoS) reference number"
        type: provide
        description: "The electronic CoS reference number from your sponsoring employer — ask them for a copy if you do not have it. It carries your job title, salary, occupation code, employer name and sponsor licence number."
      - name: "Valid passport or identity document"
        type: provide
        description: "A valid US passport (or other document showing your identity and nationality) for your application and to prove identity."
      - name: "Proof of personal savings"
        type: provide
        description: "Evidence you have at least £1,270 available to support yourself (e.g. bank statements) — not required if your CoS shows your employer will cover your costs, or if you are exempt."
      - name: "TB test results (if required)"
        type: provide
        description: "Tuberculosis test results — required only if you are applying from a listed country. (The USA is not generally a listed TB-test country; confirm your situation.)"
      - name: "Criminal record certificate (if required)"
        type: provide
        description: "Required only if you will work in certain jobs (e.g. education, healthcare, therapy, social services) and are applying from outside the UK."
      - name: "Online Skilled Worker visa application"
        type: form
        description: "The official online application for the Skilled Worker visa, started from the GOV.UK route page (the 'Apply from outside the UK' path)."
