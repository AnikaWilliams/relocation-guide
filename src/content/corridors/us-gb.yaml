  - id: family-partner-visa
    title: "Get a family visa as a partner or spouse"
    category: family-dependents
    summary:
      text: "You need a family visa to live in the UK for more than 6 months with a partner who is settled in the UK or is a British or Irish citizen (and certain other statuses). You must both be 18 or over, intend to live together permanently, prove your relationship (marriage/civil partnership, or living together for at least 2 years), meet a minimum income requirement, and meet the English-language requirement."
