        text: "A UK employer approved by the Home Office (a 'sponsor'). They issue you a Certificate of Sponsorship (CoS) — an electronic record with a reference number you use in your application. You cannot apply without a CoS."
        sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-job"
        sourceName: "GOV.UK — Skilled Worker visa: Your job"
        # DRAFT 2026-06-13 (UNVERIFIED). "Your job" page: "You must have a job
