    detail: >
      The Student visa is the route for US citizens enrolling at a UK university
      or college that is a licensed student sponsor. The institution must make you
      an unconditional offer and issue a Confirmation of Acceptance for Studies
      (CAS) — a reference number you enter on your application, valid for 6 months.
      You apply online from the USA, pay the application fee and the (reduced)
      student Immigration Health Surcharge, and prove your knowledge of English
      and your finances. As a US national you benefit from the differential
      evidence requirement, which means you usually do not have to submit
      maintenance-fund and qualification evidence upfront (UKVI may still ask). A
      degree-level course usually permits a stay of up to 5 years; you may work
      limited hours depending on your study, and after completing your course you
      may be eligible to switch to a Graduate visa to stay and work.
