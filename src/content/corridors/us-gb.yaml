#       income: UK residence and tax (Statutory Residence Test).
#   - NHS (nhs.uk): How to register with a GP surgery.
#
# Sources that FAILED capture: none. Every page attempted returned HTTP 200.
#
# KEY ACCURACY NOTES (corridor-specific, for the verifier):
#  1. POST-BREXIT POINTS-BASED SYSTEM. The UK is NOT in Schengen and has no
#     D-visa / commune-registration model. There is no residence-permit card
#     issued at a town hall; immigration status is an electronic eVisa held in a
#     UK Visas and Immigration (UKVI) account (biometric residence permits/BRPs
#     are being retired). No Anmeldung-style local registration exists.
#  2. US-SPECIFIC EXEMPTIONS (genuine corridor value):
#       - US nationals are EXEMPT from proving knowledge of English for the
#         Skilled Worker visa (USA is on the exemption list).
#       - US nationals fall under the Student visa "differential evidence
#         requirement": they need not upfront-prove maintenance funds (may still
#         be asked).
#  3. ENTITLEMENT REGISTER: gov.uk uses "you must / you can apply if" — work and
#     study routes are conditional eligibility, not a discretionary quota and not
#     an automatic entitlement. The Skilled Worker route requires employer
#     sponsorship (a Certificate of Sponsorship from a Home-Office-approved
#     sponsor); it is NOT a self-petition like a US green card.
#  4. FEES/THRESHOLDS change frequently (annual or more). Every figure-bearing
#     claim carries reviewBy = today+30d (2026-07-13). All other claims carry
#     today+90d (2026-09-11).
#  5. Salary figures captured 2026-06-13: Skilled Worker general threshold
#     £41,700/yr "or the going rate, whichever is higher"; £33,400 lower floor in
#     limited cases. These are current-as-captured; verifier must re-confirm.
# =============================================================================
originIso2: us
destinationIso2: gb
title: "Moving from the USA to the United Kingdom"
description: "How US citizens relocate to the UK under the post-Brexit points-based system: the right visa for your route (Skilled Worker, Global Talent, Student, Graduate, or family/partner), the Certificate of Sponsorship, salary and going-rate thresholds, the Immigration Health Surcharge (IHS), the eVisa and UKVI account that replace a physical permit, registering with an NHS GP, getting a National Insurance number, and how UK tax residence works. The UK is not in Schengen: there is no D-visa and no town-hall registration."
lastReviewed: "2026-06-13"
reviewedBy: "research-gb"
published: false
# Covered routes drafted in this research run: work (Skilled Worker + Global
# Talent), study (Student + Graduate), and family (partner/spouse of a person
# settled or British in the UK). "Retirement" and "other" are NOT covered: the
# UK has no dedicated retirement-residence route, so it is deliberately omitted
# rather than invented.
coversMotivations: [work, study, family]
