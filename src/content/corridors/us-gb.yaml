  # ===========================================================================
  # STUDY ROUTE — Student visa
  # ===========================================================================
  - id: student-visa
    title: "Get a Student visa (study at a licensed UK institution)"
    category: education
    summary:
      text: "The Student visa lets you study in the UK if you are 16 or over, have an unconditional offer of a place on a course from a licensed student sponsor (your university or college), can support yourself and pay for your course, and can use English. Your institution issues you a 'Confirmation of Acceptance for Studies' (CAS) reference number, which you need before you apply. This replaced the Tier 4 (General) student visa."
      sourceUrl: "https://www.gov.uk/student-visa"
      sourceName: "GOV.UK — Student visa: Overview"
      # DRAFT 2026-06-13 (UNVERIFIED). Overview eligibility list + "This visa has
      # replaced the Tier 4 (General) student visa." CAS requirement on the
      # companion "Your course" page. Verifier: confirm licensed-sponsor + CAS.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "To study in the UK as a US citizen, you need a place on a course with a licensed student sponsor and a Confirmation of Acceptance for Studies (CAS) from them before you apply. As a US national you fall under the 'differential evidence requirement', so you usually do not have to prove your maintenance funds upfront (though you may still be asked). A degree-level course usually lets you stay up to 5 years; after completing your course you may be able to switch to a Graduate visa."
      sourceUrl: "https://www.gov.uk/student-visa/money"
      sourceName: "GOV.UK — Student visa: Money you need"
      # DRAFT 2026-06-13 (UNVERIFIED). "Money you need": "You do not need to prove
      # you have enough money to support yourself if you're ... from one of the
      # following countries or territories:" — list includes "United States of
      # America". Overview: "If you're 18 or over and your course is at degree
      # level, you can usually stay in the UK for up to 5 years." Graduate-switch
      # on Overview. Verifier: confirm USA on differential-evidence list.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "You need a CAS"
        text: "An unconditional offer from a licensed student sponsor, who sends you a Confirmation of Acceptance for Studies (CAS) reference number. You must apply within 6 months of receiving your CAS."
        sourceUrl: "https://www.gov.uk/student-visa/course"
        sourceName: "GOV.UK — Student visa: Your course"
        # DRAFT 2026-06-13 (UNVERIFIED). "Your course": "You must have an
        # unconditional offer of a place on a course with a licensed student
        # sponsor", "your education provider will send you a reference number
        # (called a Confirmation of Acceptance for Studies (CAS))", "You must
        # apply for your visa within 6 months of receiving your CAS."
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Money (US applicants)"
        text: "As a US national you fall under the 'differential evidence requirement' and usually do not need to prove your maintenance funds upfront, though UKVI may still ask. The underlying amounts are £1,529/month (London) or £1,171/month (outside London), for up to 9 months, plus course fees."
        sourceUrl: "https://www.gov.uk/student-visa/money"
        sourceName: "GOV.UK — Student visa: Money you need"
        # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). "Money you need":
        # "£1,529 per month (for up to 9 months) for courses in London; £1,171 per
        # month (for up to 9 months) for courses outside London." Differential
        # evidence list includes "United States of America" with caveat "you
        # might be asked to provide this evidence before you get a decision."
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-07-13"
      - label: "Cost"
        text: "£558 to apply from outside the UK, plus the Immigration Health Surcharge — for students this is usually £776 per year. Figures change — confirm current amounts."
        sourceUrl: "https://www.gov.uk/student-visa"
        sourceName: "GOV.UK — Student visa: Overview"
        # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). Overview: "£558 to
        # apply for a Student visa from outside the UK". Student IHS rate (£776/yr)
