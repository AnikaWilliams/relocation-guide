        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      A UK bank account is needed to receive your salary and to pay rent and
      bills; GOV.UK's "start a new job" guidance lists your bank details as
      something you give a new employer in order to be paid. However, there is no
      single official government procedure for opening an account: UK banks each
      set their own identity and proof-of-address requirements, and what counts as
      acceptable proof of address (and whether one is required at all for newer
      app-based banks) varies by provider. Before choosing a bank, confirm
      directly with them what documents they need from a recent arrival — this is
      a known practical hurdle, and we do not publish a document list here because
      no official source prescribes one.
    steps:
      - text: "Choose a UK bank and check its account-opening requirements for new arrivals directly with the bank (ID and any proof-of-address rules differ by provider)."
        links:
