    detail: >
      The Global Talent visa suits US applicants who do not have (or do not want)
      an employer sponsor but are recognised leaders or emerging leaders in
      research and academia, arts and culture, or digital technology. There are
      two paths: an endorsement route (a designated endorsing body assesses your
      standing in your field, then you apply for the visa) and a direct route for
      named winners of certain eligible prestigious prizes. There is no salary
      threshold and no sponsor, and there is no overall cap on total time in the
      UK — you can hold and extend the visa for up to 5 years at a time and may
      become eligible to settle after 3 or 5 years depending on your field. As
      with all UK routes, your status is held as an eVisa in a UKVI account.
    steps:
      - text: "Decide your route: check whether you have won an eligible prestigious prize on the official list (apply directly) or need to apply for an endorsement first."
