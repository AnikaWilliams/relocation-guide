        text: "Usually the higher of £41,700 per year OR the 'going rate' for your specific occupation code — whichever is greater. In limited cases (not healthcare/education) you might qualify with a salary of at least £33,400. Healthcare and education jobs use national pay scales. These figures change — confirm the current amounts before relying on them."
        sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-job"
        sourceName: "GOV.UK — Skilled Worker visa: Your job"
        # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). "Your job":
