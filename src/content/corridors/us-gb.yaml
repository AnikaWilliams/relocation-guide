  - id: skilled-worker-visa
    title: "Get a Skilled Worker visa (employer-sponsored work)"
    category: visa-permit
    summary:
      text: "The Skilled Worker visa lets you come to the UK to do an eligible job for a UK employer that the Home Office has approved as a sponsor. You must have a confirmed job offer and a 'Certificate of Sponsorship' (CoS) from that employer before you apply, the job must be on the list of eligible occupations, and you must be paid at least the minimum salary for the type of work. This is sponsorship-based, not a self-petition: you cannot apply without an approved sponsor."
