            reviewBy: "2026-09-11"
      - text: "If needed, apply for an endorsement in your field, then apply online for the visa itself; prove your identity and submit your documents."
        tip: "If applying via endorsement you pay the fee in two parts (endorsement first, then visa)."
        links:
