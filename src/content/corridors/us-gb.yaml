            sourceHash: "50764181d7e67233d2e5a25a78eb42579220b0e634d37293161845f809543cea"
            reviewBy: "2026-09-11"
      - text: "Check your job is eligible: find its 4-digit occupation code and confirm it is on the list of eligible occupations, and that your salary meets the minimum (the higher of the general threshold or your occupation's going rate)."
        links:
          - text: "GOV.UK — Skilled Worker visa: Your job (occupation code + going rate)"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-job"
            sourceName: "GOV.UK — Skilled Worker visa: Your job"
            # VERIFIED 2026-06-13 (fact-verifier): "Your job" re-fetched LIVE (HTTP 200). Verbatim: "Before you can find out if your job is eligible, you need to know its 4-digit occupation code" and "Each occupation code has its own annual going rate. Check the going rate for your job in the going rates table." Eligible-occupations table referenced verbatim ("view the table of eligible jobs to see if it's included"). Link accurate.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-gb 2026-06-13"
            sourceHash: "50764181d7e67233d2e5a25a78eb42579220b0e634d37293161845f809543cea"
