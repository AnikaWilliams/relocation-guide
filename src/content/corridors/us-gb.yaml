          - text: "GOV.UK — How Council Tax works (discounts and exemptions)"
            sourceUrl: "https://www.gov.uk/council-tax"
            sourceName: "GOV.UK — How Council Tax works"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Your new address and tenancy/ownership details"
        type: provide
        description: "Details of the home you are responsible for, to register for Council Tax with the local council."
    warning: >
      Council Tax amounts are set locally and vary by council and band, so no
