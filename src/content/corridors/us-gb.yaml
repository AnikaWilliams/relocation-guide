      # council charges for that band; whether you can get a discount or
      # exemption." Contents list includes "Discounts for full-time students."
      # Verifier: confirm coverage (England/Wales/Scotland — NI uses domestic
      # rates, not Council Tax) and the student-exemption pointer.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "What sets the amount"
        text: "Your property's valuation band, your local council's charge for that band, and any discount or exemption you qualify for."
        sourceUrl: "https://www.gov.uk/council-tax"
        sourceName: "GOV.UK — How Council Tax works"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Student exemption"
        text: "Full-time students may be exempt from Council Tax, and other discounts exist (e.g. a single-adult discount). Check what applies with your local council."
        sourceUrl: "https://www.gov.uk/council-tax"
        sourceName: "GOV.UK — How Council Tax works (Discounts for full-time students)"
        # DRAFT 2026-06-13 (UNVERIFIED). Contents includes "Discounts for
        # full-time students." Verifier: confirm the student exemption from the
        # linked sub-page; the summary keeps it as "may be exempt."
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Council Tax is a domestic property tax collected by your local council in
      England, Wales and Scotland (Northern Ireland uses a separate domestic-rates
      system). Your bill depends on three things: the valuation band assigned to
      your home, the rate your council charges for that band, and any discounts or
      exemptions. Full-time students can be exempt and there are other reductions,
      such as a discount where only one adult lives in the property. When you move
      into a home you are responsible for, tell the local council so your Council
      Tax account is set up, and claim any discount or exemption you are entitled
      to. The exact amount is set locally, so we do not publish a figure here.
    steps:
