      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-gb 2026-06-13"
      sourceHash: "d134b5cb7e440af44406ad65b9226832522b4ae5dd49cd960c197b4415d32ef8"
