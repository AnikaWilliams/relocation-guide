    detail: >
      The Graduate visa is the UK's post-study work route. It is only available
      from inside the UK to people who hold a Student (or Tier 4) visa and have
      successfully completed an eligible course; you can apply once your provider
      tells the Home Office you have finished, without waiting for graduation. It
      needs no employer sponsor and lets you work in most jobs, be self-employed,
      or job-hunt — making it the usual bridge from study to a sponsored Skilled
      Worker role. It cannot be extended, so plan your next visa (often Skilled
      Worker) before it expires.
