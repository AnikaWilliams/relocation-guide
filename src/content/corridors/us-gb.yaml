      reviewBy: "2026-07-13"
    warning: >
      A Graduate visa cannot be extended. If you want to stay beyond it, line up
      another route (usually a Skilled Worker visa) before it expires. Fees and
      duration rules change — confirm current details on GOV.UK.
    dependsOn: ["student-visa"]
    appliesIf: "motivation == 'study'"

