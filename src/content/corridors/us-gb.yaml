            sourceName: "GOV.UK — Student visa: Your course"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Apply online from the USA (up to 6 months before your course starts), pay the application fee and the student Immigration Health Surcharge, and prove your identity."
        tip: "As a US national you usually need not prove maintenance funds upfront, but keep evidence ready in case UKVI asks."
        links:
          - text: "GOV.UK — Student visa: Money you need (US differential evidence)"
            sourceUrl: "https://www.gov.uk/student-visa/money"
            sourceName: "GOV.UK — Student visa: Money you need"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-07-13"
    documents:
      - name: "Confirmation of Acceptance for Studies (CAS) reference number"
        type: provide
        description: "The CAS reference number issued by your licensed student sponsor — required before you apply (valid 6 months)."
      - name: "Valid passport or identity document"
        type: provide
        description: "A valid US passport (or other identity/nationality document) for the application."
      - name: "Proof of finances (if asked)"
        type: provide
        description: "Evidence of course fees and maintenance funds. As a US national you usually do not submit this upfront, but UKVI may request it before deciding."
      - name: "ATAS certificate (if required)"
        type: provide
        description: "An Academic Technology Approval Scheme (ATAS) certificate if your course/research at RQF level 7 or above is in a sensitive subject."
      - name: "Online Student visa application"
        type: form
        description: "The official online application for the Student visa, started from the GOV.UK route page (apply from outside the UK)."
        form:
          text: "Apply online for the Student visa via the official GOV.UK route page; choose the apply-from-outside-the-UK path."
          sourceUrl: "https://www.gov.uk/student-visa"
          sourceName: "GOV.UK — Student visa: Overview"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
    timeline:
      text: "Usually 3 weeks for a decision after applying from outside the UK; you can apply up to 6 months before your course starts."
      sourceUrl: "https://www.gov.uk/student-visa"
      sourceName: "GOV.UK — Student visa: Overview"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    cost:
      text: "£558 to apply from outside the UK, plus the student Immigration Health Surcharge of usually £776 per year. Confirm current figures."
      sourceUrl: "https://www.gov.uk/student-visa"
      sourceName: "GOV.UK — Student visa: Overview"
      # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). See "Cost" keyFact.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    warning: >
      Maintenance amounts, fees and the IHS rate change. The differential
      evidence requirement removes the upfront proof for US nationals but UKVI
      can still ask — do not destroy your financial evidence until your visa is
      granted.
