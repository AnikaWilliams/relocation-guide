        text: "To get paid, you give your new employer your bank details (alongside your National Insurance number) — so a UK account is part of starting work."
        sourceUrl: "https://www.gov.uk/apply-national-insurance-number"
        sourceName: "GOV.UK — Start a new job: step by step (Apply for a National Insurance number)"
        # DRAFT 2026-06-13 (UNVERIFIED). "Start a new job" step list (on the
