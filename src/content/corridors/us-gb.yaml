        # your National Insurance number; your bank details; proof of your
        # identity ..." Supports "you give your employer bank details to get
        # paid." Verifier: confirm this is on the captured page.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Requirements vary"
        text: "Each bank sets its own ID and proof-of-address requirements; there is no single government procedure. Confirm with the specific bank what they accept (e.g. passport, eVisa, tenancy agreement)."
        sourceUrl: "https://www.gov.uk/apply-national-insurance-number"
        sourceName: "Confirm with your chosen UK bank"
        # DRAFT 2026-06-13 (UNVERIFIED, HONEST GAP). No official numeric/document
