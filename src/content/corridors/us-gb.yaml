      # one of the following fields: academia or research; arts and culture;
      # digital technology. You must also be at least 18 years old." Endorsement
      # vs prize routes described. Verifier: confirm no sponsor/job-offer needed.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
