  # ===========================================================================
  # TAXES — UK tax residence
  # ===========================================================================
  - id: uk-tax-residence
    title: "Understand your UK tax residence (and double taxation with the USA)"
    category: taxes
    summary:
      text: "Whether you pay UK tax on your worldwide income depends on your UK tax-residence status, worked out under the Statutory Residence Test (SRT). UK residents normally pay UK tax on all their income (UK and foreign); non-residents pay UK tax only on UK income. As a US citizen you also remain subject to US tax on worldwide income, so understand both systems and the relief for being taxed twice."
      sourceUrl: "https://www.gov.uk/tax-foreign-income/residence"
      sourceName: "GOV.UK — Tax on foreign income: UK residence and tax (Statutory Residence Test)"
      # DRAFT 2026-06-13 (UNVERIFIED). "UK residence and tax": "Non-residents only
      # pay tax on their UK income ... Residents normally pay UK tax on all their
      # income, whether it's from the UK or abroad." SRT day-count tests listed.
      # The US-citizenship-based-taxation point is general knowledge but is NOT on
      # this UK page — see note below; verifier should source/flag it separately.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "How residence is decided"
        text: "By the Statutory Residence Test, based largely on how many days you spend in the UK in the tax year (6 April–5 April), plus automatic UK/overseas tests and a 'sufficient ties' test. For example, 183+ days in the UK in the tax year usually makes you UK resident."
        sourceUrl: "https://www.gov.uk/tax-foreign-income/residence"
        sourceName: "GOV.UK — Tax on foreign income: UK residence and tax"
        # DRAFT 2026-06-13 (UNVERIFIED). "Whether you're UK resident usually
        # depends on how many days you spend in the UK in the tax year (6 April to
        # 5 April the following year)." "You may be resident under the automatic
        # UK tests if: you spent 183 or more days in the UK in the tax year ...".
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "What residents are taxed on"
        text: "UK residents normally pay UK tax on all income, UK and foreign; non-residents pay UK tax only on UK income. When you move in or out, the tax year is usually split into a resident and a non-resident part ('split-year treatment')."
        sourceUrl: "https://www.gov.uk/tax-foreign-income/residence"
        sourceName: "GOV.UK — Tax on foreign income: UK residence and tax"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "US citizens taxed twice"
        text: "Confirm with HMRC and the IRS: as a US citizen you generally remain subject to US tax on worldwide income even while UK-resident; relief for being taxed in both countries is dealt with through double-taxation rules. Get professional cross-border tax advice."
        sourceUrl: "https://www.gov.uk/tax-foreign-income/residence"
        sourceName: "GOV.UK — Tax on foreign income (see 'If you're taxed twice'); confirm with HMRC and the IRS"
        # DRAFT 2026-06-13 (UNVERIFIED, HONEST GAP). The captured UK page's
        # contents include "If you're taxed twice", but the US-citizenship-based-
        # taxation fact is a US-side rule not stated on this UK page. Phrased as
        # "confirm with HMRC and the IRS" per the no-unsourced-claim rule.
        # Verifier: either source the double-taxation/US-taxation point to an
        # official page (HMRC double-taxation guidance and/or IRS) and re-point,
        # or keep the "confirm with" framing.
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Your UK tax exposure turns on whether you are UK tax-resident, decided by
      the Statutory Residence Test (SRT). The SRT looks mainly at how many days
      you spend in the UK during the tax year (6 April to 5 April), via a set of
      automatic UK tests, automatic overseas tests, and a "sufficient ties" test;
      for instance, spending 183 or more days in the UK in the tax year usually
      makes you resident. UK residents are normally taxed on their worldwide
      income; non-residents only on UK income. When you arrive or leave mid-year,
      the year is often split into resident and non-resident parts (split-year
      treatment). Critically for US citizens: the USA taxes its citizens on
      worldwide income regardless of where they live, so you can face tax in both
      countries. The mechanics of relief are handled through double-taxation
      rules — get professional cross-border (UK/US) tax advice, and confirm
      specifics with HMRC and the IRS, before you rely on any treatment.
    steps:
      - text: "Work out your UK residence status for the tax year using the Statutory Residence Test (day counts, automatic tests, sufficient-ties test)."
        links:
          - text: "GOV.UK — Tax on foreign income: UK residence and tax (SRT)"
            sourceUrl: "https://www.gov.uk/tax-foreign-income/residence"
            sourceName: "GOV.UK — Tax on foreign income: UK residence and tax"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "As a US citizen, get cross-border tax advice and confirm how your US and UK tax obligations interact (and any double-taxation relief) with HMRC and the IRS."
        tip: "This is complex and personal; do not rely on general guidance for your own filing position."
        links:
          - text: "GOV.UK — Tax on foreign income (overview, including 'If you're taxed twice')"
            sourceUrl: "https://www.gov.uk/tax-foreign-income/residence"
            sourceName: "GOV.UK — Tax on foreign income"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Records of days spent in the UK and abroad"
        type: provide
        description: "Travel records and day counts for the tax year, needed to apply the Statutory Residence Test."
    warning: >
      UK tax residence and US/UK double taxation are complex and personal. As a US
      citizen you may owe tax in both countries. This is general information, not
      tax advice — confirm your position with HMRC, the IRS and a qualified
      cross-border tax adviser.
    dependsOn: []
    appliesIf: ""
