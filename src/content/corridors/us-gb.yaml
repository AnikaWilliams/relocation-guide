        tip: "The savings must usually have been in your account for 28 consecutive days, with day 28 within 31 days of applying."
        links:
          - text: "GOV.UK — Skilled Worker visa: How much it costs"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/how-much-it-costs"
            sourceName: "GOV.UK — Skilled Worker visa: How much it costs"
            # VERIFIED 2026-06-13 (fact-verifier): "How much it costs" re-fetched LIVE (HTTP 200). Verbatim: "support yourself when you arrive in the UK - you'll usually need to have at least £1,270 available (unless you're exempt)" and "You will need to have had the money available for at least 28 days in a row. Day 28 must be within 31 days of applying for this visa." Employer-certifies-maintenance exemption supported ("Your employer will need to complete the 'sponsor certifies maintenance' section on your certificate"). £1,270 + 28/31-day rule supported character-for-character.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-gb 2026-06-13"
            sourceHash: "5ff69ae5009e40209534ba9341a731947c22aa83110d38c0e03d69ded0df6e0e"
            reviewBy: "2026-07-13"
      - text: "Prove your identity (usually with the 'UK Immigration: ID Check' app and a UKVI account, or by giving biometrics at a visa application centre) and submit your documents."
