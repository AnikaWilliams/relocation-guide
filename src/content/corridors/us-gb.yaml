        text: "£937 application fee, plus the Immigration Health Surcharge of usually £1,035 for each year of your stay. Figures change — confirm current amounts."
        sourceUrl: "https://www.gov.uk/graduate-visa"
        sourceName: "GOV.UK — Graduate visa: Overview"
        # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). "pay the £937
