      sourceName: "GOV.UK — UK family visa: Financial requirements (partner or spouse)"
      # VERIFIED 2026-06-13 (fact-verifier): "Financial requirements" re-fetched LIVE (HTTP 200). £29,000 matches character-for-character. Verbatim: "you and your partner usually need to prove that your combined income is at least £29,000 a year. This is called a 'minimum income requirement'." 2yr9mo + 5-year settle cross-confirmed on the partner/spouse page (sourceHash 196822e2…: "You can stay in the UK for 2 years and 9 months." and "The earliest you can apply to settle in the UK ... is after you've lived in the UK for 5 years continuously on a family visa as a partner."). Supported.
