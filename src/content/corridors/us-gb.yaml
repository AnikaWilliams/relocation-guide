      # confirmed job offer before you apply." Verifier: confirm the
      # sponsorship-required framing and that this replaced Tier 2 (General).
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "To work in the UK as a US citizen, the main route is the Skilled Worker visa: you need a job offer from a UK employer the Home Office has licensed as a sponsor, a Certificate of Sponsorship from them, an eligible occupation, and a salary at or above the minimum. As a US national you do not have to prove your knowledge of English for this visa. The visa can last up to 5 years before you extend, and after 5 years you may be able to apply to settle (indefinite leave to remain)."
      sourceUrl: "https://www.gov.uk/skilled-worker-visa"
      sourceName: "GOV.UK — Skilled Worker visa: Overview"
      # DRAFT 2026-06-13 (content-researcher, UNVERIFIED). Overview: "Your visa
      # can last for up to 5 years before you need to extend it" and "After 5
