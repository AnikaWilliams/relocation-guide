    detail: >
      The Skilled Worker visa is the UK's main employer-sponsored work route under
      the post-Brexit points-based system; it replaced the Tier 2 (General) work
      visa. Unlike a US green card it is not a self-petition: a UK employer
      licensed by the Home Office must sponsor you and issue a Certificate of
      Sponsorship (CoS) — an electronic record, not a paper document — before you
      can apply. Your job must be on the list of eligible occupations (identified
      by a 4-digit occupation code) and you must be paid at least the minimum
      salary, which is the higher of the general threshold or the occupation's
      "going rate". You apply online from the USA, pay the application fee and the
      Immigration Health Surcharge, prove you have enough savings to support
      yourself, and prove your identity (often via the UK Immigration: ID Check
      app linked to a UKVI account). As a US national you are exempt from the
      English-language requirement. If granted, your status is an eVisa held in
      your UKVI account — there is no town-hall registration on arrival.
    steps:
      - text: "Get a confirmed job offer from a UK employer that holds (or applies for) a sponsor licence, and ask them for your Certificate of Sponsorship (CoS) reference number."
        tip: "The CoS is electronic. You must apply for your visa within 3 months of getting it. If the employer is not yet a licensed sponsor, they must apply for a sponsor licence first."
        links:
          - text: "GOV.UK — Skilled Worker visa: Your job (sponsor licence, CoS, occupation code, salary)"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-job"
            sourceName: "GOV.UK — Skilled Worker visa: Your job"
            # DRAFT 2026-06-13 (UNVERIFIED). "You must apply for your visa within
            # 3 months of getting your certificate of sponsorship." Sponsor-
            # licence framing on same page.
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Check your job is eligible: find its 4-digit occupation code and confirm it is on the list of eligible occupations, and that your salary meets the minimum (the higher of the general threshold or your occupation's going rate)."
        links:
          - text: "GOV.UK — Skilled Worker visa: Your job (occupation code + going rate)"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/your-job"
            sourceName: "GOV.UK — Skilled Worker visa: Your job"
            # DRAFT 2026-06-13 (UNVERIFIED). "Before you can find out if your job
            # is eligible, you need to know its 4-digit occupation code", "Each
            # occupation code has its own annual going rate. Check the going rate
            # for your job in the going rates table."
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Apply online from the USA, pay the application fee and the Immigration Health Surcharge, and show you have at least £1,270 in savings to support yourself (unless exempt or your employer certifies maintenance)."
        tip: "The savings must usually have been in your account for 28 consecutive days, with day 28 within 31 days of applying."
        links:
          - text: "GOV.UK — Skilled Worker visa: How much it costs"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/how-much-it-costs"
            sourceName: "GOV.UK — Skilled Worker visa: How much it costs"
            # DRAFT 2026-06-13 (UNVERIFIED). "support yourself when you arrive in
            # the UK - you'll usually need to have at least £1,270 available
            # (unless you're exempt)"; "You will need to have had the money
            # available for at least 28 days in a row. Day 28 must be within 31
            # days of applying."
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-07-13"
      - text: "Prove your identity (usually with the 'UK Immigration: ID Check' app and a UKVI account, or by giving biometrics at a visa application centre) and submit your documents."
        links:
          - text: "GOV.UK — Skilled Worker visa: Documents you'll need to apply"
            sourceUrl: "https://www.gov.uk/skilled-worker-visa/documents-you-must-provide"
            sourceName: "GOV.UK — Skilled Worker visa: Documents you'll need to apply"
            # DRAFT 2026-06-13 (UNVERIFIED). Documents page lists required items;
            # identity-proof framing on Overview/Your partner pages ("UK
            # Immigration: ID Check app ... UKVI account" or biometrics at a visa
            # application centre).
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Certificate of Sponsorship (CoS) reference number"
        type: provide
        description: "The electronic CoS reference number from your sponsoring employer — ask them for a copy if you do not have it. It carries your job title, salary, occupation code, employer name and sponsor licence number."
      - name: "Valid passport or identity document"
        type: provide
        description: "A valid US passport (or other document showing your identity and nationality) for your application and to prove identity."
      - name: "Proof of personal savings"
        type: provide
        description: "Evidence you have at least £1,270 available to support yourself (e.g. bank statements) — not required if your CoS shows your employer will cover your costs, or if you are exempt."
      - name: "TB test results (if required)"
        type: provide
        description: "Tuberculosis test results — required only if you are applying from a listed country. (The USA is not generally a listed TB-test country; confirm your situation.)"
      - name: "Criminal record certificate (if required)"
        type: provide
        description: "Required only if you will work in certain jobs (e.g. education, healthcare, therapy, social services) and are applying from outside the UK."
      - name: "Online Skilled Worker visa application"
        type: form
        description: "The official online application for the Skilled Worker visa, started from the GOV.UK route page (the 'Apply from outside the UK' path)."
        form:
          text: "Apply online for the Skilled Worker visa via the official GOV.UK route. We link the route page rather than a deep apply-link so it stays current; choose the 'Apply from outside the UK' path."
          sourceUrl: "https://www.gov.uk/skilled-worker-visa"
          sourceName: "GOV.UK — Skilled Worker visa: Overview"
          # DRAFT 2026-06-13 (UNVERIFIED). Overview: "You must apply online. How
          # you apply depends on whether you're: outside the UK and are coming to
          # the UK ..." Verifier: confirm the route page is the correct entry
          # point and links the outside-UK application path.
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
    timeline:
      text: "Usually 3 weeks for a decision after you apply from outside the UK (longer if you need a biometrics appointment). You can apply up to 3 months before your job start date."
      sourceUrl: "https://www.gov.uk/skilled-worker-visa"
      sourceName: "GOV.UK — Skilled Worker visa: Overview"
      # DRAFT 2026-06-13 (UNVERIFIED). Overview decision-time + 3-months-before
      # statements (see "Decision time" keyFact basis).
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    cost:
      text: "Application fee from outside the UK: £819 per person for up to 3 years, or £1,618 per person for more than 3 years (lower fees apply if the job is on the immigration salary list: £628 / £1,235). Plus the Immigration Health Surcharge, usually £1,035 per year. Figures change — confirm current amounts."
      sourceUrl: "https://www.gov.uk/skilled-worker-visa/how-much-it-costs"
      sourceName: "GOV.UK — Skilled Worker visa: How much it costs"
      # DRAFT 2026-06-13 (UNVERIFIED, FIGURE — reviewBy +30d). "How much it
      # costs": from outside the UK "up to 3 years - £819 per person; more than 3
      # years - £1,618 per person"; immigration salary list "£628 / £1,235";
      # "pay the healthcare surcharge - this is usually £1,035 per year."
      # Verifier: re-confirm all four fee figures + IHS rate on the live page.
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    warning: >
      Salary thresholds, going rates, application fees and the eligible-occupation
      list change frequently and the route requires an approved sponsor. Do not
      rely on any figure here without re-confirming the current amount on GOV.UK,
      and check that your specific occupation code is currently eligible.
    dependsOn: []
    appliesIf: "motivation == 'work'"

