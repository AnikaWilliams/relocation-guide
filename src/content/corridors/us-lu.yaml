  # ===========================================================================
  - id: entry-authorisation
    title: "Get your type D entry visa to travel to Luxembourg (if required)"
    category: visa-permit
    summary:
      text: "After your temporary authorisation to stay is granted, if you are subject to visa requirements you must apply for a long-stay type D visa before travelling, from your country of legal residence. As US citizens are generally visa-exempt for short Schengen stays, in practice many can enter Luxembourg on their passport plus the temporary authorisation to stay — but you should confirm your visa obligation for a long stay before you book travel. The type D long-stay visa fee is EUR 50 (for all applicant categories) and lets you enter and complete your residence-permit steps."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
      sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
      # RE-SOURCED 2026-06-13 (content-researcher): removed the "affixed in your passport and valid for a maximum of three months" clause, which the cited entry-visa page does not state for the type D visa (it gives affixing/validity only for the type C visa). What remains — type D fee EUR 50 "for all applicant categories", apply from country of legal residence after the authorisation to stay is granted, and the visa-exemption framing — is supported by the entry-visa page (the visa-exempt-on-passport-plus-authorisation detail is also on the salaried page already cited in this task's steps). The type D affixing/3-month validity is covered separately on the salaried/Blue Card tasks. Source unchanged (entry-visa page 666602b9).
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: contains the EUR 50 / EUR 90 visa fees.
      reviewBy: "2026-07-13"
    tldr:
      text: "If you are visa-subject, apply for a long-stay type D visa (EUR 50, for all applicant categories) before travelling, after your temporary authorisation to stay is granted. US citizens are generally visa-exempt for short Schengen stays, so many can enter on passport plus the authorisation to stay — but confirm your long-stay visa obligation first. The type D visa lets you enter and finish your residence-permit steps."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
      sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
      # RE-SOURCED 2026-06-13 (content-researcher): removed the "affixed in your passport and valid up to three months" clause, which the cited entry-visa page does not state for the type D visa. Remaining text — type D fee EUR 50 "for all applicant categories", apply after the authorisation to stay is granted, and visa-exemption framing — is supported by the entry-visa page (visa-exemption detail also on the already-cited salaried page). The type D affixing/3-month validity lives on the salaried/Blue Card tasks. Source unchanged (entry-visa page 666602b9).
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Type D visa fee"
        text: "The long-stay (type D) visa fee is EUR 50 for all applicant categories. (A short-stay type C visa, not the long-stay route, is EUR 90.)"
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
        sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim fee table "Airport transit visa (A) EUR 90 ... Short stay visa (C) EUR 90 ... Long stay visa (D) EUR 50 (for all applicant categories)". Both figures and the "for all applicant categories" qualifier confirmed character-for-character. Supported.
