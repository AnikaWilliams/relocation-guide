      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "A Luxembourg bank account is needed in practice for salary, rent and bills. Expect to show your passport, proof of your Luxembourg address (e.g. your declaration of arrival) and residence status. As a US person, FATCA reporting applies and some banks are cautious about onboarding US citizens — check a bank's US-person policy first. guichet.lu is the official starting point, but exact requirements come from each bank."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/nouveau-resident-luxembourg.html"
