  # ===========================================================================
  - id: work-blue-card
    title: "Consider the EU Blue Card if you are a highly qualified worker"
    category: visa-permit
    summary:
      text: "If you hold high professional qualifications and a higher-paid graduate offer, the EU Blue Card can be a cleaner route than the ordinary salaried-worker permit. You need an employment contract of at least six months for highly qualified work, a gross annual salary at least equal to the amount set by Grand-Ducal regulation (currently EUR 65,652), and a document proving the high professional qualification required for the role. Highly qualified workers are NOT subject to the ADEM labour-market test. The procedure is the same two steps (temporary authorisation to stay, then type D visa where required, then residence permit). The first Blue Card is valid for four years (or the contract duration plus three months if the contract is shorter)."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
      sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
      # VERIFIED 2026-06-13 (fact-verifier): EU Blue Card page re-fetched live (curl, HTTP 200, no redirect). Verbatim: contract "of 6 months at least for highly qualified work"; "be offered an annual salary at least equal to the amount set by Grand-Ducal regulation (EUR 65,652)"; "Highly qualified workers are not subject to the obligation of a labour market test" (employer must still "make a declaration of vacant position to the National Employment Agency (ADEM)"); first card "valid: for 4 years; or if the employment contract has a duration of less than 4 years, for the duration of the contract plus 3 months". Two-step procedure (authorisation to stay → type D visa where required → residence permit) verbatim. Supported.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-lu 2026-06-13"
      sourceHash: "4eafb0e373a0c1ab0301f5f40c824129b188bc6ed5ed60c3405c067f56015a4a"
      # 30-day window: contains the EUR 65,652 salary threshold.
      reviewBy: "2026-07-13"
    tldr:
      text: "The EU Blue Card suits highly qualified degree-holders: an employment contract of at least six months, a gross annual salary at least equal to the regulated amount (currently EUR 65,652), and proof of high professional qualification. No ADEM labour-market test applies. Same two-step procedure as other routes; the first Blue Card is valid for four years (or contract length plus three months if shorter)."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
      sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
      # VERIFIED 2026-06-13 (fact-verifier): same live page; all four load-bearing facts (6-month contract, EUR 65,652 regulated salary, no labour-market test, 4-year/contract+3-months validity) verbatim as quoted in the summary comment. Supported.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-lu 2026-06-13"
      sourceHash: "4eafb0e373a0c1ab0301f5f40c824129b188bc6ed5ed60c3405c067f56015a4a"
      reviewBy: "2026-07-13"
