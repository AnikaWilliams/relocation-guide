        type: form
        description: "The commune's declaration of arrival / change-of-residence form, submitted in person or online via MyGuichet.lu; obtain the current procedure from the official guichet.lu page (procedures vary by commune)."
        form:
          text: "Make the declaration of arrival / change of usual residence at your commune. The official guichet.lu page describes the in-person and online (MyGuichet.lu) procedures; the exact steps vary by commune."
          sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/nouveau-resident-luxembourg/arrivee-luxembourg/depart-arrivee-commune.html"
          sourceName: "Guichet.lu — Declaring a move to a new commune of residence"
