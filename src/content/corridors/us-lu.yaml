            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
            sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
            # VERIFIED 2026-06-13 (fact-verifier): salaried page verbatim "if he is not subject to visa requirements, enter Luxembourg territory and make a declaration to the administration of the commune where he resides. After entering Luxembourg, the third-country national must take steps to obtain a residence permit." Supports entering on passport + authorisation to stay then doing the declaration of arrival and permit steps. Supported.
            status: VERIFIED
            lastVerified: "2026-06-13"
