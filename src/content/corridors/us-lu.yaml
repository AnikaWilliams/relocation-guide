      - label: "Where to apply"
        text: "Apply at the Luxembourg consulate or diplomatic mission in your country of legal residence, enclosing your temporary authorisation to stay. Where Luxembourg is not represented, applications for long-stay visas are handled by the country representing Luxembourg in the Schengen area."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
        sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
