    detail: >
      A current account is needed in practice to receive your salary and pay rent and bills in
      Luxembourg. Banks decide their own documentary requirements, but a passport, proof of your
      Luxembourg address (your declaration of arrival is the obvious document) and proof of your
      residence status are the usual core — bring your declaration-of-arrival receipt and, once
      issued, your residence permit. US citizens should note that Luxembourg banks must report
      US-person accounts under FATCA and that some banks are wary of onboarding US clients, so ask
      about a bank's US-person policy up front. The government's guichet.lu portal is the official
