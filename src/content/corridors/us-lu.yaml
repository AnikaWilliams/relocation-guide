            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Arrange co-insurance for any dependent family members who are not personally enrolled, and confirm your CNS health-insurance coverage."
        links:
          - text: "guichet.lu — co-insured family members and the CNS"
            sourceUrl: "https://guichet.public.lu/en/citoyens/sante/affiliation-securite-sociale/salarie-independant-famille/affiliation-resident.html"
            sourceName: "guichet.lu — Registration with social security (CCSS / CNS)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Declaration of start of employment (filed by employer)"
        type: form
        description: "The declaration of start of employment filed by your employer with the CCSS within eight days of you starting; this triggers your affiliation and social security card. The official guichet.lu page describes the procedure."
        form:
          text: "Your employer files the declaration of start of employment with the CCSS (within eight days), which affiliates you and issues your card automatically. The official guichet.lu page describes the procedure; self-employed and co-insured persons follow their own declarations."
          sourceUrl: "https://guichet.public.lu/en/citoyens/sante/affiliation-securite-sociale/salarie-independant-famille/affiliation-resident.html"
          sourceName: "guichet.lu — Registration with social security (CCSS / CNS)"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Employment contract / proof of employment"
        type: provide
        description: "Your employment contract, which triggers compulsory CCSS affiliation via your employer."
      - name: "Documents for co-insured family members"
        type: provide
        description: "Relationship documents for any dependent family members you wish to co-insure (e.g. marriage/partnership certificate, children's birth certificates)."
    warning: >
      Holding qualifying health-insurance cover is also a condition of your residence permit. If you
      are not employed, you must arrange your own qualifying cover rather than relying on automatic
      employer affiliation. Confirm contribution rates and exact steps with the CCSS/CNS.
    dependsOn: []

