  - id: work-salaried-permit
    title: "Get a residence permit as a third-country salaried worker (job offer in hand)"
    category: visa-permit
    summary:
      text: "If you have a job offer in Luxembourg, the standard route for a US citizen is the residence permit for third-country salaried workers, obtained in a two-step procedure. Before you travel you apply for a temporary authorisation to stay from the General Department of Immigration (Ministry of Home Affairs); after you arrive you make a declaration of arrival at your commune, undergo a medical check, and apply for the residence permit. Your future employer must first have declared the vacancy to the National Employment Agency (ADEM) and obtained a certificate allowing them to hire a third-country national, because ADEM could not place a suitable registered candidate within three weeks (a labour-market test)."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
      sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "With a job offer, US citizens usually apply for the third-country salaried-worker residence permit in two steps: a temporary authorisation to stay (applied for before travel), then — after arriving, declaring arrival, and a medical check — the residence permit itself. Your employer must first have run the ADEM labour-market test (vacancy declared; no suitable registered candidate placed within three weeks) and obtained a certificate to hire you. The first permit is valid for one profession and sector for up to one year."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
      sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Two-step procedure"
        text: "Step 1 (before entry): apply for a temporary authorisation to stay from the General Department of Immigration; if you are visa-subject, then apply for a type D visa. Step 2 (after entry): make a declaration of arrival at your commune, undergo a medical check, and apply for the residence permit."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Labour-market test (ADEM)"
        text: "Before recruiting, the employer must declare the vacant position to the National Employment Agency (ADEM). If no suitable registered candidate can be placed within three weeks, the employer may request a certificate from ADEM's director authorising them to hire a third-country national; that original certificate is attached to your authorisation-to-stay application."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Where the authorisation is applied for"
        text: "You apply for the temporary authorisation to stay (on plain paper) from your country of origin, addressed to the General Department of Immigration or a Luxembourg diplomatic/consular representation. Applications submitted from within Luxembourg are inadmissible; the authorisation must be approved before you come to Luxembourg."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Response time"
        text: "The response time from the Ministry of Home Affairs on the authorisation-to-stay application is normally a maximum of four months; if you receive no response in that time, you should consider the application denied. The temporary authorisation to stay is valid for 90 days."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "First permit validity"
        text: "The first residence permit for a salaried worker is valid for a maximum of one year, for one profession only with all employers, and in only one sector (shown as an ISCO code in the 'observations' field). From the first renewal it is renewable for up to three years and gives access to any sector and profession."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Luxembourg uses the same two-step model for almost every long-stay route. For an ordinary
      salaried job the steps are: (1) before entering the country, apply for a temporary
      authorisation to stay from the General Department of Immigration of the Ministry of Home
      Affairs (and, if you are visa-subject, a type D visa once the authorisation is granted);
      (2) after entering, make a declaration of arrival at your commune within three days,
      undergo the compulsory medical check, and apply for the residence permit for third-country
      nationals within three months of entry. Crucially, the route depends on your employer:
      before hiring they must declare the vacancy to ADEM, and only if ADEM cannot place a
      suitable registered candidate within three weeks can they obtain the certificate that lets
      them hire a third-country national. You attach that original certificate, your signed
      Luxembourg-law employment contract, a criminal-record extract, a CV and your diplomas to
      the authorisation-to-stay application. The authorisation, once granted, is valid 90 days
      and lets you travel; the first residence permit is limited to one year, one profession and
      one sector, broadening on renewal. Confirm the current document list and fees before
      applying — figures and forms change.
    steps:
      - text: "Have your employer declare the vacancy to ADEM and (if no registered candidate is placed within three weeks) obtain the certificate authorising them to hire a third-country national; they hand you the original certificate."
        links:
          - text: "guichet.lu — preliminary ADEM steps and the employer's certificate"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
            sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Before travelling, apply for the temporary authorisation to stay (on plain paper) to the General Department of Immigration, enclosing your passport copy, criminal-record extract, CV, diplomas, the signed employment contract and the original ADEM certificate."
        links:
          - text: "guichet.lu — applying for the temporary authorisation to stay (Step 1)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
            sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Once the authorisation is granted (valid 90 days), if you are visa-subject apply for a type D visa, travel to Luxembourg, declare your arrival at the commune, do the medical check, then apply for the residence permit within three months of entry."
        links:
          - text: "guichet.lu — Step 2 after entry: declaration of arrival, medical check, residence permit"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
            sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Application for a residence permit for third-country nationals"
        type: form
        description: "The residence-permit application, submitted online via MyGuichet.lu or by post on the official form within three months of arrival; obtain the current form from the official guichet.lu page."
        form:
          text: "Apply for the residence permit for third-country nationals via MyGuichet.lu or by post. The official guichet.lu page hosts the procedure and links the current application forms (we link the authority page rather than a deep PDF so it stays current)."
          sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
          sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Valid US passport"
        type: provide
        description: "A full copy of your valid US passport (all pages). If your passport expires in less than six months, renew it before coming to Luxembourg."
      - name: "Original ADEM certificate (right to hire a third-country national)"
        type: provide
        description: "The original certificate issued by ADEM's director to your employer, authorising them to hire a third-country national; you attach it to the authorisation-to-stay application."
      - name: "Signed employment contract (Luxembourg law)"
        type: provide
        description: "A copy of the employment contract compliant with Luxembourg law, dated and signed by you and your future employer."
      - name: "Criminal-record extract or affidavit"
        type: provide
        description: "An extract from your criminal records or a sworn affidavit established in your country of residence."
      - name: "CV and diplomas / professional qualifications"
        type: provide
        description: "A curriculum vitae and copies of your diplomas or professional qualifications."
      - name: "Proof of suitable housing"
        type: provide
        description: "Proof of suitable housing (rental agreement, property deed, etc.), required for the residence-permit application after arrival."
      - name: "Proof of payment of the residence-permit fee (EUR 80)"
        type: provide
        description: "Proof of payment of a fee of EUR 80 to the Ministry of Home Affairs (IBAN LU46 1111 2582 2814 0000), attached to the residence-permit application."
    cost:
      text: "The residence-permit application requires proof of payment of a fee of EUR 80 to the Ministry of Home Affairs (General Department of Immigration), IBAN LU46 1111 2582 2814 0000. A type D entry visa (where required) costs a further EUR 50. (Confirm current amounts before paying.)"
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
      sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: contains the EUR 80 fee.
      reviewBy: "2026-07-13"
    warning: >
      This route depends entirely on your employer first clearing the ADEM labour-market test and
      obtaining the certificate to hire a third-country national — there is no entitlement without
      it. The authorisation to stay must be applied for and approved BEFORE you come to Luxembourg;
      applications filed from inside the country are inadmissible. Confirm the current fee and
      document list on guichet.lu before relying on them.
    dependsOn: []
    appliesIf: "motivation == 'work'"

  # ===========================================================================
  - id: work-blue-card
    title: "Consider the EU Blue Card if you are a highly qualified worker"
    category: visa-permit
    summary:
      text: "If you hold high professional qualifications and a higher-paid graduate offer, the EU Blue Card can be a cleaner route than the ordinary salaried-worker permit. You need an employment contract of at least six months for highly qualified work, a gross annual salary at least equal to the amount set by Grand-Ducal regulation (currently EUR 65,652), and a document proving the high professional qualification required for the role. Highly qualified workers are NOT subject to the ADEM labour-market test. The procedure is the same two steps (temporary authorisation to stay, then type D visa where required, then residence permit). The first Blue Card is valid for four years (or the contract duration plus three months if the contract is shorter)."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
      sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: contains the EUR 65,652 salary threshold.
      reviewBy: "2026-07-13"
    tldr:
      text: "The EU Blue Card suits highly qualified degree-holders: an employment contract of at least six months, a gross annual salary at least equal to the regulated amount (currently EUR 65,652), and proof of high professional qualification. No ADEM labour-market test applies. Same two-step procedure as other routes; the first Blue Card is valid for four years (or contract length plus three months if shorter)."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
      sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Salary threshold"
        text: "You must be offered a gross annual salary at least equal to the amount set by Grand-Ducal regulation — currently EUR 65,652 (described as the average gross annual salary)."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
        sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        # 30-day window: salary threshold.
        reviewBy: "2026-07-13"
      - label: "Contract & qualification"
        text: "You need an employment contract of at least six months for highly qualified work, plus a document proving the high professional qualifications required for the activity/sector named in the contract."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
        sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "No labour-market test"
        text: "Highly qualified workers are not subject to the obligation of a labour-market test; the employer must still declare the vacant position to ADEM."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
        sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Validity"
        text: "The first EU Blue Card is valid for four years, or — if the employment contract is shorter than four years — for the duration of the contract plus three months. It is valid from the date of the declaration of arrival at the commune."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
        sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Response time"
        text: "The response time from the Ministry of Home Affairs on the authorisation-to-stay application is normally a maximum of three months; no decision in that time means the application is deemed rejected. The authorisation to stay, once granted, is valid 90 days."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
        sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The EU Blue Card is Luxembourg's residence permit for highly qualified workers and follows the
      same two-step procedure as the ordinary salaried route, but with two important differences:
      the salary bar is higher (a gross annual salary at least equal to the regulated amount,
      currently EUR 65,652) and there is no labour-market test — your employer must still declare
      the vacancy to ADEM, but ADEM does not test the market for highly qualified roles. You need a
      contract of at least six months and a document proving your high professional qualification.
      Before travelling you apply for the temporary authorisation to stay (enclosing your passport,
      criminal-record extract, CV, diplomas and the signed contract); after entry you declare your
      arrival, do the medical check, and apply for the EU Blue Card residence permit within three
      months. The first card is valid four years (or contract length plus three months if shorter).
      Changing employer or sector requires advance notice to immigration, which has 30 days to
      object. The application fee is EUR 80. Confirm the current salary threshold, which is set by
      Grand-Ducal regulation and changes.
    steps:
      - text: "Confirm your offer meets the Blue Card criteria: a highly qualified role, a contract of at least six months, the gross annual salary threshold (currently EUR 65,652), and proof of your high professional qualification."
        links:
          - text: "guichet.lu — EU Blue Card prerequisites"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
            sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-07-13"
      - text: "Before travelling, apply for the temporary authorisation to stay to the General Department of Immigration; once granted, apply for a type D visa if you are visa-subject."
        links:
          - text: "guichet.lu — EU Blue Card: temporary authorisation to stay and visa (Step 1)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
            sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "After entering Luxembourg, declare your arrival at the commune, undergo the medical check, and apply for the EU Blue Card residence permit within three months of entry (EUR 80 fee)."
        links:
          - text: "guichet.lu — EU Blue Card: residence-permit application (Step 2)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
            sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Application for an EU Blue Card residence permit"
        type: form
        description: "The EU Blue Card residence-permit application, via MyGuichet.lu or by post on the official form within three months of arrival; obtain the current form from the official guichet.lu page."
        form:
          text: "Apply for the EU Blue Card residence permit via MyGuichet.lu or by post. The official guichet.lu page hosts the procedure, the EUR 80 fee and links the application forms."
          sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
          sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Valid US passport"
        type: provide
        description: "A full copy of your valid US passport (all pages); renew it if it expires in under six months."
      - name: "Signed employment contract (≥6 months, ≥ salary threshold)"
        type: provide
        description: "A copy of the Luxembourg-law employment contract, dated and signed, for at least six months and providing the required gross annual salary (currently EUR 65,652)."
      - name: "Proof of high professional qualification"
        type: provide
        description: "A document proving the high professional qualifications required for the activity/sector (e.g. a higher-education diploma), with copies of your diplomas."
      - name: "Criminal-record extract or affidavit, and CV"
        type: provide
        description: "An extract from your criminal record or a sworn affidavit from your country of legal residence, plus a curriculum vitae."
      - name: "Proof of payment of the residence-permit fee (EUR 80)"
        type: provide
        description: "Proof of payment of the EUR 80 fee to the Ministry of Home Affairs (IBAN LU46 1111 2582 2814 0000)."
    cost:
      text: "The EU Blue Card residence-permit application requires proof of payment of a fee of EUR 80 to the Ministry of Home Affairs (IBAN LU46 1111 2582 2814 0000). A type D entry visa (where required) costs a further EUR 50. (Confirm current amounts before paying.)"
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
      sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: fee.
      reviewBy: "2026-07-13"
    warning: >
      The salary threshold (currently EUR 65,652) is set by Grand-Ducal regulation and is revised —
      confirm the current figure on guichet.lu before relying on it. As with all long-stay routes,
      the authorisation to stay must be granted before you enter Luxembourg.
    dependsOn: []
    appliesIf: "motivation == 'work'"

  # ===========================================================================
  - id: entry-authorisation
    title: "Get your type D entry visa to travel to Luxembourg (if required)"
    category: visa-permit
    summary:
      text: "After your temporary authorisation to stay is granted, if you are subject to visa requirements you must apply for a long-stay type D visa before travelling, from your country of origin. As US citizens are generally visa-exempt for short Schengen stays, in practice many can enter Luxembourg on their passport plus the temporary authorisation to stay — but you should confirm your visa obligation for a long stay before you book travel. The type D long-stay visa fee is EUR 50; it is affixed in your passport and valid for a maximum of three months to let you enter and complete your residence-permit steps."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
      sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: contains the EUR 50 / EUR 90 visa fees.
      reviewBy: "2026-07-13"
    tldr:
      text: "If you are visa-subject, apply for a long-stay type D visa (EUR 50) before travelling, after your temporary authorisation to stay is granted. US citizens are generally visa-exempt for short Schengen stays, so many can enter on passport plus the authorisation to stay — but confirm your long-stay visa obligation first. The type D visa is affixed in your passport and valid up to three months to let you enter and finish your residence-permit steps."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
      sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-07-13"
    keyFacts:
      - label: "Type D visa fee"
        text: "The long-stay (type D) visa fee is EUR 50 for all applicant categories. (A short-stay type C visa, not the long-stay route, is EUR 90.)"
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
        sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        # 30-day window: visa fee.
        reviewBy: "2026-07-13"
      - label: "Where to apply"
        text: "Apply at the Luxembourg consulate or diplomatic mission in your country of legal residence, enclosing your temporary authorisation to stay. Where Luxembourg is not represented, applications for long-stay visas are handled by the country representing Luxembourg in the Schengen area."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
        sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Passport validity"
        text: "Your passport must be valid for at least three months beyond the visa's expiry date; if it is due to expire in under six months, renew it before coming to Luxembourg."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
        sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The type D (long-stay) visa is the entry document that lets a visa-subject third-country
      national travel to Luxembourg to take up residence after the temporary authorisation to stay
      has been granted. You apply before departure, from your country of legal residence, at the
      Luxembourg consulate or diplomatic mission (or, where Luxembourg is not represented, at the
      Schengen country that issues long-stay visas on its behalf — the salaried-worker page names
      Belgium, and the Blue Card page names Belgium or the Netherlands; confirm the current
      arrangement for your location). Whether you actually need the type D visa depends on your
      nationality: US citizens are generally exempt from short-stay Schengen visas, and the guichet
      pages note that someone who is not subject to visa requirements may enter on their passport
      plus the temporary authorisation to stay. Do not assume — confirm your long-stay visa
      obligation with the competent Luxembourg representation before booking travel. The type D fee
      is EUR 50.
    steps:
      - text: "Confirm whether you, as a US citizen, are subject to a long-stay (type D) visa requirement; if you are, apply at the competent Luxembourg consulate/mission with your temporary authorisation to stay."
        links:
          - text: "Guichet.lu — entry visa: who needs one and where to apply"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
            sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-07-13"
      - text: "If you are visa-exempt, prepare to enter Luxembourg on your valid passport together with your temporary authorisation to stay, then complete the declaration of arrival and residence-permit steps."
        links:
          - text: "guichet.lu — entering on passport plus authorisation to stay (salaried route)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
            sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Type D long-stay visa application"
        type: form
        description: "The long-stay (type D) visa application at the competent Luxembourg consulate/mission, submitted with your temporary authorisation to stay; obtain the current form and procedure from the official guichet.lu page."
        form:
          text: "Apply for the type D long-stay visa at the competent Luxembourg representation. The official guichet.lu page describes the procedure, fees and the form; confirm the representation responsible for your US location."
          sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
          sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-07-13"
      - name: "Temporary authorisation to stay"
        type: provide
        description: "Your granted temporary authorisation to stay, which must accompany the type D visa application."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport (valid for at least three months beyond the visa's expiry)."
    cost:
      text: "The long-stay (type D) visa fee is EUR 50 for all applicant categories. (A short-stay type C visa is EUR 90; it is not the route to take up residence.) Confirm current fees before paying."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/moins-3-mois/ressortissant-tiers/entree-visa.html"
      sourceName: "Guichet.lu — Luxembourg entry visa for third-country nationals"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: visa fee.
      reviewBy: "2026-07-13"
    warning: >
      Visa obligation depends on nationality; US citizens are generally Schengen short-stay
      visa-exempt, but you must confirm whether a long-stay type D visa is required for your move
      before booking travel. Whether or not a visa is needed, the temporary authorisation to stay
      must already be granted before you enter Luxembourg.
    dependsOn: []
    appliesIf: "motivation == 'work' || motivation == 'study' || motivation == 'family'"

  # ===========================================================================
  - id: family-reunification
    title: "Bring your spouse/partner and children (family reunification)"
    category: family-dependents
    summary:
      text: "Once you hold (or are applying for) a Luxembourg residence permit, your third-country-national family members can join you through family reunification. Family members are your spouse or registered partner aged 18 or over, and unmarried children under 18 in your custody and dependent on you. As the sponsor you must show stable, regular and sufficient resources (assessed against the minimum wage for unskilled workers over 12 months), suitable accommodation meeting legal habitability criteria, and health-insurance cover for the whole family. EU Blue Card holders, researchers and intra-corporate transferees benefit from facilitated reunification: their family can be included with their own application and is not subject to a minimum prior-residence period."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
      sourceName: "guichet.lu — Family reunification for third-country nationals"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Your third-country family can join you through family reunification: spouse or registered partner aged 18+, and unmarried children under 18 in your custody and dependent on you. As sponsor you must show stable sufficient resources (benchmarked to the unskilled-worker minimum wage over 12 months), suitable legally-compliant housing, and health insurance for the family. EU Blue Card holders, researchers and intra-corporate transferees get facilitated reunification with no minimum prior-residence period and can apply at the same time as their own application."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
      sourceName: "guichet.lu — Family reunification for third-country nationals"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who counts as a family member"
        text: "The spouse or registered partner of the sponsor, aged 18 or over at the time of application, and the unmarried children under 18 of the sponsor and/or the spouse/partner who are in their custody and dependent on them (consent of any other custody-holder may be required)."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
        sourceName: "guichet.lu — Family reunification for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Resources requirement"
        text: "The sponsor must prove stable, regular and sufficient resources without resorting to social welfare; the level is assessed against the average monthly minimum wage of an unskilled worker over a period of 12 months, and the proof must cover the 12 months before the application."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
        sourceName: "guichet.lu — Family reunification for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Housing & health insurance"
        text: "The sponsor must have suitable accommodation meeting legal habitability criteria (the law cites a floor area of at least 12 m² for the first occupant and 9 m² per additional occupant, with proper light, heating, running water and electricity) and health-insurance cover for themselves and each family member."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
        sourceName: "guichet.lu — Family reunification for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Facilitated route for Blue Card / researcher"
        text: "Sponsors holding an EU Blue Card, transferred-worker or researcher status (or long-term-resident status in another EU Member State whose family was already established there) are not subject to the minimum prior-residence period, and their spouse/partner and unmarried children under 18 may accompany them when they enter Luxembourg."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
        sourceName: "guichet.lu — Family reunification for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Response time"
        text: "The response time from the Ministry of Home Affairs on the family-reunification authorisation-to-stay application is normally a maximum of nine months (extendable in exceptionally complex cases); no response in that time means the application is deemed rejected."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
        sourceName: "guichet.lu — Family reunification for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Family reunification lets the third-country spouse/registered partner (aged 18+) and unmarried
      minor children of a third-country resident move to Luxembourg. The family member applies for a
      temporary authorisation to stay from their country of origin before entering (the sponsor may
      file on their behalf with a power of attorney), then follows the usual after-arrival steps:
      declaration of arrival, medical check, and residence-permit application. As sponsor you must
      demonstrate stable, regular and sufficient resources — benchmarked to the unskilled-worker
      minimum wage over twelve months — suitable accommodation meeting the legal habitability
      criteria, and health-insurance cover for everyone. A major advantage applies to EU Blue Card
      holders, researchers and intra-corporate transferees: their family is exempt from the minimum
      prior-residence period and can be included with the main applicant's own application, entering
      together. Each residence permit carries the EUR 80 fee. Some figures (the minimum-wage
      benchmark, habitability measurements) are set by separate regulations and change — confirm
      current values before relying on them.
    steps:
      - text: "Confirm each family member qualifies (spouse/partner 18+; unmarried child under 18 in your custody and dependent on you) and that you meet the resources, accommodation and health-insurance conditions."
        links:
          - text: "guichet.lu — family reunification: who qualifies and sponsor prerequisites"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
            sourceName: "guichet.lu — Family reunification for third-country nationals"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Have the family member apply (or apply on their behalf with a power of attorney) for the temporary authorisation to stay before they travel, enclosing proof of resources, accommodation, health insurance and the relationship documents."
        links:
          - text: "guichet.lu — family reunification: authorisation to stay and supporting documents"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
            sourceName: "guichet.lu — Family reunification for third-country nationals"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "After arrival, the family member declares their arrival at the commune, undergoes the medical check, and applies for the residence permit (EUR 80 fee) within three months."
        links:
          - text: "guichet.lu — family reunification: after-entry steps and residence permit"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
            sourceName: "guichet.lu — Family reunification for third-country nationals"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Application for a family-member residence permit"
        type: form
        description: "The family-member residence-permit application (after the authorisation to stay), via MyGuichet.lu or by post on the official form; obtain the current form from the official guichet.lu page."
        form:
          text: "Apply for the family-member residence permit. The official guichet.lu page describes who qualifies, the sponsor's conditions, the supporting documents and links the forms."
          sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
          sourceName: "guichet.lu — Family reunification for third-country nationals"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Marriage / partnership and birth certificates"
        type: provide
        description: "A certificate attesting to the marriage or registered partnership, and birth certificates / proof of the family relationship for any children (with custody documents where the parents are divorced or share custody)."
      - name: "Sponsor's proof of resources (12 months)"
        type: provide
        description: "The sponsor's proof of stable, regular and sufficient resources (e.g. payslips, tax return, income from assets) covering the 12 months before the application."
      - name: "Proof of suitable accommodation"
        type: provide
        description: "Proof of suitable housing meeting the legal habitability criteria (lease or property deed showing adequate floor area, light, heating, water and electricity)."
      - name: "Proof of health-insurance cover (family)"
        type: provide
        description: "A health-insurance certificate or certificate of co-insurance covering the sponsor and each family member for their stay in Luxembourg."
      - name: "Family members' passports and criminal-record extracts"
        type: provide
        description: "Full copies of each family member's valid passport and, for the spouse/partner and adult ascendants, a recent criminal-record extract or sworn affidavit."
    cost:
      text: "Each family-member residence permit requires proof of payment of a fee of EUR 80 to the Ministry of Home Affairs (IBAN LU46 1111 2582 2814 0000). (Confirm the current amount before paying.)"
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
      sourceName: "guichet.lu — Family reunification for third-country nationals"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: fee.
      reviewBy: "2026-07-13"
    warning: >
      The resources benchmark (unskilled-worker minimum wage) and the habitability measurements are
      set by separate regulations and change — confirm current values on guichet.lu. Ordinary
      sponsors may face a minimum prior-residence period; EU Blue Card holders, researchers and
      transferees do NOT, and can bring their family in with their own application.
    dependsOn: []
    appliesIf: "motivation == 'family' || motivation == 'work'"

  # ===========================================================================
  - id: study-permit
    title: "Apply for a student residence permit to study in Luxembourg"
    category: education
    summary:
      text: "To study in Luxembourg for more than three months as a US citizen you need a student residence permit, obtained through the same two-step procedure. You must be enrolled in a Luxembourg higher-education establishment (the University of Luxembourg, a BTS-awarding institution, or an approved private institution) for a full-time degree as your main activity. You must prove sufficient resources — monthly resources of at least 80% of the social inclusion income (REVIS) — and hold health-insurance cover. The Ministry normally responds to the authorisation-to-stay application within 60 days. Students may work a maximum of 15 hours per week."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
      sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Studying in Luxembourg over three months needs a student residence permit (same two-step procedure). You must be enrolled in a Luxembourg higher-education establishment for a full-time degree as your main activity, prove sufficient resources (monthly resources of at least 80% of the social inclusion income, REVIS) and hold health insurance. The Ministry normally responds within 60 days; students may work up to 15 hours per week."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
      sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Who counts as a student"
        text: "A person enrolled in a Luxembourg higher-education establishment (the University of Luxembourg, a BTS-awarding institution, or an approved private higher-education institution) to pursue, as their main activity, a full-time study cycle leading to a degree or diploma. PhD researchers in doctoral programmes also count as students."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
        sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Resources requirement"
        text: "You must prove sufficient resources to cover living and return-travel costs; the monthly resources must amount to at least 80% of the current social inclusion income (REVIS), shown e.g. by a scholarship certificate, a bank certificate with six months of statements, or a sponsor's financial-support declaration."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
        sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Response time"
        text: "The Ministry of Home Affairs normally responds to the authorisation-to-stay application within 60 days (the clock is suspended if documents are missing)."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
        sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Working while studying"
        text: "Remuneration from a work contract of a maximum of 15 hours per week may be taken into account towards the resources requirement; material advantages such as free accommodation also count."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
        sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Studying in Luxembourg as a US citizen for more than three months requires both enrolment and
      a student residence permit, obtained through the standard two-step procedure. You must be
      enrolled in a recognised higher-education establishment — the University of Luxembourg, an
      institution awarding the advanced technician's certificate (BTS), or an approved private
      institution — to pursue a full-time study cycle as your main activity; PhD candidates count as
      students. Before travelling you apply for the temporary authorisation to stay, enclosing proof
      of enrolment, a criminal-record extract, proof of sufficient resources (monthly resources of
      at least 80% of the social inclusion income, with options including a scholarship certificate,
      a bank certificate plus six months of statements, or a sponsor's financial-support
      declaration), and a health-insurance certificate. The Ministry normally responds within 60
      days. After arrival you declare your arrival, do the medical check, and apply for the student
      residence permit. Paid work is capped at 15 hours per week. Confirm the current REVIS figure
      and the exact document list before applying.
    steps:
      - text: "Get enrolled in a recognised Luxembourg higher-education establishment for a full-time degree as your main activity."
        links:
          - text: "Guichet.lu — who counts as a student and recognised establishments"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
            sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Before travelling, apply for the temporary authorisation to stay, enclosing your enrolment proof, criminal-record extract, proof of sufficient resources (≥80% of REVIS monthly) and health insurance."
        links:
          - text: "Guichet.lu — student authorisation to stay and supporting documents (Step 1)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
            sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "After arrival, declare your arrival at the commune, undergo the medical check, and apply for the student residence permit within three months of entry."
        links:
          - text: "Guichet.lu — student after-entry steps and residence permit (Step 2)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
            sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Application for a student residence permit"
        type: form
        description: "The student residence-permit application (after the authorisation to stay), via MyGuichet.lu or by post on the official form within three months of arrival; obtain the current form from the official guichet.lu page."
        form:
          text: "Apply for the student residence permit. The official guichet.lu page describes who counts as a student, the resources rule and the procedure, and links the forms."
          sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
          sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Proof of enrolment"
        type: provide
        description: "Proof that you are enrolled in a recognised Luxembourg higher-education establishment (and, if applicable, of any mobility programme/agreement)."
      - name: "Proof of sufficient resources"
        type: provide
        description: "Proof of monthly resources of at least 80% of the social inclusion income — e.g. a scholarship certificate, a bank certificate with six months of statements, or a sponsor's financial-support declaration."
      - name: "Health-insurance certificate"
        type: provide
        description: "A health-insurance certificate covering illness in Luxembourg."
      - name: "Valid US passport and criminal-record extract"
        type: provide
        description: "A full copy of your valid US passport and a criminal-record extract or sworn affidavit from your country of residence (plus parental authorisation if you are under 18)."
    cost:
      text: "The student residence-permit application requires proof of payment of a fee of EUR 80 to the Ministry of Home Affairs (IBAN LU46 1111 2582 2814 0000). (Confirm the current amount; the precise student-permit fee should be checked on guichet.lu.)"
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
      sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      # 30-day window: fee.
      reviewBy: "2026-07-13"
    warning: >
      The resources benchmark is tied to the social inclusion income (REVIS), which changes —
      confirm the current figure on guichet.lu. Paid work is capped at 15 hours per week for
      students; exceeding it can jeopardise your permit.
    dependsOn: []
    appliesIf: "motivation == 'study'"

  # ===========================================================================
  - id: declaration-arrival
    title: "Make your declaration of arrival at the commune"
    category: registration-bureaucracy
    summary:
      text: "After entering Luxembourg you must register your presence with your new commune. Two overlapping rules apply: the immigration procedure requires third-country nationals to make a declaration of arrival at the commune within three days of arriving (the salaried-worker page states within three days; the Blue Card page states within three working days), and the general residence rule requires anyone setting up their usual residence to declare it to the commune's population office (Bureau de la population) within eight days of occupying the home. You present a valid passport (with visa/authorisation to stay where applicable) and proof of address, and receive a copy of the declaration as a receipt — which, with your authorisation to stay, serves as your interim work and residence document until the permit is issued."
