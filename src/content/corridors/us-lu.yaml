      - label: "Where the authorisation is applied for"
        text: "You apply for the temporary authorisation to stay (on plain paper) from your country of origin, addressed to the General Department of Immigration or a Luxembourg diplomatic/consular representation. Applications submitted from within Luxembourg are inadmissible; the authorisation must be approved before you come to Luxembourg."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "submit an application for a temporary authorisation to stay (on plain paper) from his country of origin: to the General Department of immigration; or to a Luxembourg diplomatic or consular representation ... The application must be submitted and approved before coming to Luxembourg ... Applications submitted from Luxembourg are inadmissible." Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-lu 2026-06-13"
        sourceHash: "e8d880612afdde51c6931b20fa53c4f1c6491918a8d843d89fd5e779404189e6"
        reviewBy: "2026-09-11"
      - label: "Response time"
        text: "The response time from the Ministry of Home Affairs on the authorisation-to-stay application is normally a maximum of four months; if you receive no response in that time, you should consider the application denied. The temporary authorisation to stay is valid for 90 days."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "The response time from the Ministry of Home Affairs is normally a maximum of 4 months. If no response is received within this time limit, the applicant should consider their application denied." and "This temporary authorisation to stay is valid for a duration of 90 days." Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-lu 2026-06-13"
        sourceHash: "e8d880612afdde51c6931b20fa53c4f1c6491918a8d843d89fd5e779404189e6"
        reviewBy: "2026-09-11"
      - label: "First permit validity"
        text: "The first residence permit for a salaried worker is valid for a maximum of one year, for one profession only with all employers, and in only one sector (shown as an ISCO code in the 'observations' field). From the first renewal it is renewable for up to three years and gives access to any sector and profession."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
