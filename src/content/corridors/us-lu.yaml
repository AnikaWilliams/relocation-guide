    detail: >
      Family reunification lets the third-country spouse/registered partner (aged 18+) and unmarried
      minor children of a third-country resident move to Luxembourg. The family member applies for a
      temporary authorisation to stay from their country of origin before entering (the sponsor may
      file on their behalf with a power of attorney), then follows the usual after-arrival steps:
      declaration of arrival, medical check, and residence-permit application. As sponsor you must
      demonstrate stable, regular and sufficient resources — benchmarked to the unskilled-worker
      minimum wage over twelve months — suitable accommodation meeting the legal habitability
      criteria, and health-insurance cover for everyone. A major advantage applies to EU Blue Card
      holders, researchers and intra-corporate transferees: their family is exempt from the minimum
      prior-residence period and can be included with the main applicant's own application, entering
      together. Each residence permit carries the EUR 80 fee. Some figures (the minimum-wage
      benchmark, habitability measurements) are set by separate regulations and change — confirm
      current values before relying on them.
    steps:
