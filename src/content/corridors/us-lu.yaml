            sourceHash: "e8d880612afdde51c6931b20fa53c4f1c6491918a8d843d89fd5e779404189e6"
            reviewBy: "2026-09-11"
    documents:
      - name: "Type D long-stay visa application"
        type: form
        description: "The long-stay (type D) visa application at the competent Luxembourg consulate/mission, submitted with your temporary authorisation to stay; obtain the current form and procedure from the official guichet.lu page."
