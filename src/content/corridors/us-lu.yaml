  - id: housing
    title: "Find and rent housing in Luxembourg"
    category: housing
    summary:
      text: "Most newcomers rent, and proof of suitable housing is part of several immigration steps (the residence-permit application asks for a rental agreement or property deed, and family reunification requires accommodation meeting legal habitability criteria). Luxembourg's official guichet.lu portal groups housing under Leasing, Acquisition & Sales, and Financial aid (e.g. rent subsidy), and is the government starting point. Specific rules — rental guarantee/deposit amounts, lease terms, agency fees — are set by contract and regulation and are not stated as single figures on the overview pages, so confirm them for your specific lease."
