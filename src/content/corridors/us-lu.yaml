originIso2: us
destinationIso2: lu
title: "Moving from the USA to Luxembourg"
description: "How US citizens (non-EU/EEA third-country nationals) relocate to Luxembourg for work, study, or family: the two-step procedure (temporary authorisation to stay, then a type D visa where required, then a residence permit), the salaried-worker authorisation, the EU Blue Card for highly qualified workers, family reunification, study, the declaration of arrival at the commune, the compulsory medical check, social-security registration (CCSS / CNS health insurance), housing, banking, and Luxembourg income-tax residency."
lastReviewed: "2026-06-13"
reviewedBy: "research-lu"
# RESEARCH DRAFT (ADR-0016 research run). Every claim is status: UNVERIFIED with a
# primary official sourceUrl (guichet.public.lu / mae.gouvernement.lu), captured via
# scripts/snapshot-source.mjs into sources/us-lu/. published:false until the SEPARATE
# fact-verifier team run re-derives each claim from its live source and flips it
# VERIFIED (two-agent rule, ADR-0016). Nothing here is verified.
# Covered routes drafted: work (third-country salaried worker + EU Blue Card), study,
# family reunification, plus the shared post-arrival steps every newcomer needs
# (declaration of arrival, medical check, social security/CNS, housing, banking, tax).
# Retirement / non-gainful settlement ("residence for private reasons") was captured but
# NOT fully researched as a route here, so it is left out of coversMotivations honestly.
published: false
coversMotivations: [work, study, family]
