            sourceHash: "666602b951d60757f1ce8a1d1b5c5fe85e630e608b98b21e930ffe2470cf642b"
            reviewBy: "2026-07-13"
      - text: "If you are visa-exempt, prepare to enter Luxembourg on your valid passport together with your temporary authorisation to stay, then complete the declaration of arrival and residence-permit steps."
        links:
