  - id: work-salaried-permit
    title: "Get a residence permit as a third-country salaried worker (job offer in hand)"
    category: visa-permit
    summary:
      text: "If you have a job offer in Luxembourg, the standard route for a US citizen is the residence permit for third-country salaried workers, obtained in a two-step procedure. Before you travel you apply for a temporary authorisation to stay from the General Department of Immigration (Ministry of Home Affairs); after you arrive you make a declaration of arrival at your commune, undergo a medical check, and apply for the residence permit. Your future employer must first have declared the vacancy to the National Employment Agency (ADEM) and obtained a certificate allowing them to hire a third-country national, because ADEM could not place a suitable registered candidate within three weeks (a labour-market test)."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
      sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
      # VERIFIED 2026-06-13 (fact-verifier): salaried-worker page re-fetched live (curl, HTTP 200, no redirect). Two-step procedure verbatim ("Step 1: before entering the country: submit an application for a temporary authorisation to stay to the General Department of immigration of the Ministry of Home Affairs ... Step 2: after entering the country: make a declaration of arrival ... undergo a medical check; then submit an application for a residence permit"). ADEM labour-market test verbatim: "An employer who has not been presented with a suitable candidate from the National Employment Agency (ADEM) within 3 weeks following his declaration of a vacant position can request a certificate from the director of the ADEM which will allow him to recruit a third-country national." Supported.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-lu 2026-06-13"
      sourceHash: "e8d880612afdde51c6931b20fa53c4f1c6491918a8d843d89fd5e779404189e6"
      reviewBy: "2026-09-11"
    tldr:
      text: "With a job offer, US citizens usually apply for the third-country salaried-worker residence permit in two steps: a temporary authorisation to stay (applied for before travel), then — after arriving, declaring arrival, and a medical check — the residence permit itself. Your employer must first have run the ADEM labour-market test (vacancy declared; no suitable registered candidate placed within three weeks) and obtained a certificate to hire you. The first permit is valid for one profession and sector for up to one year."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
      sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
      # VERIFIED 2026-06-13 (fact-verifier): same live page. First-permit validity verbatim: "The first residence permit for salaried worker is valid: for a maximum of 1 year; for one profession only with all employers; in only one sector." ADEM 3-week test and two-step framing as above. Supported.
      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-lu 2026-06-13"
      sourceHash: "e8d880612afdde51c6931b20fa53c4f1c6491918a8d843d89fd5e779404189e6"
