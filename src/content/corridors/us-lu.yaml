    detail: >
      Registering with your commune is one of the first things you do after entering Luxembourg, and
      two rules overlap. The immigration procedure (on each route's guichet page) tells third-country
      nationals to make a declaration of arrival at the commune of intended residence very quickly —
      the salaried-worker page says within three days of arrival, the highly-qualified/Blue Card page
      says within three working days. Separately, the general residence rule (the 'declaring a move to
      a new commune' page) gives anyone establishing their usual residence eight days from occupying
      the home to declare it to the commune's population office. To be safe, treat the shorter
      immigration deadline as the one to meet. You go in person (or online via MyGuichet.lu with an
