      status: VERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: "fact-verifier-lu 2026-06-13"
      sourceHash: "d444f57cbb5a61704e8391d12c6019aaec96702b3f0bec52743eefb6ea981867"
