  # ===========================================================================
  - id: income-tax
    title: "Understand your Luxembourg income-tax residency"
    category: taxes
    summary:
      text: "If you become resident in Luxembourg you are, in principle, taxed on your worldwide income. Resident taxpayers must report their worldwide income (exempt and non-exempt); income exempted under a double-taxation treaty is not taxed directly but can raise the rate applied to your taxable income (exemption with progression). Many employees settle their tax through withholding, but in certain cases you must file an income-tax return (form 100, 'taxation by assessment'). The return is due no later than 31 December of the year following the tax year. As a US citizen you must also weigh US citizenship-based taxation — get specialist Luxembourg–US cross-border advice."
      sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
      sourceName: "guichet.lu — Income tax return for natural persons (residents)"
      # VERIFIED 2026-06-13 (fact-verifier): income-tax page re-fetched live (curl, HTTP 200, no redirect). Verbatim: "The resident taxpayer must report their worldwide income (exempt and non-exempt income). Exempt income is not taxable as such, but may be taken into account in determining the applicable tax rate for non-exempt taxable income." "Taxpayers subject to taxation by assessment must report their income by filing an income tax return for natural persons (form 100)." "the tax return must be submitted no later than 31 December of the year following the tax year." The US-citizenship-based-taxation point is framed as advice ("get cross-border advice"), not a guichet-sourced fact. Supported. (Note: the draft's "(exemption with progression)" is the standard legal name for the mechanism the page describes verbatim; the page itself does not use that phrase.)
