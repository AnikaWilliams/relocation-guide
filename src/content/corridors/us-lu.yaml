  - id: open-bank-account
    title: "Open a Luxembourg bank account"
    category: finance-banking
    summary:
      text: "You will generally need a Luxembourg bank account for salary, rent and bills. Banks set their own onboarding requirements (typically identity and proof of your Luxembourg address/residence), so confirm the exact document list with the bank you choose. As a US person you are within scope of FATCA: under the Luxembourg–US FATCA Agreement, Luxembourg reporting financial institutions must identify their account holders and report US reportable accounts to the Luxembourg tax authority (Administration des contributions directes). Individual banks also set their own policies on onboarding US citizens, so confirm a bank's US-person policy before applying."
      sourceUrl: "https://impotsdirects.public.lu/fr/echanges_electroniques/FATCA.html"
      sourceName: "Administration des contributions directes (ACD) — FATCA (French)"
