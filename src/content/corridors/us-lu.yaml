  - id: social-security-affiliation
    title: "Register with social security and get covered by the CNS"
    category: healthcare-insurance
    summary:
      text: "Enrolment with Luxembourg social security is compulsory for anyone in paid employment. Your employer files a declaration of start of employment with the Joint Social Security Centre (Centre commun de la sécurité sociale, CCSS) within eight days of you starting work, which automatically affiliates you for sickness/maternity, pension, accident and long-term-care insurance and issues your social security card. For private-sector employees the health-insurance fund is the National Health Fund (Caisse nationale de santé, CNS). Dependent family members can be covered as co-insured parties if they are not personally enrolled."
      sourceUrl: "https://guichet.public.lu/en/citoyens/sante/affiliation-securite-sociale/salarie-independant-famille/affiliation-resident.html"
      sourceName: "guichet.lu — Registration with social security (CCSS / CNS)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Social-security enrolment is compulsory for anyone in paid work in Luxembourg. Your employer files a declaration of start of employment with the CCSS within eight days of you starting, which affiliates you for sickness/maternity, pension, accident and long-term-care insurance and triggers your social security card. Private-sector employees' health fund is the CNS (Caisse nationale de santé). Dependent family members can be co-insured if not personally enrolled."
      sourceUrl: "https://guichet.public.lu/en/citoyens/sante/affiliation-securite-sociale/salarie-independant-famille/affiliation-resident.html"
      sourceName: "guichet.lu — Registration with social security (CCSS / CNS)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Compulsory enrolment"
        text: "Enrolment with the Luxembourg social security services is mandatory for anyone engaged in a paid professional activity in Luxembourg; for employees, social contributions are deducted at source by the employer."
        sourceUrl: "https://guichet.public.lu/en/citoyens/sante/affiliation-securite-sociale/salarie-independant-famille/affiliation-resident.html"
        sourceName: "guichet.lu — Registration with social security (CCSS / CNS)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Employer files within eight days"
        text: "Within eight days of an employee starting work, the employer must file a declaration of start of employment with the Joint Social Security Centre (CCSS); the worker is then automatically issued a social security card."
        sourceUrl: "https://guichet.public.lu/en/citoyens/sante/affiliation-securite-sociale/salarie-independant-famille/affiliation-resident.html"
        sourceName: "guichet.lu — Registration with social security (CCSS / CNS)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Coverage and the CNS"
        text: "Enrolment provides sickness/maternity, pension, accident and long-term-care insurance; the CCSS collects contributions for all social-security bodies. For the private sector the health-insurance fund is the National Health Fund (Caisse nationale de santé, CNS / 'Gesondheetskees')."
        sourceUrl: "https://guichet.public.lu/en/citoyens/sante/affiliation-securite-sociale/salarie-independant-famille/affiliation-resident.html"
        sourceName: "guichet.lu — Registration with social security (CCSS / CNS)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Co-insured family members"
        text: "Dependent family members (e.g. spouse, partner, children entitled to family allowance) can be covered as co-insured parties under the main policyholder's insurance, provided they are not already personally enrolled."
        sourceUrl: "https://guichet.public.lu/en/citoyens/sante/affiliation-securite-sociale/salarie-independant-famille/affiliation-resident.html"
        sourceName: "guichet.lu — Registration with social security (CCSS / CNS)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Luxembourg's statutory social security is compulsory for everyone in paid work, and for
      employees it is largely automatic: your employer files a declaration of start of employment
      with the Joint Social Security Centre (CCSS) within eight days of your first day, and you are
      then affiliated for sickness/maternity, pension, accident and long-term-care insurance and
      issued a social security card. The CCSS is the single body that handles enrolment and collects
      contributions for all the social-security funds; your health-insurance fund as a private-sector
      employee is the National Health Fund (CNS). Contributions are deducted at source from your pay.
      Dependent family members who are not personally insured can be covered as co-insured parties.
      Holding qualifying health-insurance cover is also a requirement of your residence permit, so if
      you are not (yet) employed you must arrange cover separately. Confirm contribution rates and
      the exact enrolment steps on guichet.lu and with the CCSS/CNS.
    steps:
