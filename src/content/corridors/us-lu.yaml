            sourceName: "Guichet.lu — Medical check-up for third-country nationals"
            # VERIFIED 2026-06-13 (fact-verifier): correct page; the medical examination by a Luxembourg-established GP / internal-medicine specialist / paediatrician is described verbatim under "How to proceed > Medical examination". Supported.
