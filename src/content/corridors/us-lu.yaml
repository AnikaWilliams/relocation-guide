      - label: "Labour-market test (ADEM)"
        text: "Before recruiting, the employer must declare the vacant position to the National Employment Agency (ADEM). If no suitable registered candidate can be placed within three weeks, the employer may request a certificate from ADEM's director authorising them to hire a third-country national; that original certificate is attached to your authorisation-to-stay application."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
        sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "An employer who has not been presented with a suitable candidate from the National Employment Agency (ADEM) within 3 weeks following his declaration of a vacant position can request a certificate from the director of the ADEM which will allow him to recruit a third-country national." Also "The employer must hand over the original certificate to the third-country national, who will attach it to his application for the authorisation to stay." Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-lu 2026-06-13"
        sourceHash: "e8d880612afdde51c6931b20fa53c4f1c6491918a8d843d89fd5e779404189e6"
