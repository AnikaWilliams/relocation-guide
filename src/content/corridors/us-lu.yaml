  - id: study-permit
    title: "Apply for a student residence permit to study in Luxembourg"
    category: education
    summary:
      text: "To study in Luxembourg for more than three months as a US citizen you need a student residence permit, obtained through the same two-step procedure. You must be enrolled in a Luxembourg higher-education establishment (the University of Luxembourg, a BTS-awarding institution, or an approved private institution) for a full-time degree as your main activity. You must prove sufficient resources — monthly resources of at least 80% of the social inclusion income (REVIS) — and hold health-insurance cover. The Ministry normally responds to the authorisation-to-stay application within 60 days. Students may work a maximum of 15 hours per week."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/etudiant/etudiant-pays-tiers.html"
      sourceName: "Guichet.lu — Conditions for residence in Luxembourg for students from third countries"
      # VERIFIED 2026-06-13 (fact-verifier): student page re-fetched live (curl, HTTP 200, no redirect). Verbatim: students are "persons enrolled in a higher education establishment in Luxembourg; in order to pursue, as a main activity, a complete study cycle on a full-time basis leading to an academic degree or diploma"; establishments = "the University of Luxembourg; education establishments awarding the advanced technician's certificate (BTS); approved private higher education establishments". Resources: "The monthly resources must amount to at least 80% of the current social inclusion income." Response "within 60 days". Work "(maximum 15 hours per week)". Supported. (Note: the page says "social inclusion income"; the draft's gloss "(REVIS)" is the official acronym for that scheme — used verbatim on guichet's social-security page — and does not change the figure.)
