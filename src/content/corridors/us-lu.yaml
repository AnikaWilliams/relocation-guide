  # ===========================================================================
  - id: medical-check
    title: "Undergo the compulsory medical check for third-country nationals"
    category: healthcare-insurance
    summary:
      text: "Every third-country national applying for a residence permit for a stay over three months must undergo a medical check after arriving. It consists of a medical examination by a Luxembourg-based doctor (a GP, internal-medicine specialist or paediatrician) and a tuberculosis screening (at a medical-analysis laboratory for anyone aged two and over, or a tuberculin test at the Ligue médico-sociale for children aged two months to two years). The Health Directorate's Health Inspection then issues a medical certificate that is sent to immigration so your residence-permit application can be processed. You pay for the examinations yourself, and a residence permit will not be granted if you refuse the check."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
      sourceName: "Guichet.lu — Medical check-up for third-country nationals"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "All third-country nationals applying for a long-stay residence permit must do a medical check after arrival: an examination by a Luxembourg GP/internal-medicine specialist/paediatrician plus a tuberculosis screening (lab test for ages 2+, tuberculin test at the Ligue médico-sociale for children 2 months–2 years). The Health Directorate issues a medical certificate sent to immigration so your permit can be processed. You pay for it yourself; refusing the check means no permit."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
      sourceName: "Guichet.lu — Medical check-up for third-country nationals"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "What it involves"
        text: "A medical examination by a doctor established in Luxembourg authorised to work as a GP, internal-medicine specialist or paediatrician, plus a tuberculosis (TB) screening — at a medical-analysis laboratory for anyone aged two and over, or a tuberculin test at the Ligue médico-sociale for children aged between two months and two years."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
        sourceName: "Guichet.lu — Medical check-up for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Who must do it"
        text: "Mandatory for all third-country nationals applying for a residence permit for a stay over three months. It is not required for family members of an EU citizen (or of a national of a country treated as such) or for long-term residents of another EU Member State (and their family members)."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
        sourceName: "Guichet.lu — Medical check-up for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Certificate and consequence of refusal"
        text: "The Health Inspection of the Health Directorate issues a medical certificate that is sent to immigration so the residence-permit application can be processed; the examining doctor sends the temporary certificate within one month at most. A residence permit will not be granted to anyone who refuses the required medical check."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
        sourceName: "Guichet.lu — Medical check-up for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Cost"
        text: "The costs of the medical examinations and the issuance of the medical certificate are paid by the third-country national. (The specific amounts are not stated on the page — confirm with your doctor / laboratory.)"
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
        sourceName: "Guichet.lu — Medical check-up for third-country nationals"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      The medical check is a compulsory after-arrival step for every third-country national applying
      for a residence permit for a stay over three months (with exceptions for family members of EU
      citizens and long-term residents of another EU Member State). It has two parts: a general
      medical examination by a Luxembourg-based GP, internal-medicine specialist or paediatrician,
      and a tuberculosis screening — a laboratory test for anyone aged two and over, or a tuberculin
      test at the Ligue médico-sociale for children aged two months to two years. The examining
      doctor issues a temporary medical certificate and sends it (within one month at most) to the
      Health Inspection of the Health Directorate, which issues the final certificate to immigration;
      the residence-permit application can only be processed once that certificate is received, so do
      the check as soon as possible. You pay for the examinations and certificate yourself, and a
      residence permit is refused to anyone who declines the check. Confirm the current procedure and
      where to go on guichet.lu.
    steps:
      - text: "As soon as possible after arrival, see a Luxembourg-based GP/internal-medicine specialist/paediatrician for the medical examination."
        links:
          - text: "Guichet.lu — the medical examination"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
            sourceName: "Guichet.lu — Medical check-up for third-country nationals"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Complete the tuberculosis screening (laboratory test for ages two and over, or a tuberculin test at the Ligue médico-sociale for very young children); the Health Directorate then issues your medical certificate to immigration."
        links:
          - text: "Guichet.lu — TB screening and issuance of the certificate"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
            sourceName: "Guichet.lu — Medical check-up for third-country nationals"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Temporary medical certificate"
        type: form
        description: "The temporary medical certificate (on the form provided by the Ministry of Health and Social Security), completed by your examining doctor and sent to the Health Inspection; the final certificate goes to immigration. Obtain the current procedure from the official guichet.lu page."
        form:
          text: "Your examining doctor completes the temporary medical certificate (Ministry of Health form) and sends it to the Health Inspection of the Health Directorate, which issues the final certificate to immigration. The official guichet.lu page describes the procedure."
          sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/demarches-communes/controle-medical.html"
          sourceName: "Guichet.lu — Medical check-up for third-country nationals"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Temporary authorisation to stay"
        type: provide
        description: "Your temporary authorisation to stay, which you must hold before the medical check is carried out in the context of the residence-permit application."
      - name: "Valid US passport"
        type: provide
        description: "Your valid US passport as identification for the examination."
    warning: >
      A residence permit will NOT be granted if you refuse the medical check, and the permit
      application cannot be processed until the Health Directorate's certificate is received — so do
      the examination and TB screening as soon as possible after arrival. You pay the costs yourself.
    dependsOn: [declaration-arrival]

