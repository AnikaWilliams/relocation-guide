  - id: open-bank-account
    title: "Open a Luxembourg bank account"
    category: finance-banking
    summary:
      text: "You will generally need a Luxembourg bank account for salary, rent and bills. Banks set their own onboarding requirements — typically a valid passport, proof of your Luxembourg address/residence (e.g. your declaration of arrival) and proof of residence status. As a US person, banks must apply FATCA reporting, and some are more cautious about onboarding US citizens, so confirm a bank's US-person policy before applying. The official guichet.lu portal is the government starting point for everyday-life and financial topics, but specific account-opening requirements come from each bank."
      sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/nouveau-resident-luxembourg.html"
