originIso2: us
destinationIso2: lu
title: "Moving from the USA to Luxembourg"
description: "How US citizens (non-EU/EEA third-country nationals) relocate to Luxembourg for work, study, or family: the two-step procedure (temporary authorisation to stay, then a type D visa where required, then a residence permit), the salaried-worker authorisation, the EU Blue Card for highly qualified workers, family reunification, study, the declaration of arrival at the commune, the compulsory medical check, social-security registration (CCSS / CNS health insurance), housing, banking, and Luxembourg income-tax residency."
lastReviewed: "2026-06-13"
reviewedBy: "research-lu"
