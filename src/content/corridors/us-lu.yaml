  # ===========================================================================
  - id: income-tax
    title: "Understand your Luxembourg income-tax residency"
    category: taxes
    summary:
      text: "If you become resident in Luxembourg you are, in principle, taxed on your worldwide income. Resident taxpayers must report their worldwide income (exempt and non-exempt); income exempted under a double-taxation treaty is not taxed directly but can raise the rate applied to your taxable income (exemption with progression). Many employees settle their tax through withholding, but in certain cases you must file an income-tax return (form 100, 'taxation by assessment'). The return is due no later than 31 December of the year following the tax year. As a US citizen you must also weigh US citizenship-based taxation — get specialist Luxembourg–US cross-border advice."
      sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
      sourceName: "guichet.lu — Income tax return for natural persons (residents)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    tldr:
      text: "Becoming resident in Luxembourg generally means worldwide-income taxation: residents report all worldwide income (exempt and non-exempt), with treaty-exempt income raising the rate on taxable income (exemption with progression). Many employees are taxed via withholding, but some must file a return (form 100, 'taxation by assessment'), due by 31 December of the year following the tax year. As a US citizen, also account for US citizenship-based taxation and get cross-border advice."
      sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
      sourceName: "guichet.lu — Income tax return for natural persons (residents)"
      status: UNVERIFIED
      lastVerified: "2026-06-13"
      verifiedBy: ""
      reviewBy: "2026-09-11"
    keyFacts:
      - label: "Residents taxed on worldwide income"
        text: "A resident taxpayer must report their worldwide income (exempt and non-exempt). Treaty-exempt income is not taxable as such but may be taken into account to determine the tax rate applied to non-exempt income (exemption with progression)."
        sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
        sourceName: "guichet.lu — Income tax return for natural persons (residents)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "When you must file a return"
        text: "Taxpayers subject to 'taxation by assessment' must report their income on an income-tax return (form 100). Many employees are taxed at source, but in certain cases a return is required; the Luxembourg Inland Revenue (Administration des contributions directes, ACD) sets out who is concerned."
        sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
        sourceName: "guichet.lu — Income tax return for natural persons (residents)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "Filing deadline"
        text: "The income-tax return must be submitted no later than 31 December of the year following the tax year (for tax year N, the return is due by 31 December of year N+1)."
        sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
        sourceName: "guichet.lu — Income tax return for natural persons (residents)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
      - label: "How to file"
        text: "You can file via the electronic assistant on MyGuichet.lu, or by sending form 100 (electronically as a PDF via MyGuichet.lu, or by post to the relevant tax office); the form is available from MyGuichet.lu or the ACD website."
        sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
        sourceName: "guichet.lu — Income tax return for natural persons (residents)"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Luxembourg taxes residents on their worldwide income: a resident taxpayer reports all
      worldwide income (exempt and non-exempt), and income that is exempt under a double-taxation
      treaty is not taxed directly but can be taken into account to set the rate applied to your
      taxable Luxembourg income (exemption with progression). Many employees have their tax settled
      through withholding at source, but in certain cases you must file an income-tax return for
      natural persons (form 100, 'taxation by assessment') — the Luxembourg Inland Revenue (ACD)
      defines exactly who is concerned, and you can also file to reclaim over-withheld tax. The
      return is due no later than 31 December of the year following the tax year, and can be filed
      via the electronic assistant on MyGuichet.lu or on form 100 (PDF via MyGuichet.lu or by post).
      For US citizens this is doubly important: the United States taxes its citizens on worldwide
      income regardless of residence, so the Luxembourg–US treaty and foreign tax credits matter and
      the interaction is complex. This is general information, not tax advice — get specialist
      Luxembourg–US cross-border advice (including on US reporting such as FBAR/FATCA) before your
      first return.
    steps:
      - text: "Work out whether you are taxed purely at source or must file an income-tax return (form 100) — check the Luxembourg Inland Revenue (ACD) guidance on who is subject to taxation by assessment."
        links:
          - text: "guichet.lu — who must file (taxation by assessment) and worldwide-income rules"
            sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
            sourceName: "guichet.lu — Income tax return for natural persons (residents)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "If you must file, submit your return via the MyGuichet.lu electronic assistant or on form 100 by the deadline (31 December of the year following the tax year); as a US citizen, get cross-border advice on the Luxembourg–US treaty and US obligations."
        tip: "The US taxes citizens on worldwide income regardless of residence; foreign tax credits and the treaty exist to avoid double taxation, but the interaction is complex."
        links:
          - text: "guichet.lu — filing the return (MyGuichet.lu / form 100) and the deadline"
            sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
            sourceName: "guichet.lu — Income tax return for natural persons (residents)"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Income-tax return (form 100)"
        type: form
        description: "The income-tax return for natural persons (form 100), filed via the MyGuichet.lu electronic assistant or as a PDF/by post; the form is available from MyGuichet.lu or the ACD website."
        form:
          text: "File the income-tax return (form 100) via the MyGuichet.lu electronic assistant, or download form 100 from MyGuichet.lu / the ACD website and submit it as a PDF or by post to your tax office. The official guichet.lu page describes who must file and the deadline."
          sourceUrl: "https://guichet.public.lu/en/citoyens/fiscalite/declaration-impot-decompte/activite-professionnelle/declaration-revenus/declaration-impot.html"
          sourceName: "guichet.lu — Income tax return for natural persons (residents)"
          status: UNVERIFIED
          lastVerified: "2026-06-13"
          verifiedBy: ""
          reviewBy: "2026-09-11"
      - name: "Income and foreign-income records"
        type: provide
        description: "Records of your Luxembourg and foreign income needed to report worldwide income and apply the double-taxation treaty."
    warning: >
      US citizens remain subject to US worldwide taxation by citizenship even while resident in
      Luxembourg. The Luxembourg–US tax treaty and foreign tax credits exist to avoid double
      taxation but the interaction is complex — this is general information, not tax advice. Confirm
      your position and US obligations (FBAR/FATCA) with a qualified Luxembourg–US cross-border
      adviser.
    dependsOn: []
