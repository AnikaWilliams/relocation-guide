        reviewBy: "2026-09-11"
      - label: "Deposit / lease specifics"
        text: "Rental guarantee (deposit) amounts, lease durations and agency fees are set by contract and regulation and are not given as single figures on the overview pages. (Confirm the specifics for your lease and check guichet.lu's Leasing sub-pages.)"
        sourceUrl: "https://guichet.public.lu/en/citoyens/logement/location.html"
        sourceName: "guichet.lu — Renting (Leasing) overview"
        status: UNVERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: ""
        reviewBy: "2026-09-11"
    detail: >
      Renting is the norm for most newcomers to Luxembourg, and housing is not just a practical
      matter — proof of suitable accommodation is woven into the immigration procedure. The
      residence-permit application asks for a rental agreement or property deed, and family
      reunification requires accommodation that meets legal habitability criteria (the family-
      reunification page cites a minimum floor area of 12 m² for the first occupant and 9 m² per
      additional occupant, with proper natural light, heating, running water and electricity). The
      government's guichet.lu portal is the authoritative starting point; it organises housing under
      Leasing, Acquisition & Sales, Construction/Renovation and Financial aid (including a rent
      subsidy and the 'Bëllegen Akt' notarial-fee tax credit). Concrete figures that newcomers ask
      about — the rental guarantee/deposit, lease term, and agency fees — are set by your contract
      and by regulation rather than stated as single numbers on the overview pages, so confirm them
      for your specific lease (and via guichet.lu's Leasing sub-pages) before signing. Whatever you
      rent, you must complete the declaration of arrival at your commune.
    steps:
      - text: "Search for housing and review the official guichet.lu Leasing and Financial-aid (rent subsidy) pages before committing to a lease."
        links:
          - text: "guichet.lu — Renting (Leasing) overview"
            sourceUrl: "https://guichet.public.lu/en/citoyens/logement/location.html"
            sourceName: "guichet.lu — Renting (Leasing) overview"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
      - text: "Make sure your accommodation meets the habitability criteria you will need for the residence-permit and family-reunification applications, and complete your declaration of arrival after moving in."
        links:
          - text: "guichet.lu — accommodation criteria (family reunification)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/membre-famille/regroupement-familial.html"
            sourceName: "guichet.lu — Family reunification for third-country nationals"
            status: UNVERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: ""
            reviewBy: "2026-09-11"
    documents:
      - name: "Rental agreement (lease) or property deed"
        type: provide
        description: "Your signed lease (or property deed if buying); proof of suitable housing is required for the residence-permit application and assessed for family reunification."
      - name: "Proof of identity and residence status"
        type: provide
        description: "Your passport and residence/authorisation documents, typically required by landlords and agents."
    warning: >
      Deposit amounts, lease terms and agency fees are not stated as single official figures on the
      overview pages — confirm them for your specific lease before signing. Your accommodation must
      meet legal habitability criteria to support the residence-permit and family-reunification
      applications.
