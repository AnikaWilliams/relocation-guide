      - label: "Response time"
        text: "The response time from the Ministry of Home Affairs on the authorisation-to-stay application is normally a maximum of three months; no decision in that time means the application is deemed rejected. The authorisation to stay, once granted, is valid 90 days."
        sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
        sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
        # VERIFIED 2026-06-13 (fact-verifier): verbatim "The response time from the Ministry of Home Affairs is normally a maximum of 3 months. If no decision is received within this time, the application is deemed to have been rejected." and authorisation "valid for a duration of 90 days." Supported.
        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-lu 2026-06-13"
        sourceHash: "4eafb0e373a0c1ab0301f5f40c824129b188bc6ed5ed60c3405c067f56015a4a"
        reviewBy: "2026-09-11"
    detail: >
      The EU Blue Card is Luxembourg's residence permit for highly qualified workers and follows the
      same two-step procedure as the ordinary salaried route, but with two important differences:
      the salary bar is higher (a gross annual salary at least equal to the regulated amount,
      currently EUR 65,652) and there is no labour-market test — your employer must still declare
      the vacancy to ADEM, but ADEM does not test the market for highly qualified roles. You need a
      contract of at least six months and a document proving your high professional qualification.
      Before travelling you apply for the temporary authorisation to stay (enclosing your passport,
      criminal-record extract, CV, diplomas and the signed contract); after entry you declare your
      arrival, do the medical check, and apply for the EU Blue Card residence permit within three
      months. The first card is valid four years (or contract length plus three months if shorter).
      Changing employer or sector requires advance notice to immigration, which has 30 days to
      object. The application fee is EUR 80. Confirm the current salary threshold, which is set by
      Grand-Ducal regulation and changes.
    steps:
      - text: "Confirm your offer meets the Blue Card criteria: a highly qualified role, a contract of at least six months, the gross annual salary threshold (currently EUR 65,652), and proof of your high professional qualification."
        links:
          - text: "guichet.lu — EU Blue Card prerequisites"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
            sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
            # VERIFIED 2026-06-13 (fact-verifier): correct page; prerequisites (highly qualified role, 6-month contract, EUR 65,652 regulated salary, proof of high professional qualification) all enumerated verbatim. Supported.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-lu 2026-06-13"
            sourceHash: "4eafb0e373a0c1ab0301f5f40c824129b188bc6ed5ed60c3405c067f56015a4a"
            reviewBy: "2026-07-13"
      - text: "Before travelling, apply for the temporary authorisation to stay to the General Department of Immigration; once granted, apply for a type D visa if you are visa-subject."
        links:
          - text: "guichet.lu — EU Blue Card: temporary authorisation to stay and visa (Step 1)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
            sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
            # VERIFIED 2026-06-13 (fact-verifier): correct page; Step 1 (apply for temporary authorisation to stay to the General Department of immigration; request a type D visa after obtaining the authorisation if visa-subject) described verbatim. Supported.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-lu 2026-06-13"
            sourceHash: "4eafb0e373a0c1ab0301f5f40c824129b188bc6ed5ed60c3405c067f56015a4a"
            reviewBy: "2026-09-11"
      - text: "After entering Luxembourg, declare your arrival at the commune, undergo the medical check, and apply for the EU Blue Card residence permit within three months of entry (EUR 80 fee)."
        links:
          - text: "guichet.lu — EU Blue Card: residence-permit application (Step 2)"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/hautement-qualifie/salarie-hautement-qualifie.html"
            sourceName: "guichet.lu — Salaried work for highly qualified workers (EU Blue Card)"
            # VERIFIED 2026-06-13 (fact-verifier): correct page; Step 2 (declaration of arrival within 3 working days, medical check, then residence-permit application) and the EUR 80 fee ("proof of payment of a fee of EUR 80 to account IBAN LU46 1111 2582 2814 0000") described verbatim. Supported.
            status: VERIFIED
            lastVerified: "2026-06-13"
            verifiedBy: "fact-verifier-lu 2026-06-13"
            sourceHash: "4eafb0e373a0c1ab0301f5f40c824129b188bc6ed5ed60c3405c067f56015a4a"
            reviewBy: "2026-09-11"
