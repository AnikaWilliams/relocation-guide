            sourceHash: "ab2da09224926d3f88c4548830e93dca1c2a8746b85e580c0a5a9dbfff1bd6c5"
            reviewBy: "2026-09-11"
      - text: "Keep the receipt copy of your declaration of arrival — with your authorisation to stay it is your interim work and residence document until your residence permit is issued."
        links:
          - text: "guichet.lu — the declaration receipt as interim work/residence document"
            sourceUrl: "https://guichet.public.lu/en/citoyens/immigration/plus-3-mois/ressortissant-tiers/salarie/salarie-pays-tiers.html"
            sourceName: "guichet.lu — Conditions of residence for third-country salaried workers"
            # VERIFIED 2026-06-13 (fact-verifier): cited salaried page verbatim "The copy of the declaration of arrival together with the authorisation to stay both serve as a work permit and authorisation to stay until the residence permit is issued." Supported.
            status: VERIFIED
