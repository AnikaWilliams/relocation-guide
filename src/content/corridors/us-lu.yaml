        status: VERIFIED
        lastVerified: "2026-06-13"
        verifiedBy: "fact-verifier-lu 2026-06-13"
        sourceHash: "e8d880612afdde51c6931b20fa53c4f1c6491918a8d843d89fd5e779404189e6"
        reviewBy: "2026-09-11"
    detail: >
      Luxembourg uses the same two-step model for almost every long-stay route. For an ordinary
      salaried job the steps are: (1) before entering the country, apply for a temporary
      authorisation to stay from the General Department of Immigration of the Ministry of Home
      Affairs (and, if you are visa-subject, a type D visa once the authorisation is granted);
      (2) after entering, make a declaration of arrival at your commune within three days,
      undergo the compulsory medical check, and apply for the residence permit for third-country
      nationals within three months of entry. Crucially, the route depends on your employer:
      before hiring they must declare the vacancy to ADEM, and only if ADEM cannot place a
      suitable registered candidate within three weeks can they obtain the certificate that lets
      them hire a third-country national. You attach that original certificate, your signed
      Luxembourg-law employment contract, a criminal-record extract, a CV and your diplomas to
      the authorisation-to-stay application. The authorisation, once granted, is valid 90 days
      and lets you travel; the first residence permit is limited to one year, one profession and
      one sector, broadening on renewal. Confirm the current document list and fees before
      applying — figures and forms change.
