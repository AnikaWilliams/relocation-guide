    detail: >
      Luxembourg taxes residents on their worldwide income: a resident taxpayer reports all
      worldwide income (exempt and non-exempt), and income that is exempt under a double-taxation
      treaty is not taxed directly but can be taken into account to set the rate applied to your
      taxable Luxembourg income (exemption with progression). Many employees have their tax settled
      through withholding at source, but in certain cases you must file an income-tax return for
      natural persons (form 100, 'taxation by assessment') — the Luxembourg Inland Revenue (ACD)
      defines exactly who is concerned, and you can also file to reclaim over-withheld tax. The
      return is due no later than 31 December of the year following the tax year, and can be filed
      via the electronic assistant on MyGuichet.lu or on form 100 (PDF via MyGuichet.lu or by post).
      For US citizens this is doubly important: the United States taxes its citizens on worldwide
      income regardless of residence, so the Luxembourg–US treaty and foreign tax credits matter and
      the interaction is complex. This is general information, not tax advice — get specialist
      Luxembourg–US cross-border advice (including on US reporting such as FBAR/FATCA) before your
      first return.
    steps:
      - text: "Work out whether you are taxed purely at source or must file an income-tax return (form 100) — check the Luxembourg Inland Revenue (ACD) guidance on who is subject to taxation by assessment."
        links:
          - text: "guichet.lu — who must file (taxation by assessment) and worldwide-income rules"
